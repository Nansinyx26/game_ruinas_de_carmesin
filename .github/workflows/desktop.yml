# ECLIPSE ZERO · Versão de PC (instalador para Windows e AppImage para Linux)
# O app de PC (desktop/) abre a mesma versão publicada na web, então as atualizações do jogo chegam
# às duas sem gerar instalador de novo: este workflow só roda quando se pede (Actions → "Versão de PC"
# → Run workflow) ou numa tag v*, para atualizar o próprio lançador. Os arquivos ficam nos artefatos e,
# numa tag, também na Release (o botão BAIXAR PARA PC do menu aponta para a última Release).
name: Versão de PC

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # (só para anexar os instaladores à Release da tag)

jobs:
  pacote:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: |
            desktop
            assets/icons

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22

      - name: Ícone e dependências
        shell: bash
        run: |
          mkdir -p desktop/build
          cp assets/icons/icon-512.png desktop/build/icon.png
          cd desktop && npm install --no-audit --no-fund

      - name: Instalador
        shell: bash
        run: cd desktop && npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-zero-pc-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

      - name: Release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "ECLIPSE ZERO para PC $GITHUB_REF_NAME" --notes "Instalador do app de PC. O app abre a versão atual do jogo da web: as atualizações chegam sozinhas." || true
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber desktop/dist/*.exe desktop/dist/*.AppImage 2>/dev/null || gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber desktop/dist/EclipseZero-*
