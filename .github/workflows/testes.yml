# ECLIPSE ZERO · Testes automáticos a cada push e pull request
# Confere a sintaxe dos scripts, roda a suíte do jogo (index.html?testes=1) num Chromium sem
# janela (tools/testes_navegador.mjs) e as botas dos modelos 3D (tools/conferir_botas.js).
# O Playwright é instalado só aqui, para os testes; o jogo continua sem bibliotecas.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22

      - name: Sintaxe dos scripts
        run: |
          git ls-files '*.js' '*.mjs' ':!js/assets/**' | while read -r f; do node --check "$f" || exit 1; done

      - name: Playwright e Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Suíte do jogo (index.html?testes=1)
        run: node tools/testes_navegador.mjs --imagem testes.png

      - name: Botas presas às pernas (modelos 3D)
        run: node tools/conferir_botas.js

      - name: Imagem da tela dos testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: testes
          path: testes.png
          if-no-files-found: ignore
