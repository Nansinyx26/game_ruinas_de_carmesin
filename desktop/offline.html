<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ECLIPSE ZERO</title>
<style>
  :root { --fundo: #05090f; --texto: #dbe7f5; --ciano: #6fe3ff; --rosa: #ff5ad9; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #12203a, var(--fundo) 70%); color: var(--texto); font: 16px system-ui, sans-serif; }
  main { max-width: 520px; padding: 32px; text-align: center; }
  h1 { letter-spacing: 0.3em; font-weight: 600; color: var(--ciano); margin: 0 0 12px; }
  p { line-height: 1.5; opacity: 0.9; }
  kbd { border: 1px solid var(--rosa); border-radius: 4px; padding: 1px 6px; color: var(--rosa); }
</style>
</head>
<body>
<main>
  <h1>ECLIPSE ZERO</h1>
  <p>Não foi possível abrir o jogo agora. Na primeira vez o app precisa de internet para baixar a versão atual; depois disso ele abre também sem conexão.</p>
  <p>Confira a internet e aperte <kbd>F5</kbd> para tentar de novo.</p>
</main>
</body>
</html>
