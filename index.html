  }

  hitEnemy(e, d, a) {
    let dmg = d.dmg * this.stats.dmgMult * a.mult * (d.heavyType ? this.stats.heavyMult : 1) * rand(0.9, 1.1);
    const crit = Math.random() < this.stats.crit;
    if (crit) dmg *= 2;
    dmg = Math.max(1, Math.round(dmg * (e.vulnerable || 1)));
    // Direção do knockback: radial em golpes de área, misturada com a direção do golpe nos arcos
    const dx = e.x - this.x, dy = e.y - this.y, l = Math.hypot(dx, dy) || 1;
    let kx, ky;
    if (d.radialKb) { kx = dx / l; ky = dy / l; }
    else {
      kx = Math.cos(a.dir) * 0.65 + (dx / l) * 0.35; ky = Math.sin(a.dir) * 0.65 + (dy / l) * 0.35;
      const kl = Math.hypot(kx, ky) || 1; kx /= kl; ky /= kl;
    }
    const kb = d.kb * (a.id === 'charged' ? 1 + a.charge * 0.5 : 1);
    const launch = d.launch * (a.id === 'charged' ? 0.6 + a.charge * 0.6 : 1);
    if (!e.takeHit({ dmg, kx, ky, kb, launch, stun: d.stun, heavy: !!d.heavy, crit })) return;
    game.onEnemyHit(e, dmg, crit, d, kx, ky);
    // A Tempestade Nula descarrega eletricidade no alvo
    if (Math.random() < (d.arcs || 0)) {
      const reach = Math.min(d.blade * 0.6, dist(this.x, this.y, e.x, e.y));
      game.arcs.spawn(this.x + Math.cos(a.dir) * reach * 0.5, this.y + Math.sin(a.dir) * reach * 0.5, 28,
        e.x, e.y, Math.min(e.height * 0.55, 46) + e.z, { w: d.heavy ? 2.2 : 1.5, life: d.heavy ? 0.2 : 0.13 });
    }
    if (this.stats.chain > 0 && Math.random() < this.stats.chain) this.chainLightning(e, dmg);
  }

  // Evolução "Arco Voltaico": o raio salta para o inimigo mais próximo
  chainLightning(src, dmg) {
    let best = null, bd = 200;
    for (const e of game.enemies) {
      if (e === src || !e.canBeHit()) continue;
      const d = dist(src.x, src.y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    const cd = Math.max(1, Math.round(dmg * 0.5 * (best.vulnerable || 1)));
    game.arcs.spawn(src.x, src.y, Math.min(src.height * 0.5, 40) + src.z, best.x, best.y, Math.min(best.height * 0.5, 40) + best.z,
      { w: 2.4, life: 0.24, rgb: '150,205,255' });
    const dx = best.x - src.x, dy = best.y - src.y, l = Math.hypot(dx, dy) || 1;
    if (best.takeHit({ dmg: cd, kx: dx / l, ky: dy / l, kb: 120, launch: 0, stun: 0.25, heavy: false, crit: false })) {
      game.onEnemyHit(best, cd, false, CHAIN_DEF, dx / l, dy / l);
    }
    game.audio.play('zap');
  }

  // Técnica "Corte do Vazio": onda elétrica perfurante em linha reta
  fireCrescent(dir) {
    const n = this.stats.voidSpread, spread = 0.3;
    for (let i = 0; i < n; i++) {
      const a = dir + (i - (n - 1) / 2) * spread;
      game.projectiles.spawn({
        x: this.x + Math.cos(a) * 30, y: this.y + Math.sin(a) * 30, z: 22,
        vx: Math.cos(a) * 680, vy: Math.sin(a) * 680, r: 26,
        dmg: Math.round(24 * this.stats.dmgMult), hostile: false, kind: 'crescent', life: 0.75, pierce: true,
      });
    }
    game.arcs.crackle(this.x + Math.cos(dir) * 36, this.y + Math.sin(dir) * 36, 24, 3, 40, '140,210,255');
    game.audio.play('zap');
  }

  // Técnica "Colapso Magnético": a lâmina crava no chão e libera raios em volta
  slamEffects(dir) {
    const x = this.x + Math.cos(dir) * 46, y = this.y + Math.sin(dir) * 46;
    game.particles.ring(x, y, 130, '60,130,255', 0.45, 12);
    game.particles.ring(x, y, 80, '200,230,255', 0.3, 6);
    game.particles.debris(x, y, 16);
    game.particles.dust(x, y, 14, 14, 160);
    game.particles.flash(x, y, 6, 90, '90,160,255', 0.18);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * TAU + rand(-0.2, 0.2), r = rand(90, 130);
      game.arcs.spawn(x, y, 4, x + Math.cos(a) * r, y + Math.sin(a) * r, 2, { w: 2, life: 0.25, jag: 0.3 });
    }
    game.camera.shake(0.35);
    game.audio.play('stomp');
    game.audio.play('thunder', 0.5);
    game.room.addScorch(x, y, 60);
  }

  enterCharge() {
    this.state = 'charge'; this.stateTime = 0;
    this.chargeTime = 0; this.chargeLevel = 0;
    this.vx *= 0.3; this.vy *= 0.3;
  }

  updateCharge(dt, input, wd) {
    this.chargeTime += dt * this.stats.chargeSpeed;
    const lvl = this.chargeTime >= 0.95 ? 2 : this.chargeTime >= 0.4 ? 1 : 0;
    if (lvl > this.chargeLevel) {
      this.chargeLevel = lvl;
      game.audio.play('chargeTier', lvl);
      game.particles.flash(this.x, this.y, 30, lvl === 2 ? 70 : 45, lvl === 2 ? '170,215,255' : '80,150,255', 0.2);
      game.particles.ring(this.x, this.y, lvl === 2 ? 70 : 50, '110,180,255', 0.3, 4);
      game.arcs.crackle(this.x, this.y, 34, 2 + lvl * 2, 40 + lvl * 14, '150,205,255');
      game.audio.play('zap');
      game.camera.shake(0.06 * lvl);
      this.flash = 0.05;
    }
    if (Math.random() < 0.5 + lvl * 0.25) {
      game.particles.converge(this.x, this.y, 24, 1, 60 + lvl * 20, lvl === 2 ? '170,215,255' : '70,140,255', 0.35);
    }
    if (lvl === 2 && Math.random() < 0.18) game.arcs.crackle(this.x, this.y, 40, 1, 46, '150,205,255', 0.1);
    // Movimento lento e mira livre enquanto carrega
    let tvx = 0, tvy = 0;
    if (wd) {
      this.facing = angleLerp(this.facing, Math.atan2(wd.y, wd.x), 1 - Math.exp(-12 * dt));
      tvx = wd.x * BASE_SPEED * 0.3; tvy = wd.y * BASE_SPEED * 0.3;
    }
    this.vx = approach(this.vx, tvx, 1600 * dt);
    this.vy = approach(this.vy, tvy, 1600 * dt);
    if (this.dashBuffer > 0 && this.dashCd <= 0) { this.dashBuffer = 0; this.combo.reset(); this.startDash(wd); return; }
    if (!input.held.heavy) {
      const level = clamp(this.chargeTime / 0.95, 0, 1);
      this.combo.seq = '';
      this.startAttack('charged', null, level);
    }
  }

  startDash(wd) {
    let dx, dy;
    if (wd) { dx = wd.x; dy = wd.y; } else { dx = Math.cos(this.facing); dy = Math.sin(this.facing); }
    this.dashDirX = dx; this.dashDirY = dy;
    this.facing = Math.atan2(dy, dx);
    this.state = 'dash'; this.stateTime = 0;
    this.invuln = Math.max(this.invuln, 0.22 + this.stats.iframeBonus);
    this.dashCd = 0.5 * this.stats.dashCdMult;
    this.ghostTimer = 0;
    this.squash = -0.1;
    game.audio.play('dash');
    game.particles.dust(this.x, this.y, 6, 8, 80);
  }

  updateDash(dt) {
    const dur = 0.17 * this.stats.dashMult;
    const t = clamp(this.stateTime / dur, 0, 1);
    const sp = 880 * (1 - t * t * 0.55);
    this.vx = this.dashDirX * sp; this.vy = this.dashDirY * sp;
    // Imagens residuais (afterimages)
    this.ghostTimer -= dt;
    if (this.ghostTimer <= 0) {
      this.ghostTimer = 0.028;
      const g = this.ghosts.find((q) => q.life <= 0) || this.ghosts[0];
      g.x = this.x; g.y = this.y; g.f = this.facing; g.life = 0.22;
    }
    if (this.stateTime >= dur) {
      this.state = 'idle';
      this.combo.dashWindow = 0.32;   // janela para a estocada (esquiva + leve)
      this.vx *= 0.35; this.vy *= 0.35;
    }
  }

  startSpecial() {
    this.fury = 0;
    this.state = 'special'; this.stateTime = 0;
    this.specialFired = false;
    this.invuln = Math.max(this.invuln, 1.25);
    this.vx = this.vy = 0;
    if (this.attack && this.attack.trail) this.attack.trail.release();
    this.combo.reset();
    game.hud.comboName('ECLIPSE ABSOLUTO', true);
    game.audio.play('specialCharge');
    game.camera.zoomPunch(0.05);
  }

  updateSpecial(dt) {
    const t = this.stateTime;
    this.vx = this.vy = 0;
    this.z = t < 0.45 ? easeOutCubic(t / 0.45) * 28 : Math.max(0, 28 - (t - 0.45) * 300);
    if (t < 0.45) {
      game.particles.converge(this.x, this.y, 30, 3, 170, '60,130,255', 0.4);
      if (Math.random() < 0.5) game.particles.converge(this.x, this.y, 30, 1, 120, '210,235,255', 0.35);
      if (Math.random() < 0.35) {
        const a = rand(0, TAU), r = rand(80, 170);
        game.arcs.spawn(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, rand(0, 60), this.x, this.y, 70, { w: 1.6, life: 0.12 });
      }
    }
    if (!this.specialFired && t >= 0.45) { this.specialFired = true; this.fireSpecial(); }
    if (t >= 1.05) { this.state = 'idle'; this.z = 0; }
  }

  // Especial "Eclipse Absoluto": libera toda a energia acumulada pela espada
  // (raios em todos os inimigos próximos, lâminas radiais e limpeza de projéteis)
  // — mas desperta algo adormecido dentro de Kael
  fireSpecial() {
    const R = 270, base = 85 * this.stats.dmgMult;
    for (const e of game.enemies) {
      if (!e.canBeHit()) continue;
      const dx = e.x - this.x, dy = e.y - this.y, d = Math.hypot(dx, dy);
      if (d > R + e.radius) continue;
      const l = d || 1, kx = dx / l, ky = dy / l;
      const dmg = Math.max(1, Math.round(base * (1 - 0.4 * Math.min(1, d / R)) * rand(0.95, 1.05) * (e.vulnerable || 1)));
      game.arcs.spawn(this.x, this.y, 80, e.x, e.y, Math.min(e.height * 0.55, 50) + e.z, { w: 3, life: 0.35, jag: 0.26 });
      if (e.takeHit({ dmg, kx, ky, kb: 650, launch: 420, stun: 1.0, heavy: true, crit: false })) {
        game.onEnemyHit(e, dmg, false, SPECIAL_DEF, kx, ky);
      }
    }
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU + rand(-0.2, 0.2), r = rand(160, 280);
      game.arcs.spawn(this.x, this.y, 80, this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, 0, { w: 2.4, life: 0.3, jag: 0.3 });
    }
    game.projectiles.clearHostile(true);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      game.projectiles.spawn({
        x: this.x, y: this.y, z: 22, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, r: 18,
        dmg: Math.round(22 * this.stats.dmgMult), hostile: false, kind: 'blade', life: 0.62, pierce: true,
      });
    }
    const P_ = game.particles;
    P_.ring(this.x, this.y, R + 30, '50,120,255', 0.6, 16);
    P_.ring(this.x, this.y, R * 0.7, '200,230,255', 0.45, 10);
    P_.ring(this.x, this.y, R * 1.3, '20,50,160', 0.85, 8);
    P_.flash(this.x, this.y, 20, 300, '70,140,255', 0.35);
    P_.flash(this.x, this.y, 20, 140, '230,245,255', 0.2);
    for (let i = 0; i < 4; i++) P_.sparks(this.x, this.y, 20, (i / 4) * TAU, 16, '170,215,255', 700, 0.9);
    P_.embers(this.x, this.y, 0, 40, '80,150,255', 120, 160);
    P_.debris(this.x, this.y, 20);
    P_.dust(this.x, this.y, 20, 18, 260);
    game.startEclipseFx(this.x, this.y);
    game.camera.shake(0.9);
    game.camera.zoomPunch(0.09);
    game.addHitStop(0.14);
    game.flashScreen('110,165,255', 0.55);
    game.glitch(0.45);
    game.audio.play('special');
    game.audio.play('thunder');
    game.room.addScorch(this.x, this.y, 150);
    game.hud.whisper();
  }

  addFury(n) {
    if (this.state === 'special') return;
    const before = this.fury;
    this.fury = Math.min(100, this.fury + n * this.stats.furyMult);
    if (before < 100 && this.fury >= 100) { game.hud.furyReady(); game.audio.play('chargeTier', 2); }
  }

  applyLifesteal(dmg) {
    if (this.stats.lifesteal <= 0 || this.hp <= 0) return;
    this.lifestealAcc += dmg * this.stats.lifesteal;
    if (this.lifestealAcc >= 1) {
      const n = Math.floor(this.lifestealAcc);
      this.lifestealAcc -= n;
      this.heal(n, false);
    }
  }

  heal(n, fx = true) {
    if (this.state === 'dead') return;
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    const gained = Math.round(this.hp - before);
    if (fx && gained > 0) game.texts.spawn(this.x, this.y, 60, '+' + gained, '#5dff8a', 20);
  }

  takeDamage(dmg, sx, sy, kb = 260) {
    if (this.state === 'dead' || this.invuln > 0 || game.state !== 'playing') return false;
    dmg = Math.max(1, Math.round(dmg * (1 - this.stats.armor)));
    this.hp -= dmg;
    const dx = this.x - sx, dy = this.y - sy, l = Math.hypot(dx, dy) || 1;
    this.kbx += (dx / l) * kb; this.kby += (dy / l) * kb;
    this.flash = 0.12;
    this.invuln = 0.75;
    if (this.attack && this.attack.trail) this.attack.trail.release();
    this.combo.reset();
    game.onPlayerHurt(dmg, dx / l, dy / l);
    if (this.hp <= 0) {
      this.hp = 0;
      this.state = 'dead'; this.stateTime = 0;
      game.onPlayerDeath();
    } else {
      this.state = 'hurt'; this.stateTime = 0;
    }
    return true;
  }

  // ------------------------------------------------------------------ desenho
  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z;
    if (game.use3D && this.spr && this.spr.ok) { this.draw3D(ctx, sx, sy); return; }
    // Imagens residuais da esquiva (silhuetas de eletricidade azul)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.ghosts) {
      if (g.life <= 0) continue;
      ctx.globalAlpha = (g.life / 0.22) * 0.38;
      this.drawKael(ctx, isoX(g.x, g.y), isoY(g.x, g.y), GHOST_PAL, g.f, false);
    }
    ctx.restore();

    const blink = this.invuln > 0 && this.state === 'hurt' || (this.invuln > 0 && this.state !== 'dash' && this.state !== 'special' && this.state !== 'dead' && Math.floor(this.invuln * 18) % 2 === 0);
    ctx.save();
    if (blink) ctx.globalAlpha = 0.55;
    if (this.state === 'dead') {
      // Cai de lado lentamente
      const k = easeOutCubic(Math.min(1, this.stateTime / 0.6));
      const side = worldAngleToScreen(this.facing, this.tmp2).x >= 0 ? 1 : -1;
      ctx.translate(sx, sy);
      ctx.rotate(-side * k * 1.45);
      this.drawKael(ctx, 0, 0, this.flash > 0 ? FLASH_PAL : PLAYER_PAL, this.facing, true);
    } else {
      this.drawKael(ctx, sx, sy, this.flash > 0 ? FLASH_PAL : PLAYER_PAL, this.facing, true);
    }
    ctx.restore();
  }

  // Versão 3D: fantasmas da esquiva, o modelo e os halos (marca do pulso, lâmina)
  blinking() {
    return this.invuln > 0 && this.state === 'hurt' || (this.invuln > 0 && this.state !== 'dash' && this.state !== 'special' && this.state !== 'dead' && Math.floor(this.invuln * 18) % 2 === 0);
  }
  draw3D(ctx, sx, sy) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.ghosts) {
      if (g.life <= 0 || !g.spr || !g.spr.ok) continue;
      ctx.globalAlpha = (g.life / 0.22) * 0.6;
      R3D.blit(ctx, g.spr, isoX(g.x, g.y), isoY(g.x, g.y));
    }
    ctx.restore();
    ctx.save();
    if (this.blinking()) ctx.globalAlpha = 0.55;
    R3D.blit(ctx, this.spr, sx, sy);
    ctx.restore();
    game.glows3D(ctx, 'kael', this, this.spr, sx, sy);
  }
  // Partes luminosas do modelo (desenhadas depois da escuridão)
  drawEmissive(ctx) {
    if (!game.use3D || !this.spr || !this.spr.ok) return;
    R3D.blitEmissive(ctx, this.spr, isoX(this.x, this.y), isoY(this.x, this.y) - this.z, this.blinking() ? 0.55 : 1);
  }

  // Kael Veyron procedural: casaco negro longo com fivelas, cabelo preto sobre os
  // olhos, marca azul pulsando no pulso esquerdo e a espada Tempestade Nula
  drawKael(ctx, sx, sy, pal, facing, withSword) {
    const f = worldAngleToScreen(facing, this.tmp2);
    const fl = Math.hypot(f.x, f.y) || 1;
    const fdx = f.x / fl, fdy = f.y / fl;
    const side = fdx >= 0 ? 1 : -1;
    const back = fdy < -0.25;
    const moving = this.state === 'run' && this.moveSpeed > 30;
    const t = this.animTime;
    const run = moving ? Math.sin(t * 13) : 0;
    const bob = moving ? Math.abs(Math.cos(t * 13)) * 2.4 : Math.sin(t * 2.2) * 0.8;
    const sq = this.squash;
    const isMain = pal === PLAYER_PAL;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1 - sq * 0.5, 1 + sq);

    // Espada atrás do corpo quando aponta para longe da câmera
    const sword = withSword ? this.swordPose(side, bob) : null;
    if (sword && sword.behind) this.drawSword(ctx, sword, pal);

    const speedK = Math.min(1, this.moveSpeed / BASE_SPEED);
    const sway = -side * speedK * 9 + Math.sin(t * 3.1) * 1.4 + (this.state === 'dash' ? -side * 6 : 0);
    const y0 = -18 - bob, y1 = -40 - bob;   // cintura e ombros

    // Abas do casaco longo (esvoaçam com o movimento), com a barra rasgada
    const tails = (fill) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(-10, y1 + 2); ctx.lineTo(10, y1 + 2);
      ctx.lineTo(12 + sway * 0.5, y0 + 4);
      ctx.lineTo(14 + sway, -3); ctx.lineTo(10 + sway, -7); ctx.lineTo(7 + sway, -1);
      ctx.lineTo(2 + sway, -6); ctx.lineTo(-3 + sway, 0); ctx.lineTo(-7 + sway, -6);
      ctx.lineTo(-14 + sway, -2);
      ctx.lineTo(-12 + sway * 0.5, y0 + 4);
      ctx.closePath(); ctx.fill();
    };
    if (!back) tails(pal.coatDark);

    // Pernas e botas pesadas com fivelas
    const stride = run * 4;
    const la = Math.max(0, run) * 2, lb = Math.max(0, -run) * 2;
    ctx.fillStyle = pal.pants;
    ctx.fillRect(-6 + stride * 0.5, -17 - bob * 0.3 - la, 5, 13);
    ctx.fillRect(1 - stride * 0.5, -17 - bob * 0.3 - lb, 5, 13);
    ctx.fillStyle = pal.boot;
    ctx.fillRect(-7 + stride * 0.5, -6 - la, 7, 6);
    ctx.fillRect(0 - stride * 0.5, -6 - lb, 7, 6);
    ctx.fillStyle = pal.buckle;
    ctx.fillRect(-6 + stride * 0.5, -5 - la, 5, 1);
    ctx.fillRect(1 - stride * 0.5, -5 - lb, 5, 1);

    // Braço livre (esquerdo), com a marca azul no pulso
    const freeX = -side * 12 + (moving ? -run * 2 : 0), freeY = y0 + 1;
    const drawFreeArm = () => {
      ctx.strokeStyle = pal.coat; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-side * 9, y1 + 4); ctx.lineTo(freeX, freeY); ctx.stroke();
      ctx.strokeStyle = pal.strap; ctx.lineWidth = 5.4; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(freeX + side * 0.4, freeY - 5); ctx.lineTo(freeX + side * 0.2, freeY - 3.4); ctx.stroke();
      ctx.fillStyle = pal.glove;
      ctx.beginPath(); ctx.arc(freeX, freeY + 2, 2.4, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.mark;
      ctx.fillRect(freeX - 1.2, freeY - 1.6, 2.4, 1.4);
      if (isMain) game.addGlow(ctx, freeX, freeY - 1, 6 + 3 * Math.sin(t * 4), '61,139,255', 0.55 + 0.25 * Math.sin(t * 4));
    };

    if (back) {
      // De costas: o casaco cobre o corpo e o capuz cai sobre os ombros
      tails(pal.coat);
      drawFreeArm();
      ctx.fillStyle = pal.coat;
      ctx.beginPath(); ctx.moveTo(-11, y1); ctx.lineTo(11, y1); ctx.lineTo(10, y0 + 6); ctx.lineTo(-10, y0 + 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pal.coatDark; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, y1 + 8); ctx.lineTo(0 + sway * 0.3, -4); ctx.stroke();
      ctx.fillStyle = pal.strap;
      ctx.fillRect(-10, y0 + 1, 20, 2.5);
      ctx.fillStyle = pal.coatHi;
      ctx.beginPath(); ctx.ellipse(0, y1 + 3, 8, 4.5, 0, 0, TAU); ctx.fill();   // capuz caído
      ctx.fillStyle = pal.coatDark;
      ctx.beginPath(); ctx.ellipse(0, y1 + 3.5, 5, 2.5, 0, 0, TAU); ctx.fill();
    } else {
      drawFreeArm();
      // Camisa escura com tiras cruzadas e cinto
      ctx.fillStyle = pal.shirt;
      ctx.beginPath(); ctx.moveTo(-7, y0); ctx.lineTo(7, y0); ctx.lineTo(8, y1 + 1); ctx.lineTo(-8, y1 + 1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pal.strap; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-6 * side, y1 + 2); ctx.lineTo(5 * side, y0 - 2); ctx.stroke();
      ctx.fillStyle = pal.buckle;
      ctx.fillRect(-0.5 * side - 1.2, y1 + 9, 2.4, 2.4);
      ctx.fillStyle = pal.strap;
      ctx.fillRect(-7, y0 - 3, 14, 2.6);
      ctx.fillStyle = pal.buckle;
      ctx.fillRect(-1.5, y0 - 3.2, 3, 3);
      // Casaco aberto: painéis da frente até os joelhos
      for (const k of [-1, 1]) {
        ctx.fillStyle = k === -side ? pal.coatHi : pal.coat;
        ctx.beginPath();
        ctx.moveTo(k * 11, y1); ctx.lineTo(k * 4, y1 + 2);
        ctx.lineTo(k * 5, y0 + 1); ctx.lineTo(k * 6 + sway * 0.4, -5);
        ctx.lineTo(k * 13 + sway * 0.6, -4); ctx.lineTo(k * 12, y0 + 2);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = pal.coatDark; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-4, y1 + 3); ctx.lineTo(-5 + sway * 0.4, -5); ctx.moveTo(4, y1 + 3); ctx.lineTo(5 + sway * 0.4, -5); ctx.stroke();
      // Fivelas nas abas do casaco
      ctx.fillStyle = pal.buckle;
      ctx.fillRect(-side * 9 - 1, y0 - 6, 2.2, 1.6);
      ctx.fillRect(-side * 9.5 - 1, y0 + 2, 2.2, 1.6);
      // Gola alta
      ctx.fillStyle = pal.coat;
      ctx.beginPath(); ctx.moveTo(-8, y1 + 1); ctx.lineTo(-7, y1 - 6); ctx.lineTo(-2, y1 + 2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(8, y1 + 1); ctx.lineTo(7, y1 - 6); ctx.lineTo(2, y1 + 2); ctx.closePath(); ctx.fill();
    }

    // Ombros do casaco
    ctx.fillStyle = pal.coat;
    ctx.beginPath(); ctx.ellipse(-10, y1 + 2, 5, 3.6, -0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, y1 + 2, 5, 3.6, 0.3, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.strap;
    ctx.fillRect(side * 8 - 2, y1 + 1, 4, 1.4);

    // Cabeça: rosto parcialmente coberto pelo cabelo preto e desgrenhado
    const hx = side * 1.2, hy = y1 - 8;
    if (back) {
      ctx.fillStyle = pal.hair;
      ctx.beginPath(); ctx.arc(hx, hy - 1, 8, 0, TAU); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hx - 8, hy); ctx.lineTo(hx - 6, hy + 8); ctx.lineTo(hx - 2, hy + 5); ctx.lineTo(hx + 1, hy + 9);
      ctx.lineTo(hx + 4, hy + 5); ctx.lineTo(hx + 7, hy + 8); ctx.lineTo(hx + 8, hy); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pal.hairHi; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hx - 3, hy - 7); ctx.lineTo(hx - 5, hy + 2); ctx.moveTo(hx + 3, hy - 7); ctx.lineTo(hx + 4, hy + 3); ctx.stroke();
    } else {
      ctx.fillStyle = pal.skinShade;
      ctx.fillRect(hx - 2.5, y1 - 3, 5, 4);   // pescoço
      ctx.fillStyle = pal.skin;
      ctx.beginPath(); ctx.ellipse(hx + side * 0.8, hy + 1, 5.6, 6.6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.skinShade;
      ctx.beginPath(); ctx.ellipse(hx - side * 3.4, hy + 2, 2.2, 5, 0, 0, TAU); ctx.fill();
      // Olhos cinzentos (o da frente meio escondido pela franja)
      ctx.fillStyle = pal.eye;
      ctx.fillRect(hx + side * 3 - 1, hy + 1, 2, 1.3);
      ctx.fillRect(hx - side * 1 - 1, hy + 1.2, 1.8, 1.1);
      if (isMain) game.addGlow(ctx, hx + side * 3, hy + 1.6, 4, '150,190,255', 0.35);
      // Cabelo: volume no topo, mechas laterais e franja caindo sobre os olhos
      ctx.fillStyle = pal.hair;
      ctx.beginPath(); ctx.arc(hx, hy - 2.5, 7.6, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hx - 8.2, hy - 3);
      ctx.lineTo(hx - 9, hy + 5); ctx.lineTo(hx - 6.5, hy + 1.5); ctx.lineTo(hx - 5.5, hy + 7);
      ctx.lineTo(hx - 3, hy + 0.5);
      ctx.lineTo(hx - 0.5 + side, hy + 3.5); ctx.lineTo(hx + 1.5 + side, hy - 0.5);
      ctx.lineTo(hx + 4 + side * 1.5, hy + 2.8); ctx.lineTo(hx + 5.5 + side, hy - 1);
      ctx.lineTo(hx + 8.5, hy + 4); ctx.lineTo(hx + 8.4, hy - 3);
      ctx.closePath(); ctx.fill();
      // Pontas rebeldes
      ctx.beginPath();
      ctx.moveTo(hx - 6, hy - 7); ctx.lineTo(hx - 9.5, hy - 9); ctx.lineTo(hx - 4, hy - 9.5);
      ctx.lineTo(hx - 1, hy - 13); ctx.lineTo(hx + 1.5, hy - 9.6); ctx.lineTo(hx + 6, hy - 11); ctx.lineTo(hx + 5.5, hy - 7);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = pal.hairHi; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(hx - side * 4, hy - 8); ctx.lineTo(hx - side * 1, hy - 2); ctx.moveTo(hx + side * 2, hy - 9); ctx.lineTo(hx + side * 4, hy - 3); ctx.stroke();
    }

    // Braço da espada (direito): do ombro até o cabo
    if (sword) {
      const shx = side * 9, shy = y1 + 4;
      ctx.strokeStyle = pal.coat; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(lerp(shx, sword.hx, 0.92), lerp(shy, sword.hy, 0.92)); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.fillStyle = pal.glove;
      ctx.beginPath(); ctx.arc(sword.hx, sword.hy, 2.5, 0, TAU); ctx.fill();
    }

    if (sword && !sword.behind) this.drawSword(ctx, sword, pal);
    ctx.restore();
  }

  // Calcula a pose da espada (coordenadas relativas aos pés, em pixels de tela)
  swordPose(side, bob) {
    const s = { hx: 0, hy: 0, tx: 0, ty: 0, behind: false, glow: 0 };
    const st = this.state;
    const a = this.attack;
    if (st === 'attack' && a && a.def) {
      const ang = this.bladeAngle(a, a.t);
      const c = Math.cos(ang), sn = Math.sin(ang);
      const L = a.def.blade * 0.82;
      const z = 26 + bob;
      s.hx = (c - sn) * 12; s.hy = (c + sn) * 6 - z;
      s.tx = (c - sn) * L; s.ty = (c + sn) * 0.5 * L - z;
      s.behind = c + sn < -0.2;
      s.glow = a.t < a.def.windup + a.def.active ? 0.6 : 0.15;
    } else if (st === 'charge') {
      const ang = this.facing + Math.PI * 0.75 * side;
      const c = Math.cos(ang), sn = Math.sin(ang);
      s.hx = side * 6; s.hy = -34 - bob;
      s.tx = s.hx + (c - sn) * 50; s.ty = s.hy + (c + sn) * 25 - 22;
      s.behind = true;
      s.glow = 0.4 + this.chargeLevel * 0.3 + 0.2 * Math.sin(this.animTime * 30);
    } else if (st === 'special') {
      s.hx = 0; s.hy = -46; s.tx = 0; s.ty = -110; s.behind = false;
      s.glow = 1;
    } else {
      // Repouso: lâmina apontando para baixo e para frente
      const sw = Math.sin(this.animTime * 2) * 1.5;
      s.hx = side * 11; s.hy = -24 - bob;
      s.tx = s.hx + side * (24 + sw); s.ty = s.hy + 32;
      s.behind = false;
    }
    return s;
  }

  // Tempestade Nula: lâmina negra com veias de energia azul, guarda angular com
  // a runa e cabo trançado. Brilha mais conforme a energia acumulada
  drawSword(ctx, s, pal) {
    const dx = s.tx - s.hx, dy = s.ty - s.hy, L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const isMain = pal === PLAYER_PAL;
    const energy = isMain ? Math.max(s.glow, 0.15 + 0.3 * (this.fury / 100)) : 0;
    if (isMain) {
      game.addGlow(ctx, s.hx + dx * 0.6, s.hy + dy * 0.6, 14 + energy * 26, '50,120,255', 0.2 + energy * 0.55);
      if (s.glow > 0) game.addGlow(ctx, s.tx, s.ty, 12 + s.glow * 22, '170,215,255', s.glow * 0.7);
    }
    const b0x = s.hx + ux * 3, b0y = s.hy + uy * 3;
    const mx = s.hx + dx * 0.78, my = s.hy + dy * 0.78;
    // Lâmina
    ctx.fillStyle = pal.blade;
    ctx.beginPath();
    ctx.moveTo(b0x + nx * 3, b0y + ny * 3);
    ctx.lineTo(mx + nx * 2.4, my + ny * 2.4);
    ctx.lineTo(s.tx, s.ty);
    ctx.lineTo(mx - nx * 2.4, my - ny * 2.4);
    ctx.lineTo(b0x - nx * 3, b0y - ny * 3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.bladeEdge; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(b0x + nx * 3, b0y + ny * 3); ctx.lineTo(mx + nx * 2.4, my + ny * 2.4); ctx.lineTo(s.tx, s.ty); ctx.stroke();
    // Veia de energia em zigue-zague pelo centro da lâmina
    ctx.strokeStyle = pal.vein; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(b0x, b0y);
    for (let i = 1; i <= 5; i++) { const k = i / 6, o = (i % 2 ? 1 : -1) * 1.1; ctx.lineTo(s.hx + dx * k + nx * o, s.hy + dy * k + ny * o); }
    ctx.lineTo(s.tx - ux * 4, s.ty - uy * 4);
    ctx.stroke();
    // Guarda angular com a runa azul
    ctx.fillStyle = pal.guard;
    ctx.beginPath();
    ctx.moveTo(s.hx + nx * 7 - ux, s.hy + ny * 7 - uy);
    ctx.lineTo(s.hx + ux * 4, s.hy + uy * 4);
    ctx.lineTo(s.hx - nx * 7 - ux, s.hy - ny * 7 - uy);
    ctx.lineTo(s.hx - ux * 3, s.hy - uy * 3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.vein;
    ctx.fillRect(s.hx - 1, s.hy - 1, 2, 2);
    // Cabo trançado e pomo
    ctx.strokeStyle = pal.grip; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.hx - ux * 3, s.hy - uy * 3); ctx.lineTo(s.hx - ux * 10, s.hy - uy * 10); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = pal.guard;
    ctx.beginPath(); ctx.arc(s.hx - ux * 11, s.hy - uy * 11, 1.8, 0, TAU); ctx.fill();
    if (isMain) {
      game.addGlow(ctx, s.hx, s.hy, 8, '80,160,255', 0.6);
      // Pequenos raios percorrendo a lâmina quando energizada
      if (energy > 0.42 && Math.random() < energy * 0.6) {
        ctx.strokeStyle = 'rgba(190,230,255,0.9)'; ctx.lineWidth = 0.8;
        ctx.beginPath();
        let k = rand(0.15, 0.7);
        ctx.moveTo(s.hx + dx * k, s.hy + dy * k);
        for (let i = 0; i < 3; i++) { k += 0.08; const o = rand(-6, 6); ctx.lineTo(s.hx + dx * k + nx * o, s.hy + dy * k + ny * o); }
        ctx.stroke();
      }
    }
  }

  // Hurtbox e hitbox ativa (F1)
  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.invuln > 0 ? '120,160,255' : '80,255,120');
    const a = this.attack;
    if (this.state === 'attack' && a && a.def) {
      const d = a.def, active = a.t >= d.windup && a.t < d.windup + d.active;
      Hitbox.drawDebug(ctx, d.shape, this.x, this.y, a.dir, active ? '255,40,40' : '255,200,80');
    }
  }
}

// ---------------------------------------------------------------------------
// INIMIGOS — atributos base (escalam com a dificuldade da sala)
// Máquinas de NEXUS, soldados da Legião de Ferro e fiéis do Culto do Eclipse
// blood: cor do fluido (refrigerante, óleo ou sangue)   glow: cor dos sensores
// ---------------------------------------------------------------------------
const ENEMY_TYPES = {
  rastejador: { name: 'Rastejador', hp: 32, radius: 13, speed: 105, mass: 1, dmg: 8, score: 50, souls: [1, 2], orb: 0.12, blood: '24,110,130', glow: '255,60,80', height: 30, stunMult: 1, mech: true },
  legionario: { name: 'Legionário de Ferro', hp: 230, radius: 25, speed: 58, mass: 3.2, dmg: 24, score: 320, souls: [6, 9], orb: 0.6, blood: '38,32,28', glow: '255,130,40', height: 66, stunMult: 0.6, mech: true },
  drone:      { name: 'Drone Sentinela', hp: 42, radius: 13, speed: 92, mass: 0.9, dmg: 11, score: 120, souls: [2, 4], orb: 0.2, blood: '40,46,56', glow: '255,70,70', height: 48, stunMult: 1, mech: true },
  sacerdote:  { name: 'Sacerdote do Eclipse', hp: 42, radius: 13, speed: 92, mass: 0.9, dmg: 11, score: 120, souls: [2, 4], orb: 0.2, blood: '92,16,42', glow: '200,120,255', height: 50, stunMult: 1, mech: false },
  cacador:    { name: 'Caçador da Legião', hp: 46, radius: 12, speed: 165, mass: 0.8, dmg: 13, score: 150, souls: [2, 4], orb: 0.18, blood: '38,32,28', glow: '255,130,40', height: 38, stunMult: 1.1, mech: true },
};
let ENEMY_ID = 0;

class Enemy extends Entity {
  constructor(type, x, y, level) {
    const T = ENEMY_TYPES[type];
    super(x, y, T.radius);
    this.id = ENEMY_ID++;
    this.type = type; this.T = T; this.level = level;
    this.maxHp = this.hp = Math.round(T.hp * (1 + level * 0.16));
    this.dmg = T.dmg * (1 + level * 0.1);
    this.speed = T.speed * (1 + level * 0.03);
    this.aggro = 1 + level * 0.06;          // reduz recargas em salas avançadas
    this.mass = T.mass;
    this.height = T.height;
    this.stunMult = T.stunMult;
    this.state = 'spawn'; this.stateTime = 0; this.spawnDur = 0.75;
    this.attackCd = rand(0.7, 1.5);
    this.stun = 0;
    this.hpBar = 0;
    this.telegraph = null; this.tgProgress = 0;
    this.hasToken = false;
    this.slotAngle = rand(0, TAU);
    this.strafeDir = chance(0.5) ? 1 : -1;
    this.strafeTimer = rand(1, 2.5);
    this.superArmor = false;
    this.invulnerable = false;
    this.launchable = true;
    this.usesSlots = false;
    this.vulnerable = 1;
    this.hitThisAttack = false;
    this.dodgeCredited = false;
    this.wallCd = 0;
    this.animTime = rand(0, 10);
    this.tmp = { x: 0, y: 0 };
    this.pal = null;
  }

  canBeHit() { return this.alive && this.state !== 'spawn' && this.state !== 'dying' && !this.invulnerable; }
  setState(s) { this.state = s; this.stateTime = 0; }
  releaseToken() { if (this.hasToken) game.director.release(this); }
  interrupt() { this.telegraph = null; this.superArmor = false; this.releaseToken(); }

  update(dt) {
    this.animTime += dt; this.stateTime += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.hpBar > 0) this.hpBar -= dt;
    if (this.attackCd > 0) this.attackCd -= dt * this.aggro;
    if (this.wallCd > 0) this.wallCd -= dt;

    if (this.state === 'spawn') {
      if (Math.random() < 0.4) game.particles.embers(this.x, this.y, 0, 1, this.T.glow, this.radius, 50);
      if (this.stateTime >= this.spawnDur) this.setState('idle');
      return;
    }

    // Corpo no ar (lançado): gravidade, quique e queda
    if (this.z > 0 || this.vz > 0) {
      this.vz -= GRAVITY * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        if (this.vz < -420 && this.state !== 'dying') {
          this.vz = -this.vz * 0.25;
          game.particles.dust(this.x, this.y, 6, 10, 90);
          game.camera.shake(0.06);
          game.audio.play('wallHit');
        } else this.vz = 0;
        if (this.state === 'stun') this.stun = Math.max(this.stun, 0.3);
      }
    }

    if (this.state === 'dying') {
      if (this.stateTime >= 0.45) this.alive = false;
    } else if (this.state === 'stun') {
      this.stun -= dt;
      const k = Math.exp(-10 * dt); this.vx *= k; this.vy *= k;
      // Circuitos em curto: faíscas azuis enquanto atordoado
      if (this.T.mech && Math.random() < dt * 5) game.arcs.crackle(this.x, this.y, this.height * 0.5 + this.z, 1, this.radius * 1.4, '140,200,255', 0.09);
      if (this.stun <= 0 && this.z <= 0) this.afterStun();
    } else if (this.z <= 0) {
      this.think(dt, game.player);
    }

    // Física: knockback com atrito + colisão com paredes e pilares
    const kd = Math.exp(-7 * dt);
    this.kbx *= kd; this.kby *= kd;
    const kbSpeed = Math.hypot(this.kbx, this.kby);
    this.x += (this.vx + this.kbx) * dt;
    this.y += (this.vy + this.kby) * dt;
    const hitWall = game.room.collide(this, false);
    this.touchingWall = hitWall;
    // Impacto contra a parede quando arremessado com força
    if (hitWall && kbSpeed > 330 && this.wallCd <= 0 && this.state !== 'dying') {
      this.wallCd = 0.4;
      const dmg = Math.round(6 + kbSpeed * 0.012);
      this.kbx *= -0.3; this.kby *= -0.3;
      game.particles.dust(this.x, this.y, 8, 12, 120);
      game.particles.debris(this.x, this.y, 5);
      game.camera.shake(0.12);
      game.audio.play('wallHit');
      this.hp -= dmg; this.flash = 0.1; this.hpBar = 2.5;
      game.texts.spawn(this.x, this.y, this.height, dmg, '#ffb46b', 18);
      game.stats.dmgDealt += dmg;
      if (this.hp <= 0) this.die({ kx: 0, ky: 0 });
      else if (!this.superArmor) { this.stun = Math.max(this.stun, 0.3); if (this.state !== 'stun') { this.interrupt(); this.setState('stun'); } }
    }
  }

  afterStun() { this.setState('idle'); }

  // Move em direção a um ponto com aceleração suave
  moveToward(tx, ty, speed, dt, accel = 900) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
    let tvx = 0, tvy = 0;
    if (d > 4) {
      const s = speed * Math.min(1, d / 40);
      tvx = (dx / d) * s; tvy = (dy / d) * s;
    }
    this.vx = approach(this.vx, tvx, accel * dt);
    this.vy = approach(this.vy, tvy, accel * dt);
  }
  brake(dt, k = 10) { const f = Math.exp(-k * dt); this.vx *= f; this.vy *= f; }
  faceToward(x, y, dt, rate = 10) { this.facing = angleLerp(this.facing, Math.atan2(y - this.y, x - this.x), 1 - Math.exp(-rate * dt)); }

  // Teste de acerto de um ataque inimigo contra o jogador (com detecção de esquiva perfeita)
  strikePlayer(shape, dir, dmg, kb) {
    const p = game.player;
    if (this.hitThisAttack || p.state === 'dead') return false;
    if (!Hitbox.test(shape, this.x, this.y, dir, p.x, p.y, p.radius)) return false;
    if (p.state === 'dash' && p.invuln > 0) {
      if (!this.dodgeCredited) { this.dodgeCredited = true; game.onPerfectDodge(p); }
      return false;
    }
    if (p.takeDamage(dmg, this.x, this.y, kb)) { this.hitThisAttack = true; return true; }
    return false;
  }

  takeHit(h) {
    if (!this.canBeHit()) return false;
    this.hp -= h.dmg;
    this.flash = 0.11;
    this.hpBar = 2.5;
    const armored = this.superArmor && !h.heavy;
    const k = (armored ? 0.12 : 1) / this.mass;
    this.kbx += h.kx * h.kb * k; this.kby += h.ky * h.kb * k;
    if (this.hp <= 0) { this.die(h); return true; }
    if (!armored) {
      if (h.launch > 0 && this.launchable) { this.vz = Math.max(this.vz, h.launch / Math.sqrt(this.mass)); this.z = Math.max(this.z, 1); }
      else if (this.z > 0) this.vz = Math.max(this.vz, 240);   // malabarismo: golpes no ar mantêm o corpo suspenso
      this.interrupt();
      this.stun = Math.max(this.stun, h.stun * this.stunMult);
      this.setState('stun');
    }
    this.onHurt(h);
    return true;
  }
  onHurt() {}

  die(h) {
    this.interrupt();
    this.hp = 0;
    this.setState('dying');
    this.flash = 0.18;
    this.kbx += (h.kx || 0) * 260 / this.mass; this.kby += (h.ky || 0) * 260 / this.mass;
    if (this.launchable) this.vz = Math.max(this.vz, 160);
    game.onEnemyKilled(this);
  }

  // ------------------------------------------------------------------ desenho
  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z;
    ctx.save();
    let rise = 0;
    if (this.state === 'spawn') {
      const k = clamp(this.stateTime / this.spawnDur, 0, 1);
      rise = (1 - easeOutCubic(k)) * (this.height + 6);
      ctx.globalAlpha = 0.3 + 0.7 * k;
      ctx.beginPath(); ctx.rect(sx - 120, sy - 260, 240, 260); ctx.clip();   // emerge do chão
    } else if (this.state === 'dying') {
      ctx.globalAlpha = clamp(1 - this.stateTime / 0.45, 0, 1);
    }
    const use3D = game.use3D && this.spr && this.spr.ok;
    if (use3D) R3D.blit(ctx, this.spr, sx, sy + rise);
    else this.drawBody(ctx, sx, sy + rise, this.flash > 0 ? FLASH_PAL : this.pal);
    ctx.restore();
    if (use3D && this.state !== 'spawn') game.glows3D(ctx, this.type, this, this.spr, sx, sy);
    // Atordoamento forte: centelhas elétricas girando sobre a cabeça
    if (this.state === 'stun' && this.stun > 0.25 && this.z <= 0) {
      for (let i = 0; i < 3; i++) {
        const a = this.animTime * 7 + (i * TAU) / 3;
        game.addGlow(ctx, sx + Math.cos(a) * 10, sy - this.height - 8 + Math.sin(a) * 3, 6, '140,200,255', 0.85);
      }
    }
  }

  // Partes luminosas do modelo 3D (olhos, visores, núcleos), depois da escuridão
  drawEmissive(ctx) {
    if (!game.use3D || !this.spr || !this.spr.ok) return;
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z;
    let a = 1, rise = 0;
    ctx.save();
    if (this.state === 'spawn') {
      const k = clamp(this.stateTime / this.spawnDur, 0, 1);
      rise = (1 - easeOutCubic(k)) * (this.height + 6);
      a = 0.3 + 0.7 * k;
      ctx.beginPath(); ctx.rect(sx - 120, sy - 260, 240, 260); ctx.clip();
    } else if (this.state === 'dying') a = clamp(1 - this.stateTime / 0.45, 0, 1);
    R3D.blitEmissive(ctx, this.spr, sx, sy + rise, a);
    ctx.restore();
  }

  // Barra de vida pequena sobre a cabeça (desenhada após a iluminação)
  drawHpBar(ctx) {
    if (this.hpBar <= 0 || this.state === 'dying' || this.state === 'spawn') return;
    const w = this.radius > 20 ? 52 : 32;
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z - this.height - 14;
    const a = Math.min(1, this.hpBar * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, 6);
    ctx.fillStyle = '#ff2e55';
    ctx.fillRect(sx - w / 2, sy, w * clamp(this.hp / this.maxHp, 0, 1), 4);
    ctx.globalAlpha = 1;
  }

  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.canBeHit() ? '80,255,120' : '120,120,120');
    if (this.atkShape && (this.state === 'attack' || this.state === 'dash')) {
      Hitbox.drawDebug(ctx, this.atkShape, this.x, this.y, this.atkDir, '255,140,40');
    }
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z - this.height - 22;
    ctx.fillStyle = this.hasToken ? '#ffb46b' : '#9fe';
    ctx.font = `10px ${FONT_UI}`; ctx.textAlign = 'center';
    ctx.fillText(`${this.state}${this.superArmor ? '*' : ''}`, sx, sy);
  }

  // Lado para o qual o inimigo olha na tela (+1 direita, -1 esquerda)
  screenSide() { return worldAngleToScreen(this.facing, this.tmp).x >= 0 ? 1 : -1; }
}

// ---------------------------------------------------------------------------
// RASTEJADOR: criatura mecânica de NEXUS — fraca, vem em bando e cerca o jogador
// ---------------------------------------------------------------------------
class Crawler extends Enemy {
  constructor(x, y, level) {
    super('rastejador', x, y, level);
    this.usesSlots = true;
    this.ring = rand(70, 105);
    this.pal = { shell: '#2b313b', shellHi: '#56606f', dark: '#11141a', leg: '#1f242c', eye: '#ff3a50', fang: '#aab4c4', core: '#38d6ff' };
    this.atkShape = { type: 'arc', range: 50, arc: 0.95 };
    this.atkDir = 0;
  }
  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    switch (this.state) {
      case 'idle': {
        // Vai para o seu ângulo de cerco; com "ficha" de ataque avança até o jogador
        const r = this.hasToken ? 0 : this.ring;
        const tx = p.x + Math.cos(this.slotAngle) * r, ty = p.y + Math.sin(this.slotAngle) * r;
        this.moveToward(tx, ty, this.speed * (this.hasToken ? 1.15 : 1), dt);
        this.faceToward(p.x, p.y, dt);
        if (this.attackCd <= 0 && d < 150 && !this.hasToken) game.director.request(this);
        if (this.hasToken && d < 62) {
          this.setState('windup');
          this.atkDir = Math.atan2(p.y - this.y, p.x - this.x);
          this.facing = this.atkDir;
          this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 52, dir: this.atkDir, arc: 0.95 };
        }
        if (this.hasToken && this.stateTime > 3) { this.releaseToken(); this.attackCd = 0.8; this.stateTime = 0; }
        break;
      }
      case 'windup': {
        this.brake(dt);
        const dur = 0.42 / Math.min(1.3, this.aggro);
        this.tgProgress = this.stateTime / dur;
        this.telegraph.x = this.x; this.telegraph.y = this.y;
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.setState('attack');
          game.audio.play('swing', 0.6);
        }
        break;
      }
      case 'attack':
        this.vx = Math.cos(this.atkDir) * 300; this.vy = Math.sin(this.atkDir) * 300;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 230);
        if (this.stateTime >= 0.12) this.setState('recover');
        break;
      case 'recover':
        this.brake(dt, 12);
        if (this.stateTime >= 0.42) {
          this.releaseToken();
          this.attackCd = rand(1.1, 1.9);
          this.setState(chance(0.35) ? 'retreat' : 'idle');
        }
        break;
      case 'retreat': {
        const a = Math.atan2(this.y - p.y, this.x - p.x);
        this.moveToward(this.x + Math.cos(a) * 80, this.y + Math.sin(a) * 80, this.speed * 0.9, dt);
        this.faceToward(p.x, p.y, dt);
        if (this.stateTime >= 0.5) this.setState('idle');
        break;
      }
    }
  }
  onHurt() { if (chance(0.25)) this.attackCd = Math.max(this.attackCd, 0.5); }

  // Aranha mecânica: carapaça em domo, oito patas articuladas, sensores vermelhos
  // e um tanque de energia roubada nas costas
  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 20;
    const gait = moving ? t * 16 : t * 1.5;
    let lean = 0, rear = 0, reach = 0;
    if (this.state === 'windup') { rear = 6 * Math.min(1, this.tgProgress); lean = -3 * side * Math.min(1, this.tgProgress); }
    else if (this.state === 'attack') { lean = 6 * side; reach = 8; }
    const by = -13 - (moving ? Math.abs(Math.sin(gait)) * 1.5 : Math.sin(t * 3) * 0.5) - rear * 0.6;
    ctx.save();
    ctx.translate(sx, sy);
    // Patas articuladas (quatro de cada lado), passada alternada
    ctx.strokeStyle = pal.leg; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      for (const k of [-1, 1]) {
        const ph = gait + i * 1.7 + (k > 0 ? Math.PI : 0);
        const lift = moving ? Math.max(0, Math.sin(ph)) * 3 : 0;
        const hipX = lean + (i - 1.5) * 3.2, hipY = by + 2;
        const footX = hipX + k * (10 + Math.abs(i - 1.5) * 2.5) + (moving ? Math.cos(ph) * 2.5 : 0);
        const footY = -lift + (i - 1.5) * 1.2;
        const kneeX = (hipX + footX) / 2 + k * 2, kneeY = Math.min(hipY, footY) - 8 - (i === 0 && this.state === 'windup' ? rear : 0);
        ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kneeX, kneeY); ctx.lineTo(footX, footY); ctx.stroke();
      }
    }
    // Carapaça
    ctx.fillStyle = pal.dark;
    ctx.beginPath(); ctx.ellipse(lean, by + 2, 11, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.shell;
    ctx.beginPath(); ctx.ellipse(lean, by - 1, 10.5, 7.5, side * 0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.shellHi;
    ctx.beginPath(); ctx.ellipse(lean - side * 3, by - 4, 5, 2.6, side * 0.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = pal.dark; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lean - side * 6, by - 6); ctx.lineTo(lean + side * 2, by + 3); ctx.stroke();
    // Tanque de energia roubada nas costas
    ctx.fillStyle = pal.core;
    ctx.fillRect(lean - side * 6 - 1.5, by - 6, 3, 4);
    if (pal === this.pal) game.addGlow(ctx, lean - side * 6, by - 4, 6, '56,214,255', 0.5);
    // Quelíceras
    ctx.strokeStyle = pal.fang; ctx.lineWidth = 1.5;
    const fx = lean + side * 9, fy = by + 2;
    ctx.beginPath();
    ctx.moveTo(fx, fy - 1); ctx.quadraticCurveTo(fx + side * (5 + reach), fy, fx + side * (4 + reach), fy + 4);
    ctx.moveTo(fx, fy + 1); ctx.quadraticCurveTo(fx + side * (6 + reach), fy + 3, fx + side * (2 + reach), fy + 6);
    ctx.stroke();
    // Sensores vermelhos
    const ex = lean + side * 7, ey = by - 1;
    ctx.fillStyle = pal.eye;
    ctx.beginPath(); ctx.arc(ex, ey, 2.3, 0, TAU); ctx.fill();
    ctx.fillRect(ex - side * 3.5 - 0.8, ey - 2.6, 1.6, 1.6);
    ctx.fillRect(ex + side * 0.5 - 0.8, ey - 3.4, 1.4, 1.4);
    if (pal === this.pal) game.addGlow(ctx, ex, ey, 8 + (this.state === 'windup' ? 6 * this.tgProgress : 0), '255,50,70', 0.75);
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// LEGIONÁRIO DE FERRO: soldado artificial blindado — lento, muita vida, golpes de
// martelo de impacto com aviso (super armadura). Reconhece Kael como ameaça prioritária
// ---------------------------------------------------------------------------
class Legionary extends Enemy {
  constructor(x, y, level) {
    super('legionario', x, y, level);
    this.launchable = false;
    this.pal = { suit: '#101217', suitHi: '#1d2027', armor: '#2b3038', armorHi: '#4d5462', trim: '#ff7a22',
      helm: '#262a32', visor: '#ff8a2a', hammer: '#24282f', hammerHi: '#59606e', core: '#ff9a3a' };
    this.atkShape = { type: 'arc', range: 128, arc: 1.0 };
    this.atkDir = 0;
    this.move = 'slam';
  }
  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    switch (this.state) {
      case 'idle':
        this.moveToward(p.x, p.y, this.speed, dt, 400);
        this.faceToward(p.x, p.y, dt, 4);
        if (this.attackCd <= 0 && d < 125) {
          this.move = d < 72 && chance(0.45) ? 'stomp' : 'slam';
          this.atkDir = Math.atan2(p.y - this.y, p.x - this.x);
          this.facing = this.atkDir;
          if (this.move === 'slam') {
            this.atkShape = { type: 'arc', range: 128, arc: 1.0 };
            this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 128, dir: this.atkDir, arc: 1.0 };
          } else {
            this.atkShape = { type: 'circle', radius: 100, offset: 0 };
            this.telegraph = { kind: 'circle', x: this.x, y: this.y, r: 100 };
          }
          this.superArmor = true;
          this.setState('windup');
          game.audio.play('telegraph');
        }
        break;
      case 'windup': {
        this.brake(dt, 6);
        const dur = (this.move === 'slam' ? 0.95 : 0.8) / Math.min(1.25, this.aggro);
        // Rastreia o jogador na primeira metade do aviso, depois trava a direção
        if (this.stateTime < dur * 0.45 && this.move === 'slam') {
          this.atkDir = angleLerp(this.atkDir, Math.atan2(p.y - this.y, p.x - this.x), 1 - Math.exp(-3 * dt));
          this.facing = this.atkDir;
        }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.setState('attack');
          this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 460);
          const ix = this.move === 'slam' ? this.x + Math.cos(this.atkDir) * 70 : this.x;
          const iy = this.move === 'slam' ? this.y + Math.sin(this.atkDir) * 70 : this.y;
          game.particles.ring(ix, iy, this.move === 'slam' ? 90 : 110, '255,140,60', 0.4, 9);
          game.arcs.crackle(ix, iy, 6, 4, 70, '255,160,80', 0.16);
          game.particles.debris(ix, iy, 12);
          game.particles.dust(ix, iy, 12, 14, 150);
          game.camera.shake(0.38);
          game.audio.play('stomp');
          game.room.addScorch(ix, iy, 46);
        }
        break;
      }
      case 'attack':
        this.brake(dt);
        if (this.stateTime >= 0.12) { this.superArmor = false; this.setState('recover'); }
        break;
      case 'recover':
        this.brake(dt);
        if (this.stateTime >= 0.85) { this.attackCd = rand(1.4, 2.2); this.setState('idle'); }
        break;
    }
  }

  // Soldado blindado: placas de aço, faixas de luz laranja, elmo com viseira em V
  // e um martelo de impacto que acumula energia antes do golpe
  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 12;
    const step = moving ? Math.sin(t * 6) : 0;
    const breathe = Math.sin(t * 2) * 1.2;
    let clubA = -2.2, shake = 0;   // ângulo do martelo (tela), negativo = erguido
    if (this.state === 'windup') { clubA = -2.9; shake = Math.sin(t * 60) * 1.5 * this.tgProgress; }
    else if (this.state === 'attack' || this.state === 'recover') clubA = 0.6;
    if (this.move === 'stomp' && this.state === 'windup') clubA = -1.7;
    const glowOn = pal === this.pal;
    ctx.save();
    ctx.translate(sx + shake, sy - Math.abs(step) * 2);
    // Pernas blindadas
    ctx.fillStyle = pal.suit;
    ctx.fillRect(-15 + step * 3, -24, 11, 24);
    ctx.fillRect(4 - step * 3, -24, 11, 24);
    ctx.fillStyle = pal.armor;
    ctx.fillRect(-16 + step * 3, -20, 13, 9);
    ctx.fillRect(3 - step * 3, -20, 13, 9);
    ctx.fillRect(-17 + step * 3, -6, 14, 6);
    ctx.fillRect(3 - step * 3, -6, 14, 6);
    ctx.fillStyle = pal.trim;
    ctx.fillRect(-14 + step * 3, -15, 8, 1.6);
    ctx.fillRect(5 - step * 3, -15, 8, 1.6);
    // Tronco massivo
    ctx.fillStyle = pal.suit;
    ctx.beginPath();
    ctx.moveTo(-17, -22); ctx.lineTo(17, -22); ctx.lineTo(25, -56 - breathe); ctx.lineTo(-25, -56 - breathe);
    ctx.closePath(); ctx.fill();
    // Placa peitoral com faixas de luz laranja
    ctx.fillStyle = pal.armor;
    ctx.beginPath();
    ctx.moveTo(-15, -27); ctx.lineTo(15, -27); ctx.lineTo(20, -52 - breathe); ctx.lineTo(-20, -52 - breathe);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.armorHi;
    ctx.fillRect(-side * 17, -50 - breathe, 6, 20);
    ctx.fillStyle = pal.suitHi;
    ctx.fillRect(-2, -50 - breathe, 4, 22);
    ctx.fillStyle = pal.trim;
    ctx.fillRect(-13, -44 - breathe, 7, 2);
    ctx.fillRect(6, -44 - breathe, 7, 2);
    if (glowOn) { game.addGlow(ctx, -9.5, -43 - breathe, 7, '255,130,40', 0.4); game.addGlow(ctx, 9.5, -43 - breathe, 7, '255,130,40', 0.4); }
    // Cinto com bolsas
    ctx.fillStyle = pal.suitHi;
    ctx.fillRect(-16, -29, 32, 4);
    ctx.fillStyle = pal.armor;
    ctx.fillRect(-12, -28, 6, 5); ctx.fillRect(6, -28, 6, 5);
    // Braço de trás
    ctx.fillStyle = pal.suit;
    ctx.beginPath(); ctx.ellipse(-side * 24, -42 - breathe, 7, 12, 0, 0, TAU); ctx.fill();
    // Ombreiras
    for (const k of [-1, 1]) {
      ctx.fillStyle = pal.armor;
      ctx.beginPath(); ctx.ellipse(k * 22, -54 - breathe, 10, 7, k * 0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.armorHi;
      ctx.beginPath(); ctx.ellipse(k * 22 - side * 2, -57 - breathe, 5, 2.6, k * 0.35, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.trim;
      ctx.fillRect(k * 22 - 4, -52 - breathe, 8, 1.4);
    }
    // Elmo com viseira em V
    const hx = side * 3, hy = -64 - breathe;
    ctx.fillStyle = pal.helm;
    ctx.beginPath(); ctx.arc(hx, hy, 10, 0, TAU); ctx.fill();
    ctx.fillRect(hx - 8, hy, 16, 9);
    ctx.fillStyle = pal.armorHi;
    ctx.beginPath(); ctx.arc(hx - side * 4, hy - 4, 3.5, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.visor;
    ctx.beginPath();
    ctx.moveTo(hx + side * 2 - 8, hy - 2); ctx.lineTo(hx + side * 2, hy + 3); ctx.lineTo(hx + side * 2 + 8, hy - 2);
    ctx.lineTo(hx + side * 2 + 7, hy + 1); ctx.lineTo(hx + side * 2, hy + 6); ctx.lineTo(hx + side * 2 - 7, hy + 1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.suitHi;
    ctx.fillRect(hx + side * 2 - 3, hy + 6, 6, 3);   // grade do respirador
    if (glowOn) game.addGlow(ctx, hx + side * 2, hy + 1, 13, '255,130,40', 0.85);
    // Braço da frente com o martelo de impacto
    const shx = side * 22, shy = -48 - breathe;
    const ca = side > 0 ? clubA : Math.PI - clubA;
    const cx = shx + Math.cos(ca) * 46, cy = shy + Math.sin(ca) * 46;
    ctx.strokeStyle = pal.armor; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(shx + Math.cos(ca) * 14, shy + Math.sin(ca) * 14); ctx.stroke();
    ctx.strokeStyle = pal.hammer; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(shx + Math.cos(ca) * 10, shy + Math.sin(ca) * 10); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.lineCap = 'butt';
    // Cabeça do martelo (bloco perpendicular ao cabo)
    const nx = -Math.sin(ca), ny = Math.cos(ca), ux = Math.cos(ca), uy = Math.sin(ca);
    ctx.fillStyle = pal.hammer;
    ctx.beginPath();
    ctx.moveTo(cx + nx * 13 - ux * 7, cy + ny * 13 - uy * 7); ctx.lineTo(cx + nx * 13 + ux * 7, cy + ny * 13 + uy * 7);
    ctx.lineTo(cx - nx * 13 + ux * 7, cy - ny * 13 + uy * 7); ctx.lineTo(cx - nx * 13 - ux * 7, cy - ny * 13 - uy * 7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.hammerHi; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = pal.core;
    ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill();
    if (glowOn) {
      const k = this.state === 'windup' ? this.tgProgress : 0;
      game.addGlow(ctx, cx, cy, 10 + 22 * k, '255,120,40', 0.4 + 0.5 * k);
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// ATIRADORES: mantêm distância, recuam e disparam projéteis
//   drone     — Drone Sentinela de NEXUS (laser vermelho)
//   sacerdote — Sacerdote do Culto do Eclipse (orbes de dados violeta)
// ---------------------------------------------------------------------------
class Shooter extends Enemy {
  constructor(type, x, y, level) {
    super(type, x, y, level);
    this.pal = type === 'drone'
      ? { hull: '#2b3039', hullHi: '#58616f', dark: '#121419', lens: '#ff3b3b', rotor: '#8a93a3', light: '#ff5050' }
      : { robe: '#191730', robeDark: '#0c0b1a', trim: '#8a64ff', face: '#dcd8ea', eye: '#c9a0ff', staff: '#3b3f4c', orb: '#c58cff', halo: '#d8bcff' };
    this.prefer = rand(230, 290);
    this.aim = 0;
    this.attackCd = rand(1.2, 2.2);
  }
  think(dt, p) {
    const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy) || 1;
    const toP = Math.atan2(dy, dx);
    switch (this.state) {
      case 'idle': {
        this.strafeTimer -= dt;
        if (this.strafeTimer <= 0) { this.strafeTimer = rand(1.2, 2.6); this.strafeDir *= -1; }
        // Recuar se o jogador está perto, aproximar se está longe, senão rodear
        let radial = 0;
        if (d < 170) radial = -1; else if (d > 340) radial = 1;
        const sxv = -dy / d * this.strafeDir, syv = dx / d * this.strafeDir;
        const mx = (dx / d) * radial + sxv * (radial ? 0.45 : 1);
        const my = (dy / d) * radial + syv * (radial ? 0.45 : 1);
        const ml = Math.hypot(mx, my) || 1;
        const sp = this.speed * (radial < 0 ? 1.15 : 0.8);
        this.vx = approach(this.vx, (mx / ml) * sp, 700 * dt);
        this.vy = approach(this.vy, (my / ml) * sp, 700 * dt);
        this.faceToward(p.x, p.y, dt);
        if (this.attackCd <= 0 && d < 480) {
          this.aim = toP;
          this.setState('windup');
          this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: toP, len: Math.min(d, 420), w: 5 };
        }
        break;
      }
      case 'windup': {
        this.brake(dt, 8);
        const dur = 0.65 / Math.min(1.25, this.aggro);
        if (this.stateTime < dur * 0.7) this.aim = angleLerp(this.aim, toP, 1 - Math.exp(-8 * dt));
        this.facing = this.aim;
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.aim, len: Math.min(d, 420) });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.fire();
          this.setState('recover');
        }
        break;
      }
      case 'recover':
        this.brake(dt, 6);
        if (this.stateTime >= 0.4) { this.attackCd = rand(1.9, 2.8); this.setState('idle'); }
        break;
    }
  }
  fire() {
    const drone = this.type === 'drone';
    const n = this.level >= 3 ? 3 : 1, spread = 0.26, sp = (drone ? 340 : 300) + this.level * 18;
    for (let i = 0; i < n; i++) {
      const a = this.aim + (i - (n - 1) / 2) * spread;
      game.projectiles.spawn({
        x: this.x + Math.cos(a) * 16, y: this.y + Math.sin(a) * 16, z: drone ? 40 : 34,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: drone ? 8 : 9, dmg: this.dmg, hostile: true, kind: drone ? 'laser' : 'orb', life: 2.4,
      });
    }
    game.particles.flash(this.x + Math.cos(this.aim) * 16, this.y + Math.sin(this.aim) * 16, 40, 30, drone ? '255,80,80' : '200,120,255', 0.12);
    game.audio.play(drone ? 'laser' : 'shoot');
  }

  drawBody(ctx, sx, sy, pal) {
    if (this.type === 'drone') { this.drawDrone(ctx, sx, sy, pal); return; }
    const side = this.screenSide(), t = this.animTime;
    const hover = 4 + Math.sin(t * 3) * 2;
    ctx.save();
    ctx.translate(sx, sy - hover);
    // Manto em forma de sino
    ctx.fillStyle = pal.robeDark;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-10, -26, -1, -40); ctx.quadraticCurveTo(10, -26, 14, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.robe;
    ctx.beginPath(); ctx.moveTo(-11, 0); ctx.quadraticCurveTo(-7, -24, 0, -38); ctx.quadraticCurveTo(side * 6, -22, 6, 0); ctx.closePath(); ctx.fill();
    // Barra rasgada com detalhe violeta
    ctx.strokeStyle = pal.trim; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const x = -14 + i * 28 / 6, y = -1 + (i % 2) * 3 + Math.sin(t * 4 + i) * 1; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    // Linhas de circuito bordadas no manto
    ctx.strokeStyle = pal.trim; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-2, -32); ctx.lineTo(-2, -14); ctx.lineTo(-6, -8); ctx.moveTo(2, -30); ctx.lineTo(2, -18); ctx.lineTo(5, -14); ctx.stroke();
    // Capuz com máscara branca e olhos violeta
    ctx.fillStyle = pal.robe;
    ctx.beginPath(); ctx.arc(side * 1, -40, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(side * 1 - 6, -47); ctx.lineTo(side * 1 - side * 4, -56); ctx.lineTo(side * 1 + 6, -46); ctx.fill();
    ctx.fillStyle = pal.face;
    ctx.beginPath(); ctx.ellipse(side * 4, -39, 4.5, 5.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#1a1626';
    ctx.fillRect(side * 4 - 3, -40, 2, 1.8); ctx.fillRect(side * 4 + 1, -40, 2, 1.8);
    if (pal === this.pal) game.addGlow(ctx, side * 4, -40, 6, '200,140,255', 0.6);
    // Auréola de dados flutuando sobre a cabeça
    const hy = -58 + Math.sin(t * 2) * 1.2;
    ctx.strokeStyle = pal.halo; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(side * 1, hy, 9, 3, 0, 0, TAU); ctx.stroke();
    if (pal === this.pal) game.addGlow(ctx, side * 1, hy, 14, '200,140,255', 0.45);
    // Cetro com orbe de dados
    const stx = side * 13;
    ctx.strokeStyle = pal.staff; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(stx, -2); ctx.lineTo(stx, -50); ctx.stroke();
    const charge = this.state === 'windup' ? this.tgProgress : 0;
    ctx.fillStyle = pal.orb;
    ctx.beginPath(); ctx.arc(stx, -54, 4 + charge * 3, 0, TAU); ctx.fill();
    if (pal === this.pal) game.addGlow(ctx, stx, -54, 12 + charge * 22, '190,110,255', 0.5 + charge * 0.5);
    ctx.restore();
  }

  // Drone Sentinela: casco em disco, rotores laterais e lente de mira vermelha
  drawDrone(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const hover = 30 + Math.sin(t * 3.2) * 3;
    const tilt = clamp(this.vx * 0.002, -0.2, 0.2);
    const charge = this.state === 'windup' ? this.tgProgress : 0;
    ctx.save();
    ctx.translate(sx, sy - hover);
    ctx.rotate(tilt);
    // Braços e rotores (borrões girando)
    for (const k of [-1, 1]) {
      ctx.strokeStyle = pal.dark; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(k * 6, -2); ctx.lineTo(k * 15, -6); ctx.stroke();
      ctx.fillStyle = 'rgba(140,150,165,0.35)';
      const w = 8 + Math.abs(Math.sin(t * 40 + k)) * 3;
      ctx.beginPath(); ctx.ellipse(k * 15, -8, w, 2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = pal.rotor;
      ctx.fillRect(k * 15 - 1, -9, 2, 3);
    }
    // Casco
    ctx.fillStyle = pal.dark;
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.hull;
    ctx.beginPath(); ctx.ellipse(0, -1, 11, 6.5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.hullHi;
    ctx.beginPath(); ctx.ellipse(-side * 3, -4, 5, 2, 0, 0, TAU); ctx.fill();
    // Antena com luz de status
    ctx.strokeStyle = pal.dark; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-side * 4, -6); ctx.lineTo(-side * 6, -13); ctx.stroke();
    ctx.fillStyle = pal.light;
    ctx.fillRect(-side * 6 - 1, -14, 2, 2);
    // Lente de mira
    const lx = side * 6, ly = 0;
    ctx.fillStyle = '#05060a';
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.lens;
    ctx.beginPath(); ctx.arc(lx, ly, 2 + charge * 1.5, 0, TAU); ctx.fill();
    if (pal === this.pal) {
      game.addGlow(ctx, lx, ly, 8 + charge * 18, '255,60,60', 0.7 + charge * 0.3);
      if (Math.floor(t * 3) % 2) game.addGlow(ctx, -side * 6, -13, 4, '255,60,60', 0.8);
    }
    ctx.restore();
    // Facho de luz no chão sob o drone
    if (pal === this.pal) game.addGlow(ctx, sx, sy, 16, '255,70,70', 0.12);
  }
}

// ---------------------------------------------------------------------------
// CAÇADOR DA LEGIÃO: unidade sintética rápida — rodeia o jogador e faz
// investidas telegrafadas com lâminas nos braços
// ---------------------------------------------------------------------------
class Hunter extends Enemy {
  constructor(x, y, level) {
    super('cacador', x, y, level);
    this.pal = { body: '#1c2027', bodyHi: '#3d4451', scarf: '#ff7a22', blade: '#c9d1dd', eye: '#ff8a2a', dark: '#0c0e12' };
    this.orbit = rand(150, 190);
    this.atkShape = { type: 'circle', radius: 14, offset: 0 };
    this.atkDir = 0;
    this.dashTarget = 0;
  }
  think(dt, p) {
    const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy) || 1;
    switch (this.state) {
      case 'idle': {
        // Órbita ao redor do jogador
        this.strafeTimer -= dt;
        if (this.strafeTimer <= 0) { this.strafeTimer = rand(0.8, 2); if (chance(0.5)) this.strafeDir *= -1; }
        const a = Math.atan2(this.y - p.y, this.x - p.x) + this.strafeDir * 0.9;
        const tx = p.x + Math.cos(a) * this.orbit, ty = p.y + Math.sin(a) * this.orbit;
        this.moveToward(tx, ty, this.speed, dt, 1200);
        this.faceToward(p.x, p.y, dt, 12);
        if (this.attackCd <= 0 && d < 300 && game.director.request(this)) {
          this.atkDir = Math.atan2(dy, dx);
          this.setState('windup');
          this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: this.atkDir, len: Math.min(d + 70, 330), w: 16 };
          game.audio.play('telegraph');
        }
        break;
      }
      case 'windup': {
        this.brake(dt, 12);
        const dur = 0.42 / Math.min(1.25, this.aggro);
        if (this.stateTime < dur * 0.6) {
          // Mira com leve antecipação do movimento do jogador
          const lx = p.x + p.vx * 0.15, ly = p.y + p.vy * 0.15;
          this.atkDir = angleLerp(this.atkDir, Math.atan2(ly - this.y, lx - this.x), 1 - Math.exp(-10 * dt));
          this.dashTarget = Math.min(dist(this.x, this.y, lx, ly) + 70, 330);
        }
        this.facing = this.atkDir;
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir, len: this.dashTarget || 200 });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.dashStartX = this.x; this.dashStartY = this.y;
          this.setState('dash');
          game.audio.play('dash');
        }
        break;
      }
      case 'dash': {
        const sp = 760;
        this.vx = Math.cos(this.atkDir) * sp; this.vy = Math.sin(this.atkDir) * sp;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 300);
        if (Math.random() < 0.7) game.particles.emit(P.DUST, this.x, this.y, 10, 0, 0, 10, 0.3, 7, '60,66,78', 0, 0);
        if (Math.random() < 0.5) game.particles.emit(P.EMBER, this.x, this.y, 20, -this.vx * 0.05, -this.vy * 0.05, 10, 0.25, 2, '255,140,50', 0, 2);
        const traveled = dist(this.x, this.y, this.dashStartX, this.dashStartY);
        if (traveled >= (this.dashTarget || 250) || this.stateTime > 0.45) { this.setState('recover'); this.vx *= 0.3; this.vy *= 0.3; }
        break;
      }
      case 'recover':
        this.brake(dt, 7);
        if (this.stateTime >= 0.6) { this.releaseToken(); this.attackCd = rand(1.3, 2.1); this.setState('idle'); }
        break;
      case 'evade': {
        // Salto para trás após ser atingido
        if (this.stateTime >= 0.35) this.setState('idle');
        break;
      }
    }
  }
  afterStun() {
    if (chance(0.4)) {
      const p = game.player, a = Math.atan2(this.y - p.y, this.x - p.x);
      this.vx = Math.cos(a) * 330; this.vy = Math.sin(a) * 330; this.vz = 260; this.z = 1;
      this.setState('evade');
    } else this.setState('idle');
  }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 30;
    let crouch = 0, stretch = 0;
    if (this.state === 'windup') crouch = 6 * Math.min(1, this.tgProgress);
    if (this.state === 'dash') stretch = 1;
    const run = moving ? Math.sin(t * 18) * 4 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    // Cabo energizado esvoaçante
    ctx.strokeStyle = pal.scarf; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(side * 3, -28 + crouch);
    ctx.quadraticCurveTo(-side * 12, -30 + crouch + Math.sin(t * 10) * 3, -side * (22 + stretch * 10), -24 + crouch + Math.sin(t * 12) * 4);
    ctx.stroke();
    // Pernas dobradas
    ctx.strokeStyle = pal.dark; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-2, -14 + crouch); ctx.lineTo(-7 + run, -7 + crouch * 0.5); ctx.lineTo(-4 + run, 0);
    ctx.moveTo(3, -14 + crouch); ctx.lineTo(8 - run, -7 + crouch * 0.5); ctx.lineTo(5 - run, 0);
    ctx.stroke();
    // Tronco esguio inclinado
    ctx.fillStyle = pal.body;
    ctx.beginPath();
    ctx.moveTo(-4, -13 + crouch); ctx.lineTo(5, -13 + crouch);
    ctx.lineTo(side * (8 + stretch * 6), -30 + crouch); ctx.lineTo(side * (1 + stretch * 6) - side * 6, -31 + crouch);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.bodyHi;
    ctx.fillRect(side * (3 + stretch * 4) - 1, -28 + crouch, 2, 12);
    // Cabeça e olhos
    const hx = side * (7 + stretch * 8), hy = -35 + crouch;
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.fillRect(hx + side * 1.5 - 1, hy - 1.5, 3, 1.6);
    if (pal === this.pal) game.addGlow(ctx, hx + side * 1.5, hy - 1, 7, '255,140,40', 0.75);
    // Braços-lâmina
    const bladeA = this.state === 'dash' ? 0.15 : this.state === 'windup' ? -2.2 : 0.9;
    for (let i = 0; i < 2; i++) {
      const ox = side * (2 + i * 4), oy = -24 + crouch + i * 3;
      const a = side > 0 ? bladeA + i * 0.35 : Math.PI - bladeA - i * 0.35;
      const len = 22 + stretch * 6;
      ctx.fillStyle = pal.blade;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(a - 0.12) * len * 0.5, oy + Math.sin(a - 0.12) * len * 0.5);
      ctx.lineTo(ox + Math.cos(a) * len, oy + Math.sin(a) * len);
      ctx.lineTo(ox + Math.cos(a + 0.12) * len * 0.4, oy + Math.sin(a + 0.12) * len * 0.4);
      ctx.closePath(); ctx.fill();
      if (pal === this.pal && (this.state === 'dash' || this.state === 'windup')) {
        game.addGlow(ctx, ox + Math.cos(a) * len * 0.7, oy + Math.sin(a) * len * 0.7, 10, '255,130,40', 0.5);
      }
    }
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// DIRETOR DE IA: distribui posições de cerco e limita atacantes simultâneos
// ---------------------------------------------------------------------------
class AIDirector {
  constructor() { this.tokens = new Set(); this.maxTokens = 2; this.list = []; }
  reset(level) { this.tokens.clear(); this.maxTokens = 2 + Math.floor(level / 2); }
  request(e) {
    if (e.hasToken) return true;
    for (const t of this.tokens) if (!t.alive || t.state === 'dying') { this.tokens.delete(t); t.hasToken = false; }
    if (this.tokens.size < this.maxTokens) { this.tokens.add(e); e.hasToken = true; return true; }
    return false;
  }
  release(e) { this.tokens.delete(e); e.hasToken = false; }
  update() {
    const p = game.player, list = this.list;
    list.length = 0;
    for (const e of game.enemies) if (e.usesSlots && e.alive && e.state !== 'dying' && e.state !== 'spawn') list.push(e);
    const n = list.length;
    if (!n) return;
    for (const e of list) e.ang = Math.atan2(e.y - p.y, e.x - p.x);
    list.sort((a, b) => a.ang - b.ang);
    // Ângulos igualmente espaçados, alinhados à posição média atual (estável)
    const step = TAU / n;
    let off = 0;
    for (let i = 0; i < n; i++) off += angleDiff(list[0].ang + i * step, list[i].ang);
    const base = list[0].ang + off / n;
    for (let i = 0; i < n; i++) list[i].slotAngle = base + i * step;
  }
}

// Fábrica de inimigos
function createEnemy(type, x, y, level) {
  switch (type) {
    case 'rastejador': return new Crawler(x, y, level);
    case 'legionario': return new Legionary(x, y, level);
    case 'drone':
    case 'sacerdote': return new Shooter(type, x, y, level);
    case 'cacador': return new Hunter(x, y, level);
  }
  return new Crawler(x, y, level);
}

// ---------------------------------------------------------------------------
// Dano genérico ao jogador vindo de perigos de área (com esquiva perfeita)
// ---------------------------------------------------------------------------
function damagePlayerFrom(src, x, y, dmg, kb) {
  const p = game.player;
  if (p.state === 'dead') return false;
  if (p.state === 'dash' && p.invuln > 0) {
    if (!src.dodgeCredited) { src.dodgeCredited = true; game.onPerfectDodge(p); }
    return false;
  }
  return p.takeDamage(dmg, x, y, kb);
}

// ---------------------------------------------------------------------------
// PERIGOS DE ÁREA do chefe: raios do céu artificial, fragmentos do céu que
// desabam e ondas de choque de dados
// ---------------------------------------------------------------------------
class HazardSystem {
  constructor() { this.list = []; }
  clear() { this.list.length = 0; }
  add(h) {
    h.t = 0; h.fired = false; h.fx = 0; h.hit = false; h.dodgeCredited = false;
    h.spin = rand(0, TAU);
    this.list.push(h);
    return h;
  }
  update(dt) {
    const p = game.player;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const h = this.list[i];
      h.t += dt;
      if (h.kind === 'ring') {
        // Onda de choque expansiva: atinge quem estiver sobre a borda
        const k = h.t / h.dur;
        h.radius = lerp(h.r0, h.r1, easeOutCubic(Math.min(1, k)));
        if (!h.hit && Math.abs(dist(h.x, h.y, p.x, p.y) - h.radius) <= h.w + p.radius) {
          if (damagePlayerFrom(h, h.x, h.y, h.dmg, 320)) h.hit = true;
        }
        if (k >= 1) this.list.splice(i, 1);
        continue;
      }
      // Raios e fragmentos: aviso no chão e depois o impacto
      if (!h.fired && h.t >= h.delay) {
        h.fired = true;
        if (dist(h.x, h.y, p.x, p.y) <= h.r + p.radius) damagePlayerFrom(h, h.x, h.y, h.dmg, 300);
        const P_ = game.particles;
        if (h.kind === 'bolt') {
          game.arcs.spawn(h.x + rand(-40, 40), h.y + rand(-40, 40), 560, h.x, h.y, 0, { w: 4, life: 0.32, rgb: '150,240,255', jag: 0.16 });
          game.arcs.spawn(h.x + rand(-60, 60), h.y + rand(-60, 60), 520, h.x, h.y, 0, { w: 2, life: 0.22, rgb: '120,220,255', jag: 0.2 });
          P_.flash(h.x, h.y, 30, 80, '170,240,255', 0.25);
          P_.sparks(h.x, h.y, 10, -Math.PI / 2, 10, '190,245,255', 320, Math.PI);
          P_.ring(h.x, h.y, h.r * 1.2, '120,230,255', 0.35, 6);
          game.camera.shake(0.12);
          game.audio.play('thunder', 0.6);
        } else {
          P_.flash(h.x, h.y, 10, 90, '140,240,255', 0.28);
          P_.ring(h.x, h.y, h.r * 1.3, '90,220,255', 0.45, 10);
          P_.debris(h.x, h.y, 12, '70,100,120');
          P_.dust(h.x, h.y, 10, 16, 160);
          P_.embers(h.x, h.y, 0, 10, '120,240,255', h.r * 0.5, 120);
          game.camera.shake(0.18);
          game.audio.play('explosion');
        }
        game.room.addScorch(h.x, h.y, h.r * 0.8);
      }
      if (h.fired) {
        h.fx += dt;
        if (h.fx >= 0.5) this.list.splice(i, 1);
      }
    }
  }
  // Camada emissiva (depois da iluminação)
  draw(ctx, time) {
    for (const h of this.list) {
      const sx = isoX(h.x, h.y), sy = isoY(h.x, h.y);
      if (h.kind === 'ring') {
        const a = 1 - h.t / h.dur;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('60,200,255', 0.35 * a);
        ctx.lineWidth = h.w * 2.4;
        ctx.beginPath(); ctx.ellipse(sx, sy, Math.max(0.5, h.radius * ISO_RX), Math.max(0.5, h.radius * ISO_RY), 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = rgba('210,255,255', 0.85 * a);
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
        continue;
      }
      if (!h.fired) {
        drawTelegraph(ctx, { kind: 'circle', x: h.x, y: h.y, r: h.r }, h.t / h.delay, time, h.kind === 'bolt' ? '255,60,120' : '255,46,70');
        if (h.kind === 'shard') {
          // Painel hexagonal do céu artificial caindo no final do aviso
          const rem = h.delay - h.t;
          if (rem < 0.6) {
            const z = (rem / 0.6) * 480;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.translate(sx + z * 0.2, sy - z);
            ctx.rotate(h.spin + time * 3);
            ctx.fillStyle = 'rgba(90,200,255,0.35)';
            ctx.strokeStyle = 'rgba(200,250,255,0.9)'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU; k ? ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 10) : ctx.moveTo(Math.cos(a) * 16, Math.sin(a) * 10); }
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();
            ctx.save(); ctx.globalCompositeOperation = 'lighter';
            GlowCache.draw(ctx, '120,220,255', sx + z * 0.2, sy - z, 34, 0.7);
            ctx.restore();
          }
        } else if (h.t / h.delay > 0.6 && Math.random() < 0.3) {
          // Estática no céu antes do raio
          game.arcs.crackle(h.x, h.y, 300, 1, 50, '150,240,255', 0.06);
        }
      } else {
        const a = 1 - h.fx / 0.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        if (h.kind === 'bolt') {
          for (let i = 0; i < 7; i++) {
            const yy = sy - i * 18 * (0.6 + a * 0.6);
            GlowCache.draw(ctx, i < 2 ? '220,255,255' : '90,210,255', sx + Math.sin(time * 30 + i) * 2, yy, (30 - i * 3) * (0.6 + a * 0.5), a * 0.8);
          }
        } else {
          GlowCache.drawFlat(ctx, '90,210,255', sx, sy, h.r * 1.8, a);
        }
        ctx.restore();
      }
    }
  }
}

// ---------------------------------------------------------------------------
// CHEFE: NEXUS, a consciência do Eclipse — 3 fases, ataques telegrafados.
// Uma silhueta humana formada por milhares de fragmentos luminosos
// ---------------------------------------------------------------------------
const BOSS_MOVES = {
  1: ['sweep', 'jump', 'burst'],
  2: ['sweep', 'jump', 'burst', 'charge', 'pillars'],
  3: ['sweep', 'jump', 'burst', 'charge', 'pillars', 'spiral', 'meteor'],
};

class Boss extends Enemy {
  constructor(x, y) {
    super('legionario', x, y, 5);
    this.type = 'chefe';
    this.isBoss = true;
    this.name = 'NEXUS — A CONSCIÊNCIA DO ECLIPSE';
    this.T = Object.assign({}, ENEMY_TYPES.legionario, { score: 6000, souls: [40, 50], orb: 0, blood: '60,200,220', glow: '120,255,235', height: 128, mech: true });
    this.maxHp = this.hp = 2600;
    this.radius = 38; this.mass = 14; this.height = 128;
    this.dmg = 22; this.speed = 92;
    this.launchable = false; this.stunMult = 0;
    this.phase = 1;
    this.maxPoise = 260; this.poise = 260; this.sinceHit = 0;
    this.invulnerable = true;
    this.state = 'intro'; this.stateTime = 0;
    this.jumpZ = 0;
    this.lastMove = null;
    this.idleTime = 1;
    this.casts = 0; this.fireTimer = 0; this.spiralA = 0; this.wave = 0;
    this.touchingWall = false;
    this.pal = { body: '#7fefff', bodyHi: '#e6ffff', frag: '#8ff4ff', core: '#ffffff', halo: '#bffcff', blade: '#dcffff', edge: '#7fefff', eye: '#ffffff' };
  }

  canBeHit() { return this.alive && this.state !== 'dying' && !this.invulnerable; }

  update(dt) {
    if (this.state === 'dying') {
      this.stateTime += dt; this.animTime += dt;
      if (this.flash > 0) this.flash -= dt;
      // Colapso em cadeia: a silhueta se desfaz em fragmentos e descargas
      if (Math.random() < dt * 14) {
        const ox = this.x + rand(-40, 40), oy = this.y + rand(-40, 40);
        game.particles.flash(ox, oy, rand(20, 110), rand(30, 70), '140,240,255', 0.2);
        game.particles.sparks(ox, oy, 60, rand(0, TAU), 6, '200,250,255', 380, Math.PI);
        game.particles.embers(ox, oy, 40, 4, '120,240,255', 30, 140);
        if (Math.random() < 0.5) game.arcs.spawn(this.x, this.y, 90, ox + rand(-60, 60), oy + rand(-60, 60), rand(0, 120), { w: 2, life: 0.18, rgb: '150,240,255' });
        game.audio.play('explosion');
        game.camera.shake(0.1);
      }
      if (this.stateTime >= 2.4) { this.alive = false; game.onBossDefeated(this); }
      return;
    }
    this.sinceHit += dt;
    if (this.sinceHit > 2 && this.state !== 'stagger') this.poise = Math.min(this.maxPoise, this.poise + 45 * dt);
    super.update(dt);
  }

  takeHit(h) {
    if (!this.canBeHit()) return false;
    this.hp -= h.dmg;
    this.flash = 0.08;
    this.sinceHit = 0;
    this.kbx += h.kx * h.kb * 0.03; this.kby += h.ky * h.kb * 0.03;
    if (this.hp <= 0) { this.hp = 0; this.die(h); return true; }
    if (this.state !== 'stagger' && this.state !== 'transition') {
      this.poise -= h.dmg;
      if (this.poise <= 0) this.enterStagger();
    }
    const r = this.hp / this.maxHp;
    if (this.phase === 1 && r <= 0.66) this.startTransition(2);
    else if (this.phase === 2 && r <= 0.33) this.startTransition(3);
    return true;
  }

  die() {
    this.interrupt();
    this.setState('dying');
    this.invulnerable = true;
    this.jumpZ = 0;
    game.hazards.clear();
    game.projectiles.clearHostile(true);
    game.onEnemyKilled(this);
    game.onBossDying(this);
  }

  enterStagger() {
    this.interrupt();
    this.jumpZ = 0;
    this.setState('stagger');
