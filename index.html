    this.vulnerable = 1.3;
    this.poise = this.maxPoise;
    game.texts.spawn(this.x, this.y, 150, 'SISTEMA INSTÁVEL!', '#9fe8ff', 28, 1.2);
    game.audio.play('hitHeavy');
    game.audio.play('glitch');
    game.camera.shake(0.3);
    game.particles.ring(this.x, this.y, 90, '150,240,255', 0.5, 8);
    game.arcs.crackle(this.x, this.y, 90, 6, 70, '150,240,255', 0.2);
  }

  roar() {
    game.audio.play('bossRoar');
    game.audio.play('glitch');
    game.glitch(0.35);
    game.camera.shake(0.7);
    game.particles.ring(this.x, this.y, 260, '60,200,255', 0.8, 14);
    game.particles.ring(this.x, this.y, 160, '210,255,255', 0.5, 8);
    game.particles.dust(this.x, this.y, 18, 18, 260);
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU, r = rand(150, 240);
      game.arcs.spawn(this.x, this.y, 90, this.x + Math.cos(a) * r, this.y + Math.sin(a) * r, 0, { w: 2.4, life: 0.3, rgb: '150,240,255' });
    }
    // Empurra o jogador sem causar dano
    const p = game.player, d = dist(this.x, this.y, p.x, p.y) || 1;
    if (d < 300) { p.kbx += ((p.x - this.x) / d) * 700; p.kby += ((p.y - this.y) / d) * 700; }
  }

  startTransition(ph) {
    this.phase = ph;
    this.interrupt();
    this.jumpZ = 0;
    this.vulnerable = 1;
    this.setState('transition');
    this.invulnerable = true;
    this.poise = this.maxPoise;
    this.speed *= 1.12;
    this.summoned = false;
    game.projectiles.clearHostile(true);
    game.hud.message(ph === 2 ? 'PROTOCOLO DE CONTENÇÃO' : 'O CÉU ARTIFICIAL DESMORONA', ph === 2 ? 'FASE II' : 'FASE III', 2.2, false, true);
    if (ph === 2) game.hud.say('NEXUS', 'Eu preservei o que restou deste mundo. Você veio terminar o que eles começaram?', 4.2);
    else game.hud.say('NEXUS', 'Destrua-me e as cidades se apagam. Absorva-me e você se torna eu. Escolha, Unidade ZERO.', 4.6);
    this.roar();
  }

  // Escolhe o próximo ataque conforme a fase e a distância (sem repetir o anterior)
  chooseAttack(d) {
    const moves = BOSS_MOVES[this.phase];
    const w = {
      sweep: d < 190 ? 5 : 0.5, jump: d > 160 ? 3 : 1.5, burst: 2.2,
      charge: d > 220 ? 3.5 : 1, pillars: d > 180 ? 3 : 1.5, spiral: 2.2, meteor: 2,
    };
    let total = 0;
    for (const m of moves) if (m !== this.lastMove) total += w[m];
    let r = Math.random() * total, pick_ = moves[0];
    for (const m of moves) {
      if (m === this.lastMove) continue;
      r -= w[m];
      if (r <= 0) { pick_ = m; break; }
    }
    this.lastMove = pick_;
    this.startMove(pick_);
  }

  // Duração das preparações diminui a cada fase
  wind(base) { return base * (this.phase === 1 ? 1 : this.phase === 2 ? 0.85 : 0.72); }

  startMove(m) {
    const p = game.player;
    const toP = Math.atan2(p.y - this.y, p.x - this.x);
    this.atkDir = toP; this.facing = toP;
    this.hitThisAttack = false; this.dodgeCredited = false;
    switch (m) {
      case 'sweep':
        this.atkShape = { type: 'arc', range: 178, arc: 1.25 };
        this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 178, dir: toP, arc: 1.25 };
        this.setState('sweep_windup');
        break;
      case 'jump':
        this.setState('jump_windup');
        break;
      case 'burst':
        this.setState('burst_windup');
        this.wave = 0;
        break;
      case 'charge':
        this.atkShape = { type: 'circle', radius: 50, offset: 0 };
        this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: toP, len: 560, w: 46 };
        this.setState('charge_windup');
        break;
      case 'pillars':
        this.setState('pillars');
        this.casts = 0; this.fireTimer = 0.2;
        break;
      case 'spiral':
        this.setState('spiral');
        this.spiralA = toP; this.fireTimer = 0;
        break;
      case 'meteor':
        this.setState('meteor');
        this.casts = 0;
        break;
    }
    game.audio.play('telegraph');
  }

  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = Math.atan2(p.y - this.y, p.x - this.x);
    switch (this.state) {
      case 'intro':
        this.brake(dt);
        if (this.stateTime > 0.9 && !this.roared) { this.roared = true; this.roar(); game.hud.say('NEXUS', 'Você demorou, Kael.', 3.2); }
        if (Math.random() < 0.7) game.particles.converge(this.x, this.y, 90, 2, 160, '120,240,255', 0.5);
        if (this.stateTime >= 2.8) { this.invulnerable = false; this.setState('idle'); this.idleTime = 0.6; }
        break;

      case 'idle':
        if (d > 110) this.moveToward(p.x, p.y, this.speed, dt, 500); else this.brake(dt, 6);
        this.faceToward(p.x, p.y, dt, 5);
        if (this.stateTime >= this.idleTime) this.chooseAttack(d);
        break;

      case 'recover':
        this.brake(dt, 8);
        if (this.stateTime >= this.recoverTime) {
          this.setState('idle');
          this.idleTime = rand(0.45, 1.0) * (this.phase === 3 ? 0.6 : 1);
        }
        break;

      // ----- Corte amplo em cone
      case 'sweep_windup': {
        this.brake(dt, 8);
        const dur = this.wind(0.8);
        if (this.stateTime < dur * 0.5) { this.atkDir = angleLerp(this.atkDir, toP, 1 - Math.exp(-4 * dt)); this.facing = this.atkDir; }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.setState('sweep');
          this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 420);
          game.audio.play('swingHeavy');
          game.camera.shake(0.25);
          const tr = game.trails.create('60,220,255', '220,255,255', 0.2);
          for (let i = 0; i <= 14; i++) {
            const a = this.atkDir - 1.25 + (2.5 * i) / 14;
            tr.add(this.x + Math.cos(a) * 40, this.y + Math.sin(a) * 40, this.x + Math.cos(a) * 175, this.y + Math.sin(a) * 175, 40, (14 - i) * 0.008);
          }
          tr.release();
        }
        break;
      }
      case 'sweep':
        this.brake(dt);
        if (this.stateTime >= 0.15) {
          // Na fase 3 o corte vem em dupla
          if (this.phase === 3 && !this.secondSweep) {
            this.secondSweep = true;
            this.hitThisAttack = false; this.dodgeCredited = false;
            this.atkDir = toP;
            this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 178, dir: toP, arc: 1.25 };
            this.setState('sweep_windup');
            this.stateTime = this.wind(0.8) * 0.35;
          } else {
            this.secondSweep = false;
            this.recoverTime = this.phase === 1 ? 0.75 : 0.55;
            this.setState('recover');
          }
        }
        break;

      // ----- Salto esmagador com onda de choque
      case 'jump_windup':
        this.brake(dt, 10);
        if (this.stateTime >= this.wind(0.45)) {
          this.jumpFromX = this.x; this.jumpFromY = this.y;
          this.jumpToX = p.x; this.jumpToY = p.y;
          this.telegraph = { kind: 'circle', x: p.x, y: p.y, r: 118 };
          this.invulnerable = true;
          this.setState('jump');
          game.audio.play('jump');
          game.particles.dust(this.x, this.y, 12, 16, 180);
        }
        break;
      case 'jump': {
        const dur = 0.85;
        const k = Math.min(1, this.stateTime / dur);
        this.x = lerp(this.jumpFromX, this.jumpToX, easeInOut(k));
        this.y = lerp(this.jumpFromY, this.jumpToY, easeInOut(k));
        this.vx = this.vy = 0;
        this.jumpZ = Math.sin(k * Math.PI) * 190;
        this.tgProgress = k;
        if (k >= 1) {
          this.jumpZ = 0;
          this.invulnerable = false;
          this.telegraph = null;
          this.atkShape = { type: 'circle', radius: 118, offset: 0 };
          this.strikePlayer(this.atkShape, 0, this.dmg + 6, 480);
          game.hazards.add({ kind: 'ring', x: this.x, y: this.y, r0: 60, r1: 320, dur: 0.75, w: 14, dmg: 14 });
          if (this.phase >= 2) game.hazards.add({ kind: 'ring', x: this.x, y: this.y, r0: 20, r1: 280, dur: 1.05, w: 12, dmg: 14 });
          game.particles.ring(this.x, this.y, 140, '90,220,255', 0.4, 12);
          game.particles.debris(this.x, this.y, 22, '50,70,84');
          game.particles.dust(this.x, this.y, 22, 20, 260);
          game.particles.flash(this.x, this.y, 10, 130, '150,240,255', 0.2);
          game.arcs.crackle(this.x, this.y, 6, 6, 120, '150,240,255', 0.22);
          game.camera.shake(0.7);
          game.camera.zoomPunch(0.04);
          game.audio.play('stomp');
          game.audio.play('explosion');
          game.room.addScorch(this.x, this.y, 110);
          this.recoverTime = this.phase === 1 ? 1.0 : 0.75;
          this.setState('recover');
        }
        break;
      }

      // ----- Explosão de projéteis em anel
      case 'burst_windup': {
        this.brake(dt, 8);
        const dur = this.wind(0.75);
        this.tgProgress = this.stateTime / dur;
        if (Math.random() < 0.6) game.particles.converge(this.x, this.y, 70, 2, 120, '120,240,255', 0.4);
        if (this.stateTime >= dur) { this.setState('burst'); this.fireBurst(); }
        break;
      }
      case 'burst':
        this.brake(dt, 8);
        if (this.phase >= 2 && this.wave < 2 && this.stateTime >= 0.32 * this.wave) { this.fireBurst(); }
        if (this.stateTime >= 0.75) { this.recoverTime = 0.55; this.setState('recover'); }
        break;

      // ----- Investida pela arena
      case 'charge_windup': {
        this.brake(dt, 10);
        const dur = this.wind(0.8);
        if (this.stateTime < dur * 0.6) { this.atkDir = angleLerp(this.atkDir, toP, 1 - Math.exp(-6 * dt)); this.facing = this.atkDir; }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.chargeFromX = this.x; this.chargeFromY = this.y;
          this.touchingWall = false;
          this.setState('charging');
          game.audio.play('dash');
          game.audio.play('swingHeavy');
        }
        break;
      }
      case 'charging': {
        this.vx = Math.cos(this.atkDir) * 920; this.vy = Math.sin(this.atkDir) * 920;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg + 4, 520);
        if (Math.random() < 0.8) game.particles.dust(this.x, this.y, 1, 16, 60);
        if (Math.random() < 0.9) game.particles.emit(P.WISP, this.x + rand(-20, 20), this.y + rand(-20, 20), rand(20, 110), 0, 0, 0, 0.35, 3, '150,240,255', 0, 0);
        const traveled = dist(this.x, this.y, this.chargeFromX, this.chargeFromY);
        if (this.touchingWall && this.stateTime > 0.08) {
          // Bate na parede: tremor forte e fica vulnerável por um instante
          this.vx = this.vy = 0;
          game.camera.shake(0.6);
          game.particles.debris(this.x, this.y, 18);
          game.particles.dust(this.x, this.y, 14, 18, 200);
          game.audio.play('stomp');
          this.recoverTime = 1.2;
          this.setState('recover');
        } else if (traveled >= 560 || this.stateTime > 0.9) {
          this.vx *= 0.3; this.vy *= 0.3;
          this.recoverTime = 0.7;
          this.setState('recover');
        }
        break;
      }

      // ----- Raios do céu artificial sob o jogador
      case 'pillars': {
        this.brake(dt, 8);
        this.fireTimer -= dt;
        const total = this.phase === 3 ? 7 : 5;
        if (this.fireTimer <= 0 && this.casts < total) {
          this.casts++;
          this.fireTimer = 0.3;
          game.hazards.add({ kind: 'bolt', x: p.x + p.vx * 0.2, y: p.y + p.vy * 0.2, r: 54, delay: 0.75, dmg: 18 });
        }
        if (this.casts >= total && this.stateTime > total * 0.3 + 0.4) { this.recoverTime = 0.5; this.setState('recover'); }
        break;
      }

      // ----- Espiral de projéteis (fase 3)
      case 'spiral': {
        this.brake(dt, 8);
        this.fireTimer -= dt;
        this.spiralA += dt * 2.1;
        if (this.stateTime > 0.5 && this.fireTimer <= 0 && this.stateTime < 3.1) {
          this.fireTimer = 0.1;
          for (let k = 0; k < 3; k++) {
            const a = this.spiralA + (k * TAU) / 3;
            game.projectiles.spawn({ x: this.x + Math.cos(a) * 34, y: this.y + Math.sin(a) * 34, z: 60,
              vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 10, dmg: 12, hostile: true, kind: 'data', life: 3 });
          }
          game.audio.play('fireball');
        }
        if (this.stateTime >= 3.4) { this.recoverTime = 0.6; this.setState('recover'); }
        break;
      }

      // ----- O céu artificial desmorona: fragmentos caem pela arena (fase 3)
      case 'meteor':
        this.brake(dt, 8);
        if (this.stateTime >= 0.8 && this.casts === 0) {
          this.casts = 1;
          const room = game.room;
          for (let i = 0; i < 10; i++) {
            const pt = room.randomPoint(40);
            game.hazards.add({ kind: 'shard', x: pt.x, y: pt.y, r: 62, delay: rand(0.9, 1.7), dmg: 22 });
          }
          game.hazards.add({ kind: 'shard', x: p.x, y: p.y, r: 62, delay: 1.0, dmg: 22 });
          game.hazards.add({ kind: 'shard', x: p.x + p.vx * 0.5, y: p.y + p.vy * 0.5, r: 62, delay: 1.5, dmg: 22 });
          game.camera.shake(0.3);
          game.glitch(0.25);
          game.room.skyCrack = Math.min(1, (game.room.skyCrack || 0) + 0.35);
        }
        if (this.stateTime >= 1.6) { this.recoverTime = 0.6; this.setState('recover'); }
        break;

      // ----- Transição de fase: NEXUS convoca suas defesas
      case 'transition':
        this.brake(dt, 10);
        if (this.stateTime >= 1.2 && !this.summoned) {
          this.summoned = true;
          const adds = this.phase === 2 ? ['rastejador', 'rastejador', 'rastejador', 'rastejador'] : ['rastejador', 'rastejador', 'cacador', 'cacador', 'sacerdote'];
          for (const t of adds) {
            const pt = game.room.randomPoint(60, game.player, 200);
            const e = game.waves.spawnEnemy(t, pt.x, pt.y, 4);
            game.arcs.spawn(this.x, this.y, 90, e.x, e.y, 10, { w: 2, life: 0.35, rgb: '150,240,255' });
          }
        }
        if (this.stateTime >= 2.4) { this.invulnerable = false; this.setState('idle'); this.idleTime = 0.3; }
        break;

      // ----- Atordoado (poise quebrado)
      case 'stagger':
        this.brake(dt, 10);
        if (this.stateTime >= 1.8) { this.vulnerable = 1; this.setState('idle'); this.idleTime = 0.2; }
        break;
    }
  }

  fireBurst() {
    const n = this.phase === 1 ? 12 : this.phase === 2 ? 16 : 20;
    const off = this.wave * (Math.PI / n);
    for (let i = 0; i < n; i++) {
      const a = off + (i / n) * TAU;
      game.projectiles.spawn({ x: this.x + Math.cos(a) * 40, y: this.y + Math.sin(a) * 40, z: 60,
        vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 11, dmg: 13, hostile: true, kind: 'data', life: 3 });
    }
    this.wave++;
    game.particles.flash(this.x, this.y, 70, 90, '140,240,255', 0.2);
    game.camera.shake(0.2);
    game.audio.play('fireball');
    game.audio.play('explosion');
  }

  drawShadow(ctx) {
    const k = 1 - Math.min(0.6, this.jumpZ / 300);
    ctx.fillStyle = `rgba(0,0,0,${(0.55 * k).toFixed(3)})`;
    isoCirclePath(ctx, this.x, this.y, this.radius * 1.15 * k);
    ctx.fill();
  }

  // Holograma 3D: nada na camada sólida (só os halos); a figura é somada à cena depois
  bossAlpha() {
    if (this.state === 'intro') return clamp(this.stateTime / 1.6, 0, 1);
    if (this.state === 'dying') return clamp(1 - (this.stateTime - 1.4) / 1.0, 0, 1);
    return 1;
  }
  drawEmissive(ctx) {
    if (!game.use3D || !this.spr || !this.spr.ok) return;
    R3D.blitEmissive(ctx, this.spr, isoX(this.x, this.y), isoY(this.x, this.y) - this.jumpZ, this.bossAlpha());
  }

  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.jumpZ;
    if (game.use3D && this.spr && this.spr.ok) { game.glows3D(ctx, 'nexus', this, this.spr, sx, sy, this.bossAlpha()); return; }
    ctx.save();
    if (this.state === 'intro') ctx.globalAlpha = clamp(this.stateTime / 1.6, 0, 1);   // fragmentos se reúnem
    if (this.state === 'dying') ctx.globalAlpha = clamp(1 - (this.stateTime - 1.4) / 1.0, 0, 1);
    this.drawBody(ctx, sx, sy, this.flash > 0 ? FLASH_PAL : this.pal);
    ctx.restore();
  }

  // Silhueta holográfica: auréola de dados, corpo translúcido com linhas de
  // varredura, fragmentos que se desprendem e uma lâmina de luz no braço
  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const st = this.state;
    const glowOn = pal === this.pal;
    const p3 = this.phase === 3;
    const kneel = st === 'stagger' ? 20 : st === 'jump_windup' ? 10 : 0;
    const hover = 12 + Math.sin(t * 1.6) * 4 - kneel;
    const shakeX = (st === 'transition' || st === 'burst_windup' || st === 'stagger') ? Math.sin(t * 50) * 2.5 : 0;
    const coreRGB = p3 ? '255,70,100' : '150,245,255';
    const base = ctx.globalAlpha;

    ctx.save();
    ctx.translate(sx + shakeX, sy - hover);
    if (glowOn) game.addGlow(ctx, 0, -70, 120, p3 ? '255,50,80' : '60,210,255', 0.22 + 0.06 * Math.sin(t * 3));

    // Auréola: anéis concêntricos girando atrás da cabeça
    const hcx = 0, hcy = -104;
    ctx.strokeStyle = pal.halo; ctx.lineWidth = 2;
    ctx.globalAlpha = base * 0.75;
    ctx.beginPath(); ctx.arc(hcx, hcy, 44, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) {
      const a0 = (i / 12) * TAU + t * 0.6;
      ctx.beginPath(); ctx.arc(hcx, hcy, 37, a0, a0 + 0.32); ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(hcx, hcy, 52, -t * 0.4, -t * 0.4 + 4.6); ctx.stroke();
    ctx.globalAlpha = base;

    // Silhueta (cabeça, ombros, tronco que se dissolve em fluxo de dados)
    const figure = () => {
      ctx.beginPath();
      ctx.ellipse(side * 2, -122, 11, 13, 0, 0, TAU);
      ctx.moveTo(-27, -98); ctx.lineTo(27, -98);
      ctx.quadraticCurveTo(22, -76, 14, -56); ctx.lineTo(7, -24); ctx.lineTo(0, -6); ctx.lineTo(-7, -24); ctx.lineTo(-14, -56);
      ctx.quadraticCurveTo(-22, -76, -27, -98);
      ctx.closePath();
    };
    ctx.globalAlpha = base * 0.42;
    ctx.fillStyle = pal.body;
    figure(); ctx.fill();
    ctx.save();
    figure(); ctx.clip();
    ctx.globalAlpha = base * 0.35;
    ctx.fillStyle = pal.bodyHi;
    const scan = (t * 40) % 6;
    for (let y = -136 + scan; y < 0; y += 6) ctx.fillRect(-30, y, 60, 1.4);
    ctx.restore();
    ctx.globalAlpha = base * 0.9;
    ctx.strokeStyle = pal.bodyHi; ctx.lineWidth = 1.5;
    figure(); ctx.stroke();

    // Braço livre aberto, como quem oferece a mão
    ctx.strokeStyle = pal.body; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.globalAlpha = base * 0.55;
    const ox = -side * 26, oy = -94;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - side * 14, oy + 26); ctx.lineTo(ox - side * 26, oy + 34 + Math.sin(t * 2) * 3); ctx.stroke();

    // Fragmentos luminosos (presos ao contorno e soltos, flutuando para longe)
    const rnd = mulberry32(4242);
    ctx.fillStyle = pal.frag;
    for (let i = 0; i < 64; i++) {
      const fy = -134 + rnd() * 128;
      const w = fy < -108 ? 12 : fy < -98 ? 22 : fy < -56 ? lerp(27, 14, (fy + 98) / 42) : lerp(14, 2, (fy + 56) / 50);
      let fx = (rnd() * 2 - 1) * w;
      let yy = fy, a = 0.9;
      if (rnd() < 0.4) {
        const d = (t * (0.25 + rnd() * 0.5) + rnd()) % 1;
        fx += Math.sign(fx || 1) * d * 34; yy -= d * 26; a = 1 - d;
      }
      const sz = 1.5 + rnd() * 2.5;
      ctx.globalAlpha = base * a;
      ctx.fillRect(fx - sz / 2, yy - sz / 2, sz, sz);
    }
    // Fluxo de dados descendo até o chão
    ctx.globalAlpha = base * 0.5;
    for (let i = 0; i < 6; i++) {
      const x = (i - 2.5) * 2.5, d = (t * 1.5 + i * 0.37) % 1;
      ctx.fillRect(x, -10 + d * (hover + 8), 1.4, 5);
    }
    ctx.globalAlpha = base;

    // Núcleo no peito e olhos
    ctx.fillStyle = p3 ? '#ffd6de' : pal.core;
    ctx.beginPath(); ctx.arc(0, -82, 5.5 + Math.sin(t * 6) * 0.8, 0, TAU); ctx.fill();
    const charge = st === 'burst_windup' ? this.tgProgress : 0;
    if (glowOn) game.addGlow(ctx, 0, -82, 24 + charge * 40 + this.phase * 4, coreRGB, 0.8 + charge * 0.2);
    ctx.fillStyle = p3 ? '#ffd6de' : pal.eye;
    ctx.fillRect(side * 2 + side * 3 - 3, -123, 5, 1.8);
    ctx.fillRect(side * 2 - side * 3 - 2, -123, 4, 1.8);
    if (glowOn) game.addGlow(ctx, side * 3, -122, 14, coreRGB, 0.9);

    // Lâmina de luz formada no braço: ângulo conforme o estado
    let a = 0.9;
    if (st === 'sweep_windup') a = -2.5 + this.tgProgress * -0.3;
    else if (st === 'sweep') a = 1.2;
    else if (st === 'jump' || st === 'jump_windup' || st === 'meteor' || st === 'pillars') a = -1.57;
    else if (st === 'charge_windup' || st === 'charging') a = 0.15;
    else if (st === 'stagger') a = 1.45;
    else if (st === 'burst_windup' || st === 'spiral' || st === 'transition') a = -1.2 + Math.sin(t * 3) * 0.2;
    const ang = side > 0 ? a : Math.PI - a;
    const shx = side * 26, shy = -94;
    const L = 118;
    const bx = shx + Math.cos(ang) * L, by = shy + Math.sin(ang) * L;
    const nx = -Math.sin(ang), ny = Math.cos(ang);
    ctx.strokeStyle = pal.body; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.globalAlpha = base * 0.6;
    ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(shx + Math.cos(ang) * 18, shy + Math.sin(ang) * 18); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.globalAlpha = base * 0.8;
    ctx.fillStyle = pal.blade;
    ctx.beginPath();
    ctx.moveTo(shx + Math.cos(ang) * 18 + nx * 5, shy + Math.sin(ang) * 18 + ny * 5);
    ctx.lineTo(bx + nx * 2, by + ny * 2);
    ctx.lineTo(bx + Math.cos(ang) * 16, by + Math.sin(ang) * 16);
    ctx.lineTo(bx - nx * 2, by - ny * 2);
    ctx.lineTo(shx + Math.cos(ang) * 18 - nx * 5, shy + Math.sin(ang) * 18 - ny * 5);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = base;
    if (glowOn) {
      for (let i = 1; i <= 5; i++) {
        const k = i / 5;
        game.addGlow(ctx, lerp(shx, bx, k), lerp(shy, by, k), 14 + (this.phase >= 2 ? 6 : 0) + Math.sin(t * 17 + i) * 3, p3 ? '255,90,120' : '120,235,255', 0.45);
      }
    }
    ctx.restore();
  }

  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.canBeHit() ? '80,255,120' : '120,120,120');
    if (this.atkShape && (this.state === 'sweep' || this.state === 'charging')) Hitbox.drawDebug(ctx, this.atkShape, this.x, this.y, this.atkDir, '255,140,40');
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.height - 30;
    ctx.fillStyle = '#ffd679'; ctx.font = `11px ${FONT_UI}`; ctx.textAlign = 'center';
    ctx.fillText(`${this.state} F${this.phase} poise:${Math.round(this.poise)}`, sx, sy);
  }
}

// ---------------------------------------------------------------------------
// PROJÉTEIS com pooling (inimigos e jogador)
// ---------------------------------------------------------------------------
class ProjectileSystem {
  constructor(max = 320) {
    this.items = [];
    for (let i = 0; i < max; i++) {
      this.items.push({ x: 0, y: 0, z: 0, vx: 0, vy: 0, r: 8, dmg: 0, hostile: true, kind: 'orb',
        life: 0, max: 1, pierce: false, hits: new Set(), dodgeCredited: false, angle: 0 });
    }
    this.count = 0;
  }
  spawn(o) {
    if (this.count >= this.items.length) return null;
    const p = this.items[this.count++];
    p.x = o.x; p.y = o.y; p.z = o.z || 30; p.vx = o.vx; p.vy = o.vy; p.r = o.r || 8;
    p.dmg = o.dmg || 10; p.hostile = o.hostile !== false; p.kind = o.kind || 'orb';
    p.life = p.max = o.life || 2; p.pierce = !!o.pierce;
    p.hits.clear(); p.dodgeCredited = false;
    p.angle = Math.atan2(p.vy, p.vx);
    return p;
  }
  color(p) {
    switch (p.kind) {
      case 'orb': return '200,120,255';
      case 'laser': return '255,80,80';
      case 'data': return '110,255,230';
      case 'crescent': return '140,210,255';
      default: return '110,170,255';
    }
  }
  burst(p) {
    const c = this.color(p);
    game.particles.sparks(p.x, p.y, p.z, p.angle + Math.PI, 7, c, 260, Math.PI);
    game.particles.flash(p.x, p.y, p.z, 26, c, 0.12);
  }
  kill(i, fx) {
    const p = this.items[i];
    if (fx) this.burst(p);
    const last = this.count - 1;
    if (i !== last) { this.items[i] = this.items[last]; this.items[last] = p; }
    this.count--;
  }
  clear() { this.count = 0; }
  clearHostile(fx) {
    for (let i = this.count - 1; i >= 0; i--) if (this.items[i].hostile) this.kill(i, fx);
  }

  update(dt) {
    const pl = game.player;
    outer:
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.kill(i, p.hostile); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'data' && Math.random() < 0.35) game.particles.emit(P.WISP, p.x, p.y, p.z, -p.vx * 0.1, -p.vy * 0.1, 10, 0.3, 1.6, '110,255,230', 0, 1);
      if (game.room.blocksPoint(p.x, p.y, p.r * 0.4)) { this.kill(i, true); continue; }
      if (p.hostile) {
        const rr = p.r + pl.radius;
        if (pl.state !== 'dead' && dist2(p.x, p.y, pl.x, pl.y) < rr * rr) {
          if (pl.state === 'dash' && pl.invuln > 0) {
            if (!p.dodgeCredited) { p.dodgeCredited = true; game.onPerfectDodge(pl); }
            continue;
          }
          if (pl.takeDamage(p.dmg, p.x - p.vx * 0.05, p.y - p.vy * 0.05, 200)) { this.kill(i, true); continue; }
        }
      } else {
        for (const e of game.enemies) {
          if (!e.canBeHit() || p.hits.has(e)) continue;
          const rr = p.r + e.radius;
          if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
            p.hits.add(e);
            const l = Math.hypot(p.vx, p.vy) || 1, kx = p.vx / l, ky = p.vy / l;
            const dmg = Math.max(1, Math.round(p.dmg * (e.vulnerable || 1) * rand(0.9, 1.1)));
            if (e.takeHit({ dmg, kx, ky, kb: 220, launch: 0, stun: 0.3, heavy: false, crit: false })) {
              game.onEnemyHit(e, dmg, false, PROJ_HIT_DEF, kx, ky);
            }
            if (!p.pierce) { this.kill(i, true); continue outer; }
          }
        }
      }
    }
  }

  // Golpes do jogador destroem (aparam) projéteis inimigos
  slashTest(shape, ox, oy, dir) {
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      if (p.hostile && Hitbox.test(shape, ox, oy, dir, p.x, p.y, p.r)) {
        game.onDeflect(p);
        this.kill(i, true);
      }
    }
  }

  drawShadows(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      ctx.beginPath();
      ctx.ellipse(isoX(p.x, p.y), isoY(p.x, p.y), p.r * 1.1, p.r * 0.55, 0, 0, TAU);
      ctx.fill();
    }
  }

  addLights(lighting) {
    for (let i = 0; i < this.count && i < 40; i++) {
      const p = this.items[i];
      lighting.add(isoX(p.x, p.y), isoY(p.x, p.y) - p.z * 0.5, p.kind === 'crescent' ? 150 : 80, 0.55);
    }
  }

  // Camada emissiva
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z;
      const fade = Math.min(1, p.life / 0.15);
      switch (p.kind) {
        case 'orb':   // orbe de dados do Culto
          GlowCache.draw(ctx, '180,100,255', sx, sy, p.r * 3.4, 0.85 * fade);
          GlowCache.draw(ctx, '245,225,255', sx, sy, p.r * 1.3, fade);
          break;
        case 'laser': {   // disparo do Drone Sentinela
          const sv = worldAngleToScreen(p.angle, game.tmpV);
          const l = Math.hypot(sv.x, sv.y) || 1, ux = sv.x / l, uy = sv.y / l;
          ctx.globalAlpha = fade;
          ctx.strokeStyle = 'rgba(255,70,70,0.55)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(sx - ux * 22, sy - uy * 22); ctx.lineTo(sx, sy); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,225,225,0.95)'; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(sx - ux * 18, sy - uy * 18); ctx.lineTo(sx, sy); ctx.stroke();
          ctx.lineCap = 'butt';
          GlowCache.draw(ctx, '255,60,60', sx, sy, p.r * 2.6, 0.7 * fade);
          break;
        }
        case 'data': {   // fragmentos de dados de NEXUS
          const sv = worldAngleToScreen(p.angle, game.tmpV);
          for (let k = 3; k >= 1; k--) GlowCache.draw(ctx, '60,220,200', sx - sv.x * k * 6, sy - sv.y * k * 6, p.r * (2.4 - k * 0.4), 0.3 * fade);
          GlowCache.draw(ctx, '90,255,220', sx, sy, p.r * 3, 0.75 * fade);
          ctx.save();
          ctx.translate(sx, sy); ctx.rotate(p.life * 9);
          ctx.globalAlpha = fade;
          ctx.fillStyle = 'rgba(230,255,250,0.95)';
          ctx.fillRect(-p.r * 0.55, -p.r * 0.55, p.r * 1.1, p.r * 1.1);
          ctx.restore();
          break;
        }
        case 'crescent':
        case 'blade': {
          // Onda elétrica em crescente orientada pela velocidade
          const sv = worldAngleToScreen(p.angle, game.tmpV);
          const a = Math.atan2(sv.y, sv.x);
          const isC = p.kind === 'crescent';
          const R = isC ? 30 : 18;
          ctx.globalAlpha = fade;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(a);
          ctx.scale(1, isC ? 1 : 0.6);
          ctx.fillStyle = isC ? 'rgba(110,180,255,0.7)' : 'rgba(60,130,255,0.8)';
          ctx.beginPath();
          ctx.arc(0, 0, R, -1.2, 1.2);
          ctx.arc(-R * 0.45, 0, R * 0.8, 1.0, -1.0, true);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(230,245,255,0.95)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, R, -1.1, 1.1); ctx.stroke();
          if (isC) {
            ctx.lineJoin = 'round';
            drawBolt(ctx, Math.cos(-1.1) * R, Math.sin(-1.1) * R, Math.cos(1.1) * R, Math.sin(1.1) * R,
              mulberry32(i * 131 + Math.floor(game.realTime * 30)), 0.5, 1.1, '150,210,255', fade, false);
          }
          ctx.restore();
          GlowCache.draw(ctx, isC ? '90,160,255' : '60,120,255', sx, sy, R * 2.2, 0.5 * fade);
          break;
        }
      }
    }
    ctx.restore();
  }

  drawDebug(ctx) {
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      drawHurtbox(ctx, p.x, p.y, p.r, p.hostile ? '255,90,220' : '120,220,255');
    }
  }
}

// ---------------------------------------------------------------------------
// COLETÁVEIS: células de energia (moeda), cápsulas de reparo e fragmentos de memória
// ---------------------------------------------------------------------------
class PickupSystem {
  // Cristal de memória: feixe de luz vertical, prisma girando e partículas em órbita
  drawMemory(ctx, p, time) {
    const gx = isoX(p.x, p.y), gy = isoY(p.x, p.y), sy = gy - p.z;
    const pulse = 0.75 + 0.25 * Math.sin(time * 3);
    const g = ctx.createLinearGradient(0, gy - 220, 0, gy);
    g.addColorStop(0, 'rgba(120,190,255,0)'); g.addColorStop(1, `rgba(140,200,255,${(0.22 * pulse).toFixed(3)})`);
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(gx - 9, gy - 220, 18, 220);
    GlowCache.drawFlat(ctx, '100,170,255', gx, gy, 50, 0.4 * pulse);
    GlowCache.draw(ctx, '120,190,255', gx, sy, 46, 0.6 * pulse);
    if (game.use3D && p.spr && p.spr.ok) {
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      R3D.blit(ctx, p.spr, gx, sy + 10);
      ctx.globalCompositeOperation = 'lighter';
      R3D.blitEmissive(ctx, p.spr, gx, sy + 10, 1);
      return;
    }
    const w = 7 * Math.abs(Math.cos(time * 1.7)) + 2;
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(170,215,255,0.85)';
    ctx.beginPath(); ctx.moveTo(gx, sy - 14); ctx.lineTo(gx + w, sy); ctx.lineTo(gx, sy + 12); ctx.lineTo(gx - w, sy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.2; ctx.stroke();
    for (let k = 0; k < 4; k++) {
      const a = time * 2 + (k * TAU) / 4;
      GlowCache.draw(ctx, '200,230,255', gx + Math.cos(a) * 18, sy + Math.sin(a) * 6, 5, 0.9);
    }
  }

  constructor(max = 260) {
    this.items = [];
    for (let i = 0; i < max; i++) this.items.push({ kind: 'soul', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, value: 1, life: 0, t: 0, attract: false, pull: 0 });
    this.count = 0;
  }
  drop(kind, x, y, value) {
    if (this.count >= this.items.length) return;
    const p = this.items[this.count++];
    const a = Math.random() * TAU, s = rand(40, 150);
    p.kind = kind; p.x = x; p.y = y; p.z = 20;
    p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s; p.vz = rand(200, 320);
    p.value = value; p.life = kind === 'health' ? 16 : 9999; p.t = 0; p.attract = false; p.pull = 0;
  }
  attractAll() { for (let i = 0; i < this.count; i++) this.items[i].attract = true; }
  clear() { this.count = 0; }
  kill(i) {
    const last = this.count - 1, p = this.items[i];
    if (i !== last) { this.items[i] = this.items[last]; this.items[last] = p; }
    this.count--;
  }
  update(dt) {
    const pl = game.player;
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      p.t += dt; p.life -= dt;
      if (p.life <= 0) { this.kill(i); continue; }
      // Física simples com quique (o fragmento de memória apenas flutua)
      if (p.kind === 'memory') { p.z = 22 + Math.sin(p.t * 2) * 5; p.vz = 0; }
      else {
        p.vz -= 900 * dt; p.z += p.vz * dt;
        if (p.z < 0) { p.z = 0; p.vz = Math.abs(p.vz) > 70 ? -p.vz * 0.4 : 0; }
      }
      const dx = pl.x - p.x, dy = pl.y - p.y, d = Math.hypot(dx, dy) || 1;
      const isMem = p.kind === 'memory';
      const magnet = p.kind === 'soul' ? pl.stats.magnet : isMem ? 48 : 60 + pl.stats.magnet * 0.25;
      if (pl.state !== 'dead' && p.t > 0.45 && ((p.attract && !isMem) || d < magnet)) {
        // Atração acelerada em direção ao jogador
        p.pull = Math.min(1, p.pull + dt * 2.5);
        const sp = 260 + 640 * p.pull;
        p.vx = lerp(p.vx, (dx / d) * sp, 1 - Math.exp(-10 * dt));
        p.vy = lerp(p.vy, (dy / d) * sp, 1 - Math.exp(-10 * dt));
        if (!isMem) p.z = Math.max(p.z, 12);
      } else {
        const k = Math.exp(-3 * dt); p.vx *= k; p.vy *= k;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.x = clamp(p.x, 6, game.room.w - 6); p.y = clamp(p.y, 6, game.room.h - 6);
      if (pl.state !== 'dead' && p.t > 0.35 && d < pl.radius + 12) {
        if (p.kind === 'soul') game.collectSoul(p.value, p.x, p.y);
        else if (isMem) game.collectMemory(p.x, p.y);
        else {
          pl.heal(Math.round(p.value * pl.stats.healMult));
          game.audio.play('health');
          game.particles.flash(p.x, p.y, 20, 40, '255,80,120', 0.15);
        }
        this.kill(i);
      }
    }
  }
  // Fragmento de memória flutuando em um ponto fixo da sala
  place(kind, x, y) {
    if (this.count >= this.items.length) return null;
    const p = this.items[this.count++];
    p.kind = kind; p.x = x; p.y = y; p.z = 22; p.vx = p.vy = p.vz = 0;
    p.value = 1; p.life = 9999; p.t = 0; p.attract = false; p.pull = 0;
    return p;
  }
  find(kind) {
    for (let i = 0; i < this.count; i++) if (this.items[i].kind === kind) return this.items[i];
    return null;
  }
  draw(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      const bob = p.z <= 0.1 ? 6 + Math.sin(time * 4 + i) * 3 : 0;
      const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z - bob;
      const blink = p.kind === 'health' && p.life < 3 && Math.floor(p.life * 8) % 2 === 0 ? 0.3 : 1;
      if (p.kind === 'memory') { this.drawMemory(ctx, p, time); continue; }
      if (game.use3D && p.spr && p.spr.ok) {
        // Item em 3D: corpo com luz própria + partes emissivas + brilho no chão
        GlowCache.draw(ctx, p.kind === 'soul' ? '70,150,255' : '255,60,110', sx, sy, p.kind === 'soul' ? 12 : 18, 0.45 * blink);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = blink;
        R3D.blit(ctx, p.spr, sx, sy);
        ctx.globalCompositeOperation = 'lighter';
        R3D.blitEmissive(ctx, p.spr, sx, sy, blink);
        GlowCache.drawFlat(ctx, p.kind === 'soul' ? '70,140,255' : '255,50,100', sx, isoY(p.x, p.y), 14, 0.25);
        continue;
      }
      if (p.kind === 'soul') {
        // Célula de energia: pequeno cristal azul
        GlowCache.draw(ctx, '70,150,255', sx, sy, 14, 0.75);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(220,240,255,0.95)';
        const sp = Math.sin(time * 6 + i) * 1.5;
        ctx.beginPath(); ctx.moveTo(sx, sy - 5); ctx.lineTo(sx + 2.5 + sp * 0.3, sy); ctx.lineTo(sx, sy + 5); ctx.lineTo(sx - 2.5 - sp * 0.3, sy); ctx.closePath(); ctx.fill();
      } else {
        // Cápsula de reparo
        GlowCache.draw(ctx, '255,60,110', sx, sy, 22 * blink + 6, 0.8 * blink);
        ctx.globalAlpha = blink;
        ctx.fillStyle = 'rgba(255,235,240,0.95)';
        ctx.fillRect(sx - 1.2, sy - 4, 2.4, 8); ctx.fillRect(sx - 4, sy - 1.2, 8, 2.4);
      }
      GlowCache.drawFlat(ctx, p.kind === 'soul' ? '70,140,255' : '255,50,100', sx, isoY(p.x, p.y), 14, 0.25);
    }
    ctx.restore();
  }
}

const NEON_WORDS = ['BAR', 'HOTEL', 'VESPER', 'NEXUS', 'ABERTO', 'SONHOS', 'MEMÓRIAS', 'CLÍNICA', 'NOODLES', '24H'];
const NEON_COLORS = ['255,60,200', '80,220,255', '170,100,255', '255,70,90'];
const GRAFFITI = ['DESCONECTE-SE', 'SEM REDE SEM DONO', 'LEMBRE-SE', 'NEXUS MENTE', 'LIVRES'];

class Room {
  constructor(index) {
    this.index = index;
    this.def = ROOM_DEFS[index];
    this.theme = THEMES[this.def.theme];
    this.w = this.h = this.def.tiles * TILE;
    this.seed = 9973 * (index + 1) + Math.floor(Math.random() * 100000);
    this.wallH = 150;
    this.door = { x: this.w / 2, halfW: 46, open: 0, opening: false };
    this.pillars = [];
    this.torches = [];
    this.decor = [];
    this.cables = [];
    this.decals = [];
    this.skyCrack = 0;
    this.canvas = null; this.scale = 0;
    this.generate();
    this.outlinePts = this.outline();
  }

  generate() {
    const r = mulberry32(this.seed), w = this.w, h = this.h, n = this.def.tiles, th = this.theme;
    // Luminárias nas duas paredes do fundo (evitando a porta)
    for (let x = TILE * 1.5; x < w - TILE; x += TILE * 3) {
      if (Math.abs(x - this.door.x) < TILE * 1.6) continue;
      this.torches.push({ x, y: 0, ph: r() * 10 });
    }
    for (let y = TILE * 1.5; y < h - TILE; y += TILE * 3) this.torches.push({ x: 0, y, ph: r() * 10 });
    // Enfeites das paredes (telas, letreiros neon, vitrais, painéis holográficos)
    for (const side of ['L', 'R']) {
      for (let i = 0; i < n; i++) {
        if (side === 'R' && Math.abs((i + 0.5) * TILE - this.door.x) < TILE * 1.2) continue;
        const nearLamp = this.torches.some((t) => (side === 'R' ? t.y === 0 && Math.abs(t.x - (i + 0.5) * TILE) < TILE * 0.8 : t.x === 0 && Math.abs(t.y - (i + 0.5) * TILE) < TILE * 0.8));
        const prev = this.decor[this.decor.length - 1];
        if (prev && prev.side === side && prev.i === i - 1) continue;   // nunca dois enfeites colados
        if (nearLamp || r() > (th.decor === 'window' ? 0.32 : 0.24)) continue;
        this.decor.push({ side, i, ph: r() * 10, text: pick(th.decor === 'graffiti' ? GRAFFITI : NEON_WORDS), rgb: NEON_COLORS[(r() * NEON_COLORS.length) | 0], s: r() });
      }
    }
    // Cabos luminosos sob o piso levando energia para a torre central
    for (let c = 0; c < (th.cables || 0); c++) {
      const pts = [];
      let x = TILE * (1 + Math.floor(r() * (n - 2))), y = h;
      pts.push({ x, y });
      let horiz = false;
      while (y > 0 && pts.length < 12) {
        if (horiz) x = clamp(x + (r() < 0.5 ? -1 : 1) * TILE * (1 + Math.floor(r() * 3)), TILE, w - TILE);
        else y = Math.max(0, y - TILE * (1 + Math.floor(r() * 4)));
        pts.push({ x, y });
        horiz = !horiz;
      }
      let len = 0;
      for (let k = 1; k < pts.length; k++) len += dist(pts[k - 1].x, pts[k - 1].y, pts[k].x, pts[k].y);
      this.cables.push({ pts, len, ph: r() });
    }
    // No topo da torre, os cabos partem do selo central em todas as direções
    if (this.def.boss) {
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * TAU + Math.PI / 8, cx = w / 2, cy = h / 2;
        const pts = [{ x: cx + Math.cos(a) * 240, y: cy + Math.sin(a) * 240 }, { x: cx + Math.cos(a) * (w * 0.5), y: cy + Math.sin(a) * (h * 0.5) }];
        pts[1].x = clamp(pts[1].x, 4, w - 4); pts[1].y = clamp(pts[1].y, 4, h - 4);
        this.cables.push({ pts, len: dist(pts[0].x, pts[0].y, pts[1].x, pts[1].y), ph: k / 8 });
      }
    }
    // Pilares (no topo da torre ficam simétricos)
    if (this.def.boss) {
      const m = TILE * 3.2;
      for (const [px, py] of [[m, m], [w - m, m], [m, h - m], [w - m, h - m]]) this.pillars.push(this.makePillar(r, px, py, true));
    } else {
      let tries = 0;
      while (this.pillars.length < this.def.pillars && tries++ < 200) {
        const px = TILE * 2 + r() * (w - TILE * 4), py = TILE * 2 + r() * (h - TILE * 4);
        if (dist(px, py, w / 2, h - 110) < 170) continue;          // área de entrada
        if (Math.abs(px - w / 2) < 100 && py < 230) continue;      // caminho da porta
        if (this.pillars.some((p) => dist(px, py, p.x, p.y) < 190)) continue;
        this.pillars.push(this.makePillar(r, px, py, r() < 0.55));
      }
    }
  }

  makePillar(r, x, y, tall) {
    return { x, y, r: 20 + r() * 6, h: tall ? 130 + r() * 50 : 40 + r() * 40, broken: !tall || r() < 0.4, seed: Math.floor(r() * 1e6), sprite: null, ox: 0, oy: 0 };
  }

  // Ponto aleatório livre de pilares (opcionalmente longe de 'avoid')
  randomPoint(margin = 50, avoid = null, minDist = 0) {
    let x = 0, y = 0;
    for (let i = 0; i < 40; i++) {
      x = rand(margin, this.w - margin); y = rand(margin, this.h - margin);
      if (this.pillars.some((p) => dist(x, y, p.x, p.y) < p.r + 34)) continue;
      if (avoid && dist(x, y, avoid.x, avoid.y) < minDist) continue;
      break;
    }
    return { x, y };
  }

  // Resolve colisão de um círculo com as paredes e pilares; retorna true se colidiu
  collide(e, isPlayer) {
    const r = e.radius, d = this.door;
    let hit = false;
    // Porta aberta: a passagem é tolerante e "encaixa" o jogador na abertura
    const inDoor = isPlayer && d.open > 0.9 && Math.abs(e.x - d.x) < d.halfW + 16;
    if (e.x < r) { e.x = r; hit = true; }
    if (e.x > this.w - r) { e.x = this.w - r; hit = true; }
    if (e.y > this.h - r) { e.y = this.h - r; hit = true; }
    if (e.y < r) {
      if (inDoor) e.x = clamp(e.x, d.x - d.halfW + r, d.x + d.halfW - r);   // atravessando a porta
      else { e.y = r; hit = true; }
    }
    for (const p of this.pillars) {
      const dx = e.x - p.x, dy = e.y - p.y, dd = Math.hypot(dx, dy), min = r + p.r;
      if (dd < min) {
        const nx = dd > 0.001 ? dx / dd : 1, ny = dd > 0.001 ? dy / dd : 0;
        e.x = p.x + nx * min; e.y = p.y + ny * min;
        hit = true;
      }
    }
    return hit;
  }

  blocksPoint(x, y, r) {
    if (x < 0 || y < 0 || x > this.w || y > this.h) return true;
    for (const p of this.pillars) if (dist2(x, y, p.x, p.y) < (p.r + r) * (p.r + r)) return true;
    return false;
  }

  update(dt) {
    if (this.door.opening && this.door.open < 1) this.door.open = Math.min(1, this.door.open + dt * 0.9);
  }

  // Contorno da sala na tela isométrica (a escuridão só cobre esta área; o céu fica livre)
  outline() {
    const w = this.w, h = this.h, H = this.wallH + 40, D = 64;
    return [
      isoX(0, h), isoY(0, h) + D, isoX(0, h), isoY(0, h) - H, isoX(0, 0), isoY(0, 0) - H,
      isoX(w, 0), isoY(w, 0) - H, isoX(w, 0), isoY(w, 0) + D, isoX(w, h), isoY(w, h) + D,
    ];
  }

  // ---------------------------------------------------- pré-renderização
  bounds() {
    return { minX: -this.h - 40, maxX: this.w + 40, minY: -this.wallH - 60, maxY: (this.w + this.h) / 2 + 90 };
  }

  render(scale) {
    this.scale = scale;
    const b = this.bounds();
    const W = Math.ceil((b.maxX - b.minX) * scale), H = Math.ceil((b.maxY - b.minY) * scale);
    if (!this.canvas) this.canvas = document.createElement('canvas');
    this.canvas.width = W; this.canvas.height = H;
    const ctx = this.canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, -b.minX * scale, -b.minY * scale);
    const r = mulberry32(this.seed + 17);
    this.drawLedges(ctx, r);
    this.drawFloor(ctx, r);
    this.drawSigil(ctx);
    this.drawWalls(ctx, r);
    for (const d of this.decals) this.paintDecal(ctx, d);
    for (const p of this.pillars) this.renderPillar(p, scale);
  }

  // Bordas frontais: a plataforma flutua sobre o abismo, com uma faixa de luz
  drawLedges(ctx, r) {
    const w = this.w, h = this.h, depth = 60;
    const faces = [
      [[w, 0], [w, h]],    // borda inferior direita
      [[0, h], [w, h]],    // borda inferior esquerda
    ];
    faces.forEach(([a, b], idx) => {
      const ax = isoX(a[0], a[1]), ay = isoY(a[0], a[1]), bx = isoX(b[0], b[1]), by = isoY(b[0], b[1]);
      const g = ctx.createLinearGradient(0, Math.min(ay, by), 0, Math.max(ay, by) + depth);
      g.addColorStop(0, idx === 0 ? '#1a1f29' : '#141821');
      g.addColorStop(1, 'rgba(2,4,9,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx, by + depth); ctx.lineTo(ax, ay + depth); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(this.theme.accent, 0.22); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ax, ay + 6); ctx.lineTo(bx, by + 6); ctx.stroke();
      // Juntas das placas
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      const n = Math.round(this.def.tiles);
      for (let i = 1; i < n; i++) {
        const t = i / n, x = lerp(ax, bx, t), y = lerp(ay, by, t);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26 + r() * 10); ctx.stroke();
      }
    });
  }

  drawFloor(ctx, r) {
    const n = this.def.tiles, th = this.theme, [fh, fs, fl] = th.floor, deco = th.deco;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const x0 = i * TILE, y0 = j * TILE, x1 = x0 + TILE, y1 = y0 + TILE;
        const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([x, y]) => [isoX(x, y), isoY(x, y)]);
        const v = r();
        // Escurece perto das bordas para dar profundidade
        const edge = Math.min(i, j, n - 1 - i, n - 1 - j);
        const dark = edge === 0 ? 0.65 : edge === 1 ? 0.85 : 1;
        const missing = v < 0.035;
        const l = (missing ? 5 : fl + r() * 5) * dark;
        ctx.fillStyle = `hsl(${fh + r() * 10},${fs + r() * 6}%,${l.toFixed(1)}%)`;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.closePath(); ctx.fill();
        // Chanfro das placas: borda superior clara, inferior escura
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(pts[3][0], pts[3][1]); ctx.lineTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.moveTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[2][0], pts[2][1]); ctx.lineTo(pts[3][0], pts[3][1]); ctx.stroke();
        const cx = isoX(x0 + TILE / 2, y0 + TILE / 2), cy = isoY(x0 + TILE / 2, y0 + TILE / 2);
        if (missing) {
          // Placa arrancada: buraco com cabos expostos
          ctx.strokeStyle = rgba(th.accent, 0.25); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(cx - 14, cy - 2); ctx.quadraticCurveTo(cx, cy + 6, cx + 12, cy - 3); ctx.stroke();
          ctx.fillStyle = 'rgba(70,76,90,0.6)';
          for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(cx + (r() - 0.5) * 40, cy + (r() - 0.5) * 18, 1.5 + r() * 2, 0, TAU); ctx.fill(); }
          continue;
        }
        this.floorDetail(ctx, r, deco, cx, cy, i, j, pts);
      }
    }
    // Faixa de rua no centro das avenidas
    if (deco === 'street') {
      ctx.strokeStyle = 'rgba(230,200,90,0.16)'; ctx.lineWidth = 3;
      ctx.setLineDash([22, 26]);
      ctx.beginPath(); ctx.moveTo(isoX(this.w / 2, this.h), isoY(this.w / 2, this.h)); ctx.lineTo(isoX(this.w / 2, 0), isoY(this.w / 2, 0)); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Detalhes de cada placa do piso conforme o tema
  floorDetail(ctx, r, deco, cx, cy, i, j, pts) {
    const d = r();
    const crack = () => {
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
      ctx.beginPath();
      let px = cx + (r() - 0.5) * 40, py = cy + (r() - 0.5) * 16;
      ctx.moveTo(px, py);
      for (let k = 0; k < 4; k++) { px += (r() - 0.5) * 24; py += (r() - 0.5) * 10; ctx.lineTo(px, py); }
      ctx.stroke();
    };
    const grate = () => {
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4;
      for (let k = -3; k <= 3; k++) {
        ctx.beginPath(); ctx.moveTo(cx + k * 6 - 10, cy + k * 3 - 5); ctx.lineTo(cx + k * 6 + 10, cy + k * 3 + 5); ctx.stroke();
      }
    };
    const rivets = () => {
      ctx.fillStyle = 'rgba(160,170,190,0.18)';
      for (let k = 0; k < 4; k++) {
        const px = lerp(pts[k][0], cx, 0.2), py = lerp(pts[k][1], cy, 0.2);
        ctx.fillRect(px - 1, py - 0.6, 2, 1.2);
      }
    };
    const puddle = (tint) => {
      ctx.fillStyle = `rgba(${tint},0.10)`;
      ctx.beginPath(); ctx.ellipse(cx + (r() - 0.5) * 20, cy + (r() - 0.5) * 8, 14 + r() * 14, 5 + r() * 4, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(200,220,255,0.08)'; ctx.lineWidth = 1; ctx.stroke();
    };
    const stain = (rgb, a) => {
      ctx.fillStyle = `rgba(${rgb},${a})`;
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(cx + (r() - 0.5) * 40, cy + (r() - 0.5) * 16, 5 + r() * 10, 2 + r() * 4, 0, 0, TAU); ctx.fill(); }
    };
    switch (deco) {
      case 'lab':
        if (d < 0.25) rivets();
        else if (d < 0.36) grate();
        else if (d < 0.44) crack();
        else if (d < 0.48) {
          // Faixa de advertência amarela e preta
          ctx.save();
          ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]); ctx.closePath(); ctx.clip();
          ctx.strokeStyle = 'rgba(200,170,40,0.18)'; ctx.lineWidth = 6;
          for (let k = -4; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(cx + k * 14 - 20, cy + 20); ctx.lineTo(cx + k * 14 + 20, cy - 20); ctx.stroke(); }
          ctx.restore();
        } else if (d < 0.53) stain('10,12,16', 0.4);
        break;
      case 'grate':
        if (d < 0.3) grate();
        else if (d < 0.4) puddle('80,160,200');
        else if (d < 0.55) rivets();
        else if (d < 0.62) crack();
        break;
      case 'street':
        if (d < 0.14) puddle(pick(['255,60,200', '80,200,255', '120,140,255']));
        else if (d < 0.3) crack();
        else if (d < 0.33) {
          // Tampa de bueiro
          ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.ellipse(cx, cy, 13, 6.5, 0, 0, TAU); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy); ctx.stroke();
        } else if (d < 0.4) stain('8,8,12', 0.35);
        break;
      case 'refuge':
        if (d < 0.05) {
          // Tapete improvisado
          ctx.fillStyle = pick(['rgba(110,40,30,0.35)', 'rgba(60,70,40,0.35)', 'rgba(90,70,40,0.35)']);
          ctx.beginPath(); ctx.ellipse(cx, cy, 20, 9, 0, 0, TAU); ctx.fill();
        } else if (d < 0.18) {
          // Sucata espalhada
          ctx.fillStyle = 'rgba(120,110,100,0.25)';
          for (let k = 0; k < 4; k++) ctx.fillRect(cx + (r() - 0.5) * 36, cy + (r() - 0.5) * 14, 2 + r() * 5, 1.5 + r() * 2);
        } else if (d < 0.3) crack();
        else if (d < 0.38) stain('20,12,6', 0.35);
        break;
      case 'stone':
        if (d < 0.2) crack();
        else if (d < 0.26) {
          // Circuito gravado com brilho violeta tênue
          ctx.strokeStyle = 'rgba(160,110,255,0.3)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.ellipse(cx, cy, 14, 7, 0, 0, TAU); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - 22, cy - 4); ctx.moveTo(cx + 14, cy); ctx.lineTo(cx + 22, cy + 4); ctx.stroke();
        } else if (d < 0.32) stain('30,24,40', 0.3);
        break;
      case 'circuit':
        if (d < 0.32) {
          ctx.strokeStyle = 'rgba(90,220,255,0.16)'; ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(cx - 20, cy - 2); ctx.lineTo(cx - 6, cy - 2); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx + 18, cy + 3);
          ctx.stroke();
          ctx.fillStyle = 'rgba(120,240,255,0.25)';
          ctx.fillRect(cx - 21, cy - 3.5, 3, 3); ctx.fillRect(cx + 17, cy + 1.5, 3, 3);
        } else if (d < 0.4) rivets();
        else if (d < 0.46) crack();
        break;
    }
  }

  // Emblema circular no centro da sala (o selo de NEXUS no topo da torre)
  drawSigil(ctx) {
    const cx = this.w / 2, cy = this.h / 2;
    const big = !!this.def.boss, rgb = this.theme.accent;
    const R = big ? 230 : 120;
    const ring = (rad, a, lw) => { ctx.strokeStyle = rgba(rgb, a); ctx.lineWidth = lw; isoCirclePath(ctx, cx, cy, rad); ctx.stroke(); };
    ring(R, big ? 0.35 : 0.14, 2);
    ring(R * 0.86, big ? 0.25 : 0.1, 1.2);
    ring(R * 0.42, big ? 0.3 : 0.12, 1.5);
    // Hexágono e marcações radiais
    ctx.strokeStyle = rgba(rgb, big ? 0.3 : 0.12);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) {
      const a = (i / 6) * TAU;
      const x = cx + Math.cos(a) * R * 0.7, y = cy + Math.sin(a) * R * 0.7;
      i ? ctx.lineTo(isoX(x, y), isoY(x, y)) : ctx.moveTo(isoX(x, y), isoY(x, y));
    }
    ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * TAU, r0 = R * 0.86, r1 = R * (i % 6 === 0 ? 1.06 : 0.94);
      ctx.moveTo(isoX(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0), isoY(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0));
      ctx.lineTo(isoX(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1), isoY(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1));
    }
    ctx.stroke();
  }

  // Referencial do plano de uma parede (para desenhar enfeites "colados" nela)
  wallFrame(ctx, side, i) {
    const mx = side === 'R' ? (i + 0.5) * TILE : 0, my = side === 'R' ? 0 : (i + 0.5) * TILE;
    ctx.transform(1, side === 'R' ? 0.5 : -0.5, 0, 1, isoX(mx, my), isoY(mx, my));
  }

  drawWalls(ctx, r) {
    const w = this.w, h = this.h, n = this.def.tiles, th = this.theme, [wh, ws] = th.wall;
    // Parede esquerda (x = 0) e parede direita (y = 0), em segmentos de placas metálicas
    const segs = [];
    for (let j = n - 1; j >= 0; j--) segs.push({ ax: 0, ay: (j + 1) * TILE, bx: 0, by: j * TILE, side: 'L' });
    for (let i = 0; i < n; i++) segs.push({ ax: i * TILE, ay: 0, bx: (i + 1) * TILE, by: 0, side: 'R' });
    for (const s of segs) {
      const isDoor = s.side === 'R' && Math.abs((s.ax + s.bx) / 2 - this.door.x) < TILE;
      const hh = isDoor ? this.wallH + 20 : this.wallH - (r() < th.ruined ? 20 + r() * 50 : r() * 6);
      const ax = isoX(s.ax, s.ay), ay = isoY(s.ax, s.ay), bx = isoX(s.bx, s.by), by = isoY(s.bx, s.by);
      // Face da parede com gradiente vertical
      const g = ctx.createLinearGradient(0, Math.min(ay, by) - hh, 0, Math.max(ay, by));
      g.addColorStop(0, `hsl(${wh},${ws}%,${s.side === 'L' ? 17 : 14}%)`);
      g.addColorStop(1, `hsl(${wh},${ws}%,${s.side === 'L' ? 8 : 6}%)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx, by - hh); ctx.lineTo(ax, ay - hh); ctx.closePath(); ctx.fill();
      // Painéis: juntas horizontais, emenda vertical e rebites
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
      const step = th.pillar === 'stone' ? 18 : 30;
      for (let k = step; k < hh; k += step) {
        ctx.beginPath(); ctx.moveTo(ax, ay - k); ctx.lineTo(bx, by - k); ctx.stroke();
        if (th.pillar === 'stone') {
          const off = (k / 18) % 2 ? 0.25 : 0.75;
          const jx = lerp(ax, bx, off), jy = lerp(ay, by, off);
          ctx.beginPath(); ctx.moveTo(jx, jy - k); ctx.lineTo(jx, jy - k + 18); ctx.stroke();
        }
      }
      if (th.pillar !== 'stone') {
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, ay - hh); ctx.stroke();
        ctx.fillStyle = 'rgba(170,180,200,0.12)';
        for (let k = step; k < hh; k += step) { ctx.fillRect(ax + (bx - ax) * 0.1 - 1, ay + (by - ay) * 0.1 - k + 3, 2, 2); ctx.fillRect(ax + (bx - ax) * 0.9 - 1, ay + (by - ay) * 0.9 - k + 3, 2, 2); }
      }
      // Faixa de luz de serviço
      ctx.strokeStyle = rgba(th.accent, 0.16); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, ay - 22); ctx.lineTo(bx, by - 22); ctx.stroke();
      // Tubulações nos túneis
      if (th.decor === 'pipes') {
        for (const [py, lw, col] of [[46, 7, '#1d2a30'], [58, 4, '#2a2620']]) {
          ctx.strokeStyle = col; ctx.lineWidth = lw;
          ctx.beginPath(); ctx.moveTo(ax, ay - py); ctx.lineTo(bx, by - py); ctx.stroke();
          ctx.strokeStyle = 'rgba(200,220,230,0.1)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(ax, ay - py - lw * 0.3); ctx.lineTo(bx, by - py - lw * 0.3); ctx.stroke();
        }
      }
      // Topo da parede (espessura)
      const t = 16;
      const tx = s.side === 'L' ? -t : 0, ty = s.side === 'R' ? -t : 0;
      ctx.fillStyle = `hsl(${wh},${ws}%,22%)`;
      ctx.beginPath();
      ctx.moveTo(ax, ay - hh); ctx.lineTo(bx, by - hh);
      ctx.lineTo(isoX(s.bx + tx, s.by + ty), isoY(s.bx + tx, s.by + ty) - hh);
      ctx.lineTo(isoX(s.ax + tx, s.ay + ty), isoY(s.ax + tx, s.ay + ty) - hh);
      ctx.closePath(); ctx.fill();
    }
    // Molduras dos enfeites (a parte luminosa é desenhada na camada emissiva)
    for (const d of this.decor) {
      ctx.save();
      this.wallFrame(ctx, d.side, d.i);
      switch (th.decor) {
        case 'screen': case 'holo':
          ctx.fillStyle = '#07090d'; ctx.fillRect(-18, -98, 36, 26);
          ctx.strokeStyle = '#3a404c'; ctx.lineWidth = 2; ctx.strokeRect(-18, -98, 36, 26);
          break;
        case 'neon':
          ctx.fillStyle = 'rgba(5,6,12,0.85)'; ctx.fillRect(-24, -112, 48, 22);
          break;
        case 'window':
          ctx.fillStyle = '#06040c';
          ctx.beginPath(); ctx.moveTo(-11, -40); ctx.lineTo(-11, -104); ctx.quadraticCurveTo(0, -126, 11, -104); ctx.lineTo(11, -40); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#3a3346'; ctx.lineWidth = 2.5; ctx.stroke();
          break;
        case 'graffiti':
          ctx.font = `bold 11px ${FONT_TITLE}`; ctx.textAlign = 'center';
          ctx.fillStyle = `rgba(${d.rgb},0.28)`;
          ctx.fillText(d.text, 0, -60 - d.s * 30);
          break;
      }
      ctx.restore();
    }
    // Moldura da comporta: batentes metálicos e faixa de advertência no topo
    const d = this.door;
    const lx = isoX(d.x - d.halfW, 0), ly = isoY(d.x - d.halfW, 0), rx = isoX(d.x + d.halfW, 0), ry = isoY(d.x + d.halfW, 0);
    const dh = 112;
    ctx.fillStyle = '#020306';
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(rx, ry - dh); ctx.lineTo(lx, ly - dh); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3c4350'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly - dh); ctx.lineTo(rx, ry - dh); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.strokeStyle = '#1a1e25'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.moveTo(lx - 4, ly - dh - 4); ctx.lineTo(rx + 4, ry - dh - 4); ctx.lineTo(rx + 4, ry - dh - 16); ctx.lineTo(lx - 4, ly - dh - 16); ctx.closePath();
    ctx.fillStyle = '#1b1d20'; ctx.fill(); ctx.clip();
    ctx.strokeStyle = 'rgba(210,170,40,0.55)'; ctx.lineWidth = 4;
    for (let k = -2; k < 16; k++) {
      const x = lerp(lx, rx, k / 12), y = lerp(ly, ry, k / 12) - dh;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 8, y - 20); ctx.stroke();
    }
    ctx.restore();
    // Suportes das luminárias
    for (const tc of this.torches) {
      const sx = isoX(tc.x, tc.y), sy = isoY(tc.x, tc.y) - 64;
      ctx.fillStyle = '#14171d'; ctx.fillRect(sx - 3, sy, 6, 14);
      ctx.fillStyle = '#3a404c'; ctx.fillRect(sx - 6, sy - 3, 12, 5);
    }
  }

  // Sprite pré-renderizado de cada pilar (pilone metálico, concreto ou pedra)
  renderPillar(p, scale) {
    const rx = p.r * ISO_RX, ry = p.r * ISO_RY;
    const Wd = rx * 2 + 16, Hd = p.h + ry * 2 + 40;
    const c = p.sprite || (p.sprite = document.createElement('canvas'));
    c.width = Math.ceil(Wd * scale); c.height = Math.ceil(Hd * scale);
    const g = c.getContext('2d');
    g.setTransform(scale, 0, 0, scale, 0, 0);
    p.ox = Wd / 2; p.oy = Hd - ry - 6;   // posição da base dentro do sprite
    const bx = p.ox, by = p.oy;
    const r = mulberry32(p.seed);
    const kind = this.theme.pillar, acc = this.theme.accent;
    const cols = kind === 'pylon' ? ['#12161c', '#3d4553', '#262c37', '#0d1015']
      : kind === 'concrete' ? ['#18191d', '#4a4d55', '#33363d', '#111215']
        : ['#17131b', '#3b3343', '#2a2430', '#100d13'];
    // Base
    g.fillStyle = kind === 'pylon' ? '#1a1e26' : '#1d1b22';
    g.beginPath(); g.ellipse(bx, by, rx + 6, ry + 3, 0, 0, Math.PI); g.lineTo(bx - rx - 6, by - 10); g.ellipse(bx, by - 10, rx + 6, ry + 3, 0, Math.PI, 0, true); g.closePath(); g.fill();
    // Fuste com gradiente cilíndrico
    const top = by - p.h;
    const grd = g.createLinearGradient(bx - rx, 0, bx + rx, 0);
    grd.addColorStop(0, cols[0]); grd.addColorStop(0.35, cols[1]); grd.addColorStop(0.6, cols[2]); grd.addColorStop(1, cols[3]);
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(bx - rx, by - 10);
    g.lineTo(bx - rx, top);
    const jag = [];
    if (p.broken) {
      // Topo quebrado irregular
      const steps = 6;
      for (let i = 0; i <= steps; i++) {
        const x = bx - rx + (2 * rx * i) / steps, y = top - (r() * 22) + (i % 2) * 6;
        jag.push([x, y]);
        g.lineTo(x, y);
      }
    } else g.lineTo(bx + rx, top);
    g.lineTo(bx + rx, by - 10);
    g.ellipse(bx, by - 10, rx, ry, 0, 0, Math.PI);
    g.closePath(); g.fill();
    if (kind === 'pylon') {
      // Anéis metálicos e faixa de luz vertical
      g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2;
      for (let y = by - 30; y > top + 10; y -= 28) { g.beginPath(); g.ellipse(bx, y, rx, ry * 0.6, 0, 0, Math.PI); g.stroke(); }
      g.strokeStyle = 'rgba(200,215,235,0.12)'; g.lineWidth = 1;
      for (let y = by - 32; y > top + 10; y -= 28) { g.beginPath(); g.ellipse(bx, y, rx, ry * 0.6, 0, 0, Math.PI); g.stroke(); }
      g.fillStyle = rgba(acc, 0.55);
      g.fillRect(bx - rx * 0.45, top + 16, 2.5, Math.max(4, p.h - 40));
    } else {
      // Caneluras, rachaduras e (no concreto) vergalhões expostos
      g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;
      for (let k = -2; k <= 2; k++) { const x = bx + k * rx * 0.38; g.beginPath(); g.moveTo(x, by - 12); g.lineTo(x, top + 14); g.stroke(); }
      if (kind === 'stone') {
        g.strokeStyle = rgba(acc, 0.35); g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(bx - rx * 0.2, by - 20); g.lineTo(bx - rx * 0.2, top + 30); g.lineTo(bx + rx * 0.2, top + 22); g.stroke();
      }
    }
    if (p.broken) {
      // Pontas expostas: vergalhões ou cabos
      g.strokeStyle = kind === 'pylon' ? '#2e3440' : '#5a4a3e'; g.lineWidth = 1.5;
      for (const [x, y] of jag) { if (r() < 0.5) { g.beginPath(); g.moveTo(x, y + 4); g.lineTo(x + (r() - 0.5) * 8, y - 10 - r() * 10); g.stroke(); } }
      if (kind === 'pylon') { g.fillStyle = rgba(acc, 0.7); g.fillRect(bx - 1, top - 4, 2, 2); }
    } else {
      // Capitel / tampa
      g.fillStyle = kind === 'pylon' ? '#2a303b' : '#2e2b33';
      g.fillRect(bx - rx - 6, top - 12, rx * 2 + 12, 14);
      g.fillStyle = kind === 'pylon' ? '#3a4250' : '#3d3943';
      g.beginPath(); g.ellipse(bx, top - 12, rx + 6, ry + 2, 0, 0, TAU); g.fill();
      if (kind === 'pylon') { g.fillStyle = rgba(acc, 0.6); g.beginPath(); g.ellipse(bx, top - 12, 4, 2, 0, 0, TAU); g.fill(); }
    }
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 1;
    g.beginPath(); let cx = bx + (r() - 0.5) * rx, cy = top + 20 + r() * 20; g.moveTo(cx, cy);
    for (let k = 0; k < 5; k++) { cx += (r() - 0.5) * 8; cy += 8 + r() * 8; g.lineTo(cx, cy); }
    g.stroke();
    // Pichação neon nas colunas de Vesper
    if (this.theme.decor === 'neon' && r() < 0.6) {
      g.strokeStyle = `rgba(${pick(NEON_COLORS)},0.4)`; g.lineWidth = 2;
      g.beginPath(); g.moveTo(bx - rx * 0.6, by - 30); g.quadraticCurveTo(bx, by - 46, bx + rx * 0.5, by - 28); g.stroke();
    }
  }

  // Manchas (fluidos e queimaduras) pintadas permanentemente no chão
  addDecal(x, y, r, rgb) {
    if (x < 0 || y < 0 || x > this.w || y > this.h) return;
    const d = { x, y, r, rgb, kind: 'blood' };
    this.pushDecal(d);
  }
  addScorch(x, y, r) { this.pushDecal({ x, y, r, rgb: '0,0,0', kind: 'scorch' }); }
  pushDecal(d) {
    this.decals.push(d);
    if (this.decals.length > 500) this.decals.shift();
    if (this.canvas) {
      const ctx = this.canvas.getContext('2d');
      const b = this.bounds(), s = this.scale;
      ctx.setTransform(s, 0, 0, s, -b.minX * s, -b.minY * s);
      this.paintDecal(ctx, d);
    }
  }
  paintDecal(ctx, d) {
    const sx = isoX(d.x, d.y), sy = isoY(d.x, d.y);
    const r = mulberry32(Math.floor(d.x * 13 + d.y * 7));
    if (d.kind === 'scorch') {
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, d.r * 1.3);
      g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(sx, sy, d.r * 1.3, d.r * 0.65, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        const a = r() * TAU;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a) * d.r * (0.6 + r() * 0.6), sy + Math.sin(a) * d.r * 0.4); ctx.stroke();
      }
      return;
    }
    ctx.fillStyle = `rgba(${d.rgb},0.55)`;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.ellipse(sx + (r() - 0.5) * d.r * 1.6, sy + (r() - 0.5) * d.r * 0.8, d.r * (0.5 + r() * 0.6), d.r * (0.25 + r() * 0.3), 0, 0, TAU);
      ctx.fill();
    }
  }

  // ---------------------------------------------------- desenho em tempo real
  drawBackground(ctx) {
    if (!this.canvas) return;
    const b = this.bounds();
    ctx.drawImage(this.canvas, b.minX, b.minY, b.maxX - b.minX, b.maxY - b.minY);
  }

  // Comporta blindada: duas folhas que deslizam para os lados ao abrir
  drawDoor(ctx) {
    const d = this.door, dh = 112;
    const lx = isoX(d.x - d.halfW, 0), ly = isoY(d.x - d.halfW, 0), rx = isoX(d.x + d.halfW, 0), ry = isoY(d.x + d.halfW, 0);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(rx, ry - dh); ctx.lineTo(lx, ly - dh); ctx.closePath(); ctx.clip();
    const slide = easeInOut(d.open) * d.halfW;
    for (const k of [-1, 1]) {
      const x0 = k < 0 ? d.x - d.halfW - slide : d.x + slide, x1 = x0 + d.halfW;
      const ax = isoX(x0, 0), ay = isoY(x0, 0), bx = isoX(x1, 0), by = isoY(x1, 0);
      ctx.fillStyle = k < 0 ? '#2b313b' : '#242932';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx, by - dh); ctx.lineTo(ax, ay - dh); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5;
      for (let yy = 22; yy < dh; yy += 22) { ctx.beginPath(); ctx.moveTo(ax, ay - yy); ctx.lineTo(bx, by - yy); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(210,170,40,0.35)'; ctx.lineWidth = 3;
      const ex = k < 0 ? bx : ax, ey = k < 0 ? by : ay;
      ctx.beginPath(); ctx.moveTo(ex, ey - 6); ctx.lineTo(ex, ey - dh + 6); ctx.stroke();
    }
    ctx.restore();
  }

  // Camada emissiva: luminárias, enfeites luminosos, cabos de energia e a comporta
  drawEmissive(ctx, time) {
    const th = this.theme;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Cabos de energia sob o piso, com pulsos correndo em direção à torre
    for (const c of this.cables) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = rgba(th.accent, 0.05); ctx.lineWidth = 4;
      ctx.beginPath();
      c.pts.forEach((pt, k) => (k ? ctx.lineTo(isoX(pt.x, pt.y), isoY(pt.x, pt.y)) : ctx.moveTo(isoX(pt.x, pt.y), isoY(pt.x, pt.y))));
      ctx.stroke();
      ctx.strokeStyle = rgba(th.accent, 0.11); ctx.lineWidth = 1.2; ctx.stroke();
      let dd = ((time * 0.18 + c.ph) % 1) * c.len;
      for (let k = 1; k < c.pts.length; k++) {
        const a = c.pts[k - 1], b = c.pts[k], L = dist(a.x, a.y, b.x, b.y);
        if (dd <= L) { const t = dd / (L || 1), x = lerp(a.x, b.x, t), y = lerp(a.y, b.y, t); GlowCache.drawFlat(ctx, th.accent, isoX(x, y), isoY(x, y), 26, 0.55); break; }
        dd -= L;
      }
    }
    // Luminárias de cada tema
    for (const tc of this.torches) {
      const sx = isoX(tc.x, tc.y), sy = isoY(tc.x, tc.y) - 70;
      let f = 0.85 + 0.15 * Math.sin(time * 11 + tc.ph);
      if (th.decor === 'screen') f = 0.35 + 0.65 * Math.max(0, Math.sin(time * 3.2 + tc.ph));   // giroflex de emergência
      GlowCache.draw(ctx, th.lamp, sx, sy, 34 * f, 0.6 * f);
      GlowCache.draw(ctx, th.lamp, sx, sy, 12, 0.9);
      GlowCache.draw(ctx, '255,255,255', sx, sy, 4, 0.8);
    }
    // Enfeites luminosos das paredes
    for (const d of this.decor) {
      const fl = 0.75 + 0.25 * Math.sin(time * 7 + d.ph) * (Math.sin(time * 1.3 + d.ph * 3) > 0.92 ? 1 : 0.15);
      ctx.globalAlpha = 1;
      ctx.save();
      this.wallFrame(ctx, d.side, d.i);
      switch (th.decor) {
        case 'screen': case 'holo': {
          const rgb = th.decor === 'holo' ? th.lamp : '190,230,255';
          ctx.fillStyle = rgba(rgb, 0.16 * fl);
          ctx.fillRect(-16, -96, 32, 22);
          ctx.fillStyle = rgba(rgb, 0.4 * fl);
          for (let k = 0; k < 4; k++) ctx.fillRect(-13, -93 + k * 5, 8 + ((d.ph * 7 + k * 5 + Math.floor(time * 2)) % 18), 1.5);
          GlowCache.draw(ctx, rgb, 0, -85, 38, 0.3 * fl);
          break;
        }
        case 'neon': {
          ctx.font = `bold 15px ${FONT_TITLE}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          const tw = ctx.measureText(d.text).width;
          if (tw > 42) ctx.font = `bold ${Math.floor(15 * 42 / tw)}px ${FONT_TITLE}`;
          const on = Math.sin(time * 9 + d.ph) > -0.95 ? 1 : 0.2;
          ctx.fillStyle = rgba(d.rgb, 0.95 * on);
          ctx.fillText(d.text, 0, -101);
          ctx.strokeStyle = rgba(d.rgb, 0.6 * on); ctx.lineWidth = 1.2;
          ctx.strokeRect(-23, -111, 46, 20);
          GlowCache.draw(ctx, d.rgb, 0, -101, 46, 0.4 * on);
          break;
        }
        case 'window': {
          ctx.fillStyle = rgba(th.lamp, 0.16 * fl);
          ctx.beginPath(); ctx.moveTo(-9, -42); ctx.lineTo(-9, -103); ctx.quadraticCurveTo(0, -122, 9, -103); ctx.lineTo(9, -42); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = rgba(th.lamp, 0.35 * fl); ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(0, -112); ctx.moveTo(-9, -80); ctx.lineTo(9, -80); ctx.stroke();
          GlowCache.draw(ctx, th.lamp, 0, -80, 34, 0.25 * fl);
          break;
        }
      }
      ctx.restore();
    }
    // Luz de status da comporta: vermelha fechada, azul aberta
    ctx.globalAlpha = 1;
    const d = this.door;
    const mx = isoX(d.x, 0), my = isoY(d.x, 0);
    GlowCache.draw(ctx, d.open > 0 ? '90,200,255' : '255,50,70', mx, my - 130, 16, 0.9);
    if (d.open > 0) {
      GlowCache.draw(ctx, '110,190,255', mx, my - 50, 120 * d.open, 0.4 * d.open);
      GlowCache.drawFlat(ctx, '110,190,255', isoX(d.x, 30), isoY(d.x, 30), 120 * d.open, 0.35 * d.open);
    }
    ctx.restore();
  }

  addLights(lighting, time) {
    const th = this.theme;
    for (const tc of this.torches) {
      let f = 0.85 + 0.15 * Math.sin(time * 11 + tc.ph);
      if (th.decor === 'screen') f = 0.55 + 0.45 * Math.max(0, Math.sin(time * 3.2 + tc.ph));
      lighting.add(isoX(tc.x + (tc.x === 0 ? 30 : 0), tc.y + (tc.y === 0 ? 30 : 0)), isoY(tc.x, tc.y) - 40, 210 * f, 0.75);
    }
    for (const d of this.decor) {
      if (th.decor === 'graffiti' || th.decor === 'pipes') continue;
      const x = d.side === 'R' ? (d.i + 0.5) * TILE : 20, y = d.side === 'R' ? 20 : (d.i + 0.5) * TILE;
      lighting.add(isoX(x, y), isoY(x, y) - 60, 130, 0.45);
    }
    if (this.door.open > 0) lighting.add(isoX(this.door.x, 20), isoY(this.door.x, 20) - 40, 260, 0.8 * this.door.open);
  }

  drawDebug(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,230,80,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(isoX(0, 0), isoY(0, 0)); ctx.lineTo(isoX(this.w, 0), isoY(this.w, 0));
    ctx.lineTo(isoX(this.w, this.h), isoY(this.w, this.h)); ctx.lineTo(isoX(0, this.h), isoY(0, this.h));
    ctx.closePath(); ctx.stroke();
    for (const p of this.pillars) drawHurtbox(ctx, p.x, p.y, p.r, '90,160,255');
    ctx.restore();
  }
}

// Pilar como objeto desenhável na ordenação por profundidade
function drawPillar(ctx, p, player) {
  if (!p.sprite) return;
  const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y);
  // Fica translúcido quando esconde o jogador
  let alpha = 1;
  if (player && player.depth < p.x + p.y) {
    const px = isoX(player.x, player.y), py = isoY(player.x, player.y);
    if (Math.abs(px - sx) < p.r * ISO_RX + 18 && py < sy + 10 && py > sy - p.h - 40) alpha = 0.38;
  }
  ctx.globalAlpha = alpha;
  ctx.drawImage(p.sprite, sx - p.ox, sy - p.oy, p.sprite.width / game.room.scale, p.sprite.height / game.room.scale);
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// GERENCIADOR DE ONDAS: ondas por sala, porta, transição e chefe
// ---------------------------------------------------------------------------
class WaveManager {
  constructor() { this.state = 'idle'; this.queue = []; this.waveIndex = -1; this.timer = 0; this.roomIndex = 0; this.def = ROOM_DEFS[0]; }

  startRoom(index) {
    this.roomIndex = index;
    this.def = ROOM_DEFS[index];
    this.waveIndex = -1;
    this.queue.length = 0;
    this.state = 'intro';
    this.timer = 1.8;
    game.hud.message(this.def.name.toUpperCase(), this.def.sub, 2.4);
    if (this.def.say) game.hud.say(this.def.say[0], this.def.say[1], 4.2, 1.4);
  }

  get totalWaves() { return this.def.boss ? 1 : this.def.waves.length; }

  spawnEnemy(type, x, y, level = this.roomIndex) {
    const e = createEnemy(type, x, y, level);
    game.enemies.push(e);
    game.particles.ring(x, y, e.radius * 2.5, e.T.glow, e.spawnDur, 4);
    game.particles.smoke(x, y, 0, 4, '10,16,26', 14);
    game.audio.play('spawn');
    if (type === 'legionario') game.camera.shake(0.15);
    return e;
  }

  nextWave() {
    this.waveIndex++;
    const wd = this.def.waves[this.waveIndex];
    const list = [];
    for (const t in wd) for (let i = 0; i < wd[t]; i++) list.push(t);
    // Embaralha para variar a ordem de entrada
    for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = list[i]; list[i] = list[j]; list[j] = t; }
    this.queue = list.map((t, i) => ({ type: t, delay: i === 0 ? 0 : rand(0.1, 0.28) }));
    this.state = 'spawning';
    this.timer = 0;
    game.hud.message(`ONDA ${this.waveIndex + 1} / ${this.def.waves.length}`, '', 1.3, true);
    game.audio.play('waveStart');
  }

  startBoss() {
    const r = game.room;
    const boss = new Boss(r.w / 2, r.h / 2 - 60);
    game.enemies.push(boss);
    game.boss = boss;
    this.state = 'boss';
    game.hud.message(boss.name, 'A VOZ DENTRO DA MÁQUINA', 2.8, false, true);
    game.camera.shake(0.4);
  }

  aliveCount() {
    let n = 0;
    for (const e of game.enemies) if (e.alive && e.state !== 'dying') n++;
    return n;
  }

  update(dt) {
    switch (this.state) {
      case 'intro':
        this.timer -= dt;
        if (this.timer <= 0) { if (this.def.boss) this.startBoss(); else this.nextWave(); }
        break;
      case 'spawning':
        this.timer -= dt;
        while (this.queue.length && this.timer <= 0) {
          const q = this.queue.shift();
          const minD = q.type === 'drone' || q.type === 'sacerdote' ? 300 : 230;
          const pt = game.room.randomPoint(60, game.player, minD);
          this.spawnEnemy(q.type, pt.x, pt.y);
          if (this.queue.length) this.timer += this.queue[0].delay;
        }
        if (!this.queue.length) this.state = 'fighting';
        break;
      case 'fighting':
        if (this.aliveCount() === 0) {
          if (this.waveIndex < this.def.waves.length - 1) { this.state = 'between'; this.timer = 1.1; }
          else this.roomCleared();
        }
        break;
      case 'between':
        this.timer -= dt;
        if (this.timer <= 0) this.nextWave();
        break;
      case 'cleared': {
        const p = game.player;
        if (p.y < -14 && game.room.door.open > 0.9) { this.state = 'exiting'; game.exitRoom(); }
        break;
      }
    }
  }

  roomCleared() {
    this.state = 'cleared';
    game.room.door.opening = true;
    game.pickups.attractAll();
    game.stats.roomsCleared++;
    game.audio.play('door');
    game.audio.play('roomClear');
    game.hud.message('SETOR LIBERADO', 'A comporta se abriu — siga para o norte', 2.6);
    if (!this.def.boss) game.spawnMemory();
  }
}
