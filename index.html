// FUNÇÕES DE TEXTO E ÍCONES DA INTERFACE
// ---------------------------------------------------------------------------
function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function glowText(ctx, text, x, y, color, glow, blur = 18) {
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Ícones procedurais das evoluções
function drawIcon(ctx, kind, x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 40, s / 40);
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (kind) {
    case 'sword':
      ctx.moveTo(-14, 14); ctx.lineTo(12, -12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14, 4); ctx.lineTo(-4, 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(16, -16); ctx.stroke();
      break;
    case 'boot':
      ctx.moveTo(-8, -16); ctx.lineTo(-8, 8); ctx.lineTo(10, 12); ctx.lineTo(12, 4); ctx.lineTo(2, 0); ctx.lineTo(2, -16); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, -6); ctx.lineTo(-12, -6); ctx.moveTo(-20, 0); ctx.lineTo(-12, 0); ctx.stroke();
      break;
    case 'fang':
      ctx.moveTo(-12, -12); ctx.lineTo(-6, 10); ctx.lineTo(-2, -12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2, -12); ctx.lineTo(6, 10); ctx.lineTo(12, -12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(6, 15, 3, 0, TAU); ctx.fill();
      break;
    case 'heart':
      ctx.moveTo(0, 14); ctx.bezierCurveTo(-22, 0, -14, -18, 0, -6); ctx.bezierCurveTo(14, -18, 22, 0, 0, 14); ctx.fill();
      break;
    case 'flame':
      ctx.moveTo(0, -18); ctx.bezierCurveTo(14, -4, 14, 14, 0, 16); ctx.bezierCurveTo(-14, 14, -12, 0, -4, -6); ctx.bezierCurveTo(-4, 2, 2, 4, 0, -18); ctx.fill();
      break;
    case 'eye':
      ctx.moveTo(-18, 0); ctx.quadraticCurveTo(0, -16, 18, 0); ctx.quadraticCurveTo(0, 16, -18, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      break;
    case 'wing':
      ctx.moveTo(-14, 12); ctx.quadraticCurveTo(-10, -14, 16, -14); ctx.quadraticCurveTo(6, -6, 10, -2); ctx.quadraticCurveTo(0, 0, 4, 6); ctx.quadraticCurveTo(-6, 6, -14, 12); ctx.fill();
      break;
    case 'shield':
      ctx.moveTo(0, -16); ctx.lineTo(14, -10); ctx.quadraticCurveTo(14, 8, 0, 16); ctx.quadraticCurveTo(-14, 8, -14, -10); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
      break;
    case 'soul':
      ctx.arc(0, 4, 8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -1); ctx.quadraticCurveTo(-4, -14, 4, -18); ctx.quadraticCurveTo(2, -8, 7, -2); ctx.fill();
      break;
    case 'bolt':
      ctx.moveTo(4, -18); ctx.lineTo(-10, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 18); ctx.lineTo(10, -4); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill();
      break;
    case 'chain':
      ctx.moveTo(-16, -12); ctx.lineTo(-4, -2); ctx.lineTo(-8, 2); ctx.lineTo(6, 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4, -16); ctx.lineTo(10, -6); ctx.lineTo(6, -4); ctx.lineTo(16, 6); ctx.stroke();
      ctx.beginPath(); ctx.arc(-16, -12, 3, 0, TAU); ctx.arc(16, 6, 3, 0, TAU); ctx.fill();
      break;
    case 'orb':
      ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      break;
    case 'scroll':
      ctx.strokeRect(-12, -14, 24, 28);
      ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, -6); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(-7, 6); ctx.lineTo(3, 6); ctx.stroke();
      break;
  }
  ctx.restore();
}

// Painel com cantos chanfrados (estética de interface tática)
function techPanelPath(ctx, x, y, w, h, c = 10) {
  ctx.beginPath();
  ctx.moveTo(x + c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + c);
  ctx.closePath();
}

// Cor e estilo de cada interlocutor nas legendas
const SPEAKERS = {
  'NEXUS': { color: '#9ff6ff', glow: 'rgba(90,230,255,0.9)', glitch: true },
  'SISTEMA': { color: '#ff5c7a', glow: 'rgba(255,46,85,0.8)' },
  '???': { color: '#a8d8ff', glow: 'rgba(60,140,255,0.9)', whisper: true },
  'KAEL': { color: '#dfe6f2', glow: 'rgba(60,140,255,0.6)' },
};

class HUD {
  constructor() { this.reset(); }
  reset() {
    this.names = [];
    this.msg = null;
    this.sub = null;
    this.mem = null;
    this.whisperIdx = (Math.random() * WHISPERS.length) | 0;
    this.ghostHp = 100; this.ghostDelay = 0;
    this.furyReadyT = 0; this.furyDeny = 0;
    this.tier = null;
    this.displayScore = 0;
    this.bossGhost = 1;
    this.time = 0;
  }
  comboName(text, big = false) {
    this.names.push({ text, t: 0, max: big ? 1.7 : 1.15, big });
    if (this.names.length > 3) this.names.shift();
  }
  message(title, sub = '', dur = 2, small = false, low = false) { this.msg = { title, sub, t: 0, max: dur, small, low }; }
  // Legenda com o nome de quem fala (com atraso opcional)
  say(who, text, dur = 3.5, delay = 0) { this.sub = { who, text, t: -delay, max: dur }; }
  // Algo adormecido dentro de Kael sussurra após o Eclipse Absoluto
  whisper() { this.say('???', WHISPERS[this.whisperIdx++ % WHISPERS.length], 3.2, 0.7); }
  memory(text, idx) { this.mem = { text, idx, t: 0, max: 6 }; }
  tierUp(label) { if (label) this.tier = { label, t: 0 }; }
  furyReady() { this.furyReadyT = 1.4; }
  furyDenied() { this.furyDeny = 0.35; }

  update(dt) {
    const p = game.player;
    this.time += dt;
    for (const n of this.names) n.t += dt;
    this.names = this.names.filter((n) => n.t < n.max);
    if (this.msg) { this.msg.t += dt; if (this.msg.t >= this.msg.max) this.msg = null; }
    if (this.sub) {
      const before = this.sub.t;
      this.sub.t += dt;
      if (before < 0 && this.sub.t >= 0 && this.sub.who === 'NEXUS') game.audio.play('glitch');
      if (this.sub.t >= this.sub.max) this.sub = null;
    }
    if (this.mem) { this.mem.t += dt; if (this.mem.t >= this.mem.max) this.mem = null; }
    if (this.tier) { this.tier.t += dt; if (this.tier.t > 1.2) this.tier = null; }
    if (this.furyReadyT > 0) this.furyReadyT -= dt;
    if (this.furyDeny > 0) this.furyDeny -= dt;
    // Barra "fantasma" de vida que drena com atraso
    if (p) {
      if (p.hp < this.ghostHp) { this.ghostDelay += dt; if (this.ghostDelay > 0.45) this.ghostHp = Math.max(p.hp, this.ghostHp - 70 * dt); }
      else { this.ghostHp = p.hp; this.ghostDelay = 0; }
    }
    this.displayScore = lerp(this.displayScore, game.stats.score, 1 - Math.exp(-dt * 8));
    if (Math.abs(this.displayScore - game.stats.score) < 1) this.displayScore = game.stats.score;
    if (game.boss) {
      const r = game.boss.hp / game.boss.maxHp;
      this.bossGhost = r < this.bossGhost ? Math.max(r, this.bossGhost - dt * 0.25) : r;
    }
  }

  draw(ctx) {
    const p = game.player;
    if (!p) return;
    this.drawVitals(ctx, p);
    this.drawScore(ctx);
    this.drawCombo(ctx);
    this.drawComboNames(ctx);
    this.drawBossBar(ctx);
    this.drawMessage(ctx);
    this.drawIndicators(ctx);
    this.drawMemory(ctx);
    this.drawSubtitle(ctx);
  }

  bar(ctx, x, y, w, h, frac, ghost, fill, back = 'rgba(3,6,14,0.85)') {
    ctx.fillStyle = back;
    ctx.fillRect(x, y, w, h);
    if (ghost > frac) { ctx.fillStyle = 'rgba(220,235,255,0.7)'; ctx.fillRect(x, y, w * clamp(ghost, 0, 1), h); }
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, w * clamp(frac, 0, 1), h * 0.4);
    // Divisões de segmentos
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let k = 1; k < 10; k++) ctx.fillRect(x + (w * k) / 10, y, 1, h);
  }

  drawVitals(ctx, p) {
    const x = 24, y = 30, w = 300;
    ctx.save();
    ctx.fillStyle = 'rgba(3,7,16,0.62)';
    techPanelPath(ctx, x - 10, y - 20, w + 98, 112, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(61,139,255,0.45)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.font = `bold 10px ${FONT_TITLE}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(168,216,255,0.75)';
    ctx.letterSpacing = '2px';
    ctx.fillText('KAEL VEYRON · UNIDADE ZERO', x, y - 9);
    ctx.letterSpacing = '0px';
    // Vida
    const low = p.hp / p.maxHp < 0.3;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#5a0a1e'); g.addColorStop(1, low ? `rgba(255,${(40 + 50 * Math.sin(this.time * 10)) | 0},90,1)` : '#ff2e55');
    this.bar(ctx, x, y, w, 18, p.hp / p.maxHp, this.ghostHp / p.maxHp, g);
    ctx.strokeStyle = 'rgba(255,92,122,0.8)'; ctx.lineWidth = 1.2;
    ctx.strokeRect(x - 0.5, y - 0.5, w + 1, 19);
    ctx.font = `bold 13px ${FONT_UI}`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, x + 8, y + 10);
    ctx.fillStyle = '#ff8aa0';
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillText('VIDA', x + w + 10, y + 10);
    // Energia da Tempestade Nula
    const fy = y + 28, fw = 240;
    const full = p.fury >= 100;
    const shake = this.furyDeny > 0 ? Math.sin(this.furyDeny * 80) * 4 : 0;
    const fg = ctx.createLinearGradient(x, 0, x + fw, 0);
    fg.addColorStop(0, '#0c2a66'); fg.addColorStop(1, full ? '#d6ecff' : '#3d8bff');
    if (full) { ctx.shadowColor = 'rgba(80,160,255,0.95)'; ctx.shadowBlur = 12 + 8 * Math.sin(this.time * 8); }
    this.bar(ctx, x + shake, fy, fw, 11, p.fury / 100, 0, fg);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = full ? PAL.accentHi : 'rgba(61,139,255,0.75)';
    ctx.strokeRect(x + shake - 0.5, fy - 0.5, fw + 1, 12);
    ctx.fillStyle = full ? PAL.accentHi : PAL.accent;
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillText(full ? (Math.floor(this.time * 3) % 2 ? '[I] ECLIPSE!' : 'ECLIPSE PRONTO') : 'ENERGIA', x + fw + 10 + shake, fy + 6);
    // Esquiva (recarga)
    const dy = fy + 20, dw = 90;
    const ready = p.dashCd <= 0;
    this.bar(ctx, x, dy, dw, 5, ready ? 1 : 1 - p.dashCd / (0.5 * p.stats.dashCdMult), 0, ready ? '#d6dde8' : '#5a6474');
    ctx.fillStyle = 'rgba(214,221,232,0.75)'; ctx.font = `11px ${FONT_UI}`;
    ctx.fillText('ESQUIVA', x + dw + 8, dy + 3);
    // Fragmentos de memória recuperados
    const my = dy + 20;
    ctx.fillStyle = 'rgba(168,216,255,0.75)'; ctx.font = `bold 10px ${FONT_TITLE}`;
    ctx.letterSpacing = '1px';
    ctx.fillText('MEMÓRIAS', x, my);
    ctx.letterSpacing = '0px';
    for (let k = 0; k < MEMORIES.length; k++) {
      const cx = x + 82 + k * 18, has = k < game.stats.memories;
      ctx.beginPath(); ctx.moveTo(cx, my - 6); ctx.lineTo(cx + 5, my); ctx.lineTo(cx, my + 6); ctx.lineTo(cx - 5, my); ctx.closePath();
      if (has) {
        ctx.fillStyle = PAL.accentHi; ctx.fill();
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; GlowCache.draw(ctx, '90,170,255', cx, my, 12, 0.6); ctx.restore();
      } else { ctx.strokeStyle = 'rgba(168,216,255,0.35)'; ctx.lineWidth = 1; ctx.stroke(); }
    }
    ctx.restore();
  }

  drawScore(ctx) {
    ctx.save();
    const x = VIEW_W - 24;
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(61,139,255,0.85)';
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.letterSpacing = '2px';
    ctx.fillText('PONTUAÇÃO', x, 16);
    ctx.letterSpacing = '0px';
    ctx.font = `30px ${FONT_NUM}`;
    glowText(ctx, Math.round(this.displayScore).toLocaleString('pt-BR'), x, 30, '#eef5ff', 'rgba(60,140,255,0.7)', 10);
    // Células de energia
    ctx.font = `bold 16px ${FONT_UI}`;
    ctx.fillStyle = '#cfe6ff';
    ctx.fillText(`${game.stats.soulsBank}`, x, 68);
    const tw = ctx.measureText(`${game.stats.soulsBank}`).width;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    GlowCache.draw(ctx, '70,150,255', x - tw - 14, 77, 12, 0.9);
    ctx.restore();
    ctx.fillStyle = '#eaf4ff';
    const dx = x - tw - 14;
    ctx.beginPath(); ctx.moveTo(dx, 71); ctx.lineTo(dx + 3, 77); ctx.lineTo(dx, 83); ctx.lineTo(dx - 3, 77); ctx.closePath(); ctx.fill();
    // Setor e onda
    const w = game.waves;
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillStyle = 'rgba(223,230,242,0.7)';
    const roomTxt = w.def.boss ? 'NÚCLEO DE NEXUS' : `SETOR ${w.roomIndex + 1} / 5`;
    const waveTxt = w.def.boss ? '' : ` · ONDA ${Math.max(1, w.waveIndex + 1)} / ${w.def.waves.length}`;
    ctx.fillText(roomTxt + waveTxt, x, 92);
    ctx.restore();
  }

  drawCombo(ctx) {
    const c = game.counter;
    const show = c.count >= 2;
    ctx.save();
    const x = VIEW_W - 40, y = 236;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    if (show) {
      const pop = 1 + c.pop * 0.35;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pop, pop);
      ctx.rotate(-0.06);
      ctx.font = `64px ${FONT_NUM}`;
      const hue = c.count >= 50 ? '#d6ecff' : c.count >= 15 ? PAL.accentHi : '#ffffff';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(2,6,16,0.9)';
      ctx.strokeText(String(c.count), 0, 0);
      glowText(ctx, String(c.count), 0, 0, hue, 'rgba(60,140,255,0.8)', 16);
      ctx.restore();
      ctx.font = `bold 16px ${FONT_TITLE}`;
      ctx.fillStyle = PAL.text;
      ctx.fillText('HITS', x, y + 22);
      ctx.font = `22px ${FONT_NUM}`;
      ctx.fillStyle = PAL.accent;
      ctx.fillText(`x${c.mult.toFixed(1)}`, x - 52, y + 24);
      if (c.label) {
        ctx.font = `italic bold 20px ${FONT_TITLE}`;
        glowText(ctx, c.label, x, y + 50, '#9fd0ff', 'rgba(40,120,255,0.9)', 12);
      }
      // Tempo restante do combo
      const bw = 150, k = c.timer / c.duration;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - bw, y + 60, bw, 4);
      ctx.fillStyle = k < 0.3 ? '#ff2e55' : PAL.accent; ctx.fillRect(x - bw, y + 60, bw * k, 4);
    } else if (c.dropped) {
      ctx.globalAlpha = c.dropped.t;
      ctx.font = `40px ${FONT_NUM}`;
      ctx.fillStyle = '#5d6676';
      ctx.fillText(String(c.dropped.count), x, y);
      ctx.font = `bold 13px ${FONT_TITLE}`;
      ctx.fillText('COMBO PERDIDO', x, y + 20);
    }
    if (this.tier) {
      const k = this.tier.t / 1.2;
      ctx.globalAlpha = 1 - k;
      ctx.font = `italic bold ${Math.round(26 + 10 * (1 - k))}px ${FONT_TITLE}`;
      glowText(ctx, this.tier.label + '!', x, y - 66 - k * 14, '#eaf4ff', 'rgba(60,140,255,0.95)', 18);
    }
    ctx.restore();
  }

  drawComboNames(ctx) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let y = game.boss ? 150 : 120;
    for (const n of this.names) {
      const k = n.t / n.max;
      const sIn = Math.min(1, n.t / 0.14);
      const scale = (n.big ? 1.3 : 1) * (0.6 + 0.4 * easeOutBack(sIn));
      const a = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(VIEW_W / 2, y - k * 12);
      ctx.scale(scale, scale);
      ctx.font = `bold italic 30px ${FONT_TITLE}`;
      ctx.letterSpacing = '3px';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(2,6,16,0.85)';
      ctx.strokeText(n.text, 0, 0);
      const g = ctx.createLinearGradient(0, -16, 0, 16);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, PAL.accentHi); g.addColorStop(1, '#3d8bff');
      glowText(ctx, n.text, 0, 0, g, 'rgba(40,120,255,0.95)', 16);
      // Linhas decorativas
      const w = ctx.measureText(n.text).width / 2 + 14;
      ctx.letterSpacing = '0px';
      ctx.strokeStyle = 'rgba(61,139,255,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-w - 40 * sIn, 0); ctx.lineTo(-w, 0); ctx.moveTo(w, 0); ctx.lineTo(w + 40 * sIn, 0); ctx.stroke();
      ctx.restore();
      y += 44;
    }
    ctx.restore();
  }

  drawBossBar(ctx) {
    const b = game.boss;
    if (!b || (!b.alive && b.state !== 'dying')) return;
    // Centralizada no espaço livre entre o painel de vida e a pontuação
    const x0 = 430, x1 = VIEW_W - 210;
    const w = Math.min(600, x1 - x0 - 20), x = (x0 + x1) / 2 - w / 2, y = 34, cx = x + w / 2;
    const intro = b.state === 'intro' ? clamp(b.stateTime / 2.5, 0, 1) : 1;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = `bold ${w < 420 ? 13 : 16}px ${FONT_TITLE}`;
    ctx.letterSpacing = '2px';
    glowText(ctx, b.name, cx, y - 6, '#e6fbff', 'rgba(90,230,255,0.85)', 10);
    ctx.letterSpacing = '0px';
    ctx.fillStyle = 'rgba(2,8,14,0.85)';
    ctx.fillRect(x - 4, y - 2, w + 8, 20);
    const frac = (b.hp / b.maxHp) * intro;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#08303c'); g.addColorStop(1, b.phase === 3 ? '#ff2e55' : '#5ff0ff');
    this.bar(ctx, x, y, w, 16, frac, this.bossGhost * intro, g);
    // Marcadores das fases
    ctx.fillStyle = PAL.accentHi;
    for (const m of [0.66, 0.33]) ctx.fillRect(x + w * m - 1, y - 3, 2, 22);
    ctx.strokeStyle = 'rgba(120,235,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 0.5, y - 0.5, w + 1, 17);
    // Estabilidade (poise): quando zera, NEXUS fica instável
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y + 21, w, 4);
    ctx.fillStyle = b.state === 'stagger' ? '#ffffff' : 'rgba(170,240,255,0.85)';
    ctx.fillRect(x, y + 21, w * (b.state === 'stagger' ? 1 - b.stateTime / 1.8 : b.poise / b.maxPoise), 4);
    ctx.textBaseline = 'top'; ctx.font = `bold 12px ${FONT_TITLE}`; ctx.fillStyle = 'rgba(223,230,242,0.8)';
    ctx.fillText(`FASE ${['I', 'II', 'III'][b.phase - 1]}`, cx, y + 28);
    ctx.restore();
  }

  drawMessage(ctx) {
    const m = this.msg;
    if (!m) return;
    const k = m.t / m.max;
    const a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = VIEW_H * (m.low ? 0.72 : 0.3);   // letreiros do chefe ficam abaixo da ação
    if (m.small) {
      ctx.font = `bold 30px ${FONT_TITLE}`;
      ctx.letterSpacing = '4px';
      glowText(ctx, m.title, VIEW_W / 2, y + 20, '#eaf3ff', 'rgba(60,140,255,0.85)', 14);
    } else {
      if (m.sub) {
        ctx.font = `bold 14px ${FONT_TITLE}`;
        ctx.letterSpacing = '3px';
        ctx.fillStyle = PAL.accent;
        ctx.fillText(m.sub, VIEW_W / 2, y - 34);
      }
      ctx.font = `bold 42px ${FONT_TITLE}`;
      ctx.letterSpacing = '5px';
      glowText(ctx, m.title, VIEW_W / 2, y + 6, '#eef5ff', 'rgba(40,120,255,0.95)', 22);
      const w = Math.min(VIEW_W * 0.4, ctx.measureText(m.title).width / 2 + 40);
      ctx.strokeStyle = 'rgba(61,139,255,0.75)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(VIEW_W / 2 - w, y + 36); ctx.lineTo(VIEW_W / 2 + w, y + 36); ctx.stroke();
    }
    ctx.letterSpacing = '0px';
    ctx.restore();
  }

  // Legenda de diálogo na parte de baixo da tela (texto digitado aos poucos)
  drawSubtitle(ctx) {
    const s = this.sub;
    if (!s || s.t < 0) return;
    const st = SPEAKERS[s.who] || { color: PAL.accentHi, glow: 'rgba(60,140,255,0.7)' };
    const k = s.t / s.max;
    const a = clamp(k < 0.08 ? k / 0.08 : k > 0.85 ? (1 - k) / 0.15 : 1, 0, 1);
    const shown = s.text.slice(0, Math.floor(s.t * 48));
    ctx.save();
    ctx.globalAlpha = a * (st.whisper ? 0.65 + 0.35 * Math.sin(this.time * 9) : 1);
    ctx.font = `${st.whisper ? 'italic ' : ''}17px ${FONT_UI}`;
    const lines = wrapText(ctx, s.text, Math.min(760, VIEW_W - 120));
    const lh = 23, bw = Math.min(800, VIEW_W - 80), bh = 42 + lines.length * lh;
    const bx = VIEW_W / 2 - bw / 2, by = VIEW_H - 40 - bh;
    if (!st.whisper) {
      ctx.fillStyle = 'rgba(2,6,14,0.72)';
      techPanelPath(ctx, bx, by, bw, bh, 12); ctx.fill();
      ctx.strokeStyle = st.glow; ctx.lineWidth = 1; ctx.stroke();
    }
    const jx = st.glitch && Math.random() < 0.08 ? rand(-4, 4) : 0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.letterSpacing = '3px';
    ctx.fillStyle = st.color;
    ctx.fillText(s.who, VIEW_W / 2 + jx, by + 10);
    ctx.letterSpacing = '0px';
    ctx.font = `${st.whisper ? 'italic ' : ''}17px ${FONT_UI}`;
    // Distribui o texto já digitado pelas linhas
    let left = shown.length;
    lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left));
      left -= ln.length + 1;
      glowText(ctx, part, VIEW_W / 2 + jx, by + 30 + i * lh, st.whisper ? '#cfe6ff' : '#eef3fa', st.glow, st.whisper ? 14 : 6);
    });
    ctx.restore();
  }

  // Fragmento de memória: lembrança que invade a tela por alguns segundos
  drawMemory(ctx) {
    const m = this.mem;
    if (!m) return;
    const k = m.t / m.max;
    const a = clamp(k < 0.1 ? k / 0.1 : k > 0.8 ? (1 - k) / 0.2 : 1, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    const y = VIEW_H * 0.2;
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 90);
    g.addColorStop(0, 'rgba(10,30,70,0)'); g.addColorStop(0.5, 'rgba(10,30,70,0.55)'); g.addColorStop(1, 'rgba(10,30,70,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 60, VIEW_W, 150);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 13px ${FONT_TITLE}`;
    ctx.letterSpacing = '4px';
    ctx.fillStyle = PAL.accent;
    ctx.fillText(`FRAGMENTO DE MEMÓRIA ${m.idx} / ${MEMORIES.length}`, VIEW_W / 2, y - 30);
    ctx.letterSpacing = '0px';
    ctx.font = `italic 21px ${FONT_UI}`;
    const lines = wrapText(ctx, m.text, Math.min(820, VIEW_W - 120));
    lines.forEach((ln, i) => glowText(ctx, ln, VIEW_W / 2 + (Math.random() < 0.03 ? rand(-3, 3) : 0), y + 4 + i * 28, '#eaf4ff', 'rgba(80,160,255,0.95)', 14));
    ctx.restore();
  }

  // Indicadores de inimigos fora da tela, da saída e do fragmento de memória
  drawIndicators(ctx) {
    const cam = game.camera, m = 26;
    ctx.save();
    const arrow = (sx, sy, rgb, size) => {
      const cx = VIEW_W / 2, cy = VIEW_H / 2;
      const dx = sx - cx, dy = sy - cy;
      const s = Math.min((VIEW_W / 2 - m) / Math.abs(dx || 1e-6), (VIEW_H / 2 - m) / Math.abs(dy || 1e-6));
      const ex = cx + dx * s, ey = cy + dy * s, a = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(ex, ey); ctx.rotate(a);
      ctx.fillStyle = rgba(rgb, 0.85);
      ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.7, -size * 0.7); ctx.lineTo(-size * 0.7, size * 0.7); ctx.closePath(); ctx.fill();
      ctx.restore();
    };
    const marker = (p, rgb, label) => {
      if (p.x < 0 || p.x > VIEW_W || p.y < 0 || p.y > VIEW_H) { arrow(p.x, p.y, rgb, 14); return; }
      const bob = Math.sin(this.time * 5) * 6;
      ctx.fillStyle = rgba(rgb, 1);
      ctx.beginPath(); ctx.moveTo(p.x, p.y - 40 + bob); ctx.lineTo(p.x - 10, p.y - 56 + bob); ctx.lineTo(p.x + 10, p.y - 56 + bob); ctx.closePath(); ctx.fill();
      ctx.font = `bold 13px ${FONT_TITLE}`; ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      ctx.fillText(label, p.x, p.y - 64 + bob);
      ctx.letterSpacing = '0px';
    };
    for (const e of game.enemies) {
      if (!e.alive || e.state === 'dying') continue;
      const p = cam.toScreen(isoX(e.x, e.y), isoY(e.x, e.y) - 20);
      if (p.x < 0 || p.x > VIEW_W || p.y < 0 || p.y > VIEW_H) arrow(p.x, p.y, e.isBoss ? '90,230,255' : '255,46,85', e.isBoss ? 14 : 8);
    }
    const mem = game.pickups.find('memory');
    if (mem) {
      const p = cam.toScreen(isoX(mem.x, mem.y), isoY(mem.x, mem.y) - 30);
      marker({ x: p.x, y: p.y }, '170,215,255', 'MEMÓRIA');
    }
    if (game.waves.state === 'cleared') {
      const d = game.room.door;
      const p = cam.toScreen(isoX(d.x, 0), isoY(d.x, 0) - 60);
      marker({ x: p.x, y: p.y }, '110,190,255', 'SAÍDA');
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// TELAS: título, pausa, evoluções, derrota e final
// ---------------------------------------------------------------------------
const CONTROLS = [
  ['WASD / Setas', 'Mover'],
  ['J', 'Ataque leve'],
  ['K', 'Ataque pesado (segure: Sobrecarga)'],
  ['L / Espaço', 'Esquiva (invencível)'],
  ['I', 'Eclipse Absoluto — energia cheia'],
  ['ESC', 'Pausa · pular história'], ['M', 'Som · G gráficos 3D/2D'], ['F1', 'Modo debug (hitboxes)'],
];
const COMBO_LIST = [
  ['Leve · Leve · Leve', 'Descarga Tríplice'],
  ['Leve · Leve · Pesado', 'Círculo da Ruína'],
  ['Pesado (segurado)', 'Sobrecarga'],
  ['Esquiva → Leve', 'Pulso Fantasma'],
  ['Esquiva → Pesado', 'Corte do Vazio'],
];

class Screens {
  overlay(ctx, a = 0.72) {
    ctx.fillStyle = `rgba(1,3,8,${a})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  // Partículas de energia flutuando (título e telas finais)
  drawEmbers(ctx, t) { Backdrop.drawMotes(ctx, t); }

  // Kael em 3D na tela de título, em grande escala, com a espada carregada
  drawHero3D(ctx, t) {
    if (!R3D.active || !game.model3('kael')) return false;
    const k = game.titleKael || (game.titleKael = new Player(0, 0));
    k.state = 'idle'; k.animTime = t; k.stateTime = t; k.fury = 100; k.moveSpeed = 0; k.flash = 0;
    k.facing = 0.55 + 0.5 * Math.sin(t * 0.3);
    const sc = 3.1;
    const o = game.opts3(k, 0); o.scale = sc;
    const it = game.queue3('kael', k, o);
    R3D.flush(Math.min(3, game.scale));
    if (!it || !it.ok) return false;
    const x = Math.min(VIEW_W * 0.13, 160), y = VIEW_H * 0.985;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    GlowCache.drawFlat(ctx, '60,130,255', x, y, 140, 0.5);
    ctx.restore();
    R3D.blit(ctx, it, x, y);
    R3D.blitEmissive(ctx, it, x, y, 1);
    const def = MODELS3D.kael;
    if (def.glows) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      def.glows(k, (name, r, rgb, a) => { const q = it.anchors[name]; if (q) GlowCache.draw(ctx, rgb, x + q.x, y + q.y, r * sc * 0.8, a); });
      ctx.restore();
    }
    return true;
  }

  drawTitle(ctx, t) {
    // Vesper sob o céu artificial, a torre central e Kael de costas com a espada acesa
    const sky = Backdrop.layer('title-sky', VIEW_W, VIEW_H, (g, w, h) => Backdrop.paintSky(g, w, h, 'city'));
    ctx.drawImage(sky, 0, 0, VIEW_W, VIEW_H);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    GlowCache.draw(ctx, '90,170,255', VIEW_W * 0.5, VIEW_H * 0.12, 60, 0.4 + 0.3 * Math.sin(t * 3));
    ctx.restore();
    if (Math.sin(t * 0.9) > 0.97) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
      ctx.fillStyle = 'rgba(150,190,255,0.08)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      drawBolt(ctx, VIEW_W * (0.2 + 0.6 * ((Math.floor(t * 0.9 / TAU) * 0.37) % 1)), 0, VIEW_W * 0.5, VIEW_H * 0.14, mulberry32(Math.floor(t * 18)), 0.25, 2.5, '170,220,255', 0.9);
      ctx.restore();
    }
    Backdrop.drawRain(ctx, t, 0.9);
    const vg = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    vg.addColorStop(0, 'rgba(1,3,8,0.35)'); vg.addColorStop(0.5, 'rgba(1,3,8,0.15)'); vg.addColorStop(1, 'rgba(1,3,8,0.85)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (!this.drawHero3D(ctx, t)) Backdrop.kael(ctx, Math.min(VIEW_W * 0.1, 120), VIEW_H * 0.99, 2.1, t);
    this.drawEmbers(ctx, t);
    // Título
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const jx = Math.sin(t * 37) > 0.985 ? rand(-6, 6) : 0;
    ctx.font = `bold 98px ${FONT_TITLE}`;
    ctx.letterSpacing = '22px';
    glowText(ctx, 'ECLIPSE', VIEW_W / 2 + 11 + jx, VIEW_H * 0.2, '#eef5ff', 'rgba(60,140,255,0.85)', 30);
    ctx.font = `bold 46px ${FONT_TITLE}`;
    ctx.letterSpacing = '40px';
    glowText(ctx, 'ZERO', VIEW_W / 2 + 20, VIEW_H * 0.31, PAL.accent, 'rgba(40,120,255,1)', 28);
    ctx.letterSpacing = '0px';
    ctx.strokeStyle = 'rgba(61,139,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(VIEW_W / 2 - 210, VIEW_H * 0.31); ctx.lineTo(VIEW_W / 2 - 90, VIEW_H * 0.31); ctx.moveTo(VIEW_W / 2 + 90, VIEW_H * 0.31); ctx.lineTo(VIEW_W / 2 + 210, VIEW_H * 0.31); ctx.stroke();
    ctx.font = `italic 16px ${FONT_UI}`;
    ctx.fillStyle = 'rgba(214,225,240,0.82)';
    wrapText(ctx, '“Quando o último céu artificial se apagar, os mortos se lembrarão de como viver… e os vivos desejarão nunca ter nascido.”', 640)
      .forEach((ln, i) => ctx.fillText(ln, VIEW_W / 2, VIEW_H * 0.385 + i * 22));
    ctx.restore();
    // Painel de controles e técnicas
    // Em telas estreitas o painel ocupa a largura toda (sobre a silhueta de Kael)
    const wide = VIEW_W - 300 >= 800;
    const pw = wide ? Math.min(860, VIEW_W - 300) : Math.min(860, VIEW_W - 60);
    const px = (VIEW_W - pw) / 2 + (wide ? 60 : 0), py = VIEW_H * 0.49, ph = 222;
    ctx.save();
    ctx.fillStyle = 'rgba(2,6,14,0.78)';
    techPanelPath(ctx, px, py, pw, ph, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(61,139,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.textBaseline = 'middle';
    const col = pw / 2;
    ctx.font = `bold 13px ${FONT_TITLE}`; ctx.fillStyle = PAL.accent; ctx.textAlign = 'left';
    ctx.letterSpacing = '3px';
    ctx.fillText('CONTROLES', px + 24, py + 22);
    ctx.fillText('TÉCNICAS DA TEMPESTADE NULA', px + col + 14, py + 22);
    ctx.letterSpacing = '0px';
    ctx.font = `13px ${FONT_UI}`;
    CONTROLS.forEach(([k, d], i) => {
      ctx.fillStyle = PAL.accentHi; ctx.fillText(k, px + 24, py + 48 + i * 20);
      ctx.fillStyle = '#c9d3e2'; ctx.fillText(d, px + 132, py + 48 + i * 20);
    });
    COMBO_LIST.forEach(([k, d], i) => {
      ctx.fillStyle = '#c9d3e2'; ctx.fillText(k, px + col + 14, py + 48 + i * 22);
      ctx.fillStyle = '#7fc0ff'; ctx.fillText(d, px + col + 180, py + 48 + i * 22);
    });
    ctx.fillStyle = 'rgba(201,211,226,0.6)'; ctx.font = `12px ${FONT_UI}`;
    ctx.fillText('Novas técnicas e evoluções entre os setores.', px + col + 14, py + 168);
    ctx.fillText('Gamepad: X leve · Y pesado · A esquiva · B/RB Eclipse · Start pausa', px + col + 14, py + 190);
    ctx.restore();
    // Chamada para começar + recorde
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    ctx.font = `bold 21px ${FONT_TITLE}`;
    ctx.letterSpacing = '3px';
    const cxp = px + pw / 2;
    glowText(ctx, 'Pressione ENTER ou J para despertar', cxp, VIEW_H * 0.9, PAL.accentHi, 'rgba(40,120,255,0.9)', 12);
    ctx.letterSpacing = '0px';
    ctx.globalAlpha = 1;
    ctx.font = `13px ${FONT_UI}`; ctx.fillStyle = 'rgba(214,225,240,0.6)';
    if (game.best > 0) ctx.fillText(`Recorde: ${game.best.toLocaleString('pt-BR')} pontos`, cxp, VIEW_H * 0.955);
    ctx.restore();
  }

  drawPause(ctx) {
    this.overlay(ctx, 0.78);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 54px ${FONT_TITLE}`;
    ctx.letterSpacing = '10px';
    glowText(ctx, 'PAUSADO', VIEW_W / 2, VIEW_H * 0.18, '#eef5ff', 'rgba(40,120,255,0.9)', 20);
    ctx.letterSpacing = '0px';
    ctx.font = `15px ${FONT_UI}`; ctx.fillStyle = '#c9d3e2';
    ctx.fillText('ESC — continuar      R — reiniciar      T — voltar ao título', VIEW_W / 2, VIEW_H * 0.27);
    ctx.fillStyle = PAL.accentHi;
    ctx.fillText(`${ROOM_DEFS[game.waves.roomIndex].sub}   ·   memórias recuperadas: ${game.stats.memories} / ${MEMORIES.length}`, VIEW_W / 2, VIEW_H * 0.32);
    // Técnicas conhecidas
    const p = game.player;
    const list = COMBO_LIST.slice();
    if (p.combo.unlocked.has('slam')) list.push(['Pesado · Pesado', 'Colapso Magnético']);
    if (p.combo.unlocked.has('uppercut')) list.push(['Leve · Pesado', 'Relâmpago Ascendente']);
    list.push(['I (energia cheia)', 'Eclipse Absoluto']);
    ctx.font = `bold 14px ${FONT_TITLE}`; ctx.fillStyle = PAL.accent;
    ctx.letterSpacing = '3px';
    ctx.fillText('TÉCNICAS', VIEW_W / 2 - 200, VIEW_H * 0.4);
    ctx.fillText('EVOLUÇÕES', VIEW_W / 2 + 220, VIEW_H * 0.4);
    ctx.letterSpacing = '0px';
    ctx.font = `14px ${FONT_UI}`;
    // Colunas: sequência (alinhada à direita) → nome da técnica (alinhado à esquerda)
    const cx = VIEW_W / 2 - 200;
    list.forEach(([k, n], i) => {
      const y = VIEW_H * 0.45 + i * 24;
      ctx.textAlign = 'right'; ctx.fillStyle = '#c9d3e2'; ctx.fillText(k, cx - 14, y);
      ctx.textAlign = 'center'; ctx.fillStyle = PAL.accent; ctx.fillText('→', cx, y);
      ctx.textAlign = 'left'; ctx.fillStyle = '#7fc0ff'; ctx.fillText(n, cx + 14, y);
    });
    ctx.textAlign = 'center';
    const ups = UPGRADES.filter((u) => game.upgrades.level(u.id) > 0);
    if (!ups.length) { ctx.fillStyle = 'rgba(201,211,226,0.6)'; ctx.fillText('Nenhuma ainda', VIEW_W / 2 + 220, VIEW_H * 0.45); }
    ups.forEach((u, i) => {
      ctx.fillStyle = '#c9d3e2';
      ctx.fillText(`${u.name}${u.max > 1 ? ` (${game.upgrades.level(u.id)}/${u.max})` : ''}`, VIEW_W / 2 + 220, VIEW_H * 0.45 + i * 24);
    });
    ctx.restore();
  }

  // Retângulos dos cartões de evolução (também usados para o mouse)
  cardRects() {
    const n = game.upgradeChoices.length;
    const w = Math.min(260, (VIEW_W - 120) / 3 - 20), h = 330, gap = 28;
    const total = n * w + (n - 1) * gap, x0 = (VIEW_W - total) / 2, y = VIEW_H * 0.24;
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: x0 + i * (w + gap), y, w, h });
    return out;
  }

  drawUpgrade(ctx, t) {
    this.overlay(ctx, 0.82);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 14px ${FONT_TITLE}`; ctx.fillStyle = PAL.accent;
    ctx.letterSpacing = '4px';
    ctx.fillText(`${ROOM_DEFS[game.waves.roomIndex].name.toUpperCase()} · LIBERADO`, VIEW_W / 2, VIEW_H * 0.09);
    ctx.font = `bold 38px ${FONT_TITLE}`;
    glowText(ctx, 'ESCOLHA UMA EVOLUÇÃO', VIEW_W / 2, VIEW_H * 0.155, '#eef5ff', 'rgba(40,120,255,0.85)', 18);
    ctx.letterSpacing = '0px';
    if (game.lostMemory) {
      ctx.font = `italic 14px ${FONT_UI}`; ctx.fillStyle = '#ff5c7a';
      ctx.fillText('Um fragmento de memória ficou para trás. Ele se perdeu para sempre.', VIEW_W / 2, VIEW_H * 0.205);
    }
    const rects = this.cardRects();
    game.upgradeChoices.forEach((u, i) => {
      const r = rects[i], sel = i === game.upgradeSel;
      const lift = sel ? -10 - Math.sin(t * 4) * 2 : 0;
      const lvl = game.upgrades.level(u.id);
      ctx.save();
      ctx.translate(0, lift);
      const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
      g.addColorStop(0, sel ? '#0e2246' : '#0a1426'); g.addColorStop(1, '#03060d');
      ctx.fillStyle = g;
      techPanelPath(ctx, r.x, r.y, r.w, r.h, 16); ctx.fill();
      ctx.lineWidth = sel ? 2.5 : 1.2;
      ctx.strokeStyle = sel ? PAL.accentHi : u.combo ? 'rgba(127,192,255,0.7)' : 'rgba(61,139,255,0.55)';
      if (sel) { ctx.shadowColor = 'rgba(60,140,255,0.9)'; ctx.shadowBlur = 20; }
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Ícone com brilho
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      GlowCache.draw(ctx, u.combo ? '120,200,255' : '50,120,255', r.x + r.w / 2, r.y + 70, 60, sel ? 0.55 : 0.3);
      ctx.restore();
      drawIcon(ctx, u.icon, r.x + r.w / 2, r.y + 70, 54, u.combo ? '#d6ecff' : '#7fc0ff');
      ctx.font = `bold 11px ${FONT_UI}`; ctx.fillStyle = u.combo ? PAL.accentHi : PAL.accent;
      ctx.letterSpacing = '2px';
      ctx.fillText(u.combo ? 'NOVA TÉCNICA' : 'EVOLUÇÃO', r.x + r.w / 2, r.y + 124);
      ctx.letterSpacing = '0px';
      ctx.font = `bold 19px ${FONT_TITLE}`; ctx.fillStyle = '#eef5ff';
      wrapText(ctx, u.name, r.w - 30).forEach((ln, k) => ctx.fillText(ln, r.x + r.w / 2, r.y + 150 + k * 22));
      ctx.font = `14px ${FONT_UI}`; ctx.fillStyle = '#b8c5d8';
      wrapText(ctx, u.desc, r.w - 36).forEach((ln, k) => ctx.fillText(ln, r.x + r.w / 2, r.y + 205 + k * 19));
      // Níveis
      if (u.max > 1) {
        for (let k = 0; k < u.max; k++) {
          ctx.fillStyle = k < lvl ? PAL.accent : k === lvl ? PAL.accentHi : 'rgba(255,255,255,0.15)';
          ctx.beginPath(); ctx.arc(r.x + r.w / 2 + (k - (u.max - 1) / 2) * 16, r.y + r.h - 34, 5, 0, TAU); ctx.fill();
        }
      }
      ctx.font = `bold 13px ${FONT_UI}`; ctx.fillStyle = 'rgba(214,225,240,0.55)';
      ctx.fillText(`[${i + 1}]`, r.x + r.w / 2, r.y + r.h - 14);
      ctx.restore();
    });
    // Rodapé: células, rerolagem e reparo
    const fy = VIEW_H * 0.84;
    ctx.font = `bold 16px ${FONT_UI}`;
    ctx.fillStyle = '#cfe6ff';
    ctx.fillText(`Células de energia: ${game.stats.soulsBank}`, VIEW_W / 2, fy);
    ctx.font = `14px ${FONT_UI}`;
    const canR = game.stats.soulsBank >= game.rerollCost, canH = game.stats.soulsBank >= game.healCost && game.player.hp < game.player.maxHp;
    ctx.fillStyle = canR ? '#c9d3e2' : 'rgba(201,211,226,0.35)';
    ctx.fillText(`[R / X] Recalcular opções — ${game.rerollCost} células`, VIEW_W / 2 - 210, fy + 30);
    ctx.fillStyle = canH ? '#c9d3e2' : 'rgba(201,211,226,0.35)';
    ctx.fillText(`[C / Y] Reparar 40% da vida — ${game.healCost} células`, VIEW_W / 2 + 210, fy + 30);
    ctx.fillStyle = 'rgba(214,225,240,0.6)'; ctx.font = `13px ${FONT_UI}`;
    ctx.fillText('← → escolher   ·   J / Enter confirmar   ·   1 2 3 ou clique', VIEW_W / 2, fy + 60);
    ctx.restore();
  }

  drawEnd(ctx, victory, t) {
    this.overlay(ctx, victory ? 0.74 : 0.8);
    this.drawEmbers(ctx, t);
    const s = game.stats, end = game.ending;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (victory) {
      ctx.font = `bold 15px ${FONT_TITLE}`; ctx.fillStyle = PAL.accent;
      ctx.letterSpacing = '6px';
      ctx.fillText(end ? `FINAL ${end.ending}` : 'FIM', VIEW_W / 2, VIEW_H * 0.08);
      ctx.font = `bold 62px ${FONT_TITLE}`;
      ctx.letterSpacing = '8px';
      glowText(ctx, end ? end.title : 'VITÓRIA', VIEW_W / 2, VIEW_H * 0.155, '#eef5ff', 'rgba(40,120,255,0.95)', 30);
    } else {
      ctx.font = `bold 70px ${FONT_TITLE}`;
      ctx.letterSpacing = '8px';
      glowText(ctx, 'SINAL PERDIDO', VIEW_W / 2, VIEW_H * 0.15, '#ff2e55', 'rgba(255,30,70,0.9)', 30);
    }
    ctx.letterSpacing = '0px';
    ctx.font = `italic 18px ${FONT_UI}`; ctx.fillStyle = 'rgba(214,225,240,0.82)';
    ctx.fillText(victory ? 'Kael Veyron escolheu quem desejava ser. O último eclipse chegou ao fim.'
      : `${ROOM_DEFS[game.waves.roomIndex].name}: a Tempestade Nula se apaga. NEXUS recolhe o que resta de você.`, VIEW_W / 2, VIEW_H * 0.245);
    const rows = [
      ['Tempo', formatTime(s.time)],
      ['Inimigos destruídos', s.kills],
      ['Maior combo', `${game.counter.best} hits`],
      ['Pontuação', Math.round(s.score).toLocaleString('pt-BR')],
      ['Células coletadas', s.soulsTotal],
      ['Memórias recuperadas', `${s.memories} / ${MEMORIES.length}`],
      ['Dano causado', Math.round(s.dmgDealt).toLocaleString('pt-BR')],
      ['Dano recebido', Math.round(s.dmgTaken)],
      ['Setores liberados', `${s.roomsCleared} / 6`],
    ];
    const pw = 460, px = VIEW_W / 2 - pw / 2, py = VIEW_H * 0.3;
    ctx.fillStyle = 'rgba(2,6,14,0.8)';
    techPanelPath(ctx, px, py, pw, rows.length * 30 + 24, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(61,139,255,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = `16px ${FONT_UI}`;
    rows.forEach(([k, v], i) => {
      const y = py + 27 + i * 30;
      ctx.textAlign = 'left'; ctx.fillStyle = '#b8c5d8'; ctx.fillText(k, px + 28, y);
      ctx.textAlign = 'right'; ctx.fillStyle = PAL.accentHi; ctx.fillText(String(v), px + pw - 28, y);
    });
    ctx.textAlign = 'center';
    if (victory) {
      ctx.font = `bold 14px ${FONT_TITLE}`; ctx.fillStyle = PAL.accent;
      ctx.letterSpacing = '3px';
      ctx.fillText('CLASSIFICAÇÃO', px + pw + 100, py + 30);
      ctx.letterSpacing = '0px';
      ctx.font = `bold 96px ${FONT_TITLE}`;
      glowText(ctx, game.rank, px + pw + 100, py + 110, game.rank === 'S' ? '#ffffff' : PAL.accentHi, 'rgba(40,120,255,0.95)', 24);
    }
    if (game.newRecord) {
      ctx.font = `bold 20px ${FONT_TITLE}`;
      glowText(ctx, 'NOVO RECORDE!', VIEW_W / 2, py + rows.length * 30 + 52, PAL.accentHi, 'rgba(60,140,255,0.9)', 14);
    }
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    ctx.font = `bold 19px ${FONT_TITLE}`;
    ctx.letterSpacing = '2px';
    glowText(ctx, 'ENTER — jogar novamente      T — título', VIEW_W / 2, VIEW_H * 0.93, '#eef5ff', 'rgba(40,120,255,0.8)', 10);
    ctx.restore();
  }
}
