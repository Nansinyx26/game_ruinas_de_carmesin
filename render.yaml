# Render (render.com) · servidor de chat e Game Master do Eclipse Zero (pasta servidor/)
# Os valores secretos (MONGODB_URI, EZ_OWNER_CHAVE) NÃO ficam aqui: o Render pede cada um no painel
# (sync: false) e guarda só lá. Veja docs/SERVIDOR_RENDER.md.
services:
  - type: web
    name: eclipse-zero-chat
    runtime: node
    rootDir: servidor
    buildCommand: npm ci --omit=dev
    startCommand: node servidor.mjs
    healthCheckPath: /saude
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EZ_OWNER
        sync: false
      - key: EZ_OWNER_CHAVE
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: EZ_ORIGENS
        value: https://nansinyx26.github.io
