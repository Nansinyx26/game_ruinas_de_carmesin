    ctx.beginPath(); ctx.moveTo(s.hx, s.hy); ctx.lineTo(s.hx - dx / L * 8, s.hy - dy / L * 8); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // Hurtbox e hitbox ativa (F1)
  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.invuln > 0 ? '120,160,255' : '80,255,120');
    const a = this.attack;
    if (this.state === 'attack' && a && a.def) {
      const d = a.def, active = a.t >= d.windup && a.t < d.windup + d.active;
      Hitbox.drawDebug(ctx, d.shape, this.x, this.y, a.dir, active ? '255,40,40' : '255,200,80');
    }
  }
}

// ---------------------------------------------------------------------------
// INIMIGOS — atributos base (escalam com a dificuldade da sala)
// ---------------------------------------------------------------------------
const ENEMY_TYPES = {
  lacaio:      { name: 'Lacaio', hp: 32, radius: 13, speed: 105, mass: 1, dmg: 8, score: 50, souls: [1, 2], orb: 0.12, blood: '110,14,34', height: 34, stunMult: 1 },
  brutamontes: { name: 'Brutamontes', hp: 230, radius: 25, speed: 58, mass: 3.2, dmg: 24, score: 320, souls: [6, 9], orb: 0.6, blood: '96,22,18', height: 66, stunMult: 0.6 },
  atirador:    { name: 'Atirador', hp: 42, radius: 13, speed: 92, mass: 0.9, dmg: 11, score: 120, souls: [2, 4], orb: 0.2, blood: '96,18,90', height: 48, stunMult: 1 },
  agil:        { name: 'Ágil', hp: 46, radius: 12, speed: 165, mass: 0.8, dmg: 13, score: 150, souls: [2, 4], orb: 0.18, blood: '30,80,74', height: 38, stunMult: 1.1 },
};
let ENEMY_ID = 0;

class Enemy extends Entity {
  constructor(type, x, y, level) {
    const T = ENEMY_TYPES[type];
    super(x, y, T.radius);
    this.id = ENEMY_ID++;
    this.type = type; this.T = T; this.level = level;
    this.maxHp = this.hp = Math.round(T.hp * (1 + level * 0.16));
    this.dmg = T.dmg * (1 + level * 0.1);
    this.speed = T.speed * (1 + level * 0.03);
    this.aggro = 1 + level * 0.06;          // reduz recargas em salas avançadas
    this.mass = T.mass;
    this.height = T.height;
    this.stunMult = T.stunMult;
    this.state = 'spawn'; this.stateTime = 0; this.spawnDur = 0.75;
    this.attackCd = rand(0.7, 1.5);
    this.stun = 0;
    this.hpBar = 0;
    this.telegraph = null; this.tgProgress = 0;
    this.hasToken = false;
    this.slotAngle = rand(0, TAU);
    this.strafeDir = chance(0.5) ? 1 : -1;
    this.strafeTimer = rand(1, 2.5);
    this.superArmor = false;
    this.invulnerable = false;
    this.launchable = true;
    this.usesSlots = false;
    this.vulnerable = 1;
    this.hitThisAttack = false;
    this.dodgeCredited = false;
    this.wallCd = 0;
    this.animTime = rand(0, 10);
    this.tmp = { x: 0, y: 0 };
    this.pal = null;
  }

  canBeHit() { return this.alive && this.state !== 'spawn' && this.state !== 'dying' && !this.invulnerable; }
  setState(s) { this.state = s; this.stateTime = 0; }
  releaseToken() { if (this.hasToken) game.director.release(this); }
  interrupt() { this.telegraph = null; this.superArmor = false; this.releaseToken(); }

  update(dt) {
    this.animTime += dt; this.stateTime += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.hpBar > 0) this.hpBar -= dt;
    if (this.attackCd > 0) this.attackCd -= dt * this.aggro;
    if (this.wallCd > 0) this.wallCd -= dt;

    if (this.state === 'spawn') {
      if (Math.random() < 0.4) game.particles.embers(this.x, this.y, 0, 1, '255,40,60', this.radius, 50);
      if (this.stateTime >= this.spawnDur) this.setState('idle');
      return;
    }

    // Corpo no ar (lançado): gravidade, quique e queda
    if (this.z > 0 || this.vz > 0) {
      this.vz -= GRAVITY * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        if (this.vz < -420 && this.state !== 'dying') {
          this.vz = -this.vz * 0.25;
          game.particles.dust(this.x, this.y, 6, 10, 90);
          game.camera.shake(0.06);
          game.audio.play('wallHit');
        } else this.vz = 0;
        if (this.state === 'stun') this.stun = Math.max(this.stun, 0.3);
      }
    }

    if (this.state === 'dying') {
      if (this.stateTime >= 0.45) this.alive = false;
    } else if (this.state === 'stun') {
      this.stun -= dt;
      const k = Math.exp(-10 * dt); this.vx *= k; this.vy *= k;
      if (this.stun <= 0 && this.z <= 0) this.afterStun();
    } else if (this.z <= 0) {
      this.think(dt, game.player);
    }

    // Física: knockback com atrito + colisão com paredes e pilares
    const kd = Math.exp(-7 * dt);
    this.kbx *= kd; this.kby *= kd;
    const kbSpeed = Math.hypot(this.kbx, this.kby);
    this.x += (this.vx + this.kbx) * dt;
    this.y += (this.vy + this.kby) * dt;
    const hitWall = game.room.collide(this, false);
    this.touchingWall = hitWall;
    // Impacto contra a parede quando arremessado com força
    if (hitWall && kbSpeed > 330 && this.wallCd <= 0 && this.state !== 'dying') {
      this.wallCd = 0.4;
      const dmg = Math.round(6 + kbSpeed * 0.012);
      this.kbx *= -0.3; this.kby *= -0.3;
      game.particles.dust(this.x, this.y, 8, 12, 120);
      game.particles.debris(this.x, this.y, 5);
      game.camera.shake(0.12);
      game.audio.play('wallHit');
      this.hp -= dmg; this.flash = 0.1; this.hpBar = 2.5;
      game.texts.spawn(this.x, this.y, this.height, dmg, '#ffb46b', 18);
      game.stats.dmgDealt += dmg;
      if (this.hp <= 0) this.die({ kx: 0, ky: 0 });
      else if (!this.superArmor) { this.stun = Math.max(this.stun, 0.3); if (this.state !== 'stun') { this.interrupt(); this.setState('stun'); } }
    }
  }

  afterStun() { this.setState('idle'); }

  // Move em direção a um ponto com aceleração suave
  moveToward(tx, ty, speed, dt, accel = 900) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
    let tvx = 0, tvy = 0;
    if (d > 4) {
      const s = speed * Math.min(1, d / 40);
      tvx = (dx / d) * s; tvy = (dy / d) * s;
    }
    this.vx = approach(this.vx, tvx, accel * dt);
    this.vy = approach(this.vy, tvy, accel * dt);
  }
  brake(dt, k = 10) { const f = Math.exp(-k * dt); this.vx *= f; this.vy *= f; }
  faceToward(x, y, dt, rate = 10) { this.facing = angleLerp(this.facing, Math.atan2(y - this.y, x - this.x), 1 - Math.exp(-rate * dt)); }

  // Teste de acerto de um ataque inimigo contra o jogador (com detecção de esquiva perfeita)
  strikePlayer(shape, dir, dmg, kb) {
    const p = game.player;
    if (this.hitThisAttack || p.state === 'dead') return false;
    if (!Hitbox.test(shape, this.x, this.y, dir, p.x, p.y, p.radius)) return false;
    if (p.state === 'dash' && p.invuln > 0) {
      if (!this.dodgeCredited) { this.dodgeCredited = true; game.onPerfectDodge(p); }
      return false;
    }
    if (p.takeDamage(dmg, this.x, this.y, kb)) { this.hitThisAttack = true; return true; }
    return false;
  }

  takeHit(h) {
    if (!this.canBeHit()) return false;
    this.hp -= h.dmg;
    this.flash = 0.11;
    this.hpBar = 2.5;
    const armored = this.superArmor && !h.heavy;
    const k = (armored ? 0.12 : 1) / this.mass;
    this.kbx += h.kx * h.kb * k; this.kby += h.ky * h.kb * k;
    if (this.hp <= 0) { this.die(h); return true; }
    if (!armored) {
      if (h.launch > 0 && this.launchable) { this.vz = Math.max(this.vz, h.launch / Math.sqrt(this.mass)); this.z = Math.max(this.z, 1); }
      else if (this.z > 0) this.vz = Math.max(this.vz, 240);   // malabarismo: golpes no ar mantêm o corpo suspenso
      this.interrupt();
      this.stun = Math.max(this.stun, h.stun * this.stunMult);
      this.setState('stun');
    }
    this.onHurt(h);
    return true;
  }
  onHurt() {}

  die(h) {
    this.interrupt();
    this.hp = 0;
    this.setState('dying');
    this.flash = 0.18;
    this.kbx += (h.kx || 0) * 260 / this.mass; this.kby += (h.ky || 0) * 260 / this.mass;
    if (this.launchable) this.vz = Math.max(this.vz, 160);
    game.onEnemyKilled(this);
  }

  // ------------------------------------------------------------------ desenho
  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z;
    ctx.save();
    let rise = 0;
    if (this.state === 'spawn') {
      const k = clamp(this.stateTime / this.spawnDur, 0, 1);
      rise = (1 - easeOutCubic(k)) * (this.height + 6);
      ctx.globalAlpha = 0.3 + 0.7 * k;
      ctx.beginPath(); ctx.rect(sx - 120, sy - 260, 240, 260); ctx.clip();   // emerge do chão
    } else if (this.state === 'dying') {
      ctx.globalAlpha = clamp(1 - this.stateTime / 0.45, 0, 1);
    }
    const pal = this.flash > 0 ? FLASH_PAL : this.pal;
    this.drawBody(ctx, sx, sy + rise, pal);
    ctx.restore();
    // Atordoamento forte: estrelas girando sobre a cabeça
    if (this.state === 'stun' && this.stun > 0.25 && this.z <= 0) {
      for (let i = 0; i < 3; i++) {
        const a = this.animTime * 7 + (i * TAU) / 3;
        game.addGlow(ctx, sx + Math.cos(a) * 10, sy - this.height - 8 + Math.sin(a) * 3, 6, '255,220,120', 0.8);
      }
    }
  }

  // Barra de vida pequena sobre a cabeça (desenhada após a iluminação)
  drawHpBar(ctx) {
    if (this.hpBar <= 0 || this.state === 'dying' || this.state === 'spawn') return;
    const w = this.radius > 20 ? 52 : 32;
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z - this.height - 14;
    const a = Math.min(1, this.hpBar * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, 6);
    ctx.fillStyle = '#c8102e';
    ctx.fillRect(sx - w / 2, sy, w * clamp(this.hp / this.maxHp, 0, 1), 4);
    ctx.globalAlpha = 1;
  }

  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.canBeHit() ? '80,255,120' : '120,120,120');
    if (this.atkShape && (this.state === 'attack' || this.state === 'dash')) {
      Hitbox.drawDebug(ctx, this.atkShape, this.x, this.y, this.atkDir, '255,140,40');
    }
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z - this.height - 22;
    ctx.fillStyle = this.hasToken ? '#ffd679' : '#9fe';
    ctx.font = `10px ${FONT_UI}`; ctx.textAlign = 'center';
    ctx.fillText(`${this.state}${this.superArmor ? '*' : ''}`, sx, sy);
  }

  // Lado para o qual o inimigo olha na tela (+1 direita, -1 esquerda)
  screenSide() { return worldAngleToScreen(this.facing, this.tmp).x >= 0 ? 1 : -1; }
}

// ---------------------------------------------------------------------------
// LACAIO: fraco, vem em grupo e cerca o jogador
// ---------------------------------------------------------------------------
class Minion extends Enemy {
  constructor(x, y, level) {
    super('lacaio', x, y, level);
    this.usesSlots = true;
    this.ring = rand(70, 105);
    this.pal = { body: '#3f2d4a', dark: '#1d1424', horn: '#c9b79a', eye: '#ff2a3a', claw: '#e0d6c4' };
    this.atkShape = { type: 'arc', range: 50, arc: 0.95 };
    this.atkDir = 0;
  }
  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    switch (this.state) {
      case 'idle': {
        // Vai para o seu ângulo de cerco; com "ficha" de ataque avança até o jogador
        const r = this.hasToken ? 0 : this.ring;
        const tx = p.x + Math.cos(this.slotAngle) * r, ty = p.y + Math.sin(this.slotAngle) * r;
        this.moveToward(tx, ty, this.speed * (this.hasToken ? 1.15 : 1), dt);
        this.faceToward(p.x, p.y, dt);
        if (this.attackCd <= 0 && d < 150 && !this.hasToken) game.director.request(this);
        if (this.hasToken && d < 62) {
          this.setState('windup');
          this.atkDir = Math.atan2(p.y - this.y, p.x - this.x);
          this.facing = this.atkDir;
          this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 52, dir: this.atkDir, arc: 0.95 };
        }
        if (this.hasToken && this.stateTime > 3) { this.releaseToken(); this.attackCd = 0.8; this.stateTime = 0; }
        break;
      }
      case 'windup': {
        this.brake(dt);
        const dur = 0.42 / Math.min(1.3, this.aggro);
        this.tgProgress = this.stateTime / dur;
        this.telegraph.x = this.x; this.telegraph.y = this.y;
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.setState('attack');
          game.audio.play('swing', 0.6);
        }
        break;
      }
      case 'attack':
        this.vx = Math.cos(this.atkDir) * 300; this.vy = Math.sin(this.atkDir) * 300;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 230);
        if (this.stateTime >= 0.12) this.setState('recover');
        break;
      case 'recover':
        this.brake(dt, 12);
        if (this.stateTime >= 0.42) {
          this.releaseToken();
          this.attackCd = rand(1.1, 1.9);
          this.setState(chance(0.35) ? 'retreat' : 'idle');
        }
        break;
      case 'retreat': {
        const a = Math.atan2(this.y - p.y, this.x - p.x);
        this.moveToward(this.x + Math.cos(a) * 80, this.y + Math.sin(a) * 80, this.speed * 0.9, dt);
        this.faceToward(p.x, p.y, dt);
        if (this.stateTime >= 0.5) this.setState('idle');
        break;
      }
    }
  }
  onHurt() { if (chance(0.25)) this.attackCd = Math.max(this.attackCd, 0.5); }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 20;
    const hop = moving ? Math.abs(Math.sin(t * 14)) * 3 : Math.sin(t * 3) * 0.6;
    let lean = 0, reach = 0;
    if (this.state === 'windup') lean = -4 * side * Math.min(1, this.tgProgress);
    else if (this.state === 'attack') { lean = 6 * side; reach = 10; }
    const run = moving ? Math.sin(t * 14) * 4 : 0;
    ctx.save();
    ctx.translate(sx, sy - hop);
    // Pernas
    ctx.strokeStyle = pal.dark; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-6 + run, 0); ctx.moveTo(4, -10); ctx.lineTo(6 - run, 0); ctx.stroke();
    // Corpo curvado
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.ellipse(lean + side * 2, -17, 10, 11, side * 0.35, 0, TAU); ctx.fill();
    // Espinhos nas costas
    ctx.fillStyle = pal.dark;
    for (let i = 0; i < 3; i++) {
      const bx = lean - side * (5 - i * 2), by = -24 + i * 4;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - side * 6, by - 3); ctx.lineTo(bx - side * 1, by + 3); ctx.closePath(); ctx.fill();
    }
    // Braço com garras
    const ax = lean + side * 6, ay = -18, cx = lean + side * (14 + reach), cy = -12;
    ctx.strokeStyle = pal.body; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.strokeStyle = pal.claw; ctx.lineWidth = 1.4;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + side * 5, cy + i * 3 + 1); ctx.stroke(); }
    // Cabeça, chifres e olhos
    const hx = lean + side * 8, hy = -27;
    ctx.fillStyle = pal.horn;
    ctx.beginPath(); ctx.moveTo(hx - 4, hy - 4); ctx.lineTo(hx - 7 - side * 2, hy - 12); ctx.lineTo(hx - 1, hy - 5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 2, hy - 5); ctx.lineTo(hx + 4 + side * 3, hy - 13); ctx.lineTo(hx + 5, hy - 3); ctx.fill();
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.arc(hx, hy, 6.5, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.fillRect(hx + side * 1.5 - 1, hy - 1.5, 2.2, 2.2);
    ctx.fillRect(hx + side * 4.5 - 1, hy - 1.2, 2, 2);
    if (pal === this.pal) game.addGlow(ctx, hx + side * 3, hy - 0.5, 7, '255,40,50', 0.7);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// BRUTAMONTES: lento, muita vida, golpes pesados com aviso (super armadura)
// ---------------------------------------------------------------------------
class Brute extends Enemy {
  constructor(x, y, level) {
    super('brutamontes', x, y, level);
    this.launchable = false;
    this.pal = { skin: '#5b3a32', skinDark: '#3a221d', armor: '#2a2930', armorHi: '#4a4954', trim: '#b48a35',
      horn: '#d8c49a', eye: '#ffae2a', club: '#3d2e26', spike: '#a2a2ae' };
    this.atkShape = { type: 'arc', range: 128, arc: 1.0 };
    this.atkDir = 0;
    this.move = 'slam';
  }
  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    switch (this.state) {
      case 'idle':
        this.moveToward(p.x, p.y, this.speed, dt, 400);
        this.faceToward(p.x, p.y, dt, 4);
        if (this.attackCd <= 0 && d < 125) {
          this.move = d < 72 && chance(0.45) ? 'stomp' : 'slam';
          this.atkDir = Math.atan2(p.y - this.y, p.x - this.x);
          this.facing = this.atkDir;
          if (this.move === 'slam') {
            this.atkShape = { type: 'arc', range: 128, arc: 1.0 };
            this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 128, dir: this.atkDir, arc: 1.0 };
          } else {
            this.atkShape = { type: 'circle', radius: 100, offset: 0 };
            this.telegraph = { kind: 'circle', x: this.x, y: this.y, r: 100 };
          }
          this.superArmor = true;
          this.setState('windup');
          game.audio.play('telegraph');
        }
        break;
      case 'windup': {
        this.brake(dt, 6);
        const dur = (this.move === 'slam' ? 0.95 : 0.8) / Math.min(1.25, this.aggro);
        // Rastreia o jogador na primeira metade do aviso, depois trava a direção
        if (this.stateTime < dur * 0.45 && this.move === 'slam') {
          this.atkDir = angleLerp(this.atkDir, Math.atan2(p.y - this.y, p.x - this.x), 1 - Math.exp(-3 * dt));
          this.facing = this.atkDir;
        }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.setState('attack');
          this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 460);
          const ix = this.move === 'slam' ? this.x + Math.cos(this.atkDir) * 70 : this.x;
          const iy = this.move === 'slam' ? this.y + Math.sin(this.atkDir) * 70 : this.y;
          game.particles.ring(ix, iy, this.move === 'slam' ? 90 : 110, '255,150,70', 0.4, 9);
          game.particles.debris(ix, iy, 12);
          game.particles.dust(ix, iy, 12, 14, 150);
          game.camera.shake(0.38);
          game.audio.play('stomp');
          game.room.addScorch(ix, iy, 46);
        }
        break;
      }
      case 'attack':
        this.brake(dt);
        if (this.stateTime >= 0.12) { this.superArmor = false; this.setState('recover'); }
        break;
      case 'recover':
        this.brake(dt);
        if (this.stateTime >= 0.85) { this.attackCd = rand(1.4, 2.2); this.setState('idle'); }
        break;
    }
  }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 12;
    const step = moving ? Math.sin(t * 6) : 0;
    const breathe = Math.sin(t * 2) * 1.2;
    let clubA = -2.2, shake = 0;   // ângulo do porrete (tela), negativo = erguido
    if (this.state === 'windup') { clubA = -2.9; shake = Math.sin(t * 60) * 1.5 * this.tgProgress; }
    else if (this.state === 'attack' || this.state === 'recover') clubA = 0.6;
    if (this.move === 'stomp' && this.state === 'windup') clubA = -1.7;
    ctx.save();
    ctx.translate(sx + shake, sy - Math.abs(step) * 2);
    // Pernas grossas
    ctx.fillStyle = pal.skinDark;
    ctx.fillRect(-15 + step * 3, -24, 11, 24);
    ctx.fillRect(4 - step * 3, -24, 11, 24);
    ctx.fillStyle = pal.armor;
    ctx.fillRect(-17 + step * 3, -6, 14, 6);
    ctx.fillRect(3 - step * 3, -6, 14, 6);
    // Tronco massivo
    ctx.fillStyle = pal.skin;
    ctx.beginPath();
    ctx.moveTo(-17, -22); ctx.lineTo(17, -22); ctx.lineTo(26, -56 - breathe); ctx.lineTo(-26, -56 - breathe);
    ctx.closePath(); ctx.fill();
    // Placa peitoral com rebites dourados
    ctx.fillStyle = pal.armor;
    ctx.beginPath();
    ctx.moveTo(-14, -26); ctx.lineTo(14, -26); ctx.lineTo(19, -50 - breathe); ctx.lineTo(-19, -50 - breathe);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.armorHi;
    ctx.fillRect(-side * 16, -48 - breathe, 6, 20);
    ctx.fillStyle = pal.trim;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 10, -46 - breathe, 1.8, 0, TAU); ctx.fill(); }
    ctx.fillRect(-15, -29, 30, 3);
    // Braço de trás
    ctx.fillStyle = pal.skinDark;
    ctx.beginPath(); ctx.ellipse(-side * 24, -44 - breathe, 8, 12, 0, 0, TAU); ctx.fill();
    // Cabeça pequena com chifres dourados
    const hx = side * 4, hy = -62 - breathe;
    ctx.fillStyle = pal.horn;
    ctx.beginPath(); ctx.moveTo(hx - 8, hy - 2); ctx.quadraticCurveTo(hx - 20, hy - 8, hx - 16, hy - 20); ctx.lineTo(hx - 5, hy - 6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 8, hy - 2); ctx.quadraticCurveTo(hx + 20, hy - 8, hx + 16, hy - 20); ctx.lineTo(hx + 5, hy - 6); ctx.fill();
    ctx.fillStyle = pal.armor;
    ctx.beginPath(); ctx.arc(hx, hy, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.fillRect(hx + side * 2 - 5, hy - 1, 3.5, 2.5);
    ctx.fillRect(hx + side * 2 + 1, hy - 1, 3.5, 2.5);
    if (pal === this.pal) game.addGlow(ctx, hx + side * 2, hy, 10, '255,160,40', 0.75);
    // Braço da frente com o porrete cravejado
    const shx = side * 22, shy = -48 - breathe;
    const ca = side > 0 ? clubA : Math.PI - clubA;
    const cx = shx + Math.cos(ca) * 46, cy = shy + Math.sin(ca) * 46;
    ctx.strokeStyle = pal.skin; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(shx + Math.cos(ca) * 14, shy + Math.sin(ca) * 14); ctx.stroke();
    ctx.strokeStyle = pal.club; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(shx + Math.cos(ca) * 10, shy + Math.sin(ca) * 10); ctx.lineTo(cx, cy); ctx.stroke();
    ctx.fillStyle = pal.club;
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.spike;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + t * 0.2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 9, cy + Math.sin(a) * 9);
      ctx.lineTo(cx + Math.cos(a + 0.25) * 15, cy + Math.sin(a + 0.25) * 15);
      ctx.lineTo(cx + Math.cos(a + 0.5) * 9, cy + Math.sin(a + 0.5) * 9);
      ctx.fill();
    }
    if (this.state === 'windup' && pal === this.pal) game.addGlow(ctx, cx, cy, 20 + 14 * this.tgProgress, '255,90,40', 0.35 + 0.4 * this.tgProgress);
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// ATIRADOR: mantém distância, recua e dispara projéteis
// ---------------------------------------------------------------------------
class Shooter extends Enemy {
  constructor(x, y, level) {
    super('atirador', x, y, level);
    this.pal = { robe: '#2b1d3f', robeDark: '#170f24', trim: '#8a2f9f', face: '#050308', eye: '#ff4fd8', staff: '#5a4630', orb: '#ff63e0' };
    this.prefer = rand(230, 290);
    this.aim = 0;
    this.attackCd = rand(1.2, 2.2);
  }
  think(dt, p) {
    const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy) || 1;
    const toP = Math.atan2(dy, dx);
    switch (this.state) {
      case 'idle': {
        this.strafeTimer -= dt;
        if (this.strafeTimer <= 0) { this.strafeTimer = rand(1.2, 2.6); this.strafeDir *= -1; }
        // Recuar se o jogador está perto, aproximar se está longe, senão rodear
        let radial = 0;
        if (d < 170) radial = -1; else if (d > 340) radial = 1;
        const sxv = -dy / d * this.strafeDir, syv = dx / d * this.strafeDir;
        const mx = (dx / d) * radial + sxv * (radial ? 0.45 : 1);
        const my = (dy / d) * radial + syv * (radial ? 0.45 : 1);
        const ml = Math.hypot(mx, my) || 1;
        const sp = this.speed * (radial < 0 ? 1.15 : 0.8);
        this.vx = approach(this.vx, (mx / ml) * sp, 700 * dt);
        this.vy = approach(this.vy, (my / ml) * sp, 700 * dt);
        this.faceToward(p.x, p.y, dt);
        if (this.attackCd <= 0 && d < 480) {
          this.aim = toP;
          this.setState('windup');
          this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: toP, len: Math.min(d, 420), w: 5 };
        }
        break;
      }
      case 'windup': {
        this.brake(dt, 8);
        const dur = 0.65 / Math.min(1.25, this.aggro);
        if (this.stateTime < dur * 0.7) this.aim = angleLerp(this.aim, toP, 1 - Math.exp(-8 * dt));
        this.facing = this.aim;
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.aim, len: Math.min(d, 420) });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.fire();
          this.setState('recover');
        }
        break;
      }
      case 'recover':
        this.brake(dt, 6);
        if (this.stateTime >= 0.4) { this.attackCd = rand(1.9, 2.8); this.setState('idle'); }
        break;
    }
  }
  fire() {
    const n = this.level >= 3 ? 3 : 1, spread = 0.26, sp = 300 + this.level * 18;
    for (let i = 0; i < n; i++) {
      const a = this.aim + (i - (n - 1) / 2) * spread;
      game.projectiles.spawn({
        x: this.x + Math.cos(a) * 16, y: this.y + Math.sin(a) * 16, z: 34,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 9, dmg: this.dmg, hostile: true, kind: 'orb', life: 2.4,
      });
    }
    game.particles.flash(this.x + Math.cos(this.aim) * 16, this.y + Math.sin(this.aim) * 16, 40, 30, '255,90,220', 0.12);
    game.audio.play('shoot');
  }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const hover = 4 + Math.sin(t * 3) * 2;
    ctx.save();
    ctx.translate(sx, sy - hover);
    // Manto em forma de sino
    ctx.fillStyle = pal.robeDark;
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.quadraticCurveTo(-10, -26, -1, -40); ctx.quadraticCurveTo(10, -26, 14, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.robe;
    ctx.beginPath(); ctx.moveTo(-11, 0); ctx.quadraticCurveTo(-7, -24, 0, -38); ctx.quadraticCurveTo(side * 6, -22, 6, 0); ctx.closePath(); ctx.fill();
    // Barra rasgada com detalhe violeta
    ctx.strokeStyle = pal.trim; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const x = -14 + i * 28 / 6, y = -1 + (i % 2) * 3 + Math.sin(t * 4 + i) * 1; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    // Capuz com rosto oculto e olhos brilhantes
    ctx.fillStyle = pal.robe;
    ctx.beginPath(); ctx.arc(side * 1, -40, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(side * 1 - 6, -47); ctx.lineTo(side * 1 - side * 4, -56); ctx.lineTo(side * 1 + 6, -46); ctx.fill();
    ctx.fillStyle = pal.face;
    ctx.beginPath(); ctx.ellipse(side * 4, -39, 5, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.fillRect(side * 4 - 3, -40, 2, 1.8); ctx.fillRect(side * 4 + 1, -40, 2, 1.8);
    if (pal === this.pal) game.addGlow(ctx, side * 4, -39, 7, '255,80,220', 0.7);
    // Cajado com orbe
    const stx = side * 13;
    ctx.strokeStyle = pal.staff; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(stx, -2); ctx.lineTo(stx, -50); ctx.stroke();
    const charge = this.state === 'windup' ? this.tgProgress : 0;
    ctx.fillStyle = pal.orb;
    ctx.beginPath(); ctx.arc(stx, -54, 4 + charge * 3, 0, TAU); ctx.fill();
    if (pal === this.pal) game.addGlow(ctx, stx, -54, 12 + charge * 22, '255,70,220', 0.5 + charge * 0.5);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// ÁGIL: rápido, rodeia o jogador e faz investidas telegrafadas
// ---------------------------------------------------------------------------
class Agile extends Enemy {
  constructor(x, y, level) {
    super('agil', x, y, level);
    this.pal = { body: '#1e2a2f', bodyHi: '#3a5058', scarf: '#a3122a', blade: '#cfd8e3', eye: '#ffe066', dark: '#0e1518' };
    this.orbit = rand(150, 190);
    this.atkShape = { type: 'circle', radius: 14, offset: 0 };
    this.atkDir = 0;
    this.dashTarget = 0;
  }
  think(dt, p) {
    const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy) || 1;
    switch (this.state) {
      case 'idle': {
        // Órbita ao redor do jogador
        this.strafeTimer -= dt;
        if (this.strafeTimer <= 0) { this.strafeTimer = rand(0.8, 2); if (chance(0.5)) this.strafeDir *= -1; }
        const a = Math.atan2(this.y - p.y, this.x - p.x) + this.strafeDir * 0.9;
        const tx = p.x + Math.cos(a) * this.orbit, ty = p.y + Math.sin(a) * this.orbit;
        this.moveToward(tx, ty, this.speed, dt, 1200);
        this.faceToward(p.x, p.y, dt, 12);
        if (this.attackCd <= 0 && d < 300 && game.director.request(this)) {
          this.atkDir = Math.atan2(dy, dx);
          this.setState('windup');
          this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: this.atkDir, len: Math.min(d + 70, 330), w: 16 };
          game.audio.play('telegraph');
        }
        break;
      }
      case 'windup': {
        this.brake(dt, 12);
        const dur = 0.42 / Math.min(1.25, this.aggro);
        if (this.stateTime < dur * 0.6) {
          // Mira com leve antecipação do movimento do jogador
          const lx = p.x + p.vx * 0.15, ly = p.y + p.vy * 0.15;
          this.atkDir = angleLerp(this.atkDir, Math.atan2(ly - this.y, lx - this.x), 1 - Math.exp(-10 * dt));
          this.dashTarget = Math.min(dist(this.x, this.y, lx, ly) + 70, 330);
        }
        this.facing = this.atkDir;
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir, len: this.dashTarget || 200 });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.hitThisAttack = false; this.dodgeCredited = false;
          this.dashStartX = this.x; this.dashStartY = this.y;
          this.setState('dash');
          game.audio.play('dash');
        }
        break;
      }
      case 'dash': {
        const sp = 760;
        this.vx = Math.cos(this.atkDir) * sp; this.vy = Math.sin(this.atkDir) * sp;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 300);
        if (Math.random() < 0.7) game.particles.emit(P.DUST, this.x, this.y, 10, 0, 0, 10, 0.3, 7, '60,90,96', 0, 0);
        const traveled = dist(this.x, this.y, this.dashStartX, this.dashStartY);
        if (traveled >= (this.dashTarget || 250) || this.stateTime > 0.45) { this.setState('recover'); this.vx *= 0.3; this.vy *= 0.3; }
        break;
      }
      case 'recover':
        this.brake(dt, 7);
        if (this.stateTime >= 0.6) { this.releaseToken(); this.attackCd = rand(1.3, 2.1); this.setState('idle'); }
        break;
      case 'evade': {
        // Salto para trás após ser atingido
        if (this.stateTime >= 0.35) this.setState('idle');
        break;
      }
    }
  }
  afterStun() {
    if (chance(0.4)) {
      const p = game.player, a = Math.atan2(this.y - p.y, this.x - p.x);
      this.vx = Math.cos(a) * 330; this.vy = Math.sin(a) * 330; this.vz = 260; this.z = 1;
      this.setState('evade');
    } else this.setState('idle');
  }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const moving = Math.hypot(this.vx, this.vy) > 30;
    let crouch = 0, stretch = 0;
    if (this.state === 'windup') crouch = 6 * Math.min(1, this.tgProgress);
    if (this.state === 'dash') stretch = 1;
    const run = moving ? Math.sin(t * 18) * 4 : 0;
    ctx.save();
    ctx.translate(sx, sy);
    // Cachecol esvoaçante
    ctx.strokeStyle = pal.scarf; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(side * 3, -28 + crouch);
    ctx.quadraticCurveTo(-side * 12, -30 + crouch + Math.sin(t * 10) * 3, -side * (22 + stretch * 10), -24 + crouch + Math.sin(t * 12) * 4);
    ctx.stroke();
    // Pernas dobradas
    ctx.strokeStyle = pal.dark; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-2, -14 + crouch); ctx.lineTo(-7 + run, -7 + crouch * 0.5); ctx.lineTo(-4 + run, 0);
    ctx.moveTo(3, -14 + crouch); ctx.lineTo(8 - run, -7 + crouch * 0.5); ctx.lineTo(5 - run, 0);
    ctx.stroke();
    // Tronco esguio inclinado
    ctx.fillStyle = pal.body;
    ctx.beginPath();
    ctx.moveTo(-4, -13 + crouch); ctx.lineTo(5, -13 + crouch);
    ctx.lineTo(side * (8 + stretch * 6), -30 + crouch); ctx.lineTo(side * (1 + stretch * 6) - side * 6, -31 + crouch);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.bodyHi;
    ctx.fillRect(side * (3 + stretch * 4) - 1, -28 + crouch, 2, 12);
    // Cabeça e olhos
    const hx = side * (7 + stretch * 8), hy = -35 + crouch;
    ctx.fillStyle = pal.body;
    ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.eye;
    ctx.fillRect(hx + side * 1.5 - 1, hy - 1.5, 3, 1.6);
    if (pal === this.pal) game.addGlow(ctx, hx + side * 1.5, hy - 1, 7, '255,220,90', 0.7);
    // Braços-lâmina
    const bladeA = this.state === 'dash' ? 0.15 : this.state === 'windup' ? -2.2 : 0.9;
    for (let i = 0; i < 2; i++) {
      const ox = side * (2 + i * 4), oy = -24 + crouch + i * 3;
      const a = side > 0 ? bladeA + i * 0.35 : Math.PI - bladeA - i * 0.35;
      const len = 22 + stretch * 6;
      ctx.fillStyle = pal.blade;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(a - 0.12) * len * 0.5, oy + Math.sin(a - 0.12) * len * 0.5);
      ctx.lineTo(ox + Math.cos(a) * len, oy + Math.sin(a) * len);
      ctx.lineTo(ox + Math.cos(a + 0.12) * len * 0.4, oy + Math.sin(a + 0.12) * len * 0.4);
      ctx.closePath(); ctx.fill();
    }
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// DIRETOR DE IA: distribui posições de cerco e limita atacantes simultâneos
// ---------------------------------------------------------------------------
class AIDirector {
  constructor() { this.tokens = new Set(); this.maxTokens = 2; this.list = []; }
  reset(level) { this.tokens.clear(); this.maxTokens = 2 + Math.floor(level / 2); }
  request(e) {
    if (e.hasToken) return true;
    for (const t of this.tokens) if (!t.alive || t.state === 'dying') { this.tokens.delete(t); t.hasToken = false; }
    if (this.tokens.size < this.maxTokens) { this.tokens.add(e); e.hasToken = true; return true; }
    return false;
  }
  release(e) { this.tokens.delete(e); e.hasToken = false; }
  update() {
    const p = game.player, list = this.list;
    list.length = 0;
    for (const e of game.enemies) if (e.usesSlots && e.alive && e.state !== 'dying' && e.state !== 'spawn') list.push(e);
    const n = list.length;
    if (!n) return;
    for (const e of list) e.ang = Math.atan2(e.y - p.y, e.x - p.x);
    list.sort((a, b) => a.ang - b.ang);
    // Ângulos igualmente espaçados, alinhados à posição média atual (estável)
    const step = TAU / n;
    let off = 0;
    for (let i = 0; i < n; i++) off += angleDiff(list[0].ang + i * step, list[i].ang);
    const base = list[0].ang + off / n;
    for (let i = 0; i < n; i++) list[i].slotAngle = base + i * step;
  }
}

// Fábrica de inimigos
function createEnemy(type, x, y, level) {
  switch (type) {
    case 'lacaio': return new Minion(x, y, level);
    case 'brutamontes': return new Brute(x, y, level);
    case 'atirador': return new Shooter(x, y, level);
    case 'agil': return new Agile(x, y, level);
  }
  return new Minion(x, y, level);
}

// ---------------------------------------------------------------------------
// Dano genérico ao jogador vindo de perigos de área (com esquiva perfeita)
// ---------------------------------------------------------------------------
function damagePlayerFrom(src, x, y, dmg, kb) {
  const p = game.player;
  if (p.state === 'dead') return false;
  if (p.state === 'dash' && p.invuln > 0) {
    if (!src.dodgeCredited) { src.dodgeCredited = true; game.onPerfectDodge(p); }
    return false;
  }
  return p.takeDamage(dmg, x, y, kb);
}

// ---------------------------------------------------------------------------
// PERIGOS DE ÁREA do chefe: pilares de fogo, meteoros e ondas de choque
// ---------------------------------------------------------------------------
class HazardSystem {
  constructor() { this.list = []; }
  clear() { this.list.length = 0; }
  add(h) {
    h.t = 0; h.fired = false; h.fx = 0; h.hit = false; h.dodgeCredited = false;
    this.list.push(h);
    return h;
  }
  update(dt) {
    const p = game.player;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const h = this.list[i];
      h.t += dt;
      if (h.kind === 'ring') {
        // Onda de choque expansiva: atinge quem estiver sobre a borda
        const k = h.t / h.dur;
        h.radius = lerp(h.r0, h.r1, easeOutCubic(Math.min(1, k)));
        if (!h.hit && Math.abs(dist(h.x, h.y, p.x, p.y) - h.radius) <= h.w + p.radius) {
          if (damagePlayerFrom(h, h.x, h.y, h.dmg, 320)) h.hit = true;
        }
        if (k >= 1) this.list.splice(i, 1);
        continue;
      }
      // Pilares e meteoros: aviso no chão e depois a explosão
      if (!h.fired && h.t >= h.delay) {
        h.fired = true;
        if (dist(h.x, h.y, p.x, p.y) <= h.r + p.radius) damagePlayerFrom(h, h.x, h.y, h.dmg, 300);
        const P_ = game.particles;
        if (h.kind === 'pillar') {
          P_.flash(h.x, h.y, 30, 70, '255,120,40', 0.25);
          P_.embers(h.x, h.y, 0, 14, '255,110,30', h.r * 0.6, 260);
          P_.sparks(h.x, h.y, 10, -Math.PI / 2, 8, '255,170,80', 300, Math.PI);
          game.audio.play('fireball');
        } else {
          P_.flash(h.x, h.y, 10, 90, '255,140,60', 0.28);
          P_.ring(h.x, h.y, h.r * 1.3, '255,120,50', 0.45, 10);
          P_.debris(h.x, h.y, 10, '80,50,40');
          P_.dust(h.x, h.y, 10, 16, 160);
          P_.embers(h.x, h.y, 0, 10, '255,90,30', h.r * 0.5, 120);
          game.camera.shake(0.18);
          game.audio.play('explosion');
        }
        game.room.addScorch(h.x, h.y, h.r * 0.8);
      }
      if (h.fired) {
        h.fx += dt;
        if (h.fx >= 0.5) this.list.splice(i, 1);
      }
    }
  }
  // Camada emissiva (depois da iluminação)
  draw(ctx, time) {
    for (const h of this.list) {
      const sx = isoX(h.x, h.y), sy = isoY(h.x, h.y);
      if (h.kind === 'ring') {
        const a = 1 - h.t / h.dur;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba('255,90,40', 0.35 * a);
        ctx.lineWidth = h.w * 2.4;
        ctx.beginPath(); ctx.ellipse(sx, sy, Math.max(0.5, h.radius * ISO_RX), Math.max(0.5, h.radius * ISO_RY), 0, 0, TAU); ctx.stroke();
        ctx.strokeStyle = rgba('255,210,140', 0.85 * a);
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
        continue;
      }
      if (!h.fired) {
        drawTelegraph(ctx, { kind: 'circle', x: h.x, y: h.y, r: h.r }, h.t / h.delay, time, h.kind === 'pillar' ? '255,80,30' : '255,40,40');
        if (h.kind === 'meteor') {
          // Rocha em chamas caindo do céu no final do aviso
          const rem = h.delay - h.t;
          if (rem < 0.55) {
            const z = (rem / 0.55) * 460;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            GlowCache.draw(ctx, '255,120,40', sx + z * 0.25, sy - z, 30, 0.9);
            GlowCache.draw(ctx, '255,230,160', sx + z * 0.25, sy - z, 12, 1);
            ctx.restore();
          }
        }
      } else {
        const a = 1 - h.fx / 0.5;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        if (h.kind === 'pillar') {
          // Coluna de fogo formada por brilhos empilhados
          for (let i = 0; i < 8; i++) {
            const yy = sy - i * 16 * (0.6 + a * 0.6);
            GlowCache.draw(ctx, i < 3 ? '255,200,120' : '255,90,30', sx + Math.sin(time * 20 + i) * 3, yy, (34 - i * 3) * (0.6 + a * 0.5), a);
          }
        } else {
          GlowCache.drawFlat(ctx, '255,110,40', sx, sy, h.r * 1.8, a);
        }
        ctx.restore();
      }
    }
  }
}

// ---------------------------------------------------------------------------
// CHEFE: Malakar, o Arauto Carmesim — 3 fases, ataques telegrafados
// ---------------------------------------------------------------------------
const BOSS_MOVES = {
  1: ['sweep', 'jump', 'burst'],
  2: ['sweep', 'jump', 'burst', 'charge', 'pillars'],
  3: ['sweep', 'jump', 'burst', 'charge', 'pillars', 'spiral', 'meteor'],
};

class Boss extends Enemy {
  constructor(x, y) {
    super('brutamontes', x, y, 5);
    this.type = 'chefe';
    this.isBoss = true;
    this.name = 'MALAKAR, O ARAUTO CARMESIM';
    this.T = Object.assign({}, ENEMY_TYPES.brutamontes, { score: 6000, souls: [40, 50], orb: 0, blood: '120,24,10', height: 128 });
    this.maxHp = this.hp = 2600;
    this.radius = 38; this.mass = 14; this.height = 128;
    this.dmg = 22; this.speed = 92;
    this.launchable = false; this.stunMult = 0;
    this.phase = 1;
    this.maxPoise = 260; this.poise = 260; this.sinceHit = 0;
    this.invulnerable = true;
    this.state = 'intro'; this.stateTime = 0;
    this.jumpZ = 0;
    this.lastMove = null;
    this.idleTime = 1;
    this.casts = 0; this.fireTimer = 0; this.spiralA = 0; this.wave = 0;
    this.touchingWall = false;
    this.pal = { armor: '#231c24', armorHi: '#463a48', crack: '#ff4a1c', cape: '#5c0a14', trim: '#c9963a',
      horn: '#e6d3ac', eye: '#ff3b1f', blade: '#6a6474', edge: '#ff6a2a', skin: '#140f16' };
  }

  canBeHit() { return this.alive && this.state !== 'dying' && !this.invulnerable; }

  update(dt) {
    if (this.state === 'dying') {
      this.stateTime += dt; this.animTime += dt;
      if (this.flash > 0) this.flash -= dt;
      // Explosões em cadeia durante a morte
      if (Math.random() < dt * 14) {
        const ox = this.x + rand(-40, 40), oy = this.y + rand(-40, 40);
        game.particles.flash(ox, oy, rand(20, 110), rand(30, 70), '255,120,50', 0.2);
        game.particles.sparks(ox, oy, 60, rand(0, TAU), 6, '255,200,120', 380, Math.PI);
        game.particles.embers(ox, oy, 40, 4, '255,80,30', 30, 140);
        game.audio.play('explosion');
        game.camera.shake(0.1);
      }
      if (this.stateTime >= 2.4) { this.alive = false; game.onBossDefeated(this); }
      return;
    }
    this.sinceHit += dt;
    if (this.sinceHit > 2 && this.state !== 'stagger') this.poise = Math.min(this.maxPoise, this.poise + 45 * dt);
    super.update(dt);
  }

  takeHit(h) {
    if (!this.canBeHit()) return false;
    this.hp -= h.dmg;
    this.flash = 0.08;
    this.sinceHit = 0;
    this.kbx += h.kx * h.kb * 0.03; this.kby += h.ky * h.kb * 0.03;
    if (this.hp <= 0) { this.hp = 0; this.die(h); return true; }
    if (this.state !== 'stagger' && this.state !== 'transition') {
      this.poise -= h.dmg;
      if (this.poise <= 0) this.enterStagger();
    }
    const r = this.hp / this.maxHp;
    if (this.phase === 1 && r <= 0.66) this.startTransition(2);
    else if (this.phase === 2 && r <= 0.33) this.startTransition(3);
    return true;
  }

  die() {
    this.interrupt();
    this.setState('dying');
    this.invulnerable = true;
    this.jumpZ = 0;
    game.hazards.clear();
    game.projectiles.clearHostile(true);
    game.onEnemyKilled(this);
    game.onBossDying(this);
  }

  enterStagger() {
    this.interrupt();
    this.jumpZ = 0;
    this.setState('stagger');
    this.vulnerable = 1.3;
    this.poise = this.maxPoise;
    game.texts.spawn(this.x, this.y, 150, 'ATORDOADO!', '#ffd679', 30, 1.2);
    game.audio.play('hitHeavy');
    game.camera.shake(0.3);
    game.particles.ring(this.x, this.y, 90, '255,214,120', 0.5, 8);
  }

  roar() {
    game.audio.play('bossRoar');
    game.camera.shake(0.7);
    game.particles.ring(this.x, this.y, 260, '255,60,40', 0.8, 14);
    game.particles.ring(this.x, this.y, 160, '255,200,120', 0.5, 8);
    game.particles.dust(this.x, this.y, 18, 18, 260);
    // Empurra o jogador sem causar dano
    const p = game.player, d = dist(this.x, this.y, p.x, p.y) || 1;
    if (d < 300) { p.kbx += ((p.x - this.x) / d) * 700; p.kby += ((p.y - this.y) / d) * 700; }
  }

  startTransition(ph) {
    this.phase = ph;
    this.interrupt();
    this.jumpZ = 0;
    this.vulnerable = 1;
    this.setState('transition');
    this.invulnerable = true;
    this.poise = this.maxPoise;
    this.speed *= 1.12;
    this.summoned = false;
    game.projectiles.clearHostile(true);
    game.hud.message(ph === 2 ? 'A CHAMA DESPERTA' : 'A FÚRIA DO ARAUTO', ph === 2 ? 'FASE II' : 'FASE III', 2.2, false, true);
    this.roar();
  }

  // Escolhe o próximo ataque conforme a fase e a distância (sem repetir o anterior)
  chooseAttack(d) {
    const moves = BOSS_MOVES[this.phase];
    const w = {
      sweep: d < 190 ? 5 : 0.5, jump: d > 160 ? 3 : 1.5, burst: 2.2,
      charge: d > 220 ? 3.5 : 1, pillars: d > 180 ? 3 : 1.5, spiral: 2.2, meteor: 2,
    };
    let total = 0;
    for (const m of moves) if (m !== this.lastMove) total += w[m];
    let r = Math.random() * total, pick_ = moves[0];
    for (const m of moves) {
      if (m === this.lastMove) continue;
      r -= w[m];
      if (r <= 0) { pick_ = m; break; }
    }
    this.lastMove = pick_;
    this.startMove(pick_);
  }

  // Duração das preparações diminui a cada fase
  wind(base) { return base * (this.phase === 1 ? 1 : this.phase === 2 ? 0.85 : 0.72); }

  startMove(m) {
    const p = game.player;
    const toP = Math.atan2(p.y - this.y, p.x - this.x);
    this.atkDir = toP; this.facing = toP;
    this.hitThisAttack = false; this.dodgeCredited = false;
    switch (m) {
      case 'sweep':
        this.atkShape = { type: 'arc', range: 178, arc: 1.25 };
        this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 178, dir: toP, arc: 1.25 };
        this.setState('sweep_windup');
        break;
      case 'jump':
        this.setState('jump_windup');
        break;
      case 'burst':
        this.setState('burst_windup');
        this.wave = 0;
        break;
      case 'charge':
        this.atkShape = { type: 'circle', radius: 50, offset: 0 };
        this.telegraph = { kind: 'line', x: this.x, y: this.y, dir: toP, len: 560, w: 46 };
        this.setState('charge_windup');
        break;
      case 'pillars':
        this.setState('pillars');
        this.casts = 0; this.fireTimer = 0.2;
        break;
      case 'spiral':
        this.setState('spiral');
        this.spiralA = toP; this.fireTimer = 0;
        break;
      case 'meteor':
        this.setState('meteor');
        this.casts = 0;
        break;
    }
    game.audio.play('telegraph');
  }

  think(dt, p) {
    const d = dist(this.x, this.y, p.x, p.y);
    const toP = Math.atan2(p.y - this.y, p.x - this.x);
    switch (this.state) {
      case 'intro':
        this.brake(dt);
        if (this.stateTime > 0.9 && !this.roared) { this.roared = true; this.roar(); }
        if (Math.random() < 0.5) game.particles.embers(this.x, this.y, 0, 1, '255,60,30', 40, 90);
        if (this.stateTime >= 2.8) { this.invulnerable = false; this.setState('idle'); this.idleTime = 0.6; }
        break;

      case 'idle':
        if (d > 110) this.moveToward(p.x, p.y, this.speed, dt, 500); else this.brake(dt, 6);
        this.faceToward(p.x, p.y, dt, 5);
        if (this.stateTime >= this.idleTime) this.chooseAttack(d);
        break;

      case 'recover':
        this.brake(dt, 8);
        if (this.stateTime >= this.recoverTime) {
          this.setState('idle');
          this.idleTime = rand(0.45, 1.0) * (this.phase === 3 ? 0.6 : 1);
        }
        break;

      // ----- Corte amplo em cone
      case 'sweep_windup': {
        this.brake(dt, 8);
        const dur = this.wind(0.8);
        if (this.stateTime < dur * 0.5) { this.atkDir = angleLerp(this.atkDir, toP, 1 - Math.exp(-4 * dt)); this.facing = this.atkDir; }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.setState('sweep');
          this.strikePlayer(this.atkShape, this.atkDir, this.dmg, 420);
          game.audio.play('swingHeavy');
          game.camera.shake(0.25);
          const tr = game.trails.create('255,70,30', '255,220,160', 0.2);
          for (let i = 0; i <= 14; i++) {
            const a = this.atkDir - 1.25 + (2.5 * i) / 14;
            tr.add(this.x + Math.cos(a) * 40, this.y + Math.sin(a) * 40, this.x + Math.cos(a) * 175, this.y + Math.sin(a) * 175, 40, (14 - i) * 0.008);
          }
          tr.release();
        }
        break;
      }
      case 'sweep':
        this.brake(dt);
        if (this.stateTime >= 0.15) {
          // Na fase 3 o corte vem em dupla
          if (this.phase === 3 && !this.secondSweep) {
            this.secondSweep = true;
            this.hitThisAttack = false; this.dodgeCredited = false;
            this.atkDir = toP;
            this.telegraph = { kind: 'cone', x: this.x, y: this.y, r: 178, dir: toP, arc: 1.25 };
            this.setState('sweep_windup');
            this.stateTime = this.wind(0.8) * 0.35;
          } else {
            this.secondSweep = false;
            this.recoverTime = this.phase === 1 ? 0.75 : 0.55;
            this.setState('recover');
          }
        }
        break;

      // ----- Salto esmagador com onda de choque
      case 'jump_windup':
        this.brake(dt, 10);
        if (this.stateTime >= this.wind(0.45)) {
          this.jumpFromX = this.x; this.jumpFromY = this.y;
          this.jumpToX = p.x; this.jumpToY = p.y;
          this.telegraph = { kind: 'circle', x: p.x, y: p.y, r: 118 };
          this.invulnerable = true;
          this.setState('jump');
          game.audio.play('jump');
          game.particles.dust(this.x, this.y, 12, 16, 180);
        }
        break;
      case 'jump': {
        const dur = 0.85;
        const k = Math.min(1, this.stateTime / dur);
        this.x = lerp(this.jumpFromX, this.jumpToX, easeInOut(k));
        this.y = lerp(this.jumpFromY, this.jumpToY, easeInOut(k));
        this.vx = this.vy = 0;
        this.jumpZ = Math.sin(k * Math.PI) * 190;
        this.tgProgress = k;
        if (k >= 1) {
          this.jumpZ = 0;
          this.invulnerable = false;
          this.telegraph = null;
          this.atkShape = { type: 'circle', radius: 118, offset: 0 };
          this.strikePlayer(this.atkShape, 0, this.dmg + 6, 480);
          game.hazards.add({ kind: 'ring', x: this.x, y: this.y, r0: 60, r1: 320, dur: 0.75, w: 14, dmg: 14 });
          if (this.phase >= 2) game.hazards.add({ kind: 'ring', x: this.x, y: this.y, r0: 20, r1: 280, dur: 1.05, w: 12, dmg: 14 });
          game.particles.ring(this.x, this.y, 140, '255,140,60', 0.4, 12);
          game.particles.debris(this.x, this.y, 22, '70,55,60');
          game.particles.dust(this.x, this.y, 22, 20, 260);
          game.particles.flash(this.x, this.y, 10, 130, '255,150,80', 0.2);
          game.camera.shake(0.7);
          game.camera.zoomPunch(0.04);
          game.audio.play('stomp');
          game.audio.play('explosion');
          game.room.addScorch(this.x, this.y, 110);
          this.recoverTime = this.phase === 1 ? 1.0 : 0.75;
          this.setState('recover');
        }
        break;
      }

      // ----- Explosão de projéteis em anel
      case 'burst_windup': {
        this.brake(dt, 8);
        const dur = this.wind(0.75);
        this.tgProgress = this.stateTime / dur;
        if (Math.random() < 0.6) game.particles.converge(this.x, this.y, 70, 2, 120, '255,90,40', 0.4);
        if (this.stateTime >= dur) { this.setState('burst'); this.fireBurst(); }
        break;
      }
      case 'burst':
        this.brake(dt, 8);
        if (this.phase >= 2 && this.wave < 2 && this.stateTime >= 0.32 * this.wave) { this.fireBurst(); }
        if (this.stateTime >= 0.75) { this.recoverTime = 0.55; this.setState('recover'); }
        break;

      // ----- Investida pela arena
      case 'charge_windup': {
        this.brake(dt, 10);
        const dur = this.wind(0.8);
        if (this.stateTime < dur * 0.6) { this.atkDir = angleLerp(this.atkDir, toP, 1 - Math.exp(-6 * dt)); this.facing = this.atkDir; }
        this.tgProgress = this.stateTime / dur;
        Object.assign(this.telegraph, { x: this.x, y: this.y, dir: this.atkDir });
        if (this.stateTime >= dur) {
          this.telegraph = null;
          this.chargeFromX = this.x; this.chargeFromY = this.y;
          this.touchingWall = false;
          this.setState('charging');
          game.audio.play('dash');
          game.audio.play('swingHeavy');
        }
        break;
      }
      case 'charging': {
        this.vx = Math.cos(this.atkDir) * 920; this.vy = Math.sin(this.atkDir) * 920;
        this.strikePlayer(this.atkShape, this.atkDir, this.dmg + 4, 520);
        if (Math.random() < 0.8) game.particles.dust(this.x, this.y, 1, 16, 60);
        const traveled = dist(this.x, this.y, this.chargeFromX, this.chargeFromY);
        if (this.touchingWall && this.stateTime > 0.08) {
          // Bate na parede: tremor forte e fica vulnerável por um instante
          this.vx = this.vy = 0;
          game.camera.shake(0.6);
          game.particles.debris(this.x, this.y, 18);
          game.particles.dust(this.x, this.y, 14, 18, 200);
          game.audio.play('stomp');
          this.recoverTime = 1.2;
          this.setState('recover');
        } else if (traveled >= 560 || this.stateTime > 0.9) {
          this.vx *= 0.3; this.vy *= 0.3;
          this.recoverTime = 0.7;
          this.setState('recover');
        }
        break;
      }

      // ----- Pilares de fogo sob o jogador
      case 'pillars': {
        this.brake(dt, 8);
        this.fireTimer -= dt;
        const total = this.phase === 3 ? 7 : 5;
        if (this.fireTimer <= 0 && this.casts < total) {
          this.casts++;
          this.fireTimer = 0.3;
          game.hazards.add({ kind: 'pillar', x: p.x + p.vx * 0.2, y: p.y + p.vy * 0.2, r: 54, delay: 0.75, dmg: 18 });
        }
        if (this.casts >= total && this.stateTime > total * 0.3 + 0.4) { this.recoverTime = 0.5; this.setState('recover'); }
        break;
      }

      // ----- Espiral de projéteis (fase 3)
      case 'spiral': {
        this.brake(dt, 8);
        this.fireTimer -= dt;
        this.spiralA += dt * 2.1;
        if (this.stateTime > 0.5 && this.fireTimer <= 0 && this.stateTime < 3.1) {
          this.fireTimer = 0.1;
          for (let k = 0; k < 3; k++) {
            const a = this.spiralA + (k * TAU) / 3;
            game.projectiles.spawn({ x: this.x + Math.cos(a) * 34, y: this.y + Math.sin(a) * 34, z: 60,
              vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 10, dmg: 12, hostile: true, kind: 'fire', life: 3 });
          }
          game.audio.play('fireball');
        }
        if (this.stateTime >= 3.4) { this.recoverTime = 0.6; this.setState('recover'); }
        break;
      }

      // ----- Chuva de meteoros (fase 3)
      case 'meteor':
        this.brake(dt, 8);
        if (this.stateTime >= 0.8 && this.casts === 0) {
          this.casts = 1;
          const room = game.room;
          for (let i = 0; i < 10; i++) {
            const pt = room.randomPoint(40);
            game.hazards.add({ kind: 'meteor', x: pt.x, y: pt.y, r: 62, delay: rand(0.9, 1.7), dmg: 22 });
          }
          game.hazards.add({ kind: 'meteor', x: p.x, y: p.y, r: 62, delay: 1.0, dmg: 22 });
          game.hazards.add({ kind: 'meteor', x: p.x + p.vx * 0.5, y: p.y + p.vy * 0.5, r: 62, delay: 1.5, dmg: 22 });
          game.camera.shake(0.3);
        }
        if (this.stateTime >= 1.6) { this.recoverTime = 0.6; this.setState('recover'); }
        break;

      // ----- Transição de fase: rugido, invocação de lacaios
      case 'transition':
        this.brake(dt, 10);
        if (this.stateTime >= 1.2 && !this.summoned) {
          this.summoned = true;
          const adds = this.phase === 2 ? ['lacaio', 'lacaio', 'lacaio', 'lacaio'] : ['lacaio', 'lacaio', 'agil', 'agil', 'atirador'];
          for (const t of adds) {
            const pt = game.room.randomPoint(60, game.player, 200);
            game.waves.spawnEnemy(t, pt.x, pt.y, 4);
          }
        }
        if (this.stateTime >= 2.4) { this.invulnerable = false; this.setState('idle'); this.idleTime = 0.3; }
        break;

      // ----- Atordoado (poise quebrado)
      case 'stagger':
        this.brake(dt, 10);
        if (this.stateTime >= 1.8) { this.vulnerable = 1; this.setState('idle'); this.idleTime = 0.2; }
        break;
    }
  }

  fireBurst() {
    const n = this.phase === 1 ? 12 : this.phase === 2 ? 16 : 20;
    const off = this.wave * (Math.PI / n);
    for (let i = 0; i < n; i++) {
      const a = off + (i / n) * TAU;
      game.projectiles.spawn({ x: this.x + Math.cos(a) * 40, y: this.y + Math.sin(a) * 40, z: 60,
        vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 11, dmg: 13, hostile: true, kind: 'fire', life: 3 });
    }
    this.wave++;
    game.particles.flash(this.x, this.y, 70, 90, '255,110,40', 0.2);
    game.camera.shake(0.2);
    game.audio.play('fireball');
    game.audio.play('explosion');
  }

  drawShadow(ctx) {
    const k = 1 - Math.min(0.6, this.jumpZ / 300);
    ctx.fillStyle = `rgba(0,0,0,${(0.55 * k).toFixed(3)})`;
    isoCirclePath(ctx, this.x, this.y, this.radius * 1.15 * k);
    ctx.fill();
  }

  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.jumpZ;
    ctx.save();
    let rise = 0;
    if (this.state === 'intro') {
      const k = clamp(this.stateTime / 1.4, 0, 1);
      rise = (1 - easeOutCubic(k)) * 140;
      ctx.beginPath(); ctx.rect(sx - 200, sy - 400, 400, 400); ctx.clip();
    }
    if (this.state === 'dying') ctx.globalAlpha = clamp(1 - (this.stateTime - 1.6) / 0.8, 0, 1);
    this.drawBody(ctx, sx, sy + rise, this.flash > 0 ? FLASH_PAL : this.pal);
    ctx.restore();
  }

  drawBody(ctx, sx, sy, pal) {
    const side = this.screenSide(), t = this.animTime;
    const st = this.state;
    const moving = Math.hypot(this.vx, this.vy) > 20;
    const step = moving ? Math.sin(t * 5) : 0;
    const breathe = Math.sin(t * 1.8) * 2;
    const kneel = st === 'stagger' ? 22 : st === 'jump_windup' ? 12 : 0;
    const shakeX = (st === 'transition' || st === 'burst_windup') ? Math.sin(t * 50) * 2 : 0;
    const flame = this.phase >= 2;
    const glowOn = pal === this.pal;

    ctx.save();
    ctx.translate(sx + shakeX, sy);

    // Aura da fase 3
    if (this.phase === 3 && glowOn) game.addGlow(ctx, 0, -10, 120, '255,30,20', 0.35 + 0.1 * Math.sin(t * 6), true);

    // Capa esfarrapada
    ctx.fillStyle = pal.cape;
    ctx.beginPath();
    ctx.moveTo(-30, -104 + kneel);
    ctx.lineTo(30, -104 + kneel);
    for (let i = 0; i <= 8; i++) {
      const x = 38 - i * 9.5 - side * 6, y = -8 + (i % 2) * 10 + Math.sin(t * 3 + i) * 3;
      ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();

    // Pernas blindadas
    ctx.fillStyle = pal.armor;
    ctx.fillRect(-26 + step * 5, -50 + kneel, 20, 50 - kneel * 0.5);
    ctx.fillRect(6 - step * 5, -50 + kneel, 20, 50 - kneel * 0.5);
    ctx.fillStyle = pal.armorHi;
    ctx.fillRect(-26 + step * 5, -50 + kneel, 5, 44);
    ctx.fillStyle = pal.trim;
    ctx.fillRect(-28 + step * 5, -30 + kneel, 24, 3);
    ctx.fillRect(4 - step * 5, -30 + kneel, 24, 3);

    // Torso com rachaduras incandescentes e núcleo no peito
    const ty = -50 + kneel, top = -112 + kneel - breathe;
    ctx.fillStyle = pal.armor;
    ctx.beginPath();
    ctx.moveTo(-26, ty); ctx.lineTo(26, ty); ctx.lineTo(40, top + 10); ctx.lineTo(24, top); ctx.lineTo(-24, top); ctx.lineTo(-40, top + 10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.armorHi;
    ctx.beginPath();
    ctx.moveTo(-side * 26, ty); ctx.lineTo(-side * 14, ty); ctx.lineTo(-side * 22, top + 4); ctx.lineTo(-side * 38, top + 10);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.crack;
    ctx.lineWidth = this.phase === 3 ? 2.4 : 1.5;
    ctx.beginPath();
    ctx.moveTo(-12, ty - 6); ctx.lineTo(-6, ty - 22); ctx.lineTo(-14, ty - 34);
    ctx.moveTo(14, ty - 4); ctx.lineTo(8, ty - 18); ctx.lineTo(16, ty - 30); ctx.lineTo(10, ty - 44);
    if (this.phase >= 2) { ctx.moveTo(-20, top + 14); ctx.lineTo(-8, top + 24); ctx.moveTo(22, top + 12); ctx.lineTo(12, top + 26); }
    ctx.stroke();
    const coreY = top + 30;
    ctx.fillStyle = pal.crack;
    ctx.beginPath(); ctx.arc(0, coreY, 7, 0, TAU); ctx.fill();
    if (glowOn) {
      const charge = st === 'burst_windup' ? this.tgProgress : 0;
      game.addGlow(ctx, 0, coreY, 26 + charge * 40 + this.phase * 4, '255,80,30', 0.75 + charge * 0.25, true);
    }

    // Ombreiras com espinhos
    for (const s of [-1, 1]) {
      ctx.fillStyle = pal.armor;
      ctx.beginPath(); ctx.ellipse(s * 38, top + 12, 16, 11, s * 0.3, 0, TAU); ctx.fill();
      ctx.strokeStyle = pal.trim; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(s * 38, top + 12, 16, 11, s * 0.3, Math.PI, TAU); ctx.stroke();
      ctx.fillStyle = pal.horn;
      ctx.beginPath(); ctx.moveTo(s * 32, top + 2); ctx.lineTo(s * 40, top - 16); ctx.lineTo(s * 44, top + 4); ctx.fill();
    }

    // Elmo com chifres e olhos em brasa
    const hx = side * 3, hy = top - 12;
    ctx.fillStyle = pal.horn;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(hx + s * 10, hy - 4);
      ctx.quadraticCurveTo(hx + s * 34, hy - 10, hx + s * 30, hy - 40);
      ctx.quadraticCurveTo(hx + s * 26, hy - 18, hx + s * 6, hy - 10);
      ctx.fill();
    }
    ctx.fillStyle = pal.armor;
    ctx.beginPath(); ctx.arc(hx, hy, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.armorHi;
    ctx.beginPath(); ctx.arc(hx - side * 4, hy - 4, 5, 0, TAU); ctx.fill();
    ctx.fillStyle = this.phase === 3 ? '#fff1c0' : pal.eye;
    ctx.fillRect(hx + side * 3 - 8, hy - 1, 6, 3);
    ctx.fillRect(hx + side * 3 + 2, hy - 1, 6, 3);
    if (glowOn) game.addGlow(ctx, hx + side * 3, hy, 16, this.phase === 3 ? '255,220,150' : '255,60,30', 0.9, true);

    // Montante (espada gigante): ângulo conforme o estado
    let a = 0.9;
    if (st === 'sweep_windup') a = -2.5 + this.tgProgress * -0.3;
    else if (st === 'sweep') a = 1.2;
    else if (st === 'jump' || st === 'jump_windup' || st === 'meteor' || st === 'pillars') a = -1.57;
    else if (st === 'charge_windup' || st === 'charging') a = 0.15;
    else if (st === 'stagger') a = 1.45;
    else if (st === 'burst_windup' || st === 'spiral' || st === 'transition') a = -1.2 + Math.sin(t * 3) * 0.2;
    const ang = side > 0 ? a : Math.PI - a;
    const shx = side * 34, shy = top + 22;
    const L = 118;
    const bx = shx + Math.cos(ang) * L, by = shy + Math.sin(ang) * L;
    const nx = -Math.sin(ang), ny = Math.cos(ang);
    ctx.strokeStyle = pal.armor; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(shx, shy); ctx.lineTo(shx + Math.cos(ang) * 16, shy + Math.sin(ang) * 16); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = pal.blade;
    ctx.beginPath();
    ctx.moveTo(shx + Math.cos(ang) * 18 + nx * 7, shy + Math.sin(ang) * 18 + ny * 7);
    ctx.lineTo(bx + nx * 3, by + ny * 3);
    ctx.lineTo(bx + Math.cos(ang) * 14, by + Math.sin(ang) * 14);
    ctx.lineTo(bx - nx * 3, by - ny * 3);
    ctx.lineTo(shx + Math.cos(ang) * 18 - nx * 7, shy + Math.sin(ang) * 18 - ny * 7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.edge; ctx.lineWidth = flame ? 2.5 : 1.2;
    ctx.beginPath(); ctx.moveTo(shx + Math.cos(ang) * 20 + nx * 6, shy + Math.sin(ang) * 20 + ny * 6); ctx.lineTo(bx + Math.cos(ang) * 14, by + Math.sin(ang) * 14); ctx.stroke();
    ctx.strokeStyle = pal.trim; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(shx + Math.cos(ang) * 18 + nx * 14, shy + Math.sin(ang) * 18 + ny * 14); ctx.lineTo(shx + Math.cos(ang) * 18 - nx * 14, shy + Math.sin(ang) * 18 - ny * 14); ctx.stroke();
    if (flame && glowOn) {
      // Lâmina em chamas a partir da fase 2
      for (let i = 1; i <= 5; i++) {
        const k = i / 5;
        game.addGlow(ctx, lerp(shx, bx, k) + Math.sin(t * 17 + i) * 2, lerp(shy, by, k) - 4, 16 + Math.sin(t * 23 + i * 2) * 4, '255,100,30', 0.5, true);
      }
    }
    ctx.restore();
  }

  drawDebug(ctx) {
    drawHurtbox(ctx, this.x, this.y, this.radius, this.canBeHit() ? '80,255,120' : '120,120,120');
    if (this.atkShape && (this.state === 'sweep' || this.state === 'charging')) Hitbox.drawDebug(ctx, this.atkShape, this.x, this.y, this.atkDir, '255,140,40');
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.height - 30;
    ctx.fillStyle = '#ffd679'; ctx.font = `11px ${FONT_UI}`; ctx.textAlign = 'center';
    ctx.fillText(`${this.state} F${this.phase} poise:${Math.round(this.poise)}`, sx, sy);
  }
}

// ---------------------------------------------------------------------------
// PROJÉTEIS com pooling (inimigos e jogador)
// ---------------------------------------------------------------------------
class ProjectileSystem {
  constructor(max = 320) {
    this.items = [];
    for (let i = 0; i < max; i++) {
      this.items.push({ x: 0, y: 0, z: 0, vx: 0, vy: 0, r: 8, dmg: 0, hostile: true, kind: 'orb',
        life: 0, max: 1, pierce: false, hits: new Set(), dodgeCredited: false, angle: 0 });
    }
    this.count = 0;
  }
  spawn(o) {
    if (this.count >= this.items.length) return null;
    const p = this.items[this.count++];
    p.x = o.x; p.y = o.y; p.z = o.z || 30; p.vx = o.vx; p.vy = o.vy; p.r = o.r || 8;
    p.dmg = o.dmg || 10; p.hostile = o.hostile !== false; p.kind = o.kind || 'orb';
    p.life = p.max = o.life || 2; p.pierce = !!o.pierce;
    p.hits.clear(); p.dodgeCredited = false;
    p.angle = Math.atan2(p.vy, p.vx);
    return p;
  }
  color(p) {
    switch (p.kind) {
      case 'orb': return '255,70,220';
      case 'fire': return '255,110,30';
      case 'crescent': return '255,214,130';
      default: return '255,50,60';
    }
  }
  burst(p) {
    const c = this.color(p);
    game.particles.sparks(p.x, p.y, p.z, p.angle + Math.PI, 7, c, 260, Math.PI);
    game.particles.flash(p.x, p.y, p.z, 26, c, 0.12);
  }
  kill(i, fx) {
    const p = this.items[i];
    if (fx) this.burst(p);
    const last = this.count - 1;
    if (i !== last) { this.items[i] = this.items[last]; this.items[last] = p; }
    this.count--;
  }
  clear() { this.count = 0; }
  clearHostile(fx) {
    for (let i = this.count - 1; i >= 0; i--) if (this.items[i].hostile) this.kill(i, fx);
  }

  update(dt) {
    const pl = game.player;
    outer:
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.kill(i, p.hostile); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'fire' && Math.random() < 0.35) game.particles.emit(P.EMBER, p.x, p.y, p.z, -p.vx * 0.1, -p.vy * 0.1, 20, 0.35, 2, '255,120,40', 0, 1);
      if (game.room.blocksPoint(p.x, p.y, p.r * 0.4)) { this.kill(i, true); continue; }
      if (p.hostile) {
        const rr = p.r + pl.radius;
        if (pl.state !== 'dead' && dist2(p.x, p.y, pl.x, pl.y) < rr * rr) {
          if (pl.state === 'dash' && pl.invuln > 0) {
            if (!p.dodgeCredited) { p.dodgeCredited = true; game.onPerfectDodge(pl); }
            continue;
          }
          if (pl.takeDamage(p.dmg, p.x - p.vx * 0.05, p.y - p.vy * 0.05, 200)) { this.kill(i, true); continue; }
        }
      } else {
        for (const e of game.enemies) {
          if (!e.canBeHit() || p.hits.has(e)) continue;
          const rr = p.r + e.radius;
          if (dist2(p.x, p.y, e.x, e.y) < rr * rr) {
            p.hits.add(e);
            const l = Math.hypot(p.vx, p.vy) || 1, kx = p.vx / l, ky = p.vy / l;
            const dmg = Math.max(1, Math.round(p.dmg * (e.vulnerable || 1) * rand(0.9, 1.1)));
            if (e.takeHit({ dmg, kx, ky, kb: 220, launch: 0, stun: 0.3, heavy: false, crit: false })) {
              game.onEnemyHit(e, dmg, false, PROJ_HIT_DEF, kx, ky);
            }
            if (!p.pierce) { this.kill(i, true); continue outer; }
          }
        }
      }
    }
  }

  // Golpes do jogador destroem (aparam) projéteis inimigos
  slashTest(shape, ox, oy, dir) {
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      if (p.hostile && Hitbox.test(shape, ox, oy, dir, p.x, p.y, p.r)) {
        game.onDeflect(p);
        this.kill(i, true);
      }
    }
  }

  drawShadows(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      ctx.beginPath();
      ctx.ellipse(isoX(p.x, p.y), isoY(p.x, p.y), p.r * 1.1, p.r * 0.55, 0, 0, TAU);
      ctx.fill();
    }
  }

  addLights(lighting) {
    for (let i = 0; i < this.count && i < 40; i++) {
      const p = this.items[i];
      lighting.add(isoX(p.x, p.y), isoY(p.x, p.y) - p.z * 0.5, p.kind === 'crescent' ? 140 : 80, 0.55);
    }
  }

  // Camada emissiva
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z;
      const fade = Math.min(1, p.life / 0.15);
      switch (p.kind) {
        case 'orb':
          GlowCache.draw(ctx, '255,60,210', sx, sy, p.r * 3.4, 0.85 * fade);
          GlowCache.draw(ctx, '255,220,250', sx, sy, p.r * 1.3, fade);
          break;
        case 'fire': {
          const sv = worldAngleToScreen(p.angle, game.tmpV);
          for (let k = 3; k >= 1; k--) GlowCache.draw(ctx, '255,90,20', sx - sv.x * k * 6, sy - sv.y * k * 6, p.r * (2.6 - k * 0.4), 0.35 * fade);
          GlowCache.draw(ctx, '255,130,40', sx, sy, p.r * 3.2, 0.8 * fade);
          GlowCache.draw(ctx, '255,240,190', sx, sy, p.r * 1.2, fade);
          break;
        }
        case 'crescent':
        case 'blade': {
          // Lâmina em forma de crescente orientada pela velocidade
          const sv = worldAngleToScreen(p.angle, game.tmpV);
          const a = Math.atan2(sv.y, sv.x);
          const isC = p.kind === 'crescent';
          const R = isC ? 30 : 18;
          ctx.globalAlpha = fade;
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(a);
          ctx.scale(1, isC ? 1 : 0.6);
          ctx.fillStyle = isC ? 'rgba(255,214,130,0.75)' : 'rgba(255,60,70,0.8)';
          ctx.beginPath();
          ctx.arc(0, 0, R, -1.2, 1.2);
          ctx.arc(-R * 0.45, 0, R * 0.8, 1.0, -1.0, true);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(255,250,235,0.9)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, R, -1.1, 1.1); ctx.stroke();
          ctx.restore();
          GlowCache.draw(ctx, isC ? '255,200,110' : '255,50,60', sx, sy, R * 2.2, 0.5 * fade);
          break;
        }
      }
    }
    ctx.restore();
  }

  drawDebug(ctx) {
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      drawHurtbox(ctx, p.x, p.y, p.r, p.hostile ? '255,90,220' : '120,220,255');
    }
  }
}

// ---------------------------------------------------------------------------
// COLETÁVEIS: almas (moeda) e orbes de vida
// ---------------------------------------------------------------------------
class PickupSystem {
  constructor(max = 260) {
    this.items = [];
    for (let i = 0; i < max; i++) this.items.push({ kind: 'soul', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, value: 1, life: 0, t: 0, attract: false, pull: 0 });
    this.count = 0;
  }
  drop(kind, x, y, value) {
    if (this.count >= this.items.length) return;
    const p = this.items[this.count++];
    const a = Math.random() * TAU, s = rand(40, 150);
    p.kind = kind; p.x = x; p.y = y; p.z = 20;
    p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s; p.vz = rand(200, 320);
    p.value = value; p.life = kind === 'health' ? 16 : 9999; p.t = 0; p.attract = false; p.pull = 0;
  }
  attractAll() { for (let i = 0; i < this.count; i++) this.items[i].attract = true; }
  clear() { this.count = 0; }
  kill(i) {
    const last = this.count - 1, p = this.items[i];
    if (i !== last) { this.items[i] = this.items[last]; this.items[last] = p; }
    this.count--;
  }
  update(dt) {
    const pl = game.player;
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      p.t += dt; p.life -= dt;
      if (p.life <= 0) { this.kill(i); continue; }
      // Física simples com quique
      p.vz -= 900 * dt; p.z += p.vz * dt;
      if (p.z < 0) { p.z = 0; p.vz = Math.abs(p.vz) > 70 ? -p.vz * 0.4 : 0; }
      const dx = pl.x - p.x, dy = pl.y - p.y, d = Math.hypot(dx, dy) || 1;
      const magnet = p.kind === 'soul' ? pl.stats.magnet : 60 + pl.stats.magnet * 0.25;
      if (pl.state !== 'dead' && p.t > 0.45 && (p.attract || d < magnet)) {
        // Atração acelerada em direção ao jogador
        p.pull = Math.min(1, p.pull + dt * 2.5);
        const sp = 260 + 640 * p.pull;
        p.vx = lerp(p.vx, (dx / d) * sp, 1 - Math.exp(-10 * dt));
        p.vy = lerp(p.vy, (dy / d) * sp, 1 - Math.exp(-10 * dt));
        p.z = Math.max(p.z, 12);
      } else {
        const k = Math.exp(-3 * dt); p.vx *= k; p.vy *= k;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.x = clamp(p.x, 6, game.room.w - 6); p.y = clamp(p.y, 6, game.room.h - 6);
      if (pl.state !== 'dead' && p.t > 0.35 && d < pl.radius + 12) {
        if (p.kind === 'soul') game.collectSoul(p.value, p.x, p.y);
        else {
          pl.heal(Math.round(p.value * pl.stats.healMult));
          game.audio.play('health');
          game.particles.flash(p.x, p.y, 20, 40, '255,60,80', 0.15);
        }
        this.kill(i);
      }
    }
  }
  draw(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      const bob = p.z <= 0.1 ? 6 + Math.sin(time * 4 + i) * 3 : 0;
      const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z - bob;
      const blink = p.kind === 'health' && p.life < 3 && Math.floor(p.life * 8) % 2 === 0 ? 0.3 : 1;
      if (p.kind === 'soul') {
        GlowCache.draw(ctx, '255,200,90', sx, sy, 14, 0.7);
        GlowCache.draw(ctx, '255,250,220', sx, sy - 2 + Math.sin(time * 12 + i) * 1.5, 5, 1);
      } else {
        GlowCache.draw(ctx, '255,30,60', sx, sy, 22 * blink + 6, 0.8 * blink);
        GlowCache.draw(ctx, '255,200,210', sx - 2, sy - 2, 6, blink);
      }
      GlowCache.drawFlat(ctx, p.kind === 'soul' ? '255,190,80' : '255,40,60', sx, isoY(p.x, p.y), 14, 0.25);
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// SALAS: layout, pré-renderização do chão/paredes e colisões
// ---------------------------------------------------------------------------
const ROOM_DEFS = [
  { name: 'Átrio Desabado', sub: 'SALA I', tiles: 12, pillars: 3,
    waves: [{ lacaio: 5 }, { lacaio: 7 }] },
  { name: 'Claustro das Cinzas', sub: 'SALA II', tiles: 13, pillars: 4,
    waves: [{ lacaio: 5, atirador: 2 }, { lacaio: 6, atirador: 3 }] },
  { name: 'Cripta dos Ecos', sub: 'SALA III', tiles: 13, pillars: 4,
    waves: [{ lacaio: 4, agil: 2 }, { lacaio: 4, atirador: 2, agil: 2 }, { brutamontes: 1, lacaio: 4 }] },
  { name: 'Salão dos Juramentos Partidos', sub: 'SALA IV', tiles: 14, pillars: 5,
    waves: [{ brutamontes: 1, atirador: 3, lacaio: 3 }, { agil: 3, lacaio: 5 }, { brutamontes: 2, atirador: 2, lacaio: 2 }] },
  { name: 'Câmara do Sangue Antigo', sub: 'SALA V', tiles: 14, pillars: 5,
    waves: [{ lacaio: 8, agil: 2 }, { brutamontes: 2, atirador: 3, agil: 2 }, { brutamontes: 2, agil: 3, lacaio: 5, atirador: 2 }] },
  { name: 'Santuário do Arauto', sub: 'COVIL DO CHEFE', tiles: 15, pillars: 4, boss: true, waves: [] },
];

class Room {
  constructor(index) {
    this.index = index;
    this.def = ROOM_DEFS[index];
    this.w = this.h = this.def.tiles * TILE;
    this.seed = 9973 * (index + 1) + Math.floor(Math.random() * 100000);
    this.wallH = 150;
    this.door = { x: this.w / 2, halfW: 46, open: 0, opening: false };
    this.pillars = [];
    this.torches = [];
    this.decals = [];
    this.canvas = null; this.scale = 0;
    this.generate();
  }

  generate() {
    const r = mulberry32(this.seed), w = this.w, h = this.h;
    // Tochas nas duas paredes do fundo (evitando a porta)
    for (let x = TILE * 1.5; x < w - TILE; x += TILE * 3) {
      if (Math.abs(x - this.door.x) < TILE * 1.6) continue;
      this.torches.push({ x, y: 0, ph: r() * 10 });
    }
    for (let y = TILE * 1.5; y < h - TILE; y += TILE * 3) this.torches.push({ x: 0, y, ph: r() * 10 });
    // Pilares (no covil do chefe ficam simétricos)
    if (this.def.boss) {
      const m = TILE * 3.2;
      for (const [px, py] of [[m, m], [w - m, m], [m, h - m], [w - m, h - m]]) this.pillars.push(this.makePillar(r, px, py, true));
    } else {
      let tries = 0;
      while (this.pillars.length < this.def.pillars && tries++ < 200) {
        const px = TILE * 2 + r() * (w - TILE * 4), py = TILE * 2 + r() * (h - TILE * 4);
        if (dist(px, py, w / 2, h - 110) < 170) continue;          // área de entrada
        if (Math.abs(px - w / 2) < 100 && py < 230) continue;      // caminho da porta
        if (this.pillars.some((p) => dist(px, py, p.x, p.y) < 190)) continue;
        this.pillars.push(this.makePillar(r, px, py, r() < 0.55));
      }
    }
  }

  makePillar(r, x, y, tall) {
    return { x, y, r: 20 + r() * 6, h: tall ? 130 + r() * 50 : 40 + r() * 40, broken: !tall || r() < 0.4, seed: Math.floor(r() * 1e6), sprite: null, ox: 0, oy: 0 };
  }

  // Ponto aleatório livre de pilares (opcionalmente longe de 'avoid')
  randomPoint(margin = 50, avoid = null, minDist = 0) {
    let x = 0, y = 0;
    for (let i = 0; i < 40; i++) {
      x = rand(margin, this.w - margin); y = rand(margin, this.h - margin);
      if (this.pillars.some((p) => dist(x, y, p.x, p.y) < p.r + 34)) continue;
      if (avoid && dist(x, y, avoid.x, avoid.y) < minDist) continue;
      break;
    }
    return { x, y };
  }

  // Resolve colisão de um círculo com as paredes e pilares; retorna true se colidiu
  collide(e, isPlayer) {
    const r = e.radius, d = this.door;
    let hit = false;
    // Porta aberta: a passagem é tolerante e "encaixa" o jogador na abertura
    const inDoor = isPlayer && d.open > 0.9 && Math.abs(e.x - d.x) < d.halfW + 16;
    if (e.x < r) { e.x = r; hit = true; }
    if (e.x > this.w - r) { e.x = this.w - r; hit = true; }
    if (e.y > this.h - r) { e.y = this.h - r; hit = true; }
    if (e.y < r) {
      if (inDoor) e.x = clamp(e.x, d.x - d.halfW + r, d.x + d.halfW - r);   // atravessando a porta
      else { e.y = r; hit = true; }
    }
    for (const p of this.pillars) {
      const dx = e.x - p.x, dy = e.y - p.y, dd = Math.hypot(dx, dy), min = r + p.r;
      if (dd < min) {
        const nx = dd > 0.001 ? dx / dd : 1, ny = dd > 0.001 ? dy / dd : 0;
        e.x = p.x + nx * min; e.y = p.y + ny * min;
        hit = true;
      }
    }
    return hit;
  }

  blocksPoint(x, y, r) {
    if (x < 0 || y < 0 || x > this.w || y > this.h) return true;
    for (const p of this.pillars) if (dist2(x, y, p.x, p.y) < (p.r + r) * (p.r + r)) return true;
    return false;
  }

  update(dt) {
    if (this.door.opening && this.door.open < 1) this.door.open = Math.min(1, this.door.open + dt * 0.9);
  }

  // ---------------------------------------------------- pré-renderização
  bounds() {
    return { minX: -this.h - 40, maxX: this.w + 40, minY: -this.wallH - 60, maxY: (this.w + this.h) / 2 + 90 };
  }

  render(scale) {
    this.scale = scale;
    const b = this.bounds();
    const W = Math.ceil((b.maxX - b.minX) * scale), H = Math.ceil((b.maxY - b.minY) * scale);
    if (!this.canvas) this.canvas = document.createElement('canvas');
    this.canvas.width = W; this.canvas.height = H;
    const ctx = this.canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, -b.minX * scale, -b.minY * scale);
    const r = mulberry32(this.seed + 17);
    this.drawLedges(ctx, r);
    this.drawFloor(ctx, r);
    this.drawSigil(ctx);
    this.drawWalls(ctx, r);
    for (const d of this.decals) this.paintDecal(ctx, d);
