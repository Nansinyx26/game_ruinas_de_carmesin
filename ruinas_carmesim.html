    for (const p of this.pillars) this.renderPillar(p, scale);
  }

  // Bordas frontais: a sala flutua sobre o abismo
  drawLedges(ctx, r) {
    const w = this.w, h = this.h, depth = 60;
    const faces = [
      [[w, 0], [w, h]],    // borda inferior direita
      [[0, h], [w, h]],    // borda inferior esquerda
    ];
    faces.forEach(([a, b], idx) => {
      const ax = isoX(a[0], a[1]), ay = isoY(a[0], a[1]), bx = isoX(b[0], b[1]), by = isoY(b[0], b[1]);
      const g = ctx.createLinearGradient(0, Math.min(ay, by), 0, Math.max(ay, by) + depth);
      g.addColorStop(0, idx === 0 ? '#1c1722' : '#16121b');
      g.addColorStop(1, 'rgba(6,4,9,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx, by + depth); ctx.lineTo(ax, ay + depth); ctx.closePath(); ctx.fill();
      // Juntas dos blocos
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      const n = Math.round(this.def.tiles);
      for (let i = 1; i < n; i++) {
        const t = i / n, x = lerp(ax, bx, t), y = lerp(ay, by, t);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 26 + r() * 10); ctx.stroke();
      }
    });
  }

  drawFloor(ctx, r) {
    const n = this.def.tiles;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const x0 = i * TILE, y0 = j * TILE, x1 = x0 + TILE, y1 = y0 + TILE;
        const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(([x, y]) => [isoX(x, y), isoY(x, y)]);
        const v = r();
        // Escurece perto das bordas para dar profundidade
        const edge = Math.min(i, j, n - 1 - i, n - 1 - j);
        const dark = edge === 0 ? 0.65 : edge === 1 ? 0.85 : 1;
        const missing = v < 0.04;
        const l = (missing ? 8 : 17 + r() * 7) * dark;
        ctx.fillStyle = `hsl(${255 + r() * 20},${9 + r() * 8}%,${l.toFixed(1)}%)`;
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.closePath(); ctx.fill();
        // Chanfro: borda superior clara, inferior escura
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(pts[3][0], pts[3][1]); ctx.lineTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath(); ctx.moveTo(pts[1][0], pts[1][1]); ctx.lineTo(pts[2][0], pts[2][1]); ctx.lineTo(pts[3][0], pts[3][1]); ctx.stroke();
        const cx = isoX(x0 + TILE / 2, y0 + TILE / 2), cy = isoY(x0 + TILE / 2, y0 + TILE / 2);
        if (missing) {
          // Ladrilho faltando: buraco com entulho
          ctx.fillStyle = 'rgba(60,52,66,0.6)';
          for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(cx + (r() - 0.5) * 40, cy + (r() - 0.5) * 18, 1.5 + r() * 2.5, 0, TAU); ctx.fill(); }
          continue;
        }
        const d = r();
        if (d < 0.22) {
          // Rachaduras
          ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
          ctx.beginPath();
          let px = cx + (r() - 0.5) * 40, py = cy + (r() - 0.5) * 16;
          ctx.moveTo(px, py);
          for (let k = 0; k < 4; k++) { px += (r() - 0.5) * 24; py += (r() - 0.5) * 10; ctx.lineTo(px, py); }
          ctx.stroke();
        } else if (d < 0.32) {
          // Musgo
          ctx.fillStyle = 'rgba(70,90,60,0.18)';
          for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(cx + (r() - 0.5) * 50, cy + (r() - 0.5) * 20, 6 + r() * 10, 3 + r() * 4, 0, 0, TAU); ctx.fill(); }
        } else if (d < 0.36) {
          // Runa gravada com brilho vermelho tênue
          ctx.strokeStyle = 'rgba(200,30,40,0.35)'; ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.ellipse(cx, cy, 14, 7, 0, 0, TAU); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5); ctx.stroke();
        } else if (d < 0.4) {
          // Ossos espalhados
          ctx.strokeStyle = 'rgba(200,190,170,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
          ctx.beginPath(); const a = r() * TAU;
          ctx.moveTo(cx - Math.cos(a) * 7, cy - Math.sin(a) * 3); ctx.lineTo(cx + Math.cos(a) * 7, cy + Math.sin(a) * 3); ctx.stroke();
          ctx.lineCap = 'butt';
        }
      }
    }
  }

  // Selo circular no centro da sala (maior e mais elaborado no covil do chefe)
  drawSigil(ctx) {
    const cx = this.w / 2, cy = this.h / 2;
    const big = !!this.def.boss;
    const R = big ? 230 : 120;
    const ring = (rad, col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; isoCirclePath(ctx, cx, cy, rad); ctx.stroke(); };
    ring(R, big ? 'rgba(200,30,40,0.35)' : 'rgba(180,140,60,0.18)', 2);
    ring(R * 0.86, big ? 'rgba(227,168,59,0.28)' : 'rgba(180,140,60,0.12)', 1.2);
    ring(R * 0.4, big ? 'rgba(200,30,40,0.3)' : 'rgba(150,30,40,0.14)', 1.5);
    const n = big ? 7 : 5;
    ctx.strokeStyle = big ? 'rgba(200,30,40,0.32)' : 'rgba(150,30,40,0.14)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = ((i * 2) % n) / n * TAU - Math.PI / 2;
      const x = cx + Math.cos(a) * R * 0.86, y = cy + Math.sin(a) * R * 0.86;
      i ? ctx.lineTo(isoX(x, y), isoY(x, y)) : ctx.moveTo(isoX(x, y), isoY(x, y));
    }
    ctx.stroke();
  }

  drawWalls(ctx, r) {
    const w = this.w, h = this.h, n = this.def.tiles;
    // Parede esquerda (x = 0) e parede direita (y = 0), em segmentos de altura variada (ruínas)
    const segs = [];
    for (let j = n - 1; j >= 0; j--) segs.push({ ax: 0, ay: (j + 1) * TILE, bx: 0, by: j * TILE, side: 'L' });
    for (let i = 0; i < n; i++) segs.push({ ax: i * TILE, ay: 0, bx: (i + 1) * TILE, by: 0, side: 'R' });
    for (const s of segs) {
      const isDoor = s.side === 'R' && Math.abs((s.ax + s.bx) / 2 - this.door.x) < TILE;
      const hh = isDoor ? this.wallH + 20 : this.wallH - (r() < 0.3 ? 20 + r() * 50 : r() * 10);
      const ax = isoX(s.ax, s.ay), ay = isoY(s.ax, s.ay), bx = isoX(s.bx, s.by), by = isoY(s.bx, s.by);
      // Face da parede com gradiente vertical
      const g = ctx.createLinearGradient(0, Math.min(ay, by) - hh, 0, Math.max(ay, by));
      g.addColorStop(0, s.side === 'L' ? '#2a2330' : '#231d29');
      g.addColorStop(1, s.side === 'L' ? '#141017' : '#100d13');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(bx, by - hh); ctx.lineTo(ax, ay - hh); ctx.closePath(); ctx.fill();
      // Fileiras de tijolos
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
      for (let k = 18; k < hh; k += 18) {
        ctx.beginPath(); ctx.moveTo(ax, ay - k); ctx.lineTo(bx, by - k); ctx.stroke();
        const off = (k / 18) % 2 ? 0.25 : 0.75;
        const jx = lerp(ax, bx, off), jy = lerp(ay, by, off);
        ctx.beginPath(); ctx.moveTo(jx, jy - k); ctx.lineTo(jx, jy - k + 18); ctx.stroke();
      }
      // Topo da parede (espessura)
      const t = 16;
      const tx = s.side === 'L' ? -t : 0, ty = s.side === 'R' ? -t : 0;
      ctx.fillStyle = '#3a3242';
      ctx.beginPath();
      ctx.moveTo(ax, ay - hh); ctx.lineTo(bx, by - hh);
      ctx.lineTo(isoX(s.bx + tx, s.by + ty), isoY(s.bx + tx, s.by + ty) - hh);
      ctx.lineTo(isoX(s.ax + tx, s.ay + ty), isoY(s.ax + tx, s.ay + ty) - hh);
      ctx.closePath(); ctx.fill();
      // Estandartes rasgados
      if (!isDoor && r() < 0.22) {
        const mx = lerp(ax, bx, 0.5), my = lerp(ay, by, 0.5) - hh + 22;
        const slope = (by - ay) / (bx - ax || 1);
        ctx.fillStyle = '#6e0c18';
        ctx.beginPath();
        ctx.moveTo(mx - 12, my - 12 * slope); ctx.lineTo(mx + 12, my + 12 * slope);
        ctx.lineTo(mx + 12, my + 12 * slope + 60); ctx.lineTo(mx + 4, my + 50); ctx.lineTo(mx - 3, my + 62); ctx.lineTo(mx - 12, my - 12 * slope + 52);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b8862e'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#c9963a';
        ctx.beginPath(); ctx.arc(mx, my + 24, 5, 0, TAU); ctx.fill();
      }
    }
    // Moldura da porta (arco com pedra-chave dourada)
    const d = this.door;
    const lx = isoX(d.x - d.halfW, 0), ly = isoY(d.x - d.halfW, 0), rx = isoX(d.x + d.halfW, 0), ry = isoY(d.x + d.halfW, 0);
    const dh = 112;
    ctx.fillStyle = '#050307';
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(rx, ry - dh); ctx.quadraticCurveTo((lx + rx) / 2, (ly + ry) / 2 - dh - 34, lx, ly - dh); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#4a3f52'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly - dh); ctx.quadraticCurveTo((lx + rx) / 2, (ly + ry) / 2 - dh - 34, rx, ry - dh); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.strokeStyle = '#b8862e'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#c9963a';
    ctx.beginPath(); ctx.moveTo((lx + rx) / 2 - 7, (ly + ry) / 2 - dh - 22); ctx.lineTo((lx + rx) / 2 + 7, (ly + ry) / 2 - dh - 22); ctx.lineTo((lx + rx) / 2 + 4, (ly + ry) / 2 - dh - 8); ctx.lineTo((lx + rx) / 2 - 4, (ly + ry) / 2 - dh - 8); ctx.closePath(); ctx.fill();
    // Suportes das tochas
    for (const tc of this.torches) {
      const sx = isoX(tc.x, tc.y), sy = isoY(tc.x, tc.y) - 64;
      ctx.fillStyle = '#1a141c'; ctx.fillRect(sx - 3, sy, 6, 16);
      ctx.fillStyle = '#7a5418'; ctx.fillRect(sx - 6, sy - 2, 12, 4);
    }
  }

  // Sprite pré-renderizado de cada pilar (coluna inteira ou quebrada)
  renderPillar(p, scale) {
    const rx = p.r * ISO_RX, ry = p.r * ISO_RY;
    const Wd = rx * 2 + 16, Hd = p.h + ry * 2 + 30;
    const c = p.sprite || (p.sprite = document.createElement('canvas'));
    c.width = Math.ceil(Wd * scale); c.height = Math.ceil(Hd * scale);
    const g = c.getContext('2d');
    g.setTransform(scale, 0, 0, scale, 0, 0);
    p.ox = Wd / 2; p.oy = Hd - ry - 6;   // posição da base dentro do sprite
    const bx = p.ox, by = p.oy;
    const r = mulberry32(p.seed);
    // Base (plinto)
    g.fillStyle = '#1d1822';
    g.beginPath(); g.ellipse(bx, by, rx + 6, ry + 3, 0, 0, Math.PI); g.lineTo(bx - rx - 6, by - 10); g.ellipse(bx, by - 10, rx + 6, ry + 3, 0, Math.PI, 0, true); g.closePath(); g.fill();
    // Fuste com gradiente cilíndrico
    const top = by - p.h;
    const grd = g.createLinearGradient(bx - rx, 0, bx + rx, 0);
    grd.addColorStop(0, '#17131b'); grd.addColorStop(0.35, '#3b3343'); grd.addColorStop(0.6, '#2a2430'); grd.addColorStop(1, '#100d13');
    g.fillStyle = grd;
    g.beginPath();
    g.moveTo(bx - rx, by - 10);
    g.lineTo(bx - rx, top);
    if (p.broken) {
      // Topo quebrado irregular
      const steps = 6;
      for (let i = 0; i <= steps; i++) g.lineTo(bx - rx + (2 * rx * i) / steps, top - (r() * 22) + (i % 2) * 6);
    } else g.lineTo(bx + rx, top);
    g.lineTo(bx + rx, by - 10);
    g.ellipse(bx, by - 10, rx, ry, 0, 0, Math.PI);
    g.closePath(); g.fill();
    // Caneluras
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;
    for (let k = -2; k <= 2; k++) { const x = bx + k * rx * 0.38; g.beginPath(); g.moveTo(x, by - 12); g.lineTo(x, top + 14); g.stroke(); }
    if (!p.broken) {
      // Capitel
      g.fillStyle = '#2e2735';
      g.fillRect(bx - rx - 6, top - 12, rx * 2 + 12, 14);
      g.fillStyle = '#3d3446';
      g.beginPath(); g.ellipse(bx, top - 12, rx + 6, ry + 2, 0, 0, TAU); g.fill();
    }
    // Musgo e rachaduras
    g.fillStyle = 'rgba(70,90,60,0.25)';
    for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(bx + (r() - 0.5) * rx * 1.6, by - 14 - r() * 30, 4 + r() * 6, 2 + r() * 3, 0, 0, TAU); g.fill(); }
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.beginPath(); let cx = bx + (r() - 0.5) * rx, cy = top + 20 + r() * 20; g.moveTo(cx, cy);
    for (let k = 0; k < 5; k++) { cx += (r() - 0.5) * 8; cy += 8 + r() * 8; g.lineTo(cx, cy); }
    g.stroke();
  }

  // Manchas (sangue e queimaduras) pintadas permanentemente no chão
  addDecal(x, y, r, rgb) {
    if (x < 0 || y < 0 || x > this.w || y > this.h) return;
    const d = { x, y, r, rgb, kind: 'blood' };
    this.pushDecal(d);
  }
  addScorch(x, y, r) { this.pushDecal({ x, y, r, rgb: '0,0,0', kind: 'scorch' }); }
  pushDecal(d) {
    this.decals.push(d);
    if (this.decals.length > 500) this.decals.shift();
    if (this.canvas) {
      const ctx = this.canvas.getContext('2d');
      const b = this.bounds(), s = this.scale;
      ctx.setTransform(s, 0, 0, s, -b.minX * s, -b.minY * s);
      this.paintDecal(ctx, d);
    }
  }
  paintDecal(ctx, d) {
    const sx = isoX(d.x, d.y), sy = isoY(d.x, d.y);
    const r = mulberry32(Math.floor(d.x * 13 + d.y * 7));
    if (d.kind === 'scorch') {
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, d.r * 1.3);
      g.addColorStop(0, 'rgba(0,0,0,0.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(sx, sy, d.r * 1.3, d.r * 0.65, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        const a = r() * TAU;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(a) * d.r * (0.6 + r() * 0.6), sy + Math.sin(a) * d.r * 0.4); ctx.stroke();
      }
      return;
    }
    ctx.fillStyle = `rgba(${d.rgb},0.55)`;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.ellipse(sx + (r() - 0.5) * d.r * 1.6, sy + (r() - 0.5) * d.r * 0.8, d.r * (0.5 + r() * 0.6), d.r * (0.25 + r() * 0.3), 0, 0, TAU);
      ctx.fill();
    }
  }

  // ---------------------------------------------------- desenho em tempo real
  drawBackground(ctx) {
    if (!this.canvas) return;
    const b = this.bounds();
    ctx.drawImage(this.canvas, b.minX, b.minY, b.maxX - b.minX, b.maxY - b.minY);
  }

  // Grade levadiça da porta (sobe ao abrir)
  drawDoor(ctx) {
    const d = this.door, dh = 112;
    const lx = isoX(d.x - d.halfW, 0), ly = isoY(d.x - d.halfW, 0), rx = isoX(d.x + d.halfW, 0), ry = isoY(d.x + d.halfW, 0);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.lineTo(rx, ry - dh - 20); ctx.lineTo(lx, ly - dh - 20); ctx.closePath(); ctx.clip();
    const lift = easeInOut(d.open) * (dh + 10);
    ctx.strokeStyle = '#3a3440'; ctx.lineWidth = 4;
    for (let i = 0; i <= 6; i++) {
      const t = i / 6, x = lerp(lx, rx, t), y = lerp(ly, ry, t);
      ctx.beginPath(); ctx.moveTo(x, y - lift); ctx.lineTo(x, y - dh - 30 - lift); ctx.stroke();
    }
    for (let k = 1; k <= 4; k++) {
      const yy = (k / 5) * dh;
      ctx.beginPath(); ctx.moveTo(lx, ly - yy - lift); ctx.lineTo(rx, ry - yy - lift); ctx.stroke();
    }
    ctx.restore();
  }

  // Camada emissiva: chamas das tochas e luz dourada da porta aberta
  drawEmissive(ctx, time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const tc of this.torches) {
      const sx = isoX(tc.x, tc.y), sy = isoY(tc.x, tc.y) - 72;
      const f = 0.8 + 0.2 * Math.sin(time * 13 + tc.ph) + 0.1 * Math.sin(time * 31 + tc.ph * 2);
      GlowCache.draw(ctx, '255,120,40', sx, sy, 34 * f, 0.55);
      GlowCache.draw(ctx, '255,190,90', sx, sy - 4, 14 * f, 0.9);
      GlowCache.draw(ctx, '255,250,220', sx, sy, 5, 0.9);
    }
    const d = this.door;
    if (d.open > 0) {
      const mx = isoX(d.x, 0), my = isoY(d.x, 0) - 50;
      GlowCache.draw(ctx, '255,200,110', mx, my, 120 * d.open, 0.45 * d.open);
      GlowCache.drawFlat(ctx, '255,190,90', isoX(d.x, 30), isoY(d.x, 30), 120 * d.open, 0.35 * d.open);
    }
    ctx.restore();
  }

  addLights(lighting, time) {
    for (const tc of this.torches) {
      const f = 0.85 + 0.15 * Math.sin(time * 11 + tc.ph);
      lighting.add(isoX(tc.x + (tc.x === 0 ? 30 : 0), tc.y + (tc.y === 0 ? 30 : 0)), isoY(tc.x, tc.y) - 40, 210 * f, 0.75);
    }
    if (this.door.open > 0) lighting.add(isoX(this.door.x, 20), isoY(this.door.x, 20) - 40, 260, 0.8 * this.door.open);
  }

  drawDebug(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,230,80,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(isoX(0, 0), isoY(0, 0)); ctx.lineTo(isoX(this.w, 0), isoY(this.w, 0));
    ctx.lineTo(isoX(this.w, this.h), isoY(this.w, this.h)); ctx.lineTo(isoX(0, this.h), isoY(0, this.h));
    ctx.closePath(); ctx.stroke();
    for (const p of this.pillars) drawHurtbox(ctx, p.x, p.y, p.r, '90,160,255');
    ctx.restore();
  }
}

// Pilar como objeto desenhável na ordenação por profundidade
function drawPillar(ctx, p, player) {
  if (!p.sprite) return;
  const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y);
  // Fica translúcido quando esconde o jogador
  let alpha = 1;
  if (player && player.depth < p.x + p.y) {
    const px = isoX(player.x, player.y), py = isoY(player.x, player.y);
    if (Math.abs(px - sx) < p.r * ISO_RX + 18 && py < sy + 10 && py > sy - p.h - 40) alpha = 0.38;
  }
  ctx.globalAlpha = alpha;
  ctx.drawImage(p.sprite, sx - p.ox, sy - p.oy, p.sprite.width / game.room.scale, p.sprite.height / game.room.scale);
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------------------
// GERENCIADOR DE ONDAS: ondas por sala, porta, transição e chefe
// ---------------------------------------------------------------------------
class WaveManager {
  constructor() { this.state = 'idle'; this.queue = []; this.waveIndex = -1; this.timer = 0; this.roomIndex = 0; this.def = ROOM_DEFS[0]; }

  startRoom(index) {
    this.roomIndex = index;
    this.def = ROOM_DEFS[index];
    this.waveIndex = -1;
    this.queue.length = 0;
    this.state = 'intro';
    this.timer = 1.8;
    game.hud.message(this.def.name.toUpperCase(), this.def.sub, 2.4);
  }

  get totalWaves() { return this.def.boss ? 1 : this.def.waves.length; }

  spawnEnemy(type, x, y, level = this.roomIndex) {
    const e = createEnemy(type, x, y, level);
    game.enemies.push(e);
    game.particles.ring(x, y, e.radius * 2.5, '255,40,60', e.spawnDur, 4);
    game.particles.smoke(x, y, 0, 4, '40,10,30', 14);
    game.audio.play('spawn');
    if (type === 'brutamontes') game.camera.shake(0.15);
    return e;
  }

  nextWave() {
    this.waveIndex++;
    const wd = this.def.waves[this.waveIndex];
    const list = [];
    for (const t in wd) for (let i = 0; i < wd[t]; i++) list.push(t);
    // Embaralha para variar a ordem de entrada
    for (let i = list.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = list[i]; list[i] = list[j]; list[j] = t; }
    this.queue = list.map((t, i) => ({ type: t, delay: i === 0 ? 0 : rand(0.1, 0.28) }));
    this.state = 'spawning';
    this.timer = 0;
    game.hud.message(`ONDA ${this.waveIndex + 1} / ${this.def.waves.length}`, '', 1.3, true);
    game.audio.play('waveStart');
  }

  startBoss() {
    const r = game.room;
    const boss = new Boss(r.w / 2, r.h / 2 - 60);
    game.enemies.push(boss);
    game.boss = boss;
    this.state = 'boss';
    game.hud.message(boss.name, 'O GUARDIÃO DAS RUÍNAS', 2.8, false, true);
    game.camera.shake(0.4);
  }

  aliveCount() {
    let n = 0;
    for (const e of game.enemies) if (e.alive && e.state !== 'dying') n++;
    return n;
  }

  update(dt) {
    switch (this.state) {
      case 'intro':
        this.timer -= dt;
        if (this.timer <= 0) { if (this.def.boss) this.startBoss(); else this.nextWave(); }
        break;
      case 'spawning':
        this.timer -= dt;
        while (this.queue.length && this.timer <= 0) {
          const q = this.queue.shift();
          const minD = q.type === 'atirador' ? 300 : 230;
          const pt = game.room.randomPoint(60, game.player, minD);
          this.spawnEnemy(q.type, pt.x, pt.y);
          if (this.queue.length) this.timer += this.queue[0].delay;
        }
        if (!this.queue.length) this.state = 'fighting';
        break;
      case 'fighting':
        if (this.aliveCount() === 0) {
          if (this.waveIndex < this.def.waves.length - 1) { this.state = 'between'; this.timer = 1.1; }
          else this.roomCleared();
        }
        break;
      case 'between':
        this.timer -= dt;
        if (this.timer <= 0) this.nextWave();
        break;
      case 'cleared': {
        const p = game.player;
        if (p.y < -14 && game.room.door.open > 0.9) { this.state = 'exiting'; game.exitRoom(); }
        break;
      }
    }
  }

  roomCleared() {
    this.state = 'cleared';
    game.room.door.opening = true;
    game.pickups.attractAll();
    game.stats.roomsCleared++;
    game.audio.play('door');
    game.audio.play('roomClear');
    game.hud.message('SALA PURIFICADA', 'A porta se abriu — siga para o norte', 2.6);
  }
}

// ---------------------------------------------------------------------------
// FUNÇÕES DE TEXTO E ÍCONES DA INTERFACE
// ---------------------------------------------------------------------------
function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function glowText(ctx, text, x, y, color, glow, blur = 18) {
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Ícones procedurais das melhorias
function drawIcon(ctx, kind, x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 40, s / 40);
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (kind) {
    case 'sword':
      ctx.moveTo(-14, 14); ctx.lineTo(12, -12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-14, 4); ctx.lineTo(-4, 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, -12); ctx.lineTo(16, -16); ctx.stroke();
      break;
    case 'boot':
      ctx.moveTo(-8, -16); ctx.lineTo(-8, 8); ctx.lineTo(10, 12); ctx.lineTo(12, 4); ctx.lineTo(2, 0); ctx.lineTo(2, -16); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18, -6); ctx.lineTo(-12, -6); ctx.moveTo(-20, 0); ctx.lineTo(-12, 0); ctx.stroke();
      break;
    case 'fang':
      ctx.moveTo(-12, -12); ctx.lineTo(-6, 10); ctx.lineTo(-2, -12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2, -12); ctx.lineTo(6, 10); ctx.lineTo(12, -12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(6, 15, 3, 0, TAU); ctx.fill();
      break;
    case 'heart':
      ctx.moveTo(0, 14); ctx.bezierCurveTo(-22, 0, -14, -18, 0, -6); ctx.bezierCurveTo(14, -18, 22, 0, 0, 14); ctx.fill();
      break;
    case 'flame':
      ctx.moveTo(0, -18); ctx.bezierCurveTo(14, -4, 14, 14, 0, 16); ctx.bezierCurveTo(-14, 14, -12, 0, -4, -6); ctx.bezierCurveTo(-4, 2, 2, 4, 0, -18); ctx.fill();
      break;
    case 'eye':
      ctx.moveTo(-18, 0); ctx.quadraticCurveTo(0, -16, 18, 0); ctx.quadraticCurveTo(0, 16, -18, 0); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, TAU); ctx.fill();
      break;
    case 'wing':
      ctx.moveTo(-14, 12); ctx.quadraticCurveTo(-10, -14, 16, -14); ctx.quadraticCurveTo(6, -6, 10, -2); ctx.quadraticCurveTo(0, 0, 4, 6); ctx.quadraticCurveTo(-6, 6, -14, 12); ctx.fill();
      break;
    case 'shield':
      ctx.moveTo(0, -16); ctx.lineTo(14, -10); ctx.quadraticCurveTo(14, 8, 0, 16); ctx.quadraticCurveTo(-14, 8, -14, -10); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
      break;
    case 'soul':
      ctx.arc(0, 4, 8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -1); ctx.quadraticCurveTo(-4, -14, 4, -18); ctx.quadraticCurveTo(2, -8, 7, -2); ctx.fill();
      break;
    case 'bolt':
      ctx.moveTo(4, -18); ctx.lineTo(-10, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 18); ctx.lineTo(10, -4); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill();
      break;
    case 'orb':
      ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      break;
    case 'scroll':
      ctx.strokeRect(-12, -14, 24, 28);
      ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, -6); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(-7, 6); ctx.lineTo(3, 6); ctx.stroke();
      break;
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// HUD: vida, fúria, combo, pontuação, nomes de combos e barra do chefe
// ---------------------------------------------------------------------------
class HUD {
  constructor() { this.reset(); }
  reset() {
    this.names = [];
    this.msg = null;
    this.ghostHp = 100; this.ghostDelay = 0;
    this.furyReadyT = 0; this.furyDeny = 0;
    this.tier = null;
    this.displayScore = 0;
    this.bossGhost = 1;
    this.time = 0;
  }
  comboName(text, big = false) {
    this.names.push({ text, t: 0, max: big ? 1.7 : 1.15, big });
    if (this.names.length > 3) this.names.shift();
  }
  message(title, sub = '', dur = 2, small = false, low = false) { this.msg = { title, sub, t: 0, max: dur, small, low }; }
  tierUp(label) { if (label) this.tier = { label, t: 0 }; }
  furyReady() { this.furyReadyT = 1.4; }
  furyDenied() { this.furyDeny = 0.35; }

  update(dt) {
    const p = game.player;
    this.time += dt;
    for (const n of this.names) n.t += dt;
    this.names = this.names.filter((n) => n.t < n.max);
    if (this.msg) { this.msg.t += dt; if (this.msg.t >= this.msg.max) this.msg = null; }
    if (this.tier) { this.tier.t += dt; if (this.tier.t > 1.2) this.tier = null; }
    if (this.furyReadyT > 0) this.furyReadyT -= dt;
    if (this.furyDeny > 0) this.furyDeny -= dt;
    // Barra "fantasma" de vida que drena com atraso
    if (p) {
      if (p.hp < this.ghostHp) { this.ghostDelay += dt; if (this.ghostDelay > 0.45) this.ghostHp = Math.max(p.hp, this.ghostHp - 70 * dt); }
      else { this.ghostHp = p.hp; this.ghostDelay = 0; }
    }
    this.displayScore = lerp(this.displayScore, game.stats.score, 1 - Math.exp(-dt * 8));
    if (Math.abs(this.displayScore - game.stats.score) < 1) this.displayScore = game.stats.score;
    if (game.boss) {
      const r = game.boss.hp / game.boss.maxHp;
      this.bossGhost = r < this.bossGhost ? Math.max(r, this.bossGhost - dt * 0.25) : r;
    }
  }

  draw(ctx) {
    const p = game.player;
    if (!p) return;
    this.drawVitals(ctx, p);
    this.drawScore(ctx);
    this.drawCombo(ctx);
    this.drawComboNames(ctx);
    this.drawBossBar(ctx);
    this.drawMessage(ctx);
    this.drawIndicators(ctx);
  }

  bar(ctx, x, y, w, h, frac, ghost, fill, back = 'rgba(10,4,8,0.85)') {
    ctx.fillStyle = back;
    ctx.fillRect(x, y, w, h);
    if (ghost > frac) { ctx.fillStyle = 'rgba(255,214,150,0.75)'; ctx.fillRect(x, y, w * clamp(ghost, 0, 1), h); }
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w * clamp(frac, 0, 1), h);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, w * clamp(frac, 0, 1), h * 0.4);
  }

  drawVitals(ctx, p) {
    const x = 24, y = 22, w = 300;
    ctx.save();
    // Moldura dourada
    ctx.fillStyle = 'rgba(8,4,10,0.6)';
    roundRectPath(ctx, x - 10, y - 10, w + 86, 84, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(227,168,59,0.45)'; ctx.lineWidth = 1;
    ctx.stroke();
    // Vida
    const low = p.hp / p.maxHp < 0.3;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#6d0716'); g.addColorStop(1, low ? `rgba(255,${(40 + 40 * Math.sin(this.time * 10)) | 0},60,1)` : '#e0162f');
    this.bar(ctx, x, y, w, 18, p.hp / p.maxHp, this.ghostHp / p.maxHp, g);
    ctx.strokeStyle = PAL.gold; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 0.5, y - 0.5, w + 1, 19);
    ctx.font = `bold 13px ${FONT_UI}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${Math.ceil(p.hp)} / ${p.maxHp}`, x + 8, y + 10);
    ctx.fillStyle = PAL.goldHi;
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillText('VIDA', x + w + 10, y + 10);
    // Fúria
    const fy = y + 28, fw = 240;
    const full = p.fury >= 100;
    const shake = this.furyDeny > 0 ? Math.sin(this.furyDeny * 80) * 4 : 0;
    const fg = ctx.createLinearGradient(x, 0, x + fw, 0);
    fg.addColorStop(0, '#7a4a10'); fg.addColorStop(1, full ? '#ffe9a8' : '#e3a83b');
    if (full) { ctx.shadowColor = 'rgba(255,190,80,0.9)'; ctx.shadowBlur = 12 + 8 * Math.sin(this.time * 8); }
    this.bar(ctx, x + shake, fy, fw, 11, p.fury / 100, 0, fg);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = full ? PAL.goldHi : 'rgba(227,168,59,0.7)';
    ctx.strokeRect(x + shake - 0.5, fy - 0.5, fw + 1, 12);
    ctx.fillStyle = full ? PAL.goldHi : PAL.gold;
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillText(full ? (Math.floor(this.time * 3) % 2 ? '[I] FÚRIA!' : 'FÚRIA PRONTA') : 'FÚRIA', x + fw + 10 + shake, fy + 6);
    // Esquiva (recarga)
    const dy = fy + 20, dw = 90;
    const ready = p.dashCd <= 0;
    this.bar(ctx, x, dy, dw, 5, ready ? 1 : 1 - p.dashCd / (0.5 * p.stats.dashCdMult), 0, ready ? '#9fd6ff' : '#3c6d8f');
    ctx.fillStyle = 'rgba(200,220,255,0.75)'; ctx.font = `11px ${FONT_UI}`;
    ctx.fillText('ESQUIVA', x + dw + 8, dy + 3);
    ctx.restore();
  }

  drawScore(ctx) {
    ctx.save();
    const x = VIEW_W - 24;
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(227,168,59,0.75)';
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillText('PONTUAÇÃO', x, 16);
    ctx.font = `30px ${FONT_NUM}`;
    glowText(ctx, Math.round(this.displayScore).toLocaleString('pt-BR'), x, 30, PAL.goldHi, 'rgba(255,120,40,0.6)', 10);
    // Almas
    ctx.font = `bold 16px ${FONT_UI}`;
    ctx.fillStyle = '#ffe7b0';
    ctx.fillText(`${game.stats.soulsBank}`, x, 68);
    const tw = ctx.measureText(`${game.stats.soulsBank}`).width;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    GlowCache.draw(ctx, '255,200,90', x - tw - 14, 77, 12, 0.9);
    GlowCache.draw(ctx, '255,250,220', x - tw - 14, 76, 4, 1);
    ctx.restore();
    // Sala e onda
    const w = game.waves;
    ctx.font = `bold 12px ${FONT_TITLE}`;
    ctx.fillStyle = 'rgba(232,220,196,0.7)';
    const roomTxt = w.def.boss ? 'COVIL DO CHEFE' : `SALA ${w.roomIndex + 1} / 5`;
    const waveTxt = w.def.boss ? '' : ` · ONDA ${Math.max(1, w.waveIndex + 1)} / ${w.def.waves.length}`;
    ctx.fillText(roomTxt + waveTxt, x, 92);
    ctx.restore();
  }

  drawCombo(ctx) {
    const c = game.counter;
    const show = c.count >= 2;
    ctx.save();
    const x = VIEW_W - 40, y = 236;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    if (show) {
      const pop = 1 + c.pop * 0.35;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pop, pop);
      ctx.rotate(-0.06);
      ctx.font = `64px ${FONT_NUM}`;
      const hue = c.count >= 50 ? '#ff3b4f' : c.count >= 15 ? PAL.goldHi : '#ffffff';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(30,0,6,0.9)';
      ctx.strokeText(String(c.count), 0, 0);
      glowText(ctx, String(c.count), 0, 0, hue, 'rgba(255,40,40,0.7)', 16);
      ctx.restore();
      ctx.font = `bold 16px ${FONT_TITLE}`;
      ctx.fillStyle = '#e8dcc4';
      ctx.fillText('HITS', x, y + 22);
      ctx.font = `22px ${FONT_NUM}`;
      ctx.fillStyle = PAL.gold;
      ctx.fillText(`x${c.mult.toFixed(1)}`, x - 52, y + 24);
      if (c.label) {
        ctx.font = `italic bold 20px ${FONT_TITLE}`;
        glowText(ctx, c.label, x, y + 50, '#ff4a5a', 'rgba(255,30,40,0.8)', 12);
      }
      // Tempo restante do combo
      const bw = 150, k = c.timer / c.duration;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - bw, y + 60, bw, 4);
      ctx.fillStyle = k < 0.3 ? '#ff3b4f' : PAL.gold; ctx.fillRect(x - bw, y + 60, bw * k, 4);
    } else if (c.dropped) {
      ctx.globalAlpha = c.dropped.t;
      ctx.font = `40px ${FONT_NUM}`;
      ctx.fillStyle = '#7a6a70';
      ctx.fillText(String(c.dropped.count), x, y);
      ctx.font = `bold 13px ${FONT_TITLE}`;
      ctx.fillText('COMBO PERDIDO', x, y + 20);
    }
    if (this.tier) {
      const k = this.tier.t / 1.2;
      ctx.globalAlpha = 1 - k;
      ctx.font = `italic bold ${Math.round(26 + 10 * (1 - k))}px ${FONT_TITLE}`;
      glowText(ctx, this.tier.label + '!', x, y - 66 - k * 14, '#fff0d0', 'rgba(255,60,40,0.9)', 18);
    }
    ctx.restore();
  }

  drawComboNames(ctx) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let y = game.boss ? 150 : 120;
    for (const n of this.names) {
      const k = n.t / n.max;
      const sIn = Math.min(1, n.t / 0.14);
      const scale = (n.big ? 1.3 : 1) * (0.6 + 0.4 * easeOutBack(sIn));
      const a = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(VIEW_W / 2, y - k * 12);
      ctx.scale(scale, scale);
      ctx.font = `bold italic 30px ${FONT_TITLE}`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(30,0,6,0.85)';
      ctx.strokeText(n.text, 0, 0);
      const g = ctx.createLinearGradient(0, -16, 0, 16);
      g.addColorStop(0, '#fff2c4'); g.addColorStop(0.5, PAL.goldHi); g.addColorStop(1, '#ff4a3a');
      glowText(ctx, n.text, 0, 0, g, 'rgba(255,40,30,0.9)', 16);
      // Linhas decorativas
      const w = ctx.measureText(n.text).width / 2 + 14;
      ctx.strokeStyle = 'rgba(227,168,59,0.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-w - 40 * sIn, 0); ctx.lineTo(-w, 0); ctx.moveTo(w, 0); ctx.lineTo(w + 40 * sIn, 0); ctx.stroke();
      ctx.restore();
      y += 44;
    }
    ctx.restore();
  }

  drawBossBar(ctx) {
    const b = game.boss;
    if (!b || (!b.alive && b.state !== 'dying')) return;
    // Centralizada no espaço livre entre o painel de vida e a pontuação
    const x0 = 420, x1 = VIEW_W - 210;
    const w = Math.min(600, x1 - x0 - 20), x = (x0 + x1) / 2 - w / 2, y = 34, cx = x + w / 2;
    const intro = b.state === 'intro' ? clamp(b.stateTime / 2.5, 0, 1) : 1;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = `bold ${w < 420 ? 14 : 17}px ${FONT_TITLE}`;
    glowText(ctx, b.name, cx, y - 6, '#f3dcb0', 'rgba(255,40,30,0.8)', 10);
    ctx.fillStyle = 'rgba(8,2,6,0.85)';
    ctx.fillRect(x - 4, y - 2, w + 8, 20);
    const frac = (b.hp / b.maxHp) * intro;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#4a040e'); g.addColorStop(1, b.phase === 3 ? '#ff4020' : '#c8102e');
    this.bar(ctx, x, y, w, 16, frac, this.bossGhost * intro, g);
    // Marcadores das fases
    ctx.fillStyle = PAL.goldHi;
    for (const m of [0.66, 0.33]) ctx.fillRect(x + w * m - 1, y - 3, 2, 22);
    ctx.strokeStyle = PAL.gold; ctx.lineWidth = 1.5;
    ctx.strokeRect(x - 0.5, y - 0.5, w + 1, 17);
    // Equilíbrio (poise): quando zera, o chefe fica atordoado
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y + 21, w, 4);
    ctx.fillStyle = b.state === 'stagger' ? '#ffffff' : 'rgba(255,214,120,0.85)';
    ctx.fillRect(x, y + 21, w * (b.state === 'stagger' ? 1 - b.stateTime / 1.8 : b.poise / b.maxPoise), 4);
    ctx.textBaseline = 'top'; ctx.font = `bold 12px ${FONT_TITLE}`; ctx.fillStyle = 'rgba(232,220,196,0.8)';
    ctx.fillText(`FASE ${['I', 'II', 'III'][b.phase - 1]}`, cx, y + 28);
    ctx.restore();
  }

  drawMessage(ctx) {
    const m = this.msg;
    if (!m) return;
    const k = m.t / m.max;
    const a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = VIEW_H * (m.low ? 0.74 : 0.3);   // letreiros do chefe ficam abaixo da ação
    if (m.small) {
      ctx.font = `bold 30px ${FONT_TITLE}`;
      glowText(ctx, m.title, VIEW_W / 2, y + 20, '#f3dcb0', 'rgba(255,60,40,0.8)', 14);
    } else {
      if (m.sub) {
        ctx.font = `bold 15px ${FONT_TITLE}`;
        ctx.fillStyle = PAL.gold;
        ctx.fillText(m.sub, VIEW_W / 2, y - 34);
      }
      ctx.font = `bold 44px ${FONT_TITLE}`;
      glowText(ctx, m.title, VIEW_W / 2, y + 6, '#f6e3bd', 'rgba(220,20,40,0.9)', 22);
      const w = Math.min(VIEW_W * 0.4, ctx.measureText(m.title).width / 2 + 40);
      ctx.strokeStyle = 'rgba(227,168,59,0.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(VIEW_W / 2 - w, y + 36); ctx.lineTo(VIEW_W / 2 + w, y + 36); ctx.stroke();
    }
    ctx.restore();
  }

  // Indicadores de inimigos fora da tela e da porta aberta
  drawIndicators(ctx) {
    const cam = game.camera, m = 26;
    ctx.save();
    const arrow = (sx, sy, rgb, size) => {
      const cx = VIEW_W / 2, cy = VIEW_H / 2;
      const dx = sx - cx, dy = sy - cy;
      const s = Math.min((VIEW_W / 2 - m) / Math.abs(dx || 1e-6), (VIEW_H / 2 - m) / Math.abs(dy || 1e-6));
      const ex = cx + dx * s, ey = cy + dy * s, a = Math.atan2(dy, dx);
      ctx.save();
      ctx.translate(ex, ey); ctx.rotate(a);
      ctx.fillStyle = rgba(rgb, 0.85);
      ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.7, -size * 0.7); ctx.lineTo(-size * 0.7, size * 0.7); ctx.closePath(); ctx.fill();
      ctx.restore();
    };
    for (const e of game.enemies) {
      if (!e.alive || e.state === 'dying') continue;
      const p = cam.toScreen(isoX(e.x, e.y), isoY(e.x, e.y) - 20);
      if (p.x < 0 || p.x > VIEW_W || p.y < 0 || p.y > VIEW_H) arrow(p.x, p.y, e.isBoss ? '255,140,40' : '255,50,60', e.isBoss ? 14 : 8);
    }
    if (game.waves.state === 'cleared') {
      const d = game.room.door;
      const p = cam.toScreen(isoX(d.x, 0), isoY(d.x, 0) - 60);
      if (p.x < 0 || p.x > VIEW_W || p.y < 0 || p.y > VIEW_H) arrow(p.x, p.y, '255,214,121', 14);
      else {
        const bob = Math.sin(this.time * 5) * 6;
        ctx.fillStyle = PAL.goldHi;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - 40 + bob); ctx.lineTo(p.x - 10, p.y - 56 + bob); ctx.lineTo(p.x + 10, p.y - 56 + bob); ctx.closePath(); ctx.fill();
        ctx.font = `bold 13px ${FONT_TITLE}`; ctx.textAlign = 'center';
        ctx.fillText('SAÍDA', p.x, p.y - 64 + bob);
      }
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// TELAS: título, pausa, melhorias, derrota e vitória
// ---------------------------------------------------------------------------
const CONTROLS = [
  ['WASD / Setas', 'Mover'],
  ['J', 'Ataque leve'],
  ['K', 'Ataque pesado (segure para carregar)'],
  ['L / Espaço', 'Esquiva (invencível)'],
  ['I', 'Especial — consome a fúria'],
  ['ESC', 'Pausa'], ['M', 'Som liga/desliga'], ['F1', 'Modo debug (hitboxes)'],
];
const COMBO_LIST = [
  ['Leve · Leve · Leve', 'Tríade Carmesim'],
  ['Leve · Leve · Pesado', 'Redemoinho de Aço'],
  ['Pesado (segurado)', 'Golpe Carregado'],
  ['Esquiva → Leve', 'Estocada Fantasma'],
];

class Screens {
  constructor() {
    this.embers = [];
    for (let i = 0; i < 70; i++) this.embers.push({ x: Math.random(), y: Math.random(), s: rand(1, 3), v: rand(0.02, 0.08), ph: rand(0, TAU) });
  }

  overlay(ctx, a = 0.72) {
    ctx.fillStyle = `rgba(5,2,8,${a})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  // Fundo animado com brasas (título e telas finais)
  drawEmbers(ctx, t, dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const e of this.embers) {
      e.y -= e.v * dt;
      if (e.y < -0.05) { e.y = 1.05; e.x = Math.random(); }
      const x = e.x * VIEW_W + Math.sin(t * 0.8 + e.ph) * 20, y = e.y * VIEW_H;
      GlowCache.draw(ctx, e.s > 2.2 ? '255,170,80' : '255,60,40', x, y, e.s * 5, 0.5 + 0.3 * Math.sin(t * 3 + e.ph));
    }
    ctx.restore();
  }

  drawTitle(ctx, t, dt) {
    const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
    g.addColorStop(0, '#0a0410'); g.addColorStop(0.6, '#1a0610'); g.addColorStop(1, '#2a0508');
    ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    // Silhuetas de ruínas
    ctx.fillStyle = '#07030a';
    const base = VIEW_H * 0.86;
    for (let i = 0; i < 9; i++) {
      const x = (i / 8) * VIEW_W, w = 40 + (i % 3) * 18, h = 120 + ((i * 53) % 140);
      ctx.fillRect(x - w / 2, base - h, w, h + 200);
      ctx.beginPath(); ctx.moveTo(x - w / 2, base - h); ctx.lineTo(x - w / 4, base - h - 18); ctx.lineTo(x + w / 6, base - h - 6); ctx.lineTo(x + w / 2, base - h - 22); ctx.lineTo(x + w / 2, base - h); ctx.fill();
    }
    ctx.fillRect(0, base, VIEW_W, VIEW_H - base);
    this.drawEmbers(ctx, t, dt);
    // Espada decorativa atrás do título
    ctx.save();
    ctx.translate(VIEW_W / 2, VIEW_H * 0.2);
    ctx.globalCompositeOperation = 'lighter';
    GlowCache.draw(ctx, '255,40,40', 0, 40, 220, 0.25 + 0.05 * Math.sin(t * 2));
    ctx.restore();
    ctx.save();
    ctx.translate(VIEW_W / 2, VIEW_H * 0.06);
    ctx.fillStyle = '#2a2a34';
    ctx.beginPath(); ctx.moveTo(-9, 40); ctx.lineTo(9, 40); ctx.lineTo(0, 250); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8a8fa0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 42); ctx.lineTo(0, 245); ctx.stroke();
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(-46, 32, 92, 9);
    ctx.fillRect(-4, -10, 8, 42);
    ctx.beginPath(); ctx.arc(0, -14, 8, 0, TAU); ctx.fill();
    ctx.restore();
    // Título
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 92px ${FONT_TITLE}`;
    glowText(ctx, 'RUÍNAS', VIEW_W / 2, VIEW_H * 0.27, '#f0dcb4', 'rgba(255,90,40,0.7)', 26);
    ctx.font = `bold 64px ${FONT_TITLE}`;
    glowText(ctx, 'CARMESIM', VIEW_W / 2, VIEW_H * 0.38, '#e0162f', 'rgba(255,20,40,0.95)', 30);
    ctx.font = `italic 18px ${FONT_TITLE}`;
    ctx.fillStyle = 'rgba(232,220,196,0.8)';
    ctx.fillText('Um guerreiro solitário. Ruínas infestadas. Nenhuma misericórdia.', VIEW_W / 2, VIEW_H * 0.46);
    ctx.restore();
    // Painel de controles e combos
    const pw = Math.min(860, VIEW_W - 80), px = (VIEW_W - pw) / 2, py = VIEW_H * 0.52, ph = 210;
    ctx.save();
    ctx.fillStyle = 'rgba(8,3,10,0.72)';
    roundRectPath(ctx, px, py, pw, ph, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(227,168,59,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.textBaseline = 'middle';
    const col = pw / 2;
    ctx.font = `bold 14px ${FONT_TITLE}`; ctx.fillStyle = PAL.gold; ctx.textAlign = 'left';
    ctx.fillText('CONTROLES', px + 24, py + 22);
    ctx.fillText('COMBOS', px + col + 14, py + 22);
    ctx.font = `13px ${FONT_UI}`;
    CONTROLS.forEach(([k, d], i) => {
      ctx.fillStyle = PAL.goldHi; ctx.fillText(k, px + 24, py + 48 + i * 19);
      ctx.fillStyle = '#d9cdb8'; ctx.fillText(d, px + 140, py + 48 + i * 19);
    });
    COMBO_LIST.forEach(([k, d], i) => {
      ctx.fillStyle = '#d9cdb8'; ctx.fillText(k, px + col + 14, py + 48 + i * 24);
      ctx.fillStyle = '#ff5a5a'; ctx.fillText(d, px + col + 190, py + 48 + i * 24);
    });
    ctx.fillStyle = 'rgba(217,205,184,0.65)'; ctx.font = `12px ${FONT_UI}`;
    ctx.fillText('Mais combos são desbloqueados entre as salas.', px + col + 14, py + 150);
    ctx.fillText('Gamepad: X leve · Y pesado · A esquiva · B/RB especial · Start pausa', px + col + 14, py + 172);
    ctx.restore();
    // Chamada para começar + recorde
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    ctx.font = `bold 22px ${FONT_TITLE}`;
    glowText(ctx, 'Pressione ENTER ou J para começar', VIEW_W / 2, VIEW_H * 0.9, PAL.goldHi, 'rgba(255,100,40,0.8)', 12);
    ctx.globalAlpha = 1;
    ctx.font = `13px ${FONT_UI}`; ctx.fillStyle = 'rgba(232,220,196,0.6)';
    if (game.best > 0) ctx.fillText(`Recorde: ${game.best.toLocaleString('pt-BR')} pontos`, VIEW_W / 2, VIEW_H * 0.955);
    ctx.restore();
  }

  drawPause(ctx) {
    this.overlay(ctx, 0.75);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 56px ${FONT_TITLE}`;
    glowText(ctx, 'PAUSADO', VIEW_W / 2, VIEW_H * 0.2, '#f0dcb4', 'rgba(255,40,40,0.8)', 20);
    ctx.font = `15px ${FONT_UI}`; ctx.fillStyle = '#d9cdb8';
    ctx.fillText('ESC — continuar      R — reiniciar      T — voltar ao título', VIEW_W / 2, VIEW_H * 0.29);
    // Combos conhecidos
    const p = game.player;
    const list = COMBO_LIST.slice();
    if (p.combo.unlocked.has('slam')) list.push(['Pesado · Pesado', 'Quebra-Terra']);
    if (p.combo.unlocked.has('uppercut')) list.push(['Leve · Pesado', 'Lâmina Ascendente']);
    if (p.combo.unlocked.has('wave')) list.push(['Esquiva → Pesado', 'Onda Lunar']);
    ctx.font = `bold 15px ${FONT_TITLE}`; ctx.fillStyle = PAL.gold;
    ctx.fillText('COMBOS', VIEW_W / 2 - 200, VIEW_H * 0.38);
    ctx.fillText('BÊNÇÃOS', VIEW_W / 2 + 200, VIEW_H * 0.38);
    ctx.font = `14px ${FONT_UI}`;
    // Colunas: sequência (alinhada à direita) → nome do combo (alinhado à esquerda)
    const cx = VIEW_W / 2 - 200;
    list.forEach(([k, n], i) => {
      const y = VIEW_H * 0.43 + i * 24;
      ctx.textAlign = 'right'; ctx.fillStyle = '#d9cdb8'; ctx.fillText(k, cx - 14, y);
      ctx.textAlign = 'center'; ctx.fillStyle = PAL.gold; ctx.fillText('→', cx, y);
      ctx.textAlign = 'left'; ctx.fillStyle = '#ff6a6a'; ctx.fillText(n, cx + 14, y);
    });
    ctx.textAlign = 'center';
    const ups = UPGRADES.filter((u) => game.upgrades.level(u.id) > 0);
    if (!ups.length) { ctx.fillStyle = 'rgba(217,205,184,0.6)'; ctx.fillText('Nenhuma ainda', VIEW_W / 2 + 200, VIEW_H * 0.43); }
    ups.forEach((u, i) => {
      ctx.fillStyle = '#d9cdb8';
      ctx.fillText(`${u.name}${u.max > 1 ? ` (${game.upgrades.level(u.id)}/${u.max})` : ''}`, VIEW_W / 2 + 200, VIEW_H * 0.43 + i * 24);
    });
    ctx.restore();
  }

  // Retângulos dos cartões de melhoria (também usados para o mouse)
  cardRects() {
    const n = game.upgradeChoices.length;
    const w = Math.min(260, (VIEW_W - 120) / 3 - 20), h = 330, gap = 28;
    const total = n * w + (n - 1) * gap, x0 = (VIEW_W - total) / 2, y = VIEW_H * 0.24;
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: x0 + i * (w + gap), y, w, h });
    return out;
  }

  drawUpgrade(ctx, t) {
    this.overlay(ctx, 0.8);
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 15px ${FONT_TITLE}`; ctx.fillStyle = PAL.gold;
    ctx.fillText(`${ROOM_DEFS[game.waves.roomIndex].name.toUpperCase()} PURIFICADO`, VIEW_W / 2, VIEW_H * 0.09);
    ctx.font = `bold 40px ${FONT_TITLE}`;
    glowText(ctx, 'ESCOLHA UMA BÊNÇÃO', VIEW_W / 2, VIEW_H * 0.155, '#f6e3bd', 'rgba(220,20,40,0.8)', 18);
    const rects = this.cardRects();
    game.upgradeChoices.forEach((u, i) => {
      const r = rects[i], sel = i === game.upgradeSel;
      const lift = sel ? -10 - Math.sin(t * 4) * 2 : 0;
      const lvl = game.upgrades.level(u.id);
      ctx.save();
      ctx.translate(0, lift);
      const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
      g.addColorStop(0, sel ? '#2a0d16' : '#1a0a12'); g.addColorStop(1, '#0a0409');
      ctx.fillStyle = g;
      roundRectPath(ctx, r.x, r.y, r.w, r.h, 12); ctx.fill();
      ctx.lineWidth = sel ? 3 : 1.5;
      ctx.strokeStyle = sel ? PAL.goldHi : u.combo ? 'rgba(227,168,59,0.7)' : 'rgba(200,16,46,0.6)';
      if (sel) { ctx.shadowColor = 'rgba(255,190,80,0.8)'; ctx.shadowBlur = 20; }
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Ícone com brilho
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      GlowCache.draw(ctx, u.combo ? '255,190,80' : '255,40,50', r.x + r.w / 2, r.y + 70, 60, sel ? 0.5 : 0.3);
      ctx.restore();
      drawIcon(ctx, u.icon, r.x + r.w / 2, r.y + 70, 54, u.combo ? PAL.goldHi : '#ff5a5a');
      ctx.font = `bold 11px ${FONT_UI}`; ctx.fillStyle = u.combo ? PAL.gold : '#c8102e';
      ctx.fillText(u.combo ? 'NOVO COMBO' : 'BÊNÇÃO', r.x + r.w / 2, r.y + 124);
      ctx.font = `bold 19px ${FONT_TITLE}`; ctx.fillStyle = '#f6e3bd';
      wrapText(ctx, u.name, r.w - 30).forEach((ln, k) => ctx.fillText(ln, r.x + r.w / 2, r.y + 150 + k * 22));
      ctx.font = `14px ${FONT_UI}`; ctx.fillStyle = '#cfc2ad';
      wrapText(ctx, u.desc, r.w - 36).forEach((ln, k) => ctx.fillText(ln, r.x + r.w / 2, r.y + 205 + k * 19));
      // Níveis
      if (u.max > 1) {
        for (let k = 0; k < u.max; k++) {
          ctx.fillStyle = k < lvl ? PAL.gold : k === lvl ? '#ff5a5a' : 'rgba(255,255,255,0.15)';
          ctx.beginPath(); ctx.arc(r.x + r.w / 2 + (k - (u.max - 1) / 2) * 16, r.y + r.h - 34, 5, 0, TAU); ctx.fill();
        }
      }
      ctx.font = `bold 13px ${FONT_UI}`; ctx.fillStyle = 'rgba(232,220,196,0.55)';
      ctx.fillText(`[${i + 1}]`, r.x + r.w / 2, r.y + r.h - 14);
      ctx.restore();
    });
    // Rodapé: almas, rerolagem e cura
    const fy = VIEW_H * 0.84;
    ctx.font = `bold 16px ${FONT_UI}`;
    ctx.fillStyle = '#ffe7b0';
    ctx.fillText(`Almas: ${game.stats.soulsBank}`, VIEW_W / 2, fy);
    ctx.font = `14px ${FONT_UI}`;
    const canR = game.stats.soulsBank >= game.rerollCost, canH = game.stats.soulsBank >= game.healCost && game.player.hp < game.player.maxHp;
    ctx.fillStyle = canR ? '#d9cdb8' : 'rgba(217,205,184,0.35)';
    ctx.fillText(`[R / X] Rerolar opções — ${game.rerollCost} almas`, VIEW_W / 2 - 200, fy + 30);
    ctx.fillStyle = canH ? '#d9cdb8' : 'rgba(217,205,184,0.35)';
    ctx.fillText(`[C / Y] Restaurar 40% da vida — ${game.healCost} almas`, VIEW_W / 2 + 200, fy + 30);
    ctx.fillStyle = 'rgba(232,220,196,0.6)'; ctx.font = `13px ${FONT_UI}`;
    ctx.fillText('← → escolher   ·   J / Enter confirmar   ·   1 2 3 ou clique', VIEW_W / 2, fy + 60);
    ctx.restore();
  }

  drawEnd(ctx, victory, t, dt) {
    this.overlay(ctx, victory ? 0.72 : 0.78);
    this.drawEmbers(ctx, t, dt);
    const s = game.stats;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold 76px ${FONT_TITLE}`;
    if (victory) glowText(ctx, 'VITÓRIA', VIEW_W / 2, VIEW_H * 0.15, PAL.goldHi, 'rgba(255,170,60,0.9)', 30);
    else glowText(ctx, 'VOCÊ TOMBOU', VIEW_W / 2, VIEW_H * 0.15, '#e0162f', 'rgba(255,20,40,0.9)', 30);
    ctx.font = `italic 18px ${FONT_TITLE}`; ctx.fillStyle = 'rgba(232,220,196,0.8)';
    ctx.fillText(victory ? 'O Arauto Carmesim foi destruído. As ruínas enfim silenciam.' : `As ruínas reclamam mais uma alma em ${ROOM_DEFS[game.waves.roomIndex].name}.`, VIEW_W / 2, VIEW_H * 0.25);
    const rows = [
      ['Tempo', formatTime(s.time)],
      ['Inimigos derrotados', s.kills],
      ['Maior combo', `${game.counter.best} hits`],
      ['Pontuação', Math.round(s.score).toLocaleString('pt-BR')],
      ['Almas coletadas', s.soulsTotal],
      ['Dano causado', Math.round(s.dmgDealt).toLocaleString('pt-BR')],
      ['Dano recebido', Math.round(s.dmgTaken)],
      ['Salas purificadas', `${s.roomsCleared} / 6`],
    ];
    const pw = 460, px = VIEW_W / 2 - pw / 2, py = VIEW_H * 0.31;
    ctx.fillStyle = 'rgba(8,3,10,0.75)';
    roundRectPath(ctx, px, py, pw, rows.length * 30 + 24, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(227,168,59,0.5)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = `16px ${FONT_UI}`;
    rows.forEach(([k, v], i) => {
      const y = py + 27 + i * 30;
      ctx.textAlign = 'left'; ctx.fillStyle = '#cfc2ad'; ctx.fillText(k, px + 28, y);
      ctx.textAlign = 'right'; ctx.fillStyle = PAL.goldHi; ctx.fillText(String(v), px + pw - 28, y);
    });
    ctx.textAlign = 'center';
    if (victory) {
      ctx.font = `bold 15px ${FONT_TITLE}`; ctx.fillStyle = PAL.gold;
      ctx.fillText('CLASSIFICAÇÃO', px + pw + 90, py + 30);
      ctx.font = `bold 96px ${FONT_TITLE}`;
      glowText(ctx, game.rank, px + pw + 90, py + 110, game.rank === 'S' ? PAL.goldHi : '#f0dcb4', 'rgba(255,60,40,0.9)', 24);
    }
    if (game.newRecord) {
      ctx.font = `bold 20px ${FONT_TITLE}`;
      glowText(ctx, 'NOVO RECORDE!', VIEW_W / 2, py + rows.length * 30 + 52, PAL.goldHi, 'rgba(255,150,40,0.9)', 14);
    }
    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(t * 4);
    ctx.font = `bold 20px ${FONT_TITLE}`;
    glowText(ctx, 'ENTER — jogar novamente      T — título', VIEW_W / 2, VIEW_H * 0.92, '#f0dcb4', 'rgba(255,80,40,0.8)', 10);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// JOGO: loop principal, estados, eventos de combate e pipeline de renderização
// ---------------------------------------------------------------------------
class Game {
  constructor() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.input = new Input(this.canvas);
    this.audio = new AudioSys();
    this.input.onFirstInput = () => this.audio.unlock();
    this.camera = new Camera();
    this.camera.baseZoom = 1.22;
    this.particles = new ParticleSystem();
    this.texts = new FloatingTexts();
    this.trails = new SlashTrails();
    this.lighting = new Lighting();
    this.projectiles = new ProjectileSystem();
    this.pickups = new PickupSystem();
    this.hazards = new HazardSystem();
    this.director = new AIDirector();
    this.waves = new WaveManager();
    this.hud = new HUD();
    this.screens = new Screens();
    this.upgrades = new UpgradeSystem();
    this.counter = new ComboCounter();
    this.enemies = [];
    this.player = null; this.room = null; this.boss = null;
    this.state = 'title';
    this.time = 0; this.realTime = 0;
    this.hitStop = 0; this.timeScale = 1; this.slowTimer = 0;
    this.screenFlash = { rgb: '255,255,255', a: 0 };
    this.hurtVignette = 0;
    this.fade = 0; this.fadeTarget = 0; this.fadeCb = null;
    this.debug = false;
    this.glows = []; this.glowCount = 0;
    this.drawList = [];
    this.tmpV = { x: 0, y: 0 };
    this.nullInput = { move: { x: 0, y: 0 }, held: {}, pressed: {}, released: {} };
    this.upgradeChoices = []; this.upgradeSel = 0; this.upgradeLock = 0;
    this.rerollCost = 12; this.healCost = 20;
    this.victoryTimer = 0; this.endLock = 0;
    this.lastDodge = 0;
    this.rank = 'C'; this.newRecord = false;
    this.best = 0;
    try { this.best = parseInt(localStorage.getItem('ruinas_carmesim_best') || '0', 10) || 0; } catch (e) { this.best = 0; }
    this.stats = this.freshStats();
    this.fps = 60; this.fpsAcc = 0; this.fpsFrames = 0;
    this.errors = new Set();
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.last = performance.now();
    this.loopBound = (t) => this.loop(t);
    requestAnimationFrame(this.loopBound);
  }

  freshStats() {
    return { score: 0, kills: 0, time: 0, soulsBank: 0, soulsTotal: 0, dmgDealt: 0, dmgTaken: 0, roomsCleared: 0 };
  }

  // Ajusta a resolução interna à janela (nítido em telas de alta densidade)
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = Math.max(320, window.innerWidth), ch = Math.max(240, window.innerHeight);
    VIEW_W = Math.round(clamp((VIEW_H * cw) / ch, 960, 1760));
    this.canvas.width = Math.floor(cw * dpr);
    this.canvas.height = Math.floor(ch * dpr);
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    this.scale = Math.min(this.canvas.width / VIEW_W, this.canvas.height / VIEW_H);
    this.offX = (this.canvas.width - VIEW_W * this.scale) / 2;
    this.offY = (this.canvas.height - VIEW_H * this.scale) / 2;
    this.lighting.resize();
    this.buildVignettes();
    if (this.room) this.room.render(this.roomScale());
  }
  roomScale() { return clamp(this.scale * this.camera.baseZoom, 1, 2); }

  buildVignettes() {
    const mk = (inner, outer) => {
      const c = document.createElement('canvas');
      c.width = Math.max(2, Math.ceil(VIEW_W / 2)); c.height = Math.ceil(VIEW_H / 2);
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(c.width / 2, c.height / 2, c.height * 0.35, c.width / 2, c.height / 2, c.width * 0.62);
      gr.addColorStop(0, inner); gr.addColorStop(1, outer);
      g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
      return c;
    };
    this.vignette = mk('rgba(0,0,0,0)', 'rgba(0,0,0,0.75)');
    this.redVignette = mk('rgba(120,0,10,0)', 'rgba(200,0,20,0.85)');
  }

  // Converte coordenadas do mouse em coordenadas lógicas
  toLogical(cx, cy) {
    const r = this.canvas.getBoundingClientRect();
    const kx = this.canvas.width / (r.width || 1), ky = this.canvas.height / (r.height || 1);
    return { x: ((cx - r.left) * kx - this.offX) / this.scale, y: ((cy - r.top) * ky - this.offY) / this.scale };
  }

  onBlur() { if (this.state === 'playing') this.state = 'paused'; }

  loop(now) {
    const raw = Math.min(0.1, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    this.fpsAcc += raw; this.fpsFrames++;
    if (this.fpsAcc >= 0.5) { this.fps = Math.round(this.fpsFrames / this.fpsAcc); this.fpsAcc = 0; this.fpsFrames = 0; }
    const dt = Math.min(raw, MAX_DT);
    try {
      this.update(dt);
      this.render(dt);
    } catch (e) {
      // Um erro inesperado nunca deve congelar o jogo; registra uma única vez
      const key = String(e && e.message);
      if (!this.errors.has(key)) { this.errors.add(key); console.error(e); }
    }
    requestAnimationFrame(this.loopBound);
  }

  // ------------------------------------------------------------ atualização
  update(dt) {
    const inp = this.input;
    inp.update();
    this.realTime += dt;
    if (inp.pressed.mute) this.audio.toggleMute();
    if (inp.pressed.debug) this.debug = !this.debug;
    if (this.fade !== this.fadeTarget) {
      this.fade = approach(this.fade, this.fadeTarget, dt * 3.2);
      if (this.fade === this.fadeTarget && this.fadeCb) { const cb = this.fadeCb; this.fadeCb = null; cb(); }
    }
    if (this.screenFlash.a > 0) this.screenFlash.a = Math.max(0, this.screenFlash.a - dt * 2.4);
    if (this.hurtVignette > 0) this.hurtVignette = Math.max(0, this.hurtVignette - dt * 1.6);

    switch (this.state) {
      case 'title':
        if (!this.fadeCb && (inp.pressed.confirm || inp.mouse.clicked)) { this.audio.unlock(); this.audio.play('uiSelect'); this.fadeTo(() => this.startRun()); }
        break;
      case 'playing': this.updatePlaying(dt); break;
      case 'paused': this.updatePaused(); break;
      case 'upgrade': this.updateUpgrade(dt); break;
      case 'gameover':
      case 'victory': this.updateEnd(dt); break;
    }
    this.camera.update(dt);
    inp.endFrame();
  }

  fadeTo(cb) { this.fadeTarget = 1; this.fadeCb = cb; }

  startRun() {
    this.audio.unlock();
    this.audio.startAmbient();
    this.stats = this.freshStats();
    this.upgrades.reset();
    this.counter = new ComboCounter();
    this.player = new Player(0, 0);
    this.hud.reset();
    this.rerollCost = 12;
    this.victoryTimer = 0;
    this.newRecord = false;
    this.timeScale = 1; this.slowTimer = 0; this.hitStop = 0;
    this.loadRoom(0);
    this.state = 'playing';
    this.fade = 1; this.fadeTarget = 0;
  }

  loadRoom(i) {
    this.enemies.length = 0;
    this.projectiles.clear(); this.pickups.clear(); this.particles.clear();
    this.hazards.clear(); this.trails.clear(); this.texts.clear();
    this.boss = null;
    this.counter.reset(true);
    this.room = new Room(i);
    this.room.render(this.roomScale());
    this.director.reset(i);
    const p = this.player;
    p.x = this.room.w / 2; p.y = this.room.h - 70; p.z = 0;
    p.vx = p.vy = p.kbx = p.kby = 0;
    p.facing = -Math.PI * 0.75;
    p.state = 'idle'; p.stateTime = 0; p.attack = null;
    p.combo.reset();
    this.camera.snap(isoX(p.x, p.y), isoY(p.x, p.y) - 30);
    this.waves.startRoom(i);
  }

  updatePlaying(dt) {
    const inp = this.input, p = this.player;
    if (inp.pressed.pause && !this.fadeCb) { this.state = 'paused'; this.audio.play('uiMove'); return; }
    if (this.debug) {
      if (inp.pressed.debugKill) {
        if (this.waves.state === 'intro') this.waves.timer = 0;
        for (const e of this.enemies) if (e.canBeHit()) e.takeHit({ dmg: 99999, kx: 0, ky: 0, kb: 0, launch: 0, stun: 0, heavy: true, crit: false });
      }
      if (inp.pressed.debugFury) { p.fury = 100; p.hp = p.maxHp; }
    }
    if (!this.fadeCb) p.captureInput(inp);
    this.hud.update(dt);
    // Hit stop: congela a simulação por alguns milissegundos a cada impacto
    if (this.hitStop > 0) { this.hitStop -= dt; return; }
    if (this.slowTimer > 0) { this.slowTimer -= dt; if (this.slowTimer <= 0) this.timeScale = 1; }
    const sdt = dt * this.timeScale;
    this.time += sdt;
    if (p.state !== 'dead' && this.waves.state !== 'exiting' && this.victoryTimer <= 0) this.stats.time += dt;

    p.update(sdt, this.fadeCb ? this.nullInput : inp);
    for (const e of this.enemies) e.update(sdt);
    this.separate();
    this.director.update();
    this.projectiles.update(sdt);
    this.hazards.update(sdt);
    this.pickups.update(sdt);
    this.particles.update(sdt);
    this.texts.update(sdt);
    this.trails.update(sdt);
    this.counter.update(sdt);
    this.room.update(sdt);
    this.waves.update(sdt);
    // Remove inimigos que terminaram a animação de morte
    let w = 0;
    for (let i = 0; i < this.enemies.length; i++) { const e = this.enemies[i]; if (e.alive) this.enemies[w++] = e; }
    this.enemies.length = w;

    // Câmera com leve antecipação do movimento
    const lx = p.x + p.vx * 0.18, ly = p.y + p.vy * 0.18;
    this.camera.follow(isoX(lx, ly), isoY(lx, ly) - 30, dt);

    if (p.state === 'dead' && p.stateTime > 2.2 && !this.fadeCb) this.fadeTo(() => this.endRun(false));
    if (this.victoryTimer > 0) {
      this.victoryTimer -= dt;
      if (this.victoryTimer <= 0 && !this.fadeCb) this.fadeTo(() => this.endRun(true));
    }
  }

  // Separação entre corpos (inimigos entre si e com o jogador)
  separate() {
    const list = this.enemies, p = this.player;
    const pSolid = p.state !== 'dash' && p.state !== 'special' && p.state !== 'dead' &&
      !(p.state === 'attack' && p.attack && p.attack.def.thrust);
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (a.state === 'dying' || a.state === 'spawn') continue;
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        if (b.state === 'dying' || b.state === 'spawn') continue;
        const dx = b.x - a.x, dy = b.y - a.y, min = a.radius + b.radius, d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.0001) {
          const d = Math.sqrt(d2), push = min - d, nx = dx / d, ny = dy / d;
          const ka = b.mass / (a.mass + b.mass), kb = 1 - ka;
          a.x -= nx * push * ka; a.y -= ny * push * ka;
          b.x += nx * push * kb; b.y += ny * push * kb;
        }
      }
      if (pSolid && a.z < 30 && !a.jumpZ) {
        const dx = p.x - a.x, dy = p.y - a.y, min = a.radius + p.radius, d2 = dx * dx + dy * dy;
        if (d2 < min * min && d2 > 0.0001) {
          const d = Math.sqrt(d2), push = min - d, nx = dx / d, ny = dy / d;
          const k = a.mass / (a.mass + 1.2);
          p.x += nx * push * k; p.y += ny * push * k;
          a.x -= nx * push * (1 - k); a.y -= ny * push * (1 - k);
        }
      }
    }
  }

  // ---------------------------------------------------- eventos de combate
  addHitStop(t) { this.hitStop = Math.max(this.hitStop, Math.min(t, 0.2)); }
  slowMo(scale, dur) { this.timeScale = Math.min(this.timeScale, scale); this.slowTimer = Math.max(this.slowTimer, dur); }
  flashScreen(rgb, a) { this.screenFlash.rgb = rgb; this.screenFlash.a = Math.max(this.screenFlash.a, a); }

  // Todo acerto do jogador passa por aqui: hit stop, tremor, faíscas, números, combo
  onEnemyHit(e, dmg, crit, def, kx, ky) {
    const p = this.player;
    this.stats.dmgDealt += dmg;
    this.counter.addHit();
    this.stats.score += Math.round(dmg * 10 * this.counter.mult);
    p.addFury((def.fury || 3) + dmg * 0.06);
    p.applyLifesteal(dmg);
    this.addHitStop((def.hitstop || 0.04) * (crit ? 1.35 : 1) * (e.isBoss ? 0.8 : 1));
    this.camera.shake((def.shake || 0.1) * (crit ? 1.4 : 1));
    if (def.zoom) this.camera.zoomPunch(def.zoom);
    const dir = Math.atan2(ky, kx);
    const hz = Math.min(e.height * 0.55, 46) + e.z;
    const hx = e.x - kx * e.radius * 0.6, hy = e.y - ky * e.radius * 0.6;
    this.particles.sparks(hx, hy, hz, dir, crit ? 16 : def.heavy ? 12 : 8, crit ? '255,244,190' : '255,204,120', def.heavy ? 560 : 420);
    this.particles.flash(hx, hy, hz, crit ? 48 : def.heavy ? 38 : 26, crit ? '255,250,230' : '255,214,170', 0.1);
    this.particles.blood(e.x, e.y, hz, dir, def.heavy ? 8 : 5, e.T.blood);
    if (def.heavy) this.particles.ring(e.x, e.y, 42, '255,200,140', 0.22, 4);
    this.texts.spawn(e.x, e.y, (e.height || 40) + e.z + (e.jumpZ || 0), crit ? `${dmg}!` : dmg,
      crit ? PAL.goldHi : def.heavy ? '#ffb46b' : '#ffffff', crit ? 31 : def.heavy ? 25 : 21);
    this.audio.play(def.heavy ? 'hitHeavy' : 'hit');
    if (crit) this.audio.play('crit');
  }

  onEnemyKilled(e) {
    const p = this.player;
    this.stats.kills++;
    this.stats.score += Math.round(e.T.score * this.counter.mult);
    // Almas (moeda) e orbes de vida
    const total = Math.max(1, Math.round(randInt(e.T.souls[0], e.T.souls[1]) * p.stats.soulMult));
    const n = Math.min(total, e.isBoss ? 16 : 6);
    for (let i = 0; i < n; i++) this.pickups.drop('soul', e.x, e.y, Math.floor(total / n) + (i < total % n ? 1 : 0));
    if (!e.isBoss && Math.random() < e.T.orb + p.stats.orbChance) this.pickups.drop('health', e.x, e.y, 12);
    // Efeitos de morte
    this.particles.blood(e.x, e.y, 22, rand(0, TAU), 14, e.T.blood);
    this.particles.smoke(e.x, e.y, 10, 6, '25,12,30', e.radius);
    this.particles.embers(e.x, e.y, 10, 10, '255,60,40', e.radius, 90);
    this.particles.flash(e.x, e.y, 20, e.radius * 3, '255,120,100', 0.15);
    this.room.addDecal(e.x, e.y, e.radius * 1.2, e.T.blood);
    this.audio.play('enemyDeath', e.radius > 20 ? 0.6 : 1);
    this.camera.shake(e.radius > 20 ? 0.3 : 0.08);
    // Último inimigo da sala: câmera lenta dramática
    const wv = this.waves;
    if (!e.isBoss && wv.state === 'fighting' && wv.aliveCount() === 0 && wv.waveIndex === wv.def.waves.length - 1) {
      this.slowMo(0.25, 0.7);
      this.camera.zoomPunch(0.05);
    }
  }

  collectSoul(v, x, y) {
    this.stats.soulsBank += v;
    this.stats.soulsTotal += v;
    this.stats.score += v * 5;
    this.audio.play('soul');
    this.particles.flash(x, y, 20, 18, '255,210,120', 0.12);
  }

  onPlayerHurt(dmg, dx, dy) {
    const p = this.player;
    this.stats.dmgTaken += dmg;
    this.counter.reset();
    this.texts.spawn(p.x, p.y, 52, `-${dmg}`, '#ff3b4f', 25);
    this.camera.shake(0.35);
    this.addHitStop(0.07);
    this.hurtVignette = 0.55;
    this.particles.blood(p.x, p.y, 26, Math.atan2(dy, dx), 8, '150,10,20');
    this.particles.sparks(p.x, p.y, 26, Math.atan2(dy, dx), 6, '255,90,80', 300);
    this.audio.play('playerHurt');
    this.flashScreen('255,20,30', 0.22);
  }

  onPlayerDeath() {
    this.slowMo(0.3, 1.4);
    this.camera.shake(0.6);
    this.camera.zoomPunch(0.08);
    this.audio.play('defeat');
    this.hud.message('VOCÊ TOMBOU', '', 2.2);
  }

  onPerfectDodge(p) {
    if (this.realTime - this.lastDodge < 0.35) return;
    this.lastDodge = this.realTime;
    this.texts.spawn(p.x, p.y, 64, 'ESQUIVA PERFEITA!', '#9fd6ff', 17, 1.0);
    p.addFury(10);
    this.slowMo(0.35, 0.22);
    this.particles.ring(p.x, p.y, 60, '150,210,255', 0.35, 5);
    this.audio.play('chargeTier', 1);
  }

  onDeflect(proj) {
    const p = this.player;
    p.addFury(3);
    this.stats.score += 25;
    this.texts.spawn(proj.x, proj.y, proj.z + 10, 'APARADO', '#ffd679', 15, 0.6);
    this.particles.sparks(proj.x, proj.y, proj.z, proj.angle + Math.PI, 10, '255,230,160', 380, 1.2);
    this.audio.play('deflect');
    this.addHitStop(0.03);
  }

  onBossDying(b) {
    this.slowMo(0.25, 2.2);
    this.flashScreen('255,240,220', 0.85);
    this.camera.shake(1);
    this.camera.zoomPunch(0.1);
    this.audio.play('bossRoar');
    this.audio.play('explosion');
    this.hud.message('O ARAUTO CAIU', '', 2.6, false, true);
    for (const e of this.enemies) if (e !== b && e.canBeHit()) e.die({ kx: 0, ky: 0 });
  }

  onBossDefeated(b) {
    this.particles.flash(b.x, b.y, 60, 260, '255,200,140', 0.5);
    this.particles.ring(b.x, b.y, 380, '255,190,90', 1.0, 18);
    for (let i = 0; i < 6; i++) this.particles.sparks(b.x, b.y, 60, (i / 6) * TAU, 14, '255,210,140', 700, 0.8);
    this.particles.embers(b.x, b.y, 20, 50, '255,120,40', 80, 200);
    this.camera.shake(0.8);
    this.audio.play('explosion');
    this.pickups.attractAll();
    this.stats.roomsCleared++;
    this.victoryTimer = 2.4;
  }

  exitRoom() {
    this.audio.play('uiSelect');
    this.fadeTo(() => this.openUpgrade());
  }

  // ------------------------------------------------------- tela de melhorias
  openUpgrade() {
    this.upgradeChoices = this.upgrades.roll(3);
    this.upgradeSel = Math.min(1, this.upgradeChoices.length - 1);
    this.healCost = 20 + this.waves.roomIndex * 5;
    this.upgradeLock = 0.35;
    this.fadeTarget = 0;
    if (!this.upgradeChoices.length) { this.goToNextRoom(); return; }
    this.state = 'upgrade';
  }

  goToNextRoom() {
    const next = this.waves.roomIndex + 1;
    this.fadeTo(() => { this.state = 'playing'; this.loadRoom(next); this.fadeTarget = 0; });
  }

  chooseUpgrade(i) {
    const u = this.upgradeChoices[i];
    if (!u || this.fadeCb) return;
    this.upgrades.apply(u, this.player);
    this.audio.play('upgrade');
    this.goToNextRoom();
  }

  updateUpgrade(dt) {
    if (this.upgradeLock > 0) { this.upgradeLock -= dt; return; }
    if (this.fadeCb) return;
    const inp = this.input, n = this.upgradeChoices.length;
    if (inp.pressed.left) { this.upgradeSel = (this.upgradeSel + n - 1) % n; this.audio.play('uiMove'); }
    if (inp.pressed.right) { this.upgradeSel = (this.upgradeSel + 1) % n; this.audio.play('uiMove'); }
    const rects = this.screens.cardRects();
    if (inp.mouse.moved || inp.mouse.clicked) {
      rects.forEach((r, i) => {
        if (inp.mouse.x >= r.x && inp.mouse.x <= r.x + r.w && inp.mouse.y >= r.y && inp.mouse.y <= r.y + r.h) {
          if (this.upgradeSel !== i) { this.upgradeSel = i; this.audio.play('uiMove'); }
          if (inp.mouse.clicked) this.chooseUpgrade(i);
        }
      });
    }
    if (inp.pressed.one) this.chooseUpgrade(0);
    else if (inp.pressed.two) this.chooseUpgrade(1);
    else if (inp.pressed.three) this.chooseUpgrade(2);
    else if (inp.pressed.confirm) this.chooseUpgrade(this.upgradeSel);
    if (inp.pressed.reroll) {
      if (this.stats.soulsBank >= this.rerollCost) {
        this.stats.soulsBank -= this.rerollCost;
        this.rerollCost += 6;
        this.upgradeChoices = this.upgrades.roll(3);
        this.upgradeSel = Math.min(this.upgradeSel, this.upgradeChoices.length - 1);
        this.audio.play('uiSelect');
      } else this.audio.play('uiDeny');
    }
    if (inp.pressed.buyHeal) {
      const p = this.player;
      if (this.stats.soulsBank >= this.healCost && p.hp < p.maxHp) {
        this.stats.soulsBank -= this.healCost;
        p.heal(Math.round(p.maxHp * 0.4), false);
        this.hud.ghostHp = p.hp;
        this.audio.play('health');
      } else this.audio.play('uiDeny');
    }
  }

  updatePaused() {
    const inp = this.input;
    if (inp.pressed.pause) { this.state = 'playing'; this.audio.play('uiMove'); }
    else if (inp.pressed.restart && !this.fadeCb) this.fadeTo(() => this.startRun());
    else if (inp.pressed.toTitle && !this.fadeCb) this.fadeTo(() => { this.state = 'title'; this.audio.stopAmbient(); this.fadeTarget = 0; });
  }

  endRun(victory) {
    this.state = victory ? 'victory' : 'gameover';
    this.fadeTarget = 0;
    this.endLock = 1.0;
    const s = this.stats;
    // Classificação final (tempo, dano recebido e maior combo)
    let pts = 0;
    if (s.time < 900) pts++;
    if (s.dmgTaken < 300) pts++;
    if (this.counter.best >= 40) pts++;
    this.rank = ['C', 'B', 'A', 'S'][pts];
    if (s.score > this.best) {
      this.best = Math.round(s.score);
      this.newRecord = true;
      try { localStorage.setItem('ruinas_carmesim_best', String(this.best)); } catch (e) { /* armazenamento indisponível */ }
    } else this.newRecord = false;
    if (victory) this.audio.play('victory');
    this.audio.stopAmbient();
  }

  updateEnd(dt) {
    this.particles.update(dt);
    this.texts.update(dt);
    this.trails.update(dt);
    if (this.endLock > 0) { this.endLock -= dt; return; }
    const inp = this.input;
    if (this.fadeCb) return;
    if (inp.pressed.confirm || inp.mouse.clicked) { this.audio.play('uiSelect'); this.fadeTo(() => this.startRun()); }
    else if (inp.pressed.toTitle || inp.pressed.pause) this.fadeTo(() => { this.state = 'title'; this.fadeTarget = 0; });
  }

  // --------------------------------------------------------------- desenho
  // Registra um brilho (desenhado depois da escuridão); coordenadas no sistema atual do ctx
  addGlow(ctx, x, y, r, rgb, a) {
    if (this.glowCount >= 200) return;
    const m = ctx.getTransform();
    let g = this.glows[this.glowCount];
    if (!g) g = this.glows[this.glowCount] = { x: 0, y: 0, r: 0, rgb: '', a: 0 };
    g.x = m.a * x + m.c * y + m.e; g.y = m.b * x + m.d * y + m.f;
    g.r = r * Math.hypot(m.a, m.b); g.rgb = rgb; g.a = a;
    this.glowCount++;
  }

  drawGlows(ctx) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.glowCount; i++) {
      const g = this.glows[i];
      GlowCache.draw(ctx, g.rgb, g.x, g.y, g.r, g.a);
    }
    ctx.restore();
  }

  render(dt) {
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(this.scale, 0, 0, this.scale, this.offX, this.offY);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, VIEW_W, VIEW_H); ctx.clip();
    if (this.state === 'title') {
      this.screens.drawTitle(ctx, this.realTime, dt);
    } else if (this.player && this.room) {
      this.renderWorld(ctx);
      this.renderScreenFx(ctx);
      if (this.state === 'playing' || this.state === 'paused') this.hud.draw(ctx);
      if (this.state === 'paused') this.screens.drawPause(ctx);
      else if (this.state === 'upgrade') this.screens.drawUpgrade(ctx, this.realTime);
      else if (this.state === 'gameover') this.screens.drawEnd(ctx, false, this.realTime, dt);
      else if (this.state === 'victory') this.screens.drawEnd(ctx, true, this.realTime, dt);
    }
    if (this.debug) this.drawDebugInfo(ctx);
    if (this.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${this.fade.toFixed(3)})`; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    ctx.restore();
  }

  renderWorld(ctx) {
    const p = this.player, cam = this.camera, room = this.room, t = this.time;
    this.glowCount = 0;
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // 1) Camada sólida: cenário, sombras e corpos ordenados por profundidade
    ctx.save();
    cam.apply(ctx);
    room.drawBackground(ctx);
    room.drawDoor(ctx);
    p.drawShadow(ctx);
    for (const e of this.enemies) if (e.state !== 'spawn') e.drawShadow(ctx);
    this.projectiles.drawShadows(ctx);
    const list = this.drawList;
    list.length = 0;
    list.push(p);
    for (const e of this.enemies) list.push(e);
    for (const pl of room.pillars) list.push(pl);
    list.sort((a, b) => (a.x + a.y) - (b.x + b.y));
    for (const o of list) {
      if (o.sprite !== undefined) drawPillar(ctx, o, p);
      else o.draw(ctx);
    }
    this.particles.drawSolid(ctx);
    ctx.restore();

    // 2) Escuridão com luzes (jogador, tochas, projéteis, chefe)
    const L = this.lighting;
    L.clear();
    const flick = Math.sin(this.realTime * 9) * 6 + Math.sin(this.realTime * 23) * 3;
    L.add(isoX(p.x, p.y), isoY(p.x, p.y) - 30, (p.state === 'special' ? 620 : 470) + flick, 1);
    room.addLights(L, this.realTime);
    this.projectiles.addLights(L);
    for (const e of this.enemies) {
      if (e.isBoss) L.add(isoX(e.x, e.y), isoY(e.x, e.y) - 60 - e.jumpZ, e.phase === 3 ? 300 : 220, 0.7);
      else if (e.telegraph) L.add(isoX(e.x, e.y), isoY(e.x, e.y) - 20, 90, 0.45);
    }
    for (const h of this.hazards.list) if (h.fired || h.kind === 'ring') L.add(isoX(h.x, h.y), isoY(h.x, h.y) - 20, h.kind === 'ring' ? 200 : 150, 0.6);
    L.render(ctx, cam, room.def.boss ? 0.86 : 0.8);

    // 3) Camada emissiva: tochas, avisos, coletáveis, projéteis, faíscas e rastros
    ctx.save();
    cam.apply(ctx);
    room.drawEmissive(ctx, this.realTime);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    GlowCache.drawFlat(ctx, '255,140,70', isoX(p.x, p.y), isoY(p.x, p.y), 260, 0.16);
    if (p.state === 'charge') GlowCache.drawFlat(ctx, '255,40,40', isoX(p.x, p.y), isoY(p.x, p.y), 60 + p.chargeLevel * 30, 0.4 + 0.1 * p.chargeLevel);
    ctx.restore();
    for (const e of this.enemies) {
      if (e.telegraph) drawTelegraph(ctx, e.telegraph, e.tgProgress, t);
      if (e.state === 'spawn') this.drawSpawnSigil(ctx, e);
    }
    this.hazards.draw(ctx, t);
    this.pickups.draw(ctx, this.realTime);
    this.projectiles.draw(ctx);
    this.particles.drawEmissive(ctx);
    this.trails.draw(ctx);
    ctx.restore();
    this.drawGlows(ctx);

    // 4) Sobreposições do mundo: barras de vida, números de dano e debug
    ctx.save();
    cam.apply(ctx);
    for (const e of this.enemies) if (!e.isBoss) e.drawHpBar(ctx);
    this.texts.draw(ctx);
    if (this.debug) {
      room.drawDebug(ctx);
      for (const e of this.enemies) e.drawDebug(ctx);
      p.drawDebug(ctx);
      this.projectiles.drawDebug(ctx);
    }
    ctx.restore();
  }

  // Selo vermelho no chão enquanto um inimigo emerge
  drawSpawnSigil(ctx, e) {
    const k = clamp(e.stateTime / e.spawnDur, 0, 1), r = e.radius * 2.3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    GlowCache.drawFlat(ctx, '255,30,50', isoX(e.x, e.y), isoY(e.x, e.y), r * 2.2, 0.5 * (1 - k * 0.5));
    ctx.strokeStyle = rgba('255,50,70', 0.85 * (1 - k * 0.4));
    ctx.lineWidth = 2;
    isoCirclePath(ctx, e.x, e.y, r); ctx.stroke();
    isoCirclePath(ctx, e.x, e.y, r * 0.62); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + this.realTime * 2.5;
      const x0 = e.x + Math.cos(a) * r * 0.62, y0 = e.y + Math.sin(a) * r * 0.62;
      const x1 = e.x + Math.cos(a + 0.5) * r, y1 = e.y + Math.sin(a + 0.5) * r;
      ctx.moveTo(isoX(x0, y0), isoY(x0, y0)); ctx.lineTo(isoX(x1, y1), isoY(x1, y1));
    }
    ctx.stroke();
    ctx.restore();
  }

  renderScreenFx(ctx) {
    ctx.drawImage(this.vignette, 0, 0, VIEW_W, VIEW_H);
    const p = this.player;
    let red = this.hurtVignette;
    if (p.state !== 'dead' && p.hp / p.maxHp < 0.3) red = Math.max(red, 0.3 + 0.18 * Math.sin(this.realTime * 6));
    if (red > 0) { ctx.globalAlpha = clamp(red, 0, 1); ctx.drawImage(this.redVignette, 0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1; }
    if (this.screenFlash.a > 0) {
      ctx.fillStyle = rgba(this.screenFlash.rgb, this.screenFlash.a);
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
  }

  drawDebugInfo(ctx) {
    const p = this.player;
    const lines = [
      `FPS: ${this.fps}   VIEW: ${VIEW_W}x${VIEW_H}   escala: ${this.scale.toFixed(2)}`,
      `Partículas: ${this.particles.count}/${this.particles.max}   Projéteis: ${this.projectiles.count}/${this.projectiles.items.length}   Coletáveis: ${this.pickups.count}`,
      `Inimigos: ${this.enemies.length}   Fichas de ataque: ${this.director.tokens.size}/${this.director.maxTokens}   Perigos: ${this.hazards.list.length}`,
    ];
    if (p && this.state !== 'title') {
      lines.push(`Jogador: ${p.state}  invuln: ${Math.max(0, p.invuln).toFixed(2)}  cadeia: "${p.combo.seq}"  buffer: ${p.combo.buffer || '-'}  janela esquiva: ${Math.max(0, p.combo.dashWindow).toFixed(2)}`);
      lines.push(`Hit stop: ${Math.max(0, this.hitStop).toFixed(3)}  escala de tempo: ${this.timeScale.toFixed(2)}  ondas: ${this.waves.state}`);
      lines.push('F1 debug · F2 eliminar inimigos · F3 fúria e vida cheias');
    }
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(8, VIEW_H - 18 - lines.length * 16, 640, lines.length * 16 + 10);
    ctx.font = `12px Consolas, monospace`;
    ctx.fillStyle = '#8fffb0';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => ctx.fillText(l, 14, VIEW_H - 13 - lines.length * 16 + i * 16));
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// INICIALIZAÇÃO
// ---------------------------------------------------------------------------
function boot() {
  game = new Game();
  window.__game = game;   // acesso pelo console para depuração
}
boot();
</script>
