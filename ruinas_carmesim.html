<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruínas Carmesim</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; outline: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game" tabindex="1"></canvas>
<script>
'use strict';
/* ===========================================================================
   RUÍNAS CARMESIM — hack and slash isométrico em um único arquivo HTML
   Canvas 2D puro + Web Audio API. Nenhum asset externo: formas, gradientes,
   partículas e sons são todos gerados por código.
   =========================================================================== */

// ---------------------------------------------------------------------------
// CONFIGURAÇÃO GERAL
// ---------------------------------------------------------------------------
const VIEW_H = 720;              // altura lógica da tela (a largura se adapta à janela)
let VIEW_W = 1280;               // largura lógica (recalculada ao redimensionar)
const TILE = 56;                 // tamanho de um tile em unidades de mundo
const GRAVITY = 1700;            // gravidade para corpos lançados ao ar
const TAU = Math.PI * 2;
const ISO_RX = Math.SQRT2;       // fator do raio horizontal de um círculo projetado
const ISO_RY = Math.SQRT2 / 2;   // fator do raio vertical de um círculo projetado
const MAX_DT = 1 / 30;           // passo máximo de simulação (evita "teleportes")

// Paleta dark fantasy: fundo escuro com destaques em vermelho e dourado
const PAL = {
  bg: '#060409',
  red: '#c8102e', redHi: '#ff2a3d', redDark: '#5a0a14',
  gold: '#e3a83b', goldHi: '#ffd679', goldDark: '#7a5418',
  bone: '#e8dcc4', steel: '#9aa3b2', ink: '#0b0710',
};
const FONT_TITLE = '"Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif';
const FONT_UI = '"Trebuchet MS", "Segoe UI", Tahoma, sans-serif';
const FONT_NUM = 'Impact, "Arial Black", "Segoe UI Black", sans-serif';

let game = null; // instância única do jogo (definida na inicialização)

// ---------------------------------------------------------------------------
// FUNÇÕES UTILITÁRIAS
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const chance = (p) => Math.random() < p;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; };
const rgba = (rgb, a) => `rgba(${rgb},${clamp(a, 0, 1).toFixed(3)})`;
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInCubic = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

// Menor diferença angular (de a para b), no intervalo [-PI, PI]
function angleDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  return d;
}
const angleLerp = (a, b, t) => a + angleDiff(a, b) * t;
function approach(v, target, delta) { return v < target ? Math.min(v + delta, target) : Math.max(v - delta, target); }

// Projeção isométrica 2:1 (coordenadas de mundo → coordenadas de tela)
const isoX = (x, y) => x - y;
const isoY = (x, y) => (x + y) * 0.5;

// Converte uma direção de TELA (dx, dy) numa direção de MUNDO normalizada
function screenToWorldDir(dx, dy, out) {
  const wx = dy + dx * 0.5, wy = dy - dx * 0.5;
  const l = Math.hypot(wx, wy) || 1;
  out.x = wx / l; out.y = wy / l;
  return out;
}
// Vetor de tela correspondente a um ângulo de mundo (sem normalizar)
function worldAngleToScreen(a, out) {
  const c = Math.cos(a), s = Math.sin(a);
  out.x = c - s; out.y = (c + s) * 0.5;
  return out;
}

// Gerador pseudoaleatório com semente (salas reproduzíveis ao redesenhar)
function mulberry32(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Distância de um ponto (px, py) ao segmento AB
function pointSegDist(px, py, ax, ay, bx, by) {
  const abx = bx - ax, aby = by - ay;
  const len2 = abx * abx + aby * aby;
  let t = len2 > 0 ? ((px - ax) * abx + (py - ay) * aby) / len2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
}

// Caminho de um círculo do mundo projetado (vira elipse na tela)
function isoCirclePath(ctx, x, y, r) {
  ctx.beginPath();
  ctx.ellipse(isoX(x, y), isoY(x, y), Math.max(0.1, r * ISO_RX), Math.max(0.1, r * ISO_RY), 0, 0, TAU);
}

// Retângulo de cantos arredondados
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Formata segundos como mm:ss
function formatTime(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60), r = s % 60;
  return `${m}:${r < 10 ? '0' : ''}${r}`;
}

// ---------------------------------------------------------------------------
// ENTRADA: teclado, gamepad e mouse unificados em "ações"
// ---------------------------------------------------------------------------
const KEYMAP = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  light: ['KeyJ'], heavy: ['KeyK'], dash: ['KeyL', 'Space'], special: ['KeyI'],
  pause: ['Escape'], confirm: ['Enter', 'NumpadEnter', 'KeyJ', 'Space'],
  debug: ['F1'], debugKill: ['F2'], debugFury: ['F3'], mute: ['KeyM'],
  reroll: ['KeyR'], buyHeal: ['KeyC'], restart: ['KeyR'], toTitle: ['KeyT'],
  one: ['Digit1', 'Numpad1'], two: ['Digit2', 'Numpad2'], three: ['Digit3', 'Numpad3'],
};
// Layout padrão (Xbox): 0=A 1=B 2=X 3=Y 4=LB 5=RB 7=RT 8=Back 9=Start 12-15=D-pad
const PADMAP = {
  up: [12], down: [13], left: [14], right: [15],
  light: [2], heavy: [3], dash: [0, 4], special: [1, 5, 7],
  pause: [9], confirm: [0], reroll: [2], buyHeal: [3], restart: [3], toTitle: [8],
};
const PREVENT_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1', 'F2', 'F3', 'Tab']);

class Input {
  constructor(canvas) {
    this.keys = new Set();          // teclas seguradas
    this.keyPressed = new Set();    // teclas pressionadas neste frame
    this.keyReleased = new Set();   // teclas soltas neste frame
    this.held = {}; this.pressed = {}; this.released = {};
    this.actions = Array.from(new Set([...Object.keys(KEYMAP), ...Object.keys(PADMAP)]));
    for (const a of this.actions) { this.held[a] = this.pressed[a] = this.released[a] = false; }
    this.padNow = new Array(24).fill(false);
    this.padPrev = new Array(24).fill(false);
    this.padAxes = { x: 0, y: 0 };
    this.padConnected = false;
    this.move = { x: 0, y: 0 };      // vetor de movimento em espaço de TELA (|v| <= 1)
    this.mouse = { x: -1, y: -1, clicked: false, moved: false };
    this.lastDevice = 'kb';
    this.anyPressed = false;
    this.onFirstInput = null;        // usado para destravar o áudio

    window.addEventListener('keydown', (e) => {
      if (PREVENT_KEYS.has(e.code)) e.preventDefault();
      if (!e.repeat) { this.keys.add(e.code); this.keyPressed.add(e.code); }
      this.lastDevice = 'kb';
      if (this.onFirstInput) this.onFirstInput();
    });
    window.addEventListener('keyup', (e) => {
      this.keys.delete(e.code);
      this.keyReleased.add(e.code);
    });
    window.addEventListener('blur', () => {
      for (const k of this.keys) this.keyReleased.add(k);
      this.keys.clear();
      if (game && game.onBlur) game.onBlur();
    });
    canvas.addEventListener('mousemove', (e) => {
      const p = game ? game.toLogical(e.clientX, e.clientY) : { x: 0, y: 0 };
      this.mouse.x = p.x; this.mouse.y = p.y; this.mouse.moved = true;
    });
    canvas.addEventListener('mousedown', (e) => {
      const p = game ? game.toLogical(e.clientX, e.clientY) : { x: 0, y: 0 };
      this.mouse.x = p.x; this.mouse.y = p.y; this.mouse.clicked = true;
      this.lastDevice = 'kb';
      if (this.onFirstInput) this.onFirstInput();
    });
    window.addEventListener('gamepadconnected', () => { this.padConnected = true; });
    window.addEventListener('gamepaddisconnected', () => { this.padConnected = false; });
  }

  // Lê o primeiro gamepad conectado (suporte opcional)
  pollGamepad() {
    this.padNow.fill(false);
    this.padAxes.x = this.padAxes.y = 0;
    const pads = navigator.getGamepads ? navigator.getGamepads() : null;
    if (!pads) return;
    let pad = null;
    for (let i = 0; i < pads.length; i++) { if (pads[i] && pads[i].connected) { pad = pads[i]; break; } }
    if (!pad) return;
    this.padConnected = true;
    for (let i = 0; i < pad.buttons.length && i < this.padNow.length; i++) {
      const b = pad.buttons[i];
      this.padNow[i] = typeof b === 'object' ? (b.pressed || b.value > 0.5) : b > 0.5;
    }
    const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
    const mag = Math.hypot(ax, ay);
    if (mag > 0.25) {
      const k = Math.min(1, (mag - 0.25) / 0.65) / mag;
      this.padAxes.x = ax * k; this.padAxes.y = ay * k;
    }
    for (let i = 0; i < this.padNow.length; i++) {
      if (this.padNow[i] && !this.padPrev[i]) {
        this.lastDevice = 'pad';
        if (this.onFirstInput) this.onFirstInput();
      }
    }
    if (mag > 0.5) this.lastDevice = 'pad';
  }

  // Consolida o estado das ações para o frame atual
  update() {
    this.pollGamepad();
    this.anyPressed = this.keyPressed.size > 0 || this.mouse.clicked;
    for (const a of this.actions) {
      let h = false, p = false, r = false;
      const keys = KEYMAP[a];
      if (keys) {
        for (const k of keys) {
          if (this.keys.has(k)) h = true;
          if (this.keyPressed.has(k)) p = true;
          if (this.keyReleased.has(k)) r = true;
        }
      }
      const btns = PADMAP[a];
      if (btns) {
        for (const b of btns) {
          if (this.padNow[b]) h = true;
          if (this.padNow[b] && !this.padPrev[b]) p = true;
          if (!this.padNow[b] && this.padPrev[b]) r = true;
        }
      }
      this.held[a] = h; this.pressed[a] = p; this.released[a] = r;
      if (p) this.anyPressed = true;
    }
    // Vetor de movimento (teclado ou analógico)
    let mx = (this.held.right ? 1 : 0) - (this.held.left ? 1 : 0);
    let my = (this.held.down ? 1 : 0) - (this.held.up ? 1 : 0);
    if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; }
    if (Math.hypot(this.padAxes.x, this.padAxes.y) > 0.01) { mx = this.padAxes.x; my = this.padAxes.y; }
    this.move.x = mx; this.move.y = my;
  }

  // Limpa os eventos de borda ao final do frame
  endFrame() {
    this.keyPressed.clear();
    this.keyReleased.clear();
    this.mouse.clicked = false;
    this.mouse.moved = false;
    for (let i = 0; i < this.padNow.length; i++) this.padPrev[i] = this.padNow[i];
  }
}

// ---------------------------------------------------------------------------
// ÁUDIO: efeitos sintetizados em tempo real com a Web Audio API
// ---------------------------------------------------------------------------
class AudioSys {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
    this.volume = 0.55;
    this.last = {};
    this.noiseBuf = null;
    this.ambient = null;
  }

  // O navegador só libera o áudio após uma interação do usuário
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
      const c = this.ctx;
      this.master = c.createGain();
      this.master.gain.value = this.muted ? 0 : this.volume;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.2;
      this.master.connect(comp);
      comp.connect(c.destination);
      // Buffer de ruído branco reutilizado por todos os sons de "sopro" e impacto
      const len = Math.floor(c.sampleRate * 1.5);
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime, 0.02);
  }

  // Evita sobreposição excessiva do mesmo som (ex.: vários acertos no mesmo frame)
  throttle(name, gap) {
    const t = this.ctx.currentTime;
    if (this.last[name] !== undefined && t - this.last[name] < gap) return false;
    this.last[name] = t;
    return true;
  }

  // Oscilador com envelope e varredura de frequência
  osc(type, f0, f1, dur, vol, delay = 0, attack = 0.004, dest = null) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + dur + 0.05);
    return o;
  }

  // Ruído filtrado com envelope (sopros, impactos, explosões)
  noise(dur, vol, ftype, f0, f1, q = 1, delay = 0, attack = 0.003) {
    const c = this.ctx, t = c.currentTime + delay;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter();
    f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(Math.max(20, f0), t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.2); src.stop(t + dur + 0.05);
  }

  // Sequência de notas (jingles de interface)
  arp(notes, step, dur, vol, type = 'triangle') {
    notes.forEach((n, i) => this.osc(type, n, n, dur, vol, i * step, 0.01));
  }

  play(name, p = 1) {
    if (!this.ctx || this.muted) return;
    try {
      switch (name) {
        case 'swing':
          if (!this.throttle(name, 0.03)) return;
          this.noise(0.13, 0.2 * p, 'bandpass', 700, 3400, 1.3);
          this.osc('sine', 320, 120, 0.08, 0.04 * p);
          break;
        case 'swingHeavy':
          this.noise(0.26, 0.3, 'bandpass', 380, 1900, 1.1);
          this.osc('sawtooth', 130, 55, 0.22, 0.05);
          break;
        case 'thrust':
          this.noise(0.12, 0.28, 'bandpass', 1500, 4200, 1.5);
          this.osc('sine', 700, 180, 0.12, 0.06);
          break;
        case 'hit':
          if (!this.throttle(name, 0.035)) return;
          this.noise(0.07, 0.34 * p, 'lowpass', 3600, 600, 0.8);
          this.osc('sine', 190, 55, 0.13, 0.42 * p);
          this.osc('square', 1400, 420, 0.03, 0.05 * p);
          break;
        case 'hitHeavy':
          if (!this.throttle(name, 0.05)) return;
          this.noise(0.17, 0.5, 'lowpass', 2600, 180, 0.8);
          this.osc('sine', 140, 36, 0.26, 0.7);
          this.osc('triangle', 900, 200, 0.06, 0.12);
          break;
        case 'crit':
          if (!this.throttle(name, 0.05)) return;
          this.osc('triangle', 2600, 2150, 0.2, 0.1);
          this.osc('sine', 3900, 3400, 0.14, 0.05);
          break;
        case 'dash':
          this.noise(0.2, 0.24, 'highpass', 3600, 700, 0.7);
          this.osc('sine', 480, 900, 0.12, 0.035);
          break;
        case 'enemyDeath':
          if (!this.throttle(name, 0.05)) return;
          this.osc('sawtooth', 330 * p, 48, 0.38, 0.09);
          this.noise(0.32, 0.24, 'lowpass', 1900, 140, 0.9);
          break;
        case 'playerHurt':
          this.osc('square', 210, 70, 0.28, 0.14);
          this.noise(0.22, 0.34, 'lowpass', 1300, 200, 0.9);
          this.osc('sine', 95, 40, 0.3, 0.5);
          break;
        case 'soul': {
          if (!this.throttle(name, 0.04)) return;
          const r = rand(0.92, 1.18);
          this.osc('sine', 880 * r, 1320 * r, 0.12, 0.06);
          this.osc('triangle', 1760 * r, 1760 * r, 0.09, 0.025, 0.03);
          break;
        }
        case 'health':
          this.osc('sine', 523, 784, 0.18, 0.11);
          this.osc('sine', 784, 1046, 0.24, 0.09, 0.08);
          break;
        case 'shoot':
          if (!this.throttle(name, 0.05)) return;
          this.osc('square', 720, 180, 0.16, 0.05);
          this.noise(0.1, 0.09, 'bandpass', 2200, 800, 2);
          break;
        case 'fireball':
          if (!this.throttle(name, 0.06)) return;
          this.noise(0.28, 0.16, 'bandpass', 900, 260, 1.2);
          this.osc('sawtooth', 160, 90, 0.2, 0.03);
          break;
        case 'telegraph':
          if (!this.throttle(name, 0.08)) return;
          this.osc('sine', 240, 540, 0.28, 0.06);
          this.osc('triangle', 480, 1080, 0.28, 0.025);
          break;
        case 'chargeTier':
          this.osc('triangle', 900 + 500 * p, 900 + 500 * p, 0.16, 0.1);
          this.osc('sine', 1800 + 900 * p, 1800 + 900 * p, 0.22, 0.04, 0.02);
          break;
        case 'special':
          this.noise(1.3, 0.6, 'lowpass', 5200, 110, 0.7);
          this.osc('sine', 110, 28, 1.1, 0.8);
          this.osc('sawtooth', 220, 55, 0.8, 0.1);
          this.osc('triangle', 440, 440, 0.9, 0.05, 0.02);
          this.osc('triangle', 554, 554, 0.9, 0.04, 0.04);
          this.osc('triangle', 659, 659, 0.9, 0.04, 0.06);
          break;
        case 'specialCharge':
          this.noise(0.45, 0.2, 'bandpass', 300, 2600, 2);
          this.osc('sawtooth', 80, 320, 0.45, 0.05);
          break;
        case 'bossRoar': {
          const c = this.ctx, t = c.currentTime;
          const lp = c.createBiquadFilter(); lp.type = 'lowpass';
          lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(260, t + 1.9);
          const env = c.createGain();
          env.gain.setValueAtTime(0.0001, t);
          env.gain.exponentialRampToValueAtTime(0.5, t + 0.15);
          env.gain.setValueAtTime(0.5, t + 1.2);
          env.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
          // LFO de amplitude dá o "rosnado" gutural
          const lfo = c.createOscillator(), lfoG = c.createGain();
          lfo.frequency.value = 23; lfoG.gain.value = 0.22;
          lfo.connect(lfoG); lfoG.connect(env.gain);
          lp.connect(env); env.connect(this.master);
          for (const f of [55, 62, 74, 93]) {
            const o = c.createOscillator(); o.type = 'sawtooth';
            o.frequency.setValueAtTime(f * 1.25, t);
            o.frequency.exponentialRampToValueAtTime(f * 0.8, t + 2.0);
            o.detune.value = rand(-15, 15);
            o.connect(lp); o.start(t); o.stop(t + 2.1);
          }
          lfo.start(t); lfo.stop(t + 2.1);
          this.noise(1.7, 0.3, 'bandpass', 420, 140, 0.8);
          break;
        }
        case 'door':
          this.noise(1.4, 0.32, 'lowpass', 320, 70, 1);
          this.osc('sawtooth', 48, 38, 1.3, 0.08);
          this.osc('square', 300, 120, 0.06, 0.05, 1.25);
          break;
        case 'uiMove':
          this.osc('triangle', 660, 660, 0.05, 0.04);
          break;
        case 'uiSelect':
          this.osc('triangle', 660, 990, 0.12, 0.07);
          this.osc('sine', 1320, 1320, 0.16, 0.035, 0.05);
          break;
        case 'uiDeny':
          this.osc('square', 180, 120, 0.15, 0.05);
          break;
        case 'comboName':
          this.osc('triangle', 784, 784, 0.12, 0.045);
          this.osc('triangle', 1175, 1175, 0.2, 0.045, 0.06);
          break;
        case 'explosion':
          if (!this.throttle(name, 0.06)) return;
          this.noise(0.6, 0.5, 'lowpass', 1800, 90, 0.8);
          this.osc('sine', 100, 30, 0.5, 0.55);
          break;
        case 'stomp':
          if (!this.throttle(name, 0.06)) return;
          this.noise(0.36, 0.44, 'lowpass', 650, 60, 0.9);
          this.osc('sine', 72, 30, 0.36, 0.65);
          break;
        case 'deflect':
          if (!this.throttle(name, 0.04)) return;
          this.osc('square', 1800, 1200, 0.06, 0.05);
          this.osc('triangle', 2400, 2000, 0.16, 0.05);
          break;
        case 'wallHit':
          if (!this.throttle(name, 0.06)) return;
          this.noise(0.12, 0.3, 'lowpass', 900, 100, 1);
          this.osc('sine', 120, 50, 0.14, 0.3);
          break;
        case 'upgrade':
          this.arp([523, 659, 784, 1046], 0.06, 0.25, 0.06);
          break;
        case 'roomClear':
          this.arp([659, 784, 988, 1318], 0.09, 0.4, 0.06);
          break;
        case 'waveStart':
          this.osc('sawtooth', 110, 104, 0.7, 0.06, 0, 0.05);
          this.osc('sawtooth', 165, 156, 0.7, 0.04, 0, 0.05);
          break;
        case 'victory':
          this.arp([392, 523, 659, 784, 1046], 0.14, 0.7, 0.08);
          this.arp([196, 262, 330], 0.14, 1.4, 0.05, 'sine');
          break;
        case 'defeat':
          this.arp([392, 311, 262, 196], 0.28, 0.8, 0.07, 'sawtooth');
          this.osc('sine', 98, 49, 2.0, 0.2, 0.2);
          break;
        case 'jump':
          this.noise(0.32, 0.2, 'lowpass', 400, 1600, 1);
          break;
        case 'spawn':
          if (!this.throttle(name, 0.08)) return;
          this.noise(0.35, 0.12, 'bandpass', 200, 900, 2);
          this.osc('sine', 90, 180, 0.3, 0.06);
          break;
      }
    } catch (e) { /* falhas de áudio nunca devem travar o jogo */ }
  }

  // Zumbido ambiente grave com filtro modulado (atmosfera das ruínas)
  startAmbient() {
    if (!this.ctx || this.ambient) return;
    const c = this.ctx, t = c.currentTime;
    const out = c.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.05, t + 3);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 230; lp.Q.value = 3;
    const lfo = c.createOscillator(), lfoG = c.createGain();
    lfo.frequency.value = 0.07; lfoG.gain.value = 90;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    const oscs = [];
    for (const [f, type] of [[55, 'sawtooth'], [55.4, 'sawtooth'], [82.4, 'triangle']]) {
      const o = c.createOscillator(); o.type = type; o.frequency.value = f;
      o.connect(lp); o.start(); oscs.push(o);
    }
    lp.connect(out); out.connect(this.master);
    lfo.start(); oscs.push(lfo);
    this.ambient = { out, oscs };
  }

  stopAmbient() {
    if (!this.ambient) return;
    const { out, oscs } = this.ambient, t = this.ctx.currentTime;
    out.gain.cancelScheduledValues(t);
    out.gain.setTargetAtTime(0.0001, t, 0.4);
    for (const o of oscs) o.stop(t + 2);
    this.ambient = null;
  }
}

// ---------------------------------------------------------------------------
// CACHE DE BRILHOS: sprites radiais pré-renderizados (muito mais rápido do que
// criar gradientes a cada partícula)
// ---------------------------------------------------------------------------
const GlowCache = {
  map: new Map(),
  get(rgb) {
    let c = this.map.get(rgb);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, `rgba(${rgb},1)`);
      gr.addColorStop(0.22, `rgba(${rgb},0.6)`);
      gr.addColorStop(0.55, `rgba(${rgb},0.16)`);
      gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr;
      g.fillRect(0, 0, 64, 64);
      this.map.set(rgb, c);
    }
    return c;
  },
  // Brilho circular (em coordenadas de tela isométrica)
  draw(ctx, rgb, x, y, r, alpha) {
    if (alpha <= 0.004 || r <= 0.5) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(this.get(rgb), x - r, y - r, r * 2, r * 2);
  },
  // Brilho achatado sobre o chão (elipse 2:1)
  drawFlat(ctx, rgb, x, y, r, alpha) {
    if (alpha <= 0.004 || r <= 0.5) return;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(this.get(rgb), x - r, y - r * 0.5, r * 2, r);
  },
};

// ---------------------------------------------------------------------------
// SISTEMA DE PARTÍCULAS com pooling (nenhuma alocação durante o jogo)
// ---------------------------------------------------------------------------
const P = { SPARK: 0, EMBER: 1, DUST: 2, BLOOD: 3, RING: 4, FLASH: 5, SMOKE: 6, DEBRIS: 7, WISP: 8 };
const P_EMISSIVE = [true, true, false, false, true, true, false, false, true];

class ParticleSystem {
  constructor(max = 1800) {
    this.max = max;
    this.items = [];
    for (let i = 0; i < max; i++) {
      this.items.push({ type: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, size: 1, size2: 1,
        rgb: '255,255,255', grav: 0, drag: 0, rot: 0, vrot: 0, decal: false });
    }
    this.count = 0;
  }

  // Emite uma partícula; devolve o objeto (ou null se o pool estiver cheio)
  emit(type, x, y, z, vx, vy, vz, life, size, rgb, grav = 0, drag = 0) {
    if (this.count >= this.max) return null;
    const p = this.items[this.count++];
    p.type = type; p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;
    p.life = p.max = life; p.size = size; p.size2 = size; p.rgb = rgb;
    p.grav = grav; p.drag = drag; p.rot = Math.random() * TAU; p.vrot = 0; p.decal = false;
    return p;
  }

  // Remove a partícula i trocando-a com a última ativa (O(1))
  kill(i) {
    const last = this.count - 1;
    if (i !== last) { const t = this.items[i]; this.items[i] = this.items[last]; this.items[last] = t; }
    this.count--;
  }

  clear() { this.count = 0; }

  update(dt) {
    for (let i = this.count - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.kill(i); continue; }
      if (p.drag) {
        const k = Math.exp(-p.drag * dt);
        p.vx *= k; p.vy *= k;
        if (!p.grav) p.vz *= k;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grav) p.vz -= p.grav * dt;
      p.z += p.vz * dt;
      p.rot += p.vrot * dt;
      if (p.grav && p.z < 0) {
        // Gotas de sangue viram manchas permanentes no chão da sala
        if (p.type === P.BLOOD) {
          if (p.decal && game.room) game.room.addDecal(p.x, p.y, p.size * 1.7, p.rgb);
          this.kill(i); continue;
        }
        p.z = 0; p.vz = -p.vz * 0.3; p.vx *= 0.55; p.vy *= 0.55; p.vrot *= 0.5;
      }
    }
  }

  // ----- Atalhos para efeitos comuns -----
  sparks(x, y, z, dir, n, rgb = '255,214,150', speed = 430, spread = 0.9) {
    for (let i = 0; i < n; i++) {
      const a = dir + rand(-spread, spread), s = speed * rand(0.35, 1.15);
      this.emit(P.SPARK, x, y, z, Math.cos(a) * s, Math.sin(a) * s, rand(60, 320), rand(0.16, 0.38), rand(1.6, 3), rgb, 900, 3.5);
    }
  }
  blood(x, y, z, dir, n, rgb = '120,10,24') {
    for (let i = 0; i < n; i++) {
      const a = dir + rand(-0.8, 0.8), s = rand(60, 260);
      const p = this.emit(P.BLOOD, x, y, z, Math.cos(a) * s, Math.sin(a) * s, rand(80, 280), 2, rand(1.8, 3.8), rgb, 1100, 1.2);
      if (p) p.decal = Math.random() < 0.45;
    }
  }
  dust(x, y, n, size = 10, speed = 90, rgb = '90,80,95') {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = speed * rand(0.3, 1);
      const p = this.emit(P.DUST, x, y, rand(0, 6), Math.cos(a) * s, Math.sin(a) * s, rand(10, 40), rand(0.4, 0.8), size * rand(0.6, 1.2), rgb, 0, 3);
      if (p) p.size2 = p.size * 2.4;
    }
  }
  ring(x, y, radius, rgb = '255,200,120', life = 0.4, width = 6) {
    const p = this.emit(P.RING, x, y, 0, 0, 0, 0, life, radius, rgb);
    if (p) p.size2 = width;
  }
  flash(x, y, z, size, rgb = '255,240,210', life = 0.12) {
    this.emit(P.FLASH, x, y, z, 0, 0, 0, life, size, rgb);
  }
  embers(x, y, z, n, rgb = '255,120,40', spread = 20, rise = 60) {
    for (let i = 0; i < n; i++) {
      this.emit(P.EMBER, x + rand(-spread, spread), y + rand(-spread, spread), z + rand(0, 20),
        rand(-25, 25), rand(-25, 25), rand(rise * 0.4, rise * 1.4), rand(0.5, 1.2), rand(1.5, 3.2), rgb, 0, 1);
    }
  }
  smoke(x, y, z, n, rgb = '30,22,40', size = 14) {
    for (let i = 0; i < n; i++) {
      const p = this.emit(P.SMOKE, x + rand(-10, 10), y + rand(-10, 10), z + rand(0, 20),
        rand(-30, 30), rand(-30, 30), rand(20, 70), rand(0.6, 1.2), size * rand(0.7, 1.3), rgb, 0, 1.5);
      if (p) p.size2 = p.size * 2.2;
    }
  }
  debris(x, y, n, rgb = '70,62,78') {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(60, 240);
      const p = this.emit(P.DEBRIS, x, y, rand(2, 12), Math.cos(a) * s, Math.sin(a) * s, rand(150, 420), rand(0.6, 1.1), rand(2, 5), rgb, 1300, 0.8);
      if (p) p.vrot = rand(-14, 14);
    }
  }
  // Partículas que convergem para um ponto (carga do especial / do chefe)
  converge(x, y, z, n, radius, rgb = '255,60,60', life = 0.45) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, r = radius * rand(0.6, 1);
      this.emit(P.WISP, x + Math.cos(a) * r, y + Math.sin(a) * r, z + rand(-10, 30),
        -Math.cos(a) * r / life, -Math.sin(a) * r / life, 0, life, rand(2, 4), rgb, 0, 0);
    }
  }

  // Camada sólida (mistura normal): poeira, sangue, fumaça, destroços
  drawSolid(ctx) {
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      if (P_EMISSIVE[p.type]) continue;
      const t = p.life / p.max, sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z;
      if (p.type === P.DUST || p.type === P.SMOKE) {
        const r = lerp(p.size2, p.size, t);
        ctx.fillStyle = rgba(p.rgb, (p.type === P.DUST ? 0.32 : 0.45) * t);
        ctx.beginPath(); ctx.ellipse(sx, sy, r, r * 0.7, 0, 0, TAU); ctx.fill();
      } else if (p.type === P.BLOOD) {
        ctx.fillStyle = rgba(p.rgb, 0.95);
        ctx.beginPath(); ctx.arc(sx, sy, p.size, 0, TAU); ctx.fill();
      } else if (p.type === P.DEBRIS) {
        ctx.save();
        ctx.translate(sx, sy); ctx.rotate(p.rot);
        ctx.fillStyle = rgba(p.rgb, Math.min(1, t * 2));
        ctx.fillRect(-p.size, -p.size * 0.6, p.size * 2, p.size * 1.2);
        ctx.restore();
      }
    }
  }

  // Camada emissiva (mistura aditiva): faíscas, brasas, anéis, clarões
  drawEmissive(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < this.count; i++) {
      const p = this.items[i];
      if (!P_EMISSIVE[p.type]) continue;
      const t = p.life / p.max, sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - p.z;
      switch (p.type) {
        case P.SPARK: {
          // Faísca desenhada como um risco na direção da velocidade
          const k = 0.035;
          const ex = sx - (p.vx - p.vy) * k, ey = sy - ((p.vx + p.vy) * 0.5 - p.vz) * k;
          ctx.globalAlpha = 1;
          ctx.strokeStyle = rgba(p.rgb, t);
          ctx.lineWidth = p.size * (0.4 + t);
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
          break;
        }
        case P.EMBER:
        case P.WISP:
          GlowCache.draw(ctx, p.rgb, sx, sy, p.size * 3.2, t * 0.9);
          break;
        case P.FLASH:
          GlowCache.draw(ctx, p.rgb, sx, sy, p.size * (1.3 - t * 0.3), t);
          break;
        case P.RING: {
          const e = easeOutCubic(1 - t), r = Math.max(0.5, p.size * e);
          ctx.globalAlpha = 1;
          ctx.strokeStyle = rgba(p.rgb, t * 0.9);
          ctx.lineWidth = Math.max(0.5, p.size2 * t);
          ctx.beginPath(); ctx.ellipse(sx, sy, r * ISO_RX, r * ISO_RY, 0, 0, TAU); ctx.stroke();
          break;
        }
      }
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// NÚMEROS DE DANO FLUTUANTES (pool)
// ---------------------------------------------------------------------------
class FloatingTexts {
  constructor(max = 140) {
    this.items = [];
    for (let i = 0; i < max; i++) this.items.push({ x: 0, y: 0, z: 0, vx: 0, vz: 0, life: 0, max: 1, text: '', color: '#fff', size: 20 });
    this.count = 0;
  }
  spawn(x, y, z, text, color = '#ffffff', size = 22, life = 0.85) {
    if (this.count >= this.items.length) return;
    const t = this.items[this.count++];
    t.x = x + rand(-8, 8); t.y = y + rand(-8, 8); t.z = z;
    t.vx = rand(-40, 40); t.vz = rand(170, 230);
    t.life = t.max = life; t.text = String(text); t.color = color; t.size = size;
  }
  clear() { this.count = 0; }
  update(dt) {
    for (let i = this.count - 1; i >= 0; i--) {
      const t = this.items[i];
      t.life -= dt;
      if (t.life <= 0) {
        const last = this.count - 1;
        this.items[i] = this.items[last]; this.items[last] = t; this.count--;
        continue;
      }
      t.vz -= 420 * dt;
      t.z += t.vz * dt;
      t.x += t.vx * dt; t.y += t.vx * dt * 0.2;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (let i = 0; i < this.count; i++) {
      const t = this.items[i];
      const age = t.max - t.life;
      const pop = age < 0.1 ? lerp(1.9, 1, age / 0.1) : 1;
      const a = Math.min(1, t.life / (t.max * 0.35));
      const sx = isoX(t.x, t.y), sy = isoY(t.x, t.y) - t.z;
      ctx.globalAlpha = a;
      ctx.font = `${Math.round(t.size * pop)}px ${FONT_NUM}`;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(10,0,4,0.9)';
      ctx.strokeText(t.text, sx, sy);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, sx, sy);
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// RASTRO DA LÂMINA (slash trail): faixa entre a base e a ponta da espada
// ---------------------------------------------------------------------------
class SlashTrail {
  constructor() {
    this.cap = 48;
    this.pts = [];
    for (let i = 0; i < this.cap; i++) this.pts.push({ bx: 0, by: 0, tx: 0, ty: 0, z: 0, age: 0 });
    this.reset('255,60,60', '255,240,220', 0.12);
  }
  reset(rgb, core, maxAge) {
    this.head = 0; this.n = 0; this.active = true; this.released = false;
    this.rgb = rgb; this.core = core; this.maxAge = maxAge;
  }
  // Adiciona uma amostra (base e ponta da lâmina em coordenadas de mundo)
  add(bx, by, tx, ty, z, age = 0) {
    const p = this.pts[this.head];
    p.bx = bx; p.by = by; p.tx = tx; p.ty = ty; p.z = z; p.age = age;
    this.head = (this.head + 1) % this.cap;
    this.n = Math.min(this.cap, this.n + 1);
  }
  release() { this.released = true; }
  // i = 0 é a amostra mais antiga
  get(i) { return this.pts[(this.head - this.n + i + this.cap * 2) % this.cap]; }
}

class SlashTrails {
  constructor(max = 12) {
    this.pool = [];
    for (let i = 0; i < max; i++) { const t = new SlashTrail(); t.active = false; this.pool.push(t); }
  }
  create(rgb = '255,50,60', core = '255,236,200', maxAge = 0.12) {
    let t = this.pool.find((s) => !s.active);
    if (!t) t = this.pool[0];
    t.reset(rgb, core, maxAge);
    return t;
  }
  clear() { for (const t of this.pool) t.active = false; }
  update(dt) {
    for (const t of this.pool) {
      if (!t.active) continue;
      // Envelhece as amostras e descarta as mais antigas
      for (let i = 0; i < t.n; i++) t.get(i).age += dt;
      while (t.n > 0 && t.get(0).age > t.maxAge) t.n--;
      if (t.released && t.n === 0) t.active = false;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (const t of this.pool) {
      if (!t.active || t.n < 2) continue;
      for (let i = 1; i < t.n; i++) {
        const a = t.get(i - 1), b = t.get(i);
        const k = 1 - b.age / t.maxAge;
        if (k <= 0) continue;
        const f = (i / t.n);
        // Faixa externa (cor do golpe)
        ctx.fillStyle = rgba(t.rgb, 0.5 * k * (0.35 + 0.65 * f));
        ctx.beginPath();
        ctx.moveTo(isoX(a.bx, a.by), isoY(a.bx, a.by) - a.z);
        ctx.lineTo(isoX(a.tx, a.ty), isoY(a.tx, a.ty) - a.z);
        ctx.lineTo(isoX(b.tx, b.ty), isoY(b.tx, b.ty) - b.z);
        ctx.lineTo(isoX(b.bx, b.by), isoY(b.bx, b.by) - b.z);
        ctx.closePath(); ctx.fill();
        // Faixa interna, mais brilhante, perto da ponta
        const amx = lerp(a.bx, a.tx, 0.6), amy = lerp(a.by, a.ty, 0.6);
        const bmx = lerp(b.bx, b.tx, 0.6), bmy = lerp(b.by, b.ty, 0.6);
        ctx.fillStyle = rgba(t.core, 0.55 * k * f);
        ctx.beginPath();
        ctx.moveTo(isoX(amx, amy), isoY(amx, amy) - a.z);
        ctx.lineTo(isoX(a.tx, a.ty), isoY(a.tx, a.ty) - a.z);
        ctx.lineTo(isoX(b.tx, b.ty), isoY(b.tx, b.ty) - b.z);
        ctx.lineTo(isoX(bmx, bmy), isoY(bmx, bmy) - b.z);
        ctx.closePath(); ctx.fill();
      }
      // Fio de luz ao longo da ponta
      ctx.beginPath();
      for (let i = 0; i < t.n; i++) {
        const p = t.get(i), x = isoX(p.tx, p.ty), y = isoY(p.tx, p.ty) - p.z;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      const last = t.get(t.n - 1);
      ctx.strokeStyle = rgba(t.core, 0.85 * (1 - last.age / t.maxAge));
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------------------
// CÂMERA: segue o jogador, tremor de tela por "trauma" e zoom de impacto
// ---------------------------------------------------------------------------
class Camera {
  constructor() {
    this.x = 0; this.y = 0;          // centro da visão em coordenadas isométricas
    this.zoom = 1; this.baseZoom = 1;
    this.trauma = 0; this.punch = 0;
    this.sx = 0; this.sy = 0; this.rot = 0;
    this.time = 0;
    this.out = { x: 0, y: 0 };
  }
  shake(amount) { this.trauma = Math.min(1, this.trauma + amount); }
  zoomPunch(amount) { this.punch = Math.max(this.punch, amount); }
  snap(x, y) { this.x = x; this.y = y; }
  follow(tx, ty, dt, speed = 6) {
    const k = 1 - Math.exp(-dt * speed);
    this.x += (tx - this.x) * k;
    this.y += (ty - this.y) * k;
  }
  update(dt) {
    this.time += dt;
    this.trauma = Math.max(0, this.trauma - dt * 1.7);
    const s = this.trauma * this.trauma, mag = 24 * s, tm = this.time;
    // Ruído suave a partir de senoides com frequências incomensuráveis
    this.sx = mag * (Math.sin(tm * 47.3) * 0.6 + Math.sin(tm * 91.7 + 1.3) * 0.4);
    this.sy = mag * (Math.sin(tm * 53.1 + 2.1) * 0.6 + Math.sin(tm * 83.3 + 0.7) * 0.4);
    this.rot = 0.014 * s * Math.sin(tm * 37);
    this.punch = Math.max(0, this.punch - dt * 0.5);
    this.zoom = this.baseZoom * (1 + this.punch);
  }
  apply(ctx) {
    ctx.translate(VIEW_W / 2 + this.sx, VIEW_H / 2 + this.sy);
    if (this.rot) ctx.rotate(this.rot);
    ctx.scale(this.zoom, this.zoom);
    ctx.translate(-this.x, -this.y);
  }
  // Coordenada isométrica → tela lógica (ignora a pequena rotação do tremor)
  toScreen(ix, iy) {
    this.out.x = VIEW_W / 2 + this.sx + (ix - this.x) * this.zoom;
    this.out.y = VIEW_H / 2 + this.sy + (iy - this.y) * this.zoom;
    return this.out;
  }
}

// ---------------------------------------------------------------------------
// ILUMINAÇÃO: mapa de escuridão em meia resolução com "furos" de luz
// ---------------------------------------------------------------------------
class Lighting {
  constructor() {
    this.res = 0.5;
    this.canvas = document.createElement('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.lights = [];
    this.n = 0;
    // Sprite de luz: gradiente radial preto → transparente (usado com destination-out)
    this.sprite = document.createElement('canvas');
    this.sprite.width = this.sprite.height = 128;
    const g = this.sprite.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(0.35, 'rgba(0,0,0,0.85)');
    gr.addColorStop(0.7, 'rgba(0,0,0,0.35)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    this.resize();
  }
  resize() {
    this.canvas.width = Math.max(2, Math.ceil(VIEW_W * this.res));
    this.canvas.height = Math.max(2, Math.ceil(VIEW_H * this.res));
  }
  clear() { this.n = 0; }
  // (ix, iy) em coordenadas isométricas (já com a altura z subtraída)
  add(ix, iy, radius, intensity, flat = 0.72) {
    if (this.n >= 96) return;
    let L = this.lights[this.n];
    if (!L) L = this.lights[this.n] = { x: 0, y: 0, r: 0, i: 0, f: 0 };
    L.x = ix; L.y = iy; L.r = radius; L.i = intensity; L.f = flat;
    this.n++;
  }
  render(ctx, cam, darkness) {
    const c = this.ctx, s = this.res, W = this.canvas.width, H = this.canvas.height;
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, W, H);
    c.fillStyle = `rgba(4,2,9,${clamp(darkness, 0, 1).toFixed(3)})`;
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < this.n; i++) {
      const L = this.lights[i];
      const p = cam.toScreen(L.x, L.y);
      const r = L.r * cam.zoom * s;
      if (r < 1) continue;
      const x = p.x * s, y = p.y * s;
      if (x + r < 0 || y + r < 0 || x - r > W || y - r > H) continue;
      c.globalAlpha = clamp(L.i, 0, 1);
      c.drawImage(this.sprite, x - r, y - r * L.f, r * 2, r * 2 * L.f);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.canvas, 0, 0, VIEW_W, VIEW_H);
  }
}

// ---------------------------------------------------------------------------
// TELEGRAPHS: avisos visuais no chão antes de ataques inimigos
// tg = { kind: 'circle'|'cone'|'line', x, y, r, dir, arc, len, w }
// ---------------------------------------------------------------------------
function telegraphPath(ctx, tg, scale) {
  switch (tg.kind) {
    case 'circle':
      isoCirclePath(ctx, tg.x, tg.y, tg.r * scale);
      break;
    case 'cone': {
      ctx.beginPath();
      ctx.moveTo(isoX(tg.x, tg.y), isoY(tg.x, tg.y));
      const steps = 18;
      for (let i = 0; i <= steps; i++) {
        const a = tg.dir - tg.arc + (2 * tg.arc * i) / steps;
        const px = tg.x + Math.cos(a) * tg.r * scale, py = tg.y + Math.sin(a) * tg.r * scale;
        ctx.lineTo(isoX(px, py), isoY(px, py));
      }
      ctx.closePath();
      break;
    }
    case 'line': {
      const c = Math.cos(tg.dir), s = Math.sin(tg.dir), L = tg.len * scale;
      const nx = -s * tg.w, ny = c * tg.w;
      const x0 = tg.x, y0 = tg.y, x1 = tg.x + c * L, y1 = tg.y + s * L;
      ctx.beginPath();
      ctx.moveTo(isoX(x0 + nx, y0 + ny), isoY(x0 + nx, y0 + ny));
      ctx.lineTo(isoX(x1 + nx, y1 + ny), isoY(x1 + nx, y1 + ny));
      ctx.lineTo(isoX(x1 - nx, y1 - ny), isoY(x1 - nx, y1 - ny));
      ctx.lineTo(isoX(x0 - nx, y0 - ny), isoY(x0 - nx, y0 - ny));
      ctx.closePath();
      break;
    }
  }
}

function drawTelegraph(ctx, tg, progress, time, rgb = '255,36,52') {
  progress = clamp(progress, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(time * (14 + progress * 16));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // Área total (contorno pulsante)
  telegraphPath(ctx, tg, 1);
  ctx.fillStyle = rgba(rgb, 0.06 + 0.05 * pulse);
  ctx.fill();
  ctx.strokeStyle = rgba(rgb, 0.45 + 0.35 * pulse);
  ctx.lineWidth = 2;
  ctx.stroke();
  // Preenchimento que cresce até o momento do golpe
  if (progress > 0.02) {
    telegraphPath(ctx, tg, progress);
    ctx.fillStyle = rgba(rgb, 0.12 + 0.28 * progress + (progress > 0.85 ? 0.2 * pulse : 0));
    ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// HITBOXES: testes de colisão entre formas de ataque e hurtboxes circulares
// shape = {type:'arc', range, arc} | {type:'circle', radius, offset}
//       | {type:'capsule', length, width} | {type:'ring', radius, width}
// ---------------------------------------------------------------------------
const Hitbox = {
  // A forma está posicionada em (ox, oy) e orientada pelo ângulo 'dir'
  test(shape, ox, oy, dir, cx, cy, cr) {
    switch (shape.type) {
      case 'arc': {
        const dx = cx - ox, dy = cy - oy, d = Math.hypot(dx, dy);
        if (d - cr > shape.range) return false;
        if (d <= cr + 6) return true; // colado no atacante
        const tol = Math.asin(Math.min(1, cr / d)); // tolerância angular pelo raio do alvo
        return Math.abs(angleDiff(dir, Math.atan2(dy, dx))) <= shape.arc + tol;
      }
      case 'circle': {
        const off = shape.offset || 0;
        const px = ox + Math.cos(dir) * off, py = oy + Math.sin(dir) * off;
        return dist(px, py, cx, cy) <= shape.radius + cr;
      }
      case 'capsule': {
        const ex = ox + Math.cos(dir) * shape.length, ey = oy + Math.sin(dir) * shape.length;
        return pointSegDist(cx, cy, ox, oy, ex, ey) <= shape.width + cr;
      }
      case 'ring': {
        const d = dist(ox, oy, cx, cy);
        return Math.abs(d - shape.radius) <= shape.width + cr;
      }
    }
    return false;
  },

  // Desenho das hitboxes no modo de depuração (F1)
  drawDebug(ctx, shape, ox, oy, dir, rgb) {
    ctx.save();
    ctx.strokeStyle = rgba(rgb, 0.95);
    ctx.fillStyle = rgba(rgb, 0.2);
    ctx.lineWidth = 1.5;
    switch (shape.type) {
      case 'arc':
        telegraphPath(ctx, { kind: 'cone', x: ox, y: oy, r: shape.range, dir, arc: shape.arc }, 1);
        ctx.fill(); ctx.stroke();
        break;
      case 'circle': {
        const off = shape.offset || 0;
        isoCirclePath(ctx, ox + Math.cos(dir) * off, oy + Math.sin(dir) * off, shape.radius);
        ctx.fill(); ctx.stroke();
        break;
      }
      case 'capsule': {
        telegraphPath(ctx, { kind: 'line', x: ox, y: oy, dir, len: shape.length, w: shape.width }, 1);
        ctx.fill(); ctx.stroke();
        isoCirclePath(ctx, ox, oy, shape.width); ctx.stroke();
        isoCirclePath(ctx, ox + Math.cos(dir) * shape.length, oy + Math.sin(dir) * shape.length, shape.width); ctx.stroke();
        break;
      }
      case 'ring':
        isoCirclePath(ctx, ox, oy, shape.radius + shape.width); ctx.stroke();
        isoCirclePath(ctx, ox, oy, Math.max(0.5, shape.radius - shape.width)); ctx.stroke();
        break;
    }
    ctx.restore();
  },
};

// Desenha uma hurtbox (círculo do mundo) no modo debug
function drawHurtbox(ctx, x, y, r, rgb = '80,255,120') {
  ctx.save();
  ctx.strokeStyle = rgba(rgb, 0.9);
  ctx.lineWidth = 1.2;
  isoCirclePath(ctx, x, y, r);
  ctx.stroke();
  const sx = isoX(x, y), sy = isoY(x, y);
  ctx.beginPath(); ctx.moveTo(sx - 4, sy); ctx.lineTo(sx + 4, sy); ctx.moveTo(sx, sy - 4); ctx.lineTo(sx, sy + 4); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// SISTEMA DE COMBOS: sequências de entradas com janela de tempo e buffer
// ---------------------------------------------------------------------------
const COMBO_TABLE = { L: 'light1', LL: 'light2', LLL: 'light3', LLH: 'spin', H: 'heavy', LH: 'uppercut', HH: 'slam' };
const COMBO_REQUIRES = { uppercut: 'uppercut', slam: 'slam', wave: 'wave' }; // combos desbloqueáveis

class ComboSystem {
  constructor() {
    this.seq = '';          // cadeia atual (ex.: "LL")
    this.grace = 0;         // tempo restante para continuar a cadeia após um golpe terminar
    this.dashWindow = 0;    // janela após a esquiva para a estocada
    this.buffer = null;     // último input armazenado ('L' ou 'H')
    this.bufferTime = 0;
    this.unlocked = new Set();
  }
  reset() { this.seq = ''; this.grace = 0; this.buffer = null; this.dashWindow = 0; }

  // Armazena um input com carimbo de tempo REAL (funciona mesmo durante o hit stop)
  bufferInput(type) { this.buffer = type; this.bufferTime = performance.now(); }
  hasBuffer(maxAge = 380) { return this.buffer !== null && performance.now() - this.bufferTime <= maxAge; }
  takeBuffer(maxAge = 380) {
    const ok = this.hasBuffer(maxAge), b = this.buffer;
    this.buffer = null;
    return ok ? b : null;
  }
  isUnlocked(id) { const req = COMBO_REQUIRES[id]; return !req || this.unlocked.has(req); }

  // Decide qual golpe executar para o input, considerando a cadeia em andamento
  resolve(type) {
    if (this.dashWindow > 0) {
      this.dashWindow = 0;
      if (type === 'L') { this.seq = 'D'; return 'thrust'; }
      if (type === 'H' && this.isUnlocked('wave')) { this.seq = 'D'; return 'wave'; }
    }
    const s = this.seq + type;
    const id = COMBO_TABLE[s];
    if (id && this.isUnlocked(id)) { this.seq = s; return id; }
    // Sem correspondência: recomeça a cadeia a partir deste input
    this.seq = type;
    return COMBO_TABLE[type];
  }

  onAttackEnd() { this.grace = 0.4; }

  update(dt, attacking) {
    if (this.dashWindow > 0) this.dashWindow -= dt;
    if (!attacking && this.seq) {
      this.grace -= dt;
      if (this.grace <= 0) this.seq = '';
    }
  }
}

// ---------------------------------------------------------------------------
// CONTADOR DE COMBO (hits seguidos) com multiplicador de pontos
// Zera ao levar dano ou após 3 s sem acertar
// ---------------------------------------------------------------------------
const COMBO_TIERS = [
  { min: 0, mult: 1, label: '' },
  { min: 5, mult: 1.5, label: 'BOM' },
  { min: 15, mult: 2, label: 'ÓTIMO' },
  { min: 25, mult: 2.5, label: 'BRUTAL' },
  { min: 50, mult: 3, label: 'SELVAGEM' },
  { min: 100, mult: 4, label: 'CARNIFICINA' },
];

class ComboCounter {
  constructor() { this.duration = 3; this.best = 0; this.reset(true); }
  reset(silent = false) {
    if (!silent && this.count >= 5) this.dropped = { count: this.count, t: 1 };
    this.count = 0; this.timer = 0; this.pop = 0; this.tierIndex = 0;
    if (silent) this.dropped = null;
  }
  addHit() {
    this.count++;
    this.timer = this.duration;
    this.pop = 1;
    if (this.count > this.best) this.best = this.count;
    const ti = this.computeTier();
    if (ti > this.tierIndex) {
      this.tierIndex = ti;
      if (game && game.hud) game.hud.tierUp(COMBO_TIERS[ti].label);
    }
  }
  computeTier() {
    let ti = 0;
    for (let i = 0; i < COMBO_TIERS.length; i++) if (this.count >= COMBO_TIERS[i].min) ti = i;
    return ti;
  }
  get mult() { return COMBO_TIERS[this.computeTier()].mult; }
  get label() { return COMBO_TIERS[this.computeTier()].label; }
  update(dt) {
    if (this.count > 0) {
      this.timer -= dt;
      if (this.timer <= 0) this.reset();
    }
    this.pop = Math.max(0, this.pop - dt * 5);
    if (this.dropped) { this.dropped.t -= dt * 0.8; if (this.dropped.t <= 0) this.dropped = null; }
  }
}

class UpgradeSystem {
  constructor() { this.reset(); }
  reset() { this.levels = {}; this.history = []; }
  level(id) { return this.levels[id] || 0; }
  available() { return UPGRADES.filter((u) => this.level(u.id) < u.max); }
  // Sorteia n opções distintas, ponderadas pelo peso 'w'
  roll(n = 3) {
    const pool = this.available().slice();
    const out = [];
    while (out.length < n && pool.length) {
      const total = pool.reduce((s, u) => s + u.w, 0);
      let r = Math.random() * total, idx = 0;
      for (; idx < pool.length - 1; idx++) { r -= pool[idx].w; if (r <= 0) break; }
      out.push(pool.splice(idx, 1)[0]);
    }
    return out;
  }
  apply(up, player) {
    up.apply(player);
    this.levels[up.id] = this.level(up.id) + 1;
    this.history.push(up.id);
  }
}

class Entity {
  constructor(x, y, r) {
    this.x = x; this.y = y; this.z = 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.kbx = 0; this.kby = 0;       // velocidade de knockback (decai com o tempo)
    this.radius = r;                  // raio da hurtbox
    this.facing = 0;                  // ângulo no mundo
    this.flash = 0;                   // tempo restante do flash branco
    this.alive = true;
    this.hp = 1; this.maxHp = 1;
  }
  get depth() { return this.x + this.y; }   // ordenação por profundidade (y-sorting)
  drawShadow(ctx) {
    const k = 1 - Math.min(0.55, this.z / 260);
    ctx.fillStyle = `rgba(0,0,0,${(0.5 * k).toFixed(3)})`;
    isoCirclePath(ctx, this.x, this.y, this.radius * 1.1 * k);
    ctx.fill();
  }
}

// Paletas (o flash branco e os "fantasmas" da esquiva trocam todas as cores)
const PLAYER_PAL = {
  armor: '#2b2d3a', armorHi: '#4c5066', armorDark: '#15161e', cape: '#8e0f1f', capeDark: '#4a0710',
  trim: '#d9a441', helm: '#3a3d4d', helmHi: '#6a6f88', visor: '#ffcf6b', blade: '#c3ccda',
  bladeHi: '#ffffff', guard: '#d9a441', leg: '#1c1d26', boot: '#101017', plume: '#c8102e',
};
const FLASH_PAL = new Proxy({}, { get: () => '#ffffff' });
const GHOST_PAL = new Proxy({}, { get: (t, k) => (k === 'visor' || k === 'trim' ? '#ffb070' : '#d01830') });

const BASE_SPEED = 235;
const SPECIAL_DEF = { hitstop: 0.16, shake: 0.2, fury: 0, zoom: 0.06, heavy: true, sound: 'hitHeavy' };
const PROJ_HIT_DEF = { hitstop: 0.03, shake: 0.08, fury: 3, heavy: false, sound: 'hit' };

// ---------------------------------------------------------------------------
// JOGADOR
// ---------------------------------------------------------------------------
class Player extends Entity {
  constructor(x, y) {
    super(x, y, 14);
    this.maxHp = 100; this.hp = 100;
    this.fury = 0;
    this.stats = {
      dmgMult: 1, speedMult: 1, dashMult: 1, lifesteal: 0, furyMult: 1, crit: 0.05,
      dashCdMult: 1, iframeBonus: 0, armor: 0, soulMult: 1, magnet: 120,
      heavyMult: 1, chargeSpeed: 1, healMult: 1, orbChance: 0,
    };
    this.combo = new ComboSystem();
    this.state = 'idle'; this.stateTime = 0;
    this.attack = null;
    this.dashCd = 0; this.dashDirX = 1; this.dashDirY = 0;
    this.dashBuffer = 0; this.specialBuffer = 0;
    this.invuln = 0;
    this.chargeTime = 0; this.chargeLevel = 0;
    this.specialFired = false;
    this.animTime = 0; this.moveSpeed = 0;
    this.squash = 0;
    this.lifestealAcc = 0;
    this.ghosts = [];
    for (let i = 0; i < 8; i++) this.ghosts.push({ x: 0, y: 0, f: 0, life: 0 });
    this.ghostTimer = 0;
    this.tmp = { x: 0, y: 0 };
    this.tmp2 = { x: 0, y: 0 };
  }

  get dashing() { return this.state === 'dash'; }

  // Captura inputs TODO frame (inclusive durante o hit stop) para o buffer de combos
  captureInput(input) {
    if (this.state === 'dead') return;
    if (input.pressed.light) this.combo.bufferInput('L');
    if (input.pressed.heavy) this.combo.bufferInput('H');
    if (input.pressed.dash) this.dashBuffer = 0.16;
    if (input.pressed.special) {
      if (this.fury >= 100) this.specialBuffer = 0.25;
      else { game.hud.furyDenied(); game.audio.play('uiDeny'); }
    }
  }

  update(dt, input) {
    this.animTime += dt; this.stateTime += dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.dashBuffer > 0) this.dashBuffer -= dt;
    if (this.specialBuffer > 0) this.specialBuffer -= dt;
    this.squash = approach(this.squash, 0, dt * 1.2);
    this.combo.update(dt, this.state === 'attack' || this.state === 'charge');

    const mv = input.move, mag = Math.min(1, Math.hypot(mv.x, mv.y));
    const wd = mag > 0.15 ? screenToWorldDir(mv.x, mv.y, this.tmp) : null;

    switch (this.state) {
      case 'idle':
      case 'run': {
        if (this.tryActions(wd)) break;
        let tvx = 0, tvy = 0;
        if (wd) {
          const sp = BASE_SPEED * this.stats.speedMult * mag;
          tvx = wd.x * sp; tvy = wd.y * sp;
          this.facing = Math.atan2(wd.y, wd.x);
          this.state = 'run';
        } else this.state = 'idle';
        const acc = 2800 * dt;
        this.vx = approach(this.vx, tvx, acc);
        this.vy = approach(this.vy, tvy, acc);
        break;
      }
      case 'attack': this.updateAttack(dt, input, wd); break;
      case 'charge': this.updateCharge(dt, input, wd); break;
      case 'dash': this.updateDash(dt); break;
      case 'hurt':
        this.vx *= Math.exp(-10 * dt); this.vy *= Math.exp(-10 * dt);
        if (this.stateTime >= 0.22) this.state = 'idle';
        break;
      case 'special': this.updateSpecial(dt); break;
      case 'dead':
        this.vx *= Math.exp(-6 * dt); this.vy *= Math.exp(-6 * dt);
        break;
    }

    // Física: velocidade própria + knockback, depois colisão com a sala
    const kd = Math.exp(-9 * dt);
    this.kbx *= kd; this.kby *= kd;
    this.x += (this.vx + this.kbx) * dt;
    this.y += (this.vy + this.kby) * dt;
    game.room.collide(this, true);
    this.moveSpeed = Math.hypot(this.vx, this.vy);

    for (const g of this.ghosts) if (g.life > 0) g.life -= dt;
  }

  // Ações disponíveis em estado livre: especial, esquiva ou golpe
  tryActions(wd) {
    if (this.specialBuffer > 0 && this.fury >= 100) { this.specialBuffer = 0; this.startSpecial(); return true; }
    if (this.dashBuffer > 0 && this.dashCd <= 0) { this.dashBuffer = 0; this.startDash(wd); return true; }
    const b = this.combo.takeBuffer();
    if (b) { this.startAttack(this.combo.resolve(b), wd); return true; }
    return false;
  }

  // Assistência de mira: corrige levemente a direção para o inimigo mais próximo no cone
  aimAssist(dir, def) {
    const s = def.shape;
    const range = (s.range || s.length || s.radius || 90) * 1.7;
    let best = null, bestScore = Infinity;
    for (const e of game.enemies) {
      if (!e.canBeHit()) continue;
      const dx = e.x - this.x, dy = e.y - this.y, d = Math.hypot(dx, dy);
      if (d > range + e.radius) continue;
      const ad = Math.abs(angleDiff(dir, Math.atan2(dy, dx)));
      if (ad > 0.85) continue;
      const score = ad * 120 + d;
      if (score < bestScore) { bestScore = score; best = e; }
    }
    return best ? Math.atan2(best.y - this.y, best.x - this.x) : dir;
  }

  startAttack(id, wd, chargeLevel = 0) {
    const def = ATTACKS[id];
    if (!def) return;
    let dir = wd ? Math.atan2(wd.y, wd.x) : this.facing;
    if (def.shape.type !== 'circle' || def.shape.offset) dir = this.aimAssist(dir, def);
    this.facing = dir;
    if (this.attack && this.attack.trail) this.attack.trail.release();
    const a = this.attack || (this.attack = { hits: new Map(), counts: new Map() });
    a.id = id; a.def = def; a.t = 0; a.dir = dir;
    a.hits.clear(); a.counts.clear();
    a.trail = null; a.started = false;
    a.charge = chargeLevel;
    a.mult = id === 'charged' ? 1 + chargeLevel : 1;
    this.state = 'attack'; this.stateTime = 0;
    this.vx *= 0.2; this.vy *= 0.2;
    if (def.name) {
      let name = def.name;
      if (id === 'charged' && chargeLevel >= 0.99) name = 'GOLPE CARREGADO MÁXIMO';
      game.hud.comboName(name);
      game.audio.play('comboName');
    }
  }

  // Ângulo da lâmina (mundo) no instante t do golpe atual
  bladeAngle(a, t) {
    const d = a.def;
    const p = clamp((t - d.windup) / d.active, 0, 1);
    const e = d.multiHit ? p : easeOutCubic(p);
    return a.dir + lerp(d.swing[0], d.swing[1], e);
  }

  updateAttack(dt, input, wd) {
    const a = this.attack, d = a.def;
    const prevT = a.t;
    a.t += dt;
    const tW = d.windup, tA = d.windup + d.active, tEnd = tA + d.recovery;

    // Pesado segurado: ao fim da preparação, entra no estado de carga
    if (d.chargeable && prevT < tW && a.t >= tW && input.held.heavy) { this.enterCharge(); return; }

    // Avanço (lunge) durante preparação e fase ativa
    if (a.t < tA) {
      const k = d.thrust ? (a.t >= tW ? 1 - (a.t - tW) / d.active * 0.5 : 0.15) : 1 - a.t / tA;
      const sp = d.lunge * k;
      this.vx = Math.cos(a.dir) * sp; this.vy = Math.sin(a.dir) * sp;
    } else {
      const k = Math.exp(-16 * dt);
      this.vx *= k; this.vy *= k;
    }

    // Início da fase ativa: som, rastro, efeitos especiais do golpe
    if (!a.started && a.t >= tW) {
      a.started = true;
      game.audio.play(d.sound);
      a.trail = game.trails.create(d.rgb, d.core, d.thrust ? 0.1 : 0.14);
      this.squash = d.heavy ? 0.14 : 0.07;
      if (d.projectile) this.fireCrescent(a.dir);
      if (d.slamRing) this.slamEffects(a.dir);
    }

    // Amostras do rastro da lâmina (sub-amostradas para curvas suaves)
    if (a.trail && !a.trail.released) {
      const steps = 4;
      for (let s = 1; s <= steps; s++) {
        const tt = prevT + (a.t - prevT) * (s / steps);
        if (tt < tW) continue;
        const ang = this.bladeAngle(a, Math.min(tt, tA));
        const c = Math.cos(ang), sn = Math.sin(ang);
        const z = d.thrust ? 24 : 26 + (d.launch > 300 ? (tt - tW) / d.active * 18 : 0);
        a.trail.add(this.x + c * 18, this.y + sn * 18, this.x + c * d.blade, this.y + sn * d.blade, z, a.t - tt);
      }
      if (a.t >= tA) a.trail.release();
    }

    // Hitbox ativa somente na janela [tW, tA)
    if (a.t >= tW && prevT < tA) this.processHits(a);

    // Encadeamento: após o ponto de cancelamento, inputs armazenados disparam o próximo golpe
    const chainAt = tA + d.recovery * d.chainFrac;
    if (a.t >= chainAt) {
      if (this.specialBuffer > 0 && this.fury >= 100) { this.specialBuffer = 0; this.endAttack(); this.startSpecial(); return; }
      const b = this.combo.takeBuffer();
      if (b) { this.startAttack(this.combo.resolve(b), wd); return; }
    }
    // Esquiva cancela a preparação e a recuperação (nunca os frames ativos)
    if (this.dashBuffer > 0 && this.dashCd <= 0 && (a.t < tW || a.t >= tA)) {
      this.dashBuffer = 0; this.endAttack(); this.startDash(wd); return;
    }
    if (a.t >= tEnd) { this.endAttack(); this.state = 'idle'; }
  }

  endAttack() {
    if (this.attack && this.attack.trail) this.attack.trail.release();
    this.combo.onAttackEnd();
  }

  processHits(a) {
    const d = a.def;
    for (const e of game.enemies) {
      if (!e.canBeHit()) continue;
      const last = a.hits.get(e);
      if (last !== undefined) {
        if (!d.multiHit) continue;
        if ((a.counts.get(e) || 1) >= d.multiHit || a.t - last < d.rehit) continue;
      }
      if (!Hitbox.test(d.shape, this.x, this.y, a.dir, e.x, e.y, e.radius)) continue;
      a.hits.set(e, a.t);
      a.counts.set(e, (a.counts.get(e) || 0) + 1);
      this.hitEnemy(e, d, a);
    }
    // A lâmina também destrói projéteis inimigos (aparar)
    game.projectiles.slashTest(d.shape, this.x, this.y, a.dir);
  }

  hitEnemy(e, d, a) {
    let dmg = d.dmg * this.stats.dmgMult * a.mult * (d.heavyType ? this.stats.heavyMult : 1) * rand(0.9, 1.1);
    const crit = Math.random() < this.stats.crit;
    if (crit) dmg *= 2;
    dmg = Math.max(1, Math.round(dmg * (e.vulnerable || 1)));
    // Direção do knockback: radial em golpes de área, misturada com a direção do golpe nos arcos
    const dx = e.x - this.x, dy = e.y - this.y, l = Math.hypot(dx, dy) || 1;
    let kx, ky;
    if (d.radialKb) { kx = dx / l; ky = dy / l; }
    else {
      kx = Math.cos(a.dir) * 0.65 + (dx / l) * 0.35; ky = Math.sin(a.dir) * 0.65 + (dy / l) * 0.35;
      const kl = Math.hypot(kx, ky) || 1; kx /= kl; ky /= kl;
    }
    const kb = d.kb * (a.id === 'charged' ? 1 + a.charge * 0.5 : 1);
    const launch = d.launch * (a.id === 'charged' ? 0.6 + a.charge * 0.6 : 1);
    if (!e.takeHit({ dmg, kx, ky, kb, launch, stun: d.stun, heavy: !!d.heavy, crit })) return;
    game.onEnemyHit(e, dmg, crit, d, kx, ky);
  }

  // Combo "Onda Lunar": lâmina de energia perfurante
  fireCrescent(dir) {
    game.projectiles.spawn({
      x: this.x + Math.cos(dir) * 30, y: this.y + Math.sin(dir) * 30, z: 22,
      vx: Math.cos(dir) * 640, vy: Math.sin(dir) * 640, r: 26,
      dmg: Math.round(24 * this.stats.dmgMult), hostile: false, kind: 'crescent', life: 0.75, pierce: true,
    });
  }

  // Combo "Quebra-Terra": onda de choque e destroços
  slamEffects(dir) {
    const x = this.x + Math.cos(dir) * 46, y = this.y + Math.sin(dir) * 46;
    game.particles.ring(x, y, 130, '255,150,60', 0.45, 12);
    game.particles.ring(x, y, 80, '255,230,170', 0.3, 6);
    game.particles.debris(x, y, 16);
    game.particles.dust(x, y, 14, 14, 160);
    game.particles.flash(x, y, 6, 90, '255,170,90', 0.18);
    game.camera.shake(0.35);
    game.audio.play('stomp');
    game.room.addScorch(x, y, 60);
  }

  enterCharge() {
    this.state = 'charge'; this.stateTime = 0;
    this.chargeTime = 0; this.chargeLevel = 0;
    this.vx *= 0.3; this.vy *= 0.3;
  }

  updateCharge(dt, input, wd) {
    this.chargeTime += dt * this.stats.chargeSpeed;
    const lvl = this.chargeTime >= 0.95 ? 2 : this.chargeTime >= 0.4 ? 1 : 0;
    if (lvl > this.chargeLevel) {
      this.chargeLevel = lvl;
      game.audio.play('chargeTier', lvl);
      game.particles.flash(this.x, this.y, 30, lvl === 2 ? 70 : 45, lvl === 2 ? '255,80,60' : '255,170,90', 0.2);
      game.particles.ring(this.x, this.y, lvl === 2 ? 70 : 50, '255,90,60', 0.3, 4);
      game.camera.shake(0.06 * lvl);
      this.flash = 0.05;
    }
    if (Math.random() < 0.5 + lvl * 0.25) {
      game.particles.converge(this.x, this.y, 24, 1, 60 + lvl * 20, lvl === 2 ? '255,60,50' : '255,150,80', 0.35);
    }
    // Movimento lento e mira livre enquanto carrega
    let tvx = 0, tvy = 0;
    if (wd) {
      this.facing = angleLerp(this.facing, Math.atan2(wd.y, wd.x), 1 - Math.exp(-12 * dt));
      tvx = wd.x * BASE_SPEED * 0.3; tvy = wd.y * BASE_SPEED * 0.3;
    }
    this.vx = approach(this.vx, tvx, 1600 * dt);
    this.vy = approach(this.vy, tvy, 1600 * dt);
    if (this.dashBuffer > 0 && this.dashCd <= 0) { this.dashBuffer = 0; this.combo.reset(); this.startDash(wd); return; }
    if (!input.held.heavy) {
      const level = clamp(this.chargeTime / 0.95, 0, 1);
      this.combo.seq = '';
      this.startAttack('charged', null, level);
    }
  }

  startDash(wd) {
    let dx, dy;
    if (wd) { dx = wd.x; dy = wd.y; } else { dx = Math.cos(this.facing); dy = Math.sin(this.facing); }
    this.dashDirX = dx; this.dashDirY = dy;
    this.facing = Math.atan2(dy, dx);
    this.state = 'dash'; this.stateTime = 0;
    this.invuln = Math.max(this.invuln, 0.22 + this.stats.iframeBonus);
    this.dashCd = 0.5 * this.stats.dashCdMult;
    this.ghostTimer = 0;
    this.squash = -0.1;
    game.audio.play('dash');
    game.particles.dust(this.x, this.y, 6, 8, 80);
  }

  updateDash(dt) {
    const dur = 0.17 * this.stats.dashMult;
    const t = clamp(this.stateTime / dur, 0, 1);
    const sp = 880 * (1 - t * t * 0.55);
    this.vx = this.dashDirX * sp; this.vy = this.dashDirY * sp;
    // Imagens residuais (afterimages)
    this.ghostTimer -= dt;
    if (this.ghostTimer <= 0) {
      this.ghostTimer = 0.028;
      const g = this.ghosts.find((q) => q.life <= 0) || this.ghosts[0];
      g.x = this.x; g.y = this.y; g.f = this.facing; g.life = 0.22;
    }
    if (this.stateTime >= dur) {
      this.state = 'idle';
      this.combo.dashWindow = 0.32;   // janela para a estocada (esquiva + leve)
      this.vx *= 0.35; this.vy *= 0.35;
    }
  }

  startSpecial() {
    this.fury = 0;
    this.state = 'special'; this.stateTime = 0;
    this.specialFired = false;
    this.invuln = Math.max(this.invuln, 1.25);
    this.vx = this.vy = 0;
    if (this.attack && this.attack.trail) this.attack.trail.release();
    this.combo.reset();
    game.hud.comboName('JUÍZO CARMESIM', true);
    game.audio.play('specialCharge');
    game.camera.zoomPunch(0.05);
  }

  updateSpecial(dt) {
    const t = this.stateTime;
    this.vx = this.vy = 0;
    this.z = t < 0.45 ? easeOutCubic(t / 0.45) * 28 : Math.max(0, 28 - (t - 0.45) * 300);
    if (t < 0.45) {
      game.particles.converge(this.x, this.y, 30, 3, 170, '255,50,50', 0.4);
      if (Math.random() < 0.5) game.particles.converge(this.x, this.y, 30, 1, 120, '255,200,110', 0.35);
    }
    if (!this.specialFired && t >= 0.45) { this.specialFired = true; this.fireSpecial(); }
    if (t >= 1.05) { this.state = 'idle'; this.z = 0; }
  }

  // Especial "Juízo Carmesim": explosão em área, lâminas radiais e limpeza de projéteis
  fireSpecial() {
    const R = 270, base = 85 * this.stats.dmgMult;
    for (const e of game.enemies) {
      if (!e.canBeHit()) continue;
      const dx = e.x - this.x, dy = e.y - this.y, d = Math.hypot(dx, dy);
      if (d > R + e.radius) continue;
      const l = d || 1, kx = dx / l, ky = dy / l;
      const dmg = Math.max(1, Math.round(base * (1 - 0.4 * Math.min(1, d / R)) * rand(0.95, 1.05) * (e.vulnerable || 1)));
      if (e.takeHit({ dmg, kx, ky, kb: 650, launch: 420, stun: 1.0, heavy: true, crit: false })) {
        game.onEnemyHit(e, dmg, false, SPECIAL_DEF, kx, ky);
      }
    }
    game.projectiles.clearHostile(true);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      game.projectiles.spawn({
        x: this.x, y: this.y, z: 22, vx: Math.cos(a) * 620, vy: Math.sin(a) * 620, r: 18,
        dmg: Math.round(22 * this.stats.dmgMult), hostile: false, kind: 'blade', life: 0.62, pierce: true,
      });
    }
    const P_ = game.particles;
    P_.ring(this.x, this.y, R + 30, '255,50,50', 0.6, 16);
    P_.ring(this.x, this.y, R * 0.7, '255,210,130', 0.45, 10);
    P_.ring(this.x, this.y, R * 1.3, '200,20,40', 0.85, 8);
    P_.flash(this.x, this.y, 20, 300, '255,80,80', 0.35);
    P_.flash(this.x, this.y, 20, 140, '255,240,220', 0.2);
    for (let i = 0; i < 4; i++) P_.sparks(this.x, this.y, 20, (i / 4) * TAU, 16, '255,200,120', 700, 0.9);
    P_.embers(this.x, this.y, 0, 40, '255,70,50', 120, 160);
    P_.debris(this.x, this.y, 20);
    P_.dust(this.x, this.y, 20, 18, 260);
    game.camera.shake(0.9);
    game.camera.zoomPunch(0.09);
    game.addHitStop(0.14);
    game.flashScreen('255,60,60', 0.55);
    game.audio.play('special');
    game.room.addScorch(this.x, this.y, 150);
  }

  addFury(n) {
    if (this.state === 'special') return;
    const before = this.fury;
    this.fury = Math.min(100, this.fury + n * this.stats.furyMult);
    if (before < 100 && this.fury >= 100) { game.hud.furyReady(); game.audio.play('chargeTier', 2); }
  }

  applyLifesteal(dmg) {
    if (this.stats.lifesteal <= 0 || this.hp <= 0) return;
    this.lifestealAcc += dmg * this.stats.lifesteal;
    if (this.lifestealAcc >= 1) {
      const n = Math.floor(this.lifestealAcc);
      this.lifestealAcc -= n;
      this.heal(n, false);
    }
  }

  heal(n, fx = true) {
    if (this.state === 'dead') return;
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    const gained = Math.round(this.hp - before);
    if (fx && gained > 0) game.texts.spawn(this.x, this.y, 60, '+' + gained, '#5dff8a', 20);
  }

  takeDamage(dmg, sx, sy, kb = 260) {
    if (this.state === 'dead' || this.invuln > 0 || game.state !== 'playing') return false;
    dmg = Math.max(1, Math.round(dmg * (1 - this.stats.armor)));
    this.hp -= dmg;
    const dx = this.x - sx, dy = this.y - sy, l = Math.hypot(dx, dy) || 1;
    this.kbx += (dx / l) * kb; this.kby += (dy / l) * kb;
    this.flash = 0.12;
    this.invuln = 0.75;
    if (this.attack && this.attack.trail) this.attack.trail.release();
    this.combo.reset();
    game.onPlayerHurt(dmg, dx / l, dy / l);
    if (this.hp <= 0) {
      this.hp = 0;
      this.state = 'dead'; this.stateTime = 0;
      game.onPlayerDeath();
    } else {
      this.state = 'hurt'; this.stateTime = 0;
    }
    return true;
  }

  // ------------------------------------------------------------------ desenho
  draw(ctx) {
    const sx = isoX(this.x, this.y), sy = isoY(this.x, this.y) - this.z;
    // Imagens residuais da esquiva (mistura aditiva)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.ghosts) {
      if (g.life <= 0) continue;
      ctx.globalAlpha = (g.life / 0.22) * 0.35;
      this.drawKnight(ctx, isoX(g.x, g.y), isoY(g.x, g.y), GHOST_PAL, g.f, false);
    }
    ctx.restore();

    const blink = this.invuln > 0 && this.state === 'hurt' || (this.invuln > 0 && this.state !== 'dash' && this.state !== 'special' && this.state !== 'dead' && Math.floor(this.invuln * 18) % 2 === 0);
    ctx.save();
    if (blink) ctx.globalAlpha = 0.55;
    if (this.state === 'dead') {
      // Cai de lado lentamente
      const k = easeOutCubic(Math.min(1, this.stateTime / 0.6));
      const side = worldAngleToScreen(this.facing, this.tmp2).x >= 0 ? 1 : -1;
      ctx.translate(sx, sy);
      ctx.rotate(-side * k * 1.45);
      this.drawKnight(ctx, 0, 0, this.flash > 0 ? FLASH_PAL : PLAYER_PAL, this.facing, true);
    } else {
      this.drawKnight(ctx, sx, sy, this.flash > 0 ? FLASH_PAL : PLAYER_PAL, this.facing, true);
    }
    ctx.restore();
  }

  // Cavaleiro procedural: pernas, capa, armadura, elmo com viseira brilhante e espada
  drawKnight(ctx, sx, sy, pal, facing, withSword) {
    const f = worldAngleToScreen(facing, this.tmp2);
    const fl = Math.hypot(f.x, f.y) || 1;
    const fdx = f.x / fl, fdy = f.y / fl;
    const side = fdx >= 0 ? 1 : -1;
    const back = fdy < -0.25;
    const moving = this.state === 'run' && this.moveSpeed > 30;
    const t = this.animTime;
    const run = moving ? Math.sin(t * 13) : 0;
    const bob = moving ? Math.abs(Math.cos(t * 13)) * 2.4 : Math.sin(t * 2.2) * 0.8;
    const sq = this.squash;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(1 - sq * 0.5, 1 + sq);

    // Espada atrás do corpo quando aponta para longe da câmera
    const sword = withSword ? this.swordPose(side, bob) : null;
    if (sword && sword.behind) this.drawSword(ctx, sword, pal);

    // Capa: atrás quando de frente, por cima quando de costas
    const speedK = Math.min(1, this.moveSpeed / BASE_SPEED);
    const sway = -side * speedK * 7 + Math.sin(t * 3.1) * 1.4;
    const drawCape = () => {
      ctx.fillStyle = back ? pal.cape : pal.capeDark;
      ctx.beginPath();
      ctx.moveTo(-10, -37 - bob);
      ctx.lineTo(10, -37 - bob);
      ctx.lineTo(13 + sway, -5);
      ctx.lineTo(7 + sway, -8);
      ctx.lineTo(2 + sway, -3);
      ctx.lineTo(-4 + sway, -8);
      ctx.lineTo(-13 + sway, -4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = pal.trim; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-10, -37 - bob); ctx.lineTo(-13 + sway, -4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, -37 - bob); ctx.lineTo(13 + sway, -5); ctx.stroke();
    };
    if (!back) drawCape();

    // Pernas com passada
    const stride = run * 4;
    ctx.fillStyle = pal.leg;
    ctx.fillRect(-6 + stride * 0.5, -17 - bob * 0.3 - Math.max(0, run) * 2, 5, 15);
    ctx.fillRect(1 - stride * 0.5, -17 - bob * 0.3 - Math.max(0, -run) * 2, 5, 15);
    ctx.fillStyle = pal.boot;
    ctx.fillRect(-7 + stride * 0.5, -4 - Math.max(0, run) * 2, 7, 4);
    ctx.fillRect(0 - stride * 0.5, -4 - Math.max(0, -run) * 2, 7, 4);

    // Tronco (trapézio de armadura) com faixa iluminada e cinto dourado
    const y0 = -16 - bob, y1 = -39 - bob;
    ctx.fillStyle = pal.armor;
    ctx.beginPath();
    ctx.moveTo(-8, y0); ctx.lineTo(8, y0); ctx.lineTo(11, y1); ctx.lineTo(-11, y1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.armorHi;
    ctx.beginPath();
    ctx.moveTo(-side * 8, y0); ctx.lineTo(-side * 3, y0); ctx.lineTo(-side * 4, y1); ctx.lineTo(-side * 11, y1);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.trim;
    ctx.fillRect(-8, y0 - 3, 16, 2.5);
    if (!back) { ctx.fillStyle = pal.armorDark; ctx.fillRect(-1, y1 + 4, 2, 14); }

    // Ombreiras
    ctx.fillStyle = pal.helm;
    ctx.beginPath(); ctx.ellipse(-11, y1 + 2, 6.5, 4.5, -0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, y1 + 2, 6.5, 4.5, 0.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = pal.trim; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-11, y1 + 2, 6.5, 4.5, -0.3, Math.PI, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(11, y1 + 2, 6.5, 4.5, 0.3, Math.PI, TAU); ctx.stroke();

    if (back) drawCape();

    // Elmo com penacho e viseira
    const hx = side * 1.5, hy = y1 - 7;
    ctx.fillStyle = pal.plume;
    ctx.beginPath();
    ctx.moveTo(hx - 2, hy - 7);
    ctx.quadraticCurveTo(hx - side * 10 + sway * 0.5, hy - 14, hx - side * 14 + sway, hy - 4);
    ctx.quadraticCurveTo(hx - side * 6, hy - 8, hx + 2, hy - 6);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.helm;
    ctx.beginPath(); ctx.arc(hx, hy, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = pal.helmHi;
    ctx.beginPath(); ctx.arc(hx - side * 2.5, hy - 2.5, 3.5, 0, TAU); ctx.fill();
    if (!back) {
      ctx.fillStyle = '#07060a';
      ctx.fillRect(hx + side * 1 - 5, hy - 1, 10, 3.2);
      ctx.fillStyle = pal.visor;
      ctx.fillRect(hx + side * 1 - 4, hy - 0.2, 8, 1.6);
      if (pal === PLAYER_PAL) game.addGlow(ctx, hx + side, hy + 0.6, 7, '255,190,90', 0.55);
    }

    if (sword && !sword.behind) this.drawSword(ctx, sword, pal);
    ctx.restore();
  }

  // Calcula a pose da espada (coordenadas relativas aos pés, em pixels de tela)
  swordPose(side, bob) {
    const s = { hx: 0, hy: 0, tx: 0, ty: 0, behind: false, glow: 0 };
    const st = this.state;
    const a = this.attack;
    if (st === 'attack' && a && a.def) {
      const ang = this.bladeAngle(a, a.t);
      const c = Math.cos(ang), sn = Math.sin(ang);
      const L = a.def.blade * 0.82;
      const z = 26 + bob;
      s.hx = (c - sn) * 12; s.hy = (c + sn) * 6 - z;
      s.tx = (c - sn) * L; s.ty = (c + sn) * 0.5 * L - z;
      s.behind = c + sn < -0.2;
      s.glow = a.t < a.def.windup + a.def.active ? 0.5 : 0;
    } else if (st === 'charge') {
      const ang = this.facing + Math.PI * 0.75 * side;
      const c = Math.cos(ang), sn = Math.sin(ang);
      s.hx = side * 6; s.hy = -34 - bob;
      s.tx = s.hx + (c - sn) * 50; s.ty = s.hy + (c + sn) * 25 - 22;
      s.behind = true;
      s.glow = 0.4 + this.chargeLevel * 0.3 + 0.2 * Math.sin(this.animTime * 30);
    } else if (st === 'special') {
      s.hx = 0; s.hy = -46; s.tx = 0; s.ty = -110; s.behind = false;
      s.glow = 1;
    } else {
      // Repouso: lâmina apontando para baixo e para frente
      const sw = Math.sin(this.animTime * 2) * 1.5;
      s.hx = side * 11; s.hy = -24 - bob;
      s.tx = s.hx + side * (24 + sw); s.ty = s.hy + 32;
      s.behind = false;
    }
    return s;
  }

  drawSword(ctx, s, pal) {
    const dx = s.tx - s.hx, dy = s.ty - s.hy, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L;
    // Brilho da lâmina (carga, especial, golpes)
    if (s.glow > 0 && pal === PLAYER_PAL) {
      game.addGlow(ctx, s.tx, s.ty, 18 + s.glow * 26, '255,70,60', s.glow * 0.8);
      game.addGlow(ctx, (s.hx + s.tx) / 2, (s.hy + s.ty) / 2, 14 + s.glow * 16, '255,120,80', s.glow * 0.5);
    }
    ctx.fillStyle = pal.blade;
    ctx.beginPath();
    ctx.moveTo(s.hx + nx * 2.6, s.hy + ny * 2.6);
    ctx.lineTo(s.tx, s.ty);
    ctx.lineTo(s.hx - nx * 2.6, s.hy - ny * 2.6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.bladeHi; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(s.hx + nx * 0.8, s.hy + ny * 0.8); ctx.lineTo(s.tx, s.ty); ctx.stroke();
    // Guarda e cabo
    ctx.strokeStyle = pal.guard; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.hx + nx * 6, s.hy + ny * 6); ctx.lineTo(s.hx - nx * 6, s.hy - ny * 6); ctx.stroke();
    ctx.strokeStyle = pal.leg; ctx.lineWidth = 3;
